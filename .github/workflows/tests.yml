name: Tests

# Runs on every push and pull request. The point is that a change which
# breaks planning, groceries, inventory or the password gate fails here
# rather than on someone's phone after a deploy.
#
# TWO JOBS, and the split is deliberate on both axes.
#
# `pytest` keeps that exact name because a branch-protection rule may be
# requiring a status check called `pytest`. Folding it into a matrix renames
# it to `pytest (live)`, the required check stops being satisfiable, and every
# merge blocks until somebody with repo-settings access notices. Same coverage,
# no rename, nothing to reconfigure under time pressure.
#
# `clock` is the pinned matrix, and it does NOT run on every push to every
# branch: four more full suites on each of a day's pushes is roughly five times
# the CI minutes for feedback nobody reads mid-branch. A weekday cliff has to
# be caught before it reaches main, which is what `pull_request` and pushes to
# `main` cover.
#
# TZ is America/Toronto on both, matching the households' own default. The
# container runs UTC, so between 00:00 and 03:59 UTC the server's date is
# already tomorrow by Toronto's reckoning and anything reading the household's
# clock disagrees with a fixture that seeded it — a suite that is green at
# 09:00 and red at 01:00. Setting it here makes the runner and the household
# agree at every hour.
#
# NOTE for whoever merges second: `overnight/moves-household-clock` also edits
# this file, adding that same TZ to the single pre-existing `pytest` job. The
# resolution is keep the matrix AND keep the TZ — they are answers to two
# different problems and neither replaces the other.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The name is load-bearing. See above before renaming it.
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    env:
      # The runner is UTC; a household defaults to America/Toronto
      # (households.timezone, and cooker.household_now's own fallback).
      # Since the screens read the HOUSEHOLD's clock rather than the
      # server's, a suite whose process sits four hours from the household
      # it is testing has a different "today" in the test than in the app
      # for four hours out of every twenty-four — 00:00–03:59 UTC, which is
      # the Toronto evening — and the date-shaped tests flip red and green
      # with the wall clock rather than with the code.
      #
      # Measured on the merge of this branch with overnight/frozen-clock-tests,
      # 2026-09-14, same tree three ways: TZ=Pacific/Niue 23 failed,
      # unset (UTC) 0 failed but only because it was run outside that
      # window, TZ=America/Toronto 0 failed at any hour. Matching the
      # runner to the app's own default is what makes it the last of those.
      #
      # This is the runner's clock only. It is NOT a claim that the app
      # should assume Toronto — the app reads each household's own zone,
      # which is the whole point of the change this comment arrived with.
      TZ: America/Toronto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches the Dockerfile
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # No ANTHROPIC_API_KEY here on purpose — the suite must never make a
        # real API call. If a test starts needing one, that test is wrong.
        #
        # No pin: this is the real date, whatever day the runner is on, and it
        # is the ONLY job that can see a fixture whose hard-coded date has
        # quietly aged into the past — the shape that took
        # test_tap_a_meal_opens_recipe.py red on 2026-09-14, a week after the
        # week it names finished.
        run: pytest -q

  clock:
    # The weekday cliffs. `_first_plan_window` folds a Sunday sign-up forward,
    # PLAN_AHEAD_FROM_WEEKDAY = 4 makes Friday onward suggest next week, and a
    # live-clock suite sits on whichever side of those the calendar puts it —
    # so main has gone red on a Sunday for behaviour that was deliberate, with
    # nothing but the diff to tell that from a regression. Saturday is in
    # because a Saturday sign-up's first "week" is a two-day part-week.
    #
    # The pins are weekday NAMES, resolved to the next such day at run time,
    # not fixed dates. A fixed pin would age exactly the way the fixtures it
    # protects do: in three months every new test written against a plausible
    # date would fail these four jobs, and the matrix would get switched off.
    # conftest.py prints the resolved date as the first line of each pinned
    # run, so a failure is still reproducible from the log.
    #
    # There is a SECOND axis that belongs here and is not here yet: an
    # unpinned run under a timezone that straddles UTC relative to
    # America/Toronto (TZ=Pacific/Niue, UTC-11, no DST). Two clocks at one
    # instant is a relationship a date pin cannot express. It finds real bugs;
    # it also finds two that are already failing on main (measured 2026-09-14:
    # 2 failed, 4647 passed), and a job that is red the day it lands gets
    # ignored. One more matrix entry once those two are fixed.
    name: clock (${{ matrix.clock }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        # Written out rather than derived with `clock == 'live' && '' || clock`:
        # in a GitHub expression `&&` returns its right operand, so an empty
        # string is falsy and that idiom hands a job the wrong pin. One column
        # of pins cannot get that wrong.
        include:
          - clock: monday
            pin: monday
          - clock: friday
            pin: friday
          - clock: saturday
            pin: saturday
          - clock: sunday
            pin: sunday
    env:
      TZ: America/Toronto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # POMONA_TEST_TODAY rather than --today so the command is one line
        # either way; conftest.py reads both, and an empty value is no pin.
        env:
          POMONA_TEST_TODAY: ${{ matrix.pin }}
        run: pytest -q
