name: Tests

# Runs on every push and pull request. The point is that a change which
# breaks planning, groceries, inventory or the password gate fails here
# rather than on someone's phone after a deploy.
#
# TWO JOBS, and the split is deliberate on both axes.
#
# `pytest` keeps that exact name because a branch-protection rule may be
# requiring a status check called `pytest`. Folding it into a matrix renames
# it to `pytest (live)`, the required check stops being satisfiable, and every
# merge blocks until somebody with repo-settings access notices. Same coverage,
# no rename, nothing to reconfigure under time pressure.
#
# `clock` is the pinned matrix, and it does NOT run on every push to every
# branch: four more full suites on each of a day's pushes is roughly five times
# the CI minutes for feedback nobody reads mid-branch. A weekday cliff has to
# be caught before it reaches main, which is what `pull_request` and pushes to
# `main` cover.
#
# `straddle` is the third job and the reason the other two can be trusted. See
# its own comment below. It is written to BLOCK — no continue-on-error — but a
# workflow file cannot make a check required: somebody with repo settings has
# to add `straddle (Pacific/Niue)`, `straddle (Asia/Tokyo)` and
# `straddle (Pacific/Kiritimati)` to branch protection. Until that happens they
# are still visible on every PR, and adding a job never breaks an existing
# required check, so this is safe to land first.
#
# KIRITIMATI WAS ADDED RATHER THAN SWAPPED IN FOR TOKYO (2026-09-17), AND THAT
# IS A DECISION FOR EMILY TO CONFIRM OR REVERSE RATHER THAN A SETTLED ONE.
# Kiritimati's straddle window strictly contains Tokyo's and leans the same
# way, so on coverage alone Tokyo now buys nothing: keeping it is one extra
# full suite on every PR, for ever, for hours Kiritimati already covers.
#
# The case for adding rather than swapping is that removing a matrix entry
# REMOVES ITS CHECK NAME, and a branch-protection rule pointing at
# `straddle (Asia/Tokyo)` would then block every PR for ever on a check that
# can never report, undoable only by somebody with repo settings. **Measured
# 2026-09-17: GitHub reports `main` as "protected": false, so no required
# check exists today and nothing can actually be stranded right now** — the
# caveat being that repository RULESETS do not necessarily surface in that
# field. So this is insurance against a state that does not exist yet, not
# against one that does.
#
# An earlier version of this comment also claimed Tokyo earns its place as a
# live guard on the +9 boundary (09:00 local is 00:00 UTC there, the exact
# edge of the bug fixed that day). THAT IS FALSE and is corrected rather than
# quietly dropped: this job is UNPINNED, so no entry in this matrix exercises
# pin-hour arithmetic at all. That boundary is guarded by
# `test_a_bare_date_lands_mid_morning` and
# `test_a_pin_east_of_utc_plus_9_holds_every_clock_on_one_instant`, which
# carry their own markers and run in every job including this one.
#
# Net, honestly: dropping Tokyo costs nothing measurable today and saves a
# suite per PR. It is left in because the downside of being wrong about branch
# protection is unrecoverable without repo access and the downside of the
# extra job is minutes.
#
# NOTE for whoever merges second: if another branch also edits this file, the
# resolution is KEEP ALL THREE JOBS. They answer three different questions —
# did it break (pytest), does a weekday cliff break it (clock), do the
# server's clock and the household's still agree about what day it is
# (straddle) — and none of them replaces another.
#
# TZ is America/Toronto on the first two, matching the households' own
# default, so that neither of them is ALSO answering the timezone question.
# Since 2026-09-15 the date-shaped tests seed off the household's clock
# (conftest.household_today) rather than the process's. That used to make the
# suite green only "at or west of UTC+9" — UTC+10 and east failed 3 tests in
# tests/test_frozen_clock.py, which kept Kiritimati out of the straddle job.
# Closed 2026-09-17: those three asserted that a UTC clock carried the pin's
# LOCAL date, which is only true up to +9; they now measure against
# conftest's `pinned_utc_now`, the same claim in every zone.
#
# ON `clock` THE TZ LINE IS STILL LOAD-BEARING, for a reason it did not have
# before 2026-09-17. A pin is the PROCESS's local wall clock, and the app
# reads the HOUSEHOLD's; the two coincide only when the runner is in the
# household's own zone. Take TZ off `clock` and its four jobs go back to
# exercising a house four hours behind the hour they pinned — before its
# morning text, and unable to reach the evening at all. That was the state
# until 2026-09-17 and it cost real coverage; see conftest's
# freezegun.configure block. tests/test_pin_hour_household_clock.py is the
# tripwire on this line. With TZ set, the pin buys one thing only: those jobs
# go red for the reason they are named after (a real break; a weekday cliff)
# and never for the wall clock.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The name is load-bearing. See above before renaming it.
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    env:
      # Held at the households' own default so this job answers ONE question:
      # did something break, and has a fixture's hard-coded date aged out.
      # It used to be the fix for the whole timezone problem — the runner is
      # UTC, a household defaults to America/Toronto, and a test that seeded
      # a date from the process's clock and then asked a screen about "today"
      # was really asserting that those two clocks are on the same day, which
      # they are not for 00:00–03:59 UTC. That is fixed in the tests now
      # (conftest.household_today), and `straddle` below is what proves it
      # stays fixed. Keeping the pin here is belt and braces, not the belt.
      #
      # It is the runner's clock only, and never a claim that the app may
      # assume Toronto — the app reads each household's own zone.
      TZ: America/Toronto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches the Dockerfile
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # No ANTHROPIC_API_KEY here on purpose — the suite must never make a
        # real API call. If a test starts needing one, that test is wrong.
        #
        # No pin: this is the real date, whatever day the runner is on, and it
        # is the ONLY job that can see a fixture whose hard-coded date has
        # quietly aged into the past — the shape that took
        # test_tap_a_meal_opens_recipe.py red on 2026-09-14, a week after the
        # week it names finished.
        run: pytest -q

  clock:
    # The weekday cliffs. `_first_plan_window` folds a Sunday sign-up forward,
    # PLAN_AHEAD_FROM_WEEKDAY = 4 makes Friday onward suggest next week, and a
    # live-clock suite sits on whichever side of those the calendar puts it —
    # so main has gone red on a Sunday for behaviour that was deliberate, with
    # nothing but the diff to tell that from a regression. Saturday is in
    # because a Saturday sign-up's first "week" is a two-day part-week.
    #
    # The pins are weekday NAMES, resolved to the next such day at run time,
    # not fixed dates. A fixed pin would age exactly the way the fixtures it
    # protects do: in three months every new test written against a plausible
    # date would fail these four jobs, and the matrix would get switched off.
    # conftest.py prints the resolved date as the first line of each pinned
    # run, so a failure is still reproducible from the log.
    #
    # The SECOND axis — two clocks at one instant, which a date pin cannot
    # express — is its own job now. See `straddle`.
    name: clock (${{ matrix.clock }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        # Written out rather than derived with `clock == 'live' && '' || clock`:
        # in a GitHub expression `&&` returns its right operand, so an empty
        # string is falsy and that idiom hands a job the wrong pin. One column
        # of pins cannot get that wrong.
        include:
          - clock: monday
            pin: monday
          - clock: friday
            pin: friday
          - clock: saturday
            pin: saturday
          - clock: sunday
            pin: sunday
    env:
      TZ: America/Toronto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # POMONA_TEST_TODAY rather than --today so the command is one line
        # either way; conftest.py reads both, and an empty value is no pin.
        env:
          POMONA_TEST_TODAY: ${{ matrix.pin }}
        run: pytest -q

  straddle:
    # THE TRIPWIRE. Production is a UTC container serving a household on
    # America/Toronto, and since overnight/moves-household-clock the screens
    # read the HOUSEHOLD's clock while the process reads its own. That is a
    # relationship between two clocks at ONE instant, which no date pin can
    # express: a pinned run holds the offset constant, so it can check the
    # arithmetic is consistent but never catches a route that reads the wrong
    # one of the two dates. Only an UNPINNED run in a zone that is on a
    # different DAY from the household does that.
    #
    # The other two jobs are pinned to America/Toronto, i.e. to the one
    # configuration in which this whole bug class cannot occur. Without this
    # job a regression that re-splits the two clocks has no way to turn CI
    # red. It is deliberately NOT continue-on-error for that reason: an
    # advisory tripwire is a tripwire nobody looks at.
    #
    # THREE ZONES, because one is only straddling for part of the day and a job
    # that quietly proves nothing for most of the day is the same problem in a
    # different hat. All fixed-offset, no DST, and they do not all lean the
    # same way:
    #   Pacific/Niue        UTC-11, seven hours behind Toronto's EDT — a
    #                       different day while Toronto reads 00:00-06:59, i.e.
    #                       the HOUSEHOLD is a day AHEAD of the process.
    #   Asia/Tokyo          UTC+9, thirteen hours ahead — a different day while
    #                       Toronto reads 11:00-23:59, i.e. the household is a
    #                       day BEHIND the process, which is the direction
    #                       production actually has.
    #   Pacific/Kiritimati  UTC+14, eighteen hours ahead — the same direction
    #                       as Tokyo and a wider window, a different day while
    #                       Toronto reads 06:00-23:59.
    # Niue and Kiritimati together are all twenty-four hours. Until 2026-09-17
    # this was Niue and Tokyo only, twenty hours, with a real gap at Toronto
    # 07:00-10:59 (06:00-09:59 under EST) in which a PR merged at exactly the
    # wrong time got no answer from this job. That gap is closed.
    #
    # Kiritimati was kept OUT until now because any zone east of UTC+9 failed
    # three tests in tests/test_frozen_clock.py, on main as well as on a
    # branch — a bare --today pin is 09:00 LOCAL, so above +9 the UTC instant
    # behind it falls on the previous day, and those three asserted that
    # SQLite's 'now', node's toISOString() and a `DEFAULT (datetime('now'))`
    # column carried the pin's LOCAL date. They now measure against Python's
    # own frozen UTC clock, which is the claim they were named for and is the
    # same claim in every zone. See tests/conftest.py's `pinned_utc_now` and
    # `test_a_pin_east_of_utc_plus_9_holds_every_clock_on_one_instant`.
    #
    # Do not drop a zone to save minutes, and read the header before removing
    # one: dropping Niue leaves no coverage of the household-ahead direction at
    # all, and removing any entry removes its CHECK NAME, which is the thing
    # branch protection points at.
    #
    # No pin, and the first reason above is most of it. It used to have a
    # second: under a freeze `datetime.now(utc)` came back as local wall time
    # wearing a UTC label, which split the two clocks by itself, so a pinned
    # straddle looked like it worked and would have stopped working silently
    # the day that seam was fixed. It was fixed on 2026-09-17 (see conftest's
    # freezegun.configure block), so a pinned run in one of these zones now
    # genuinely straddles. This job stays unpinned anyway, because a pin holds
    # the offset constant and so can never catch a route that reads the wrong
    # one of the two dates as the day turns over.
    #
    # And a second reason that still stands, measured 2026-09-17: a run east
    # of UTC+9 pinned to a MONDAY fails four tests around
    # `get_already_have_decisions`, which takes its cutoff from `date.today()`
    # (the process's local date) and compares it against `removed_at`, which
    # SQLite stamps in UTC. A Monday pin specifically, because the cutoff falls
    # back to "this Monday" and the one-day skew puts `removed_at` just the
    # wrong side of it — measured at Kiritimati, monday is 4 failed and the
    # other six weekdays are 0. Pre-existing on main, latent in production (a
    # UTC container has no gap between those two), and reachable by no job
    # here precisely because this one is unpinned and `clock` is at Toronto.
    # Its own card. Do not pin this matrix without fixing it first.
    name: straddle (${{ matrix.tz }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        tz: ["Pacific/Niue", "Asia/Tokyo", "Pacific/Kiritimati"]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # Unpinned on purpose — see above. If this goes red and the pinned
        # jobs are green, the failure is almost certainly a test that seeded
        # a date from `datetime.date.today()` (the SERVER's day) and then
        # asked a screen about "today" (the HOUSEHOLD's). The fix is
        # conftest.household_today(), not a TZ.
        run: pytest -q
