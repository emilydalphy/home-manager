<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<link rel="preload" href="/static/fonts/figtree-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>My preferences</title>
<link rel="icon" href="/static/icons/icon-192.png" />
<meta name="theme-color" content="#FFFAF3" />
<meta name="robots" content="noindex, nofollow" />
<style>
  * { box-sizing: border-box; }
  body {
    max-width: 640px;
    margin: 0 auto;
    padding: 58px 16px 34px;
    -webkit-font-smoothing: antialiased;
  }
  h1 { margin: 0 4px 3px; font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.03em; }
  p.subtitle { margin: 0 4px 14px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--slate); }
  .card {
    background: var(--white);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 14px;
    margin-bottom: 10px;
  }
  .card h2 { margin: 0 0 2px; font-size: 16px; line-height: 22px; font-weight: 700; }
  .card .hint { color: var(--slate); font-size: 14px; line-height: 20px; margin: 0 0 10px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip {
    background: var(--blush);
    color: var(--night-ink);
    font-weight: 500;
    padding: 6px 12px;
    border-radius: var(--radius-control);
    font-size: 14px;
  }
  .empty { color: var(--slate); font-size: 14px; }
  .error { color: var(--clay); font-size: 16px; line-height: 22px; padding: 14px 4px; }
  .add-row { display: flex; gap: 8px; }
  input[type=text], textarea {
    flex: 1;
    min-width: 0;
    height: 52px;
    padding: 0 14px;
    border: 0;
    border-radius: var(--radius-button);
    box-shadow: inset 0 0 0 1.6px var(--line);
    background: var(--cream);
    color: var(--ink);
    font: 500 16px var(--font-body);
  }
  input[type=text]:focus, textarea:focus { outline: 2px solid var(--dusk); outline-offset: 2px; }
  textarea { display: block; width: 100%; height: auto; min-height: 88px; padding: 12px 14px; line-height: 22px; resize: vertical; margin-bottom: 8px; }
  button.action {
    height: 52px;
    padding: 0 18px;
    border: 0;
    border-radius: var(--radius-button);
    background: var(--apricot);
    color: var(--night-ink);
    font: 700 16px var(--font-body);
    cursor: pointer;
  }
  button.action:disabled { opacity: 0.6; cursor: default; }
  .note-item { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 16px; line-height: 22px; color: var(--ink); }
  .note-item:last-child { border-bottom: none; }
  .note-date { color: var(--slate); font-size: 13px; }
  .footer-note { color: var(--slate); font-size: 13px; line-height: 18px; margin-top: 20px; text-align: center; }
</style>
</head>
<body>

<h1 id="page-title">My preferences</h1>
<p class="subtitle" id="subtitle">Loading...</p>
<div id="content"></div>

<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

// When a note was left, on this phone's clock. The server stamps notes with
// SQLite's datetime('now') — UTC, with no zone on it — and this page used to
// print that string as it came: a note left at 9pm in Toronto read
// "2026-10-23 01:00:00", tomorrow at 1am (defect hunt, 2026-10-22). Read as
// UTC, shown in the app's date style ("Oct 22, 9:00 PM").
function noteWhen(stamp) {
  if (!stamp) return '';
  const d = new Date(String(stamp).replace(' ', 'T') + 'Z');
  if (isNaN(d)) return '';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ', ' +
    d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

// The line to show when a save is refused. The server's own sentence when
// it sent one — a note over the cap, the rate limit, a link revoked while
// this page was open — because "try again" is false for all three; the
// generic line otherwise. Only a 4xx with a string detail: a 500's detail
// is "Server error: …", which is not a sentence for a person, and a 422
// from the field parser is a list. alert() draws plain text, so the
// sentence can never become markup here.
async function saveFailedLine(res) {
  const generic = "Couldn't save that — try again.";
  if (!res || res.status < 400 || res.status >= 500) return generic;
  try {
    const body = await res.json();
    const detail = body && typeof body.detail === 'string' ? body.detail.trim() : '';
    return detail || generic;
  } catch (e) {
    return generic;
  }
}

function getToken() {
  return window.location.pathname.split('/').filter(Boolean).pop();
}

function render(view) {
  const content = document.getElementById('content');
  const restrictions = view.dietary_restrictions || [];
  const notes = view.notes || [];

  content.innerHTML = `
    <div class="card">
      <h2>Dietary restrictions &amp; allergies</h2>
      <p class="hint">These get factored into meal plans for this household.</p>
      <div class="chip-row" id="restriction-chips">
        ${restrictions.length ? restrictions.map(r => `<span class="chip">${escapeHtml(r)}</span>`).join('') : '<span class="empty">None on file</span>'}
      </div>
      <div class="add-row">
        <input type="text" id="restriction-input" placeholder="e.g. shellfish allergy" />
        <button class="action" id="restriction-btn">Add</button>
      </div>
    </div>
    <div class="card">
      <h2>Leave a note</h2>
      <p class="hint">Anything you'd like factored in — a preference, feedback on a recent meal, anything.</p>
      <textarea id="note-input" placeholder="e.g. I'd love more vegetarian nights"></textarea>
      <button class="action" id="note-btn">Save note</button>
      ${notes.length ? `<div style="margin-top:14px">${notes.map(n => `<div class="note-item">${escapeHtml(n.note)}<div class="note-date">${escapeHtml(noteWhen(n.created_at))}</div></div>`).join('')}</div>` : ''}
    </div>
    <p class="footer-note">This link is just for you — it only edits your own restrictions and notes, nothing else in the household.</p>
  `;

  document.getElementById('restriction-btn').addEventListener('click', async () => {
    const input = document.getElementById('restriction-input');
    const val = input.value.trim();
    if (!val) return;
    const btn = document.getElementById('restriction-btn');
    btn.disabled = true;
    try {
      const res = await fetch('/api/member-share/' + encodeURIComponent(getToken()) + '/restriction', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ restriction: val }),
      });
      if (!res.ok) {
        btn.disabled = false;
        alert(await saveFailedLine(res));
        return;
      }
      render(await res.json());
    } catch (err) {
      btn.disabled = false;
      alert("Couldn't save that — try again.");
    }
  });

  document.getElementById('note-btn').addEventListener('click', async () => {
    const input = document.getElementById('note-input');
    const val = input.value.trim();
    if (!val) return;
    const btn = document.getElementById('note-btn');
    btn.disabled = true;
    try {
      const res = await fetch('/api/member-share/' + encodeURIComponent(getToken()) + '/note', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ note: val }),
      });
      if (!res.ok) {
        btn.disabled = false;
        alert(await saveFailedLine(res));
        return;
      }
      render(await res.json());
    } catch (err) {
      btn.disabled = false;
      alert("Couldn't save that — try again.");
    }
  });
}

async function load() {
  const content = document.getElementById('content');
  const subtitle = document.getElementById('subtitle');
  const title = document.getElementById('page-title');

  try {
    const res = await fetch('/api/member-share/' + encodeURIComponent(getToken()));
    if (res.status === 404) {
      subtitle.textContent = '';
      content.innerHTML = '<p class="error">This link isn\'t valid — it may have been revoked. Ask whoever shared it for a fresh one.</p>';
      return;
    }
    if (!res.ok) throw new Error('Could not load');
    const view = await res.json();
    title.textContent = view.member_name + "'s preferences";
    subtitle.textContent = 'Add your own dietary restrictions or leave a note — no account needed.';
    render(view);
  } catch (err) {
    subtitle.textContent = '';
    content.innerHTML = '<p class="error">Couldn\'t load this right now — try refreshing.</p>';
  }
}

load();
</script>
</body>
</html>
