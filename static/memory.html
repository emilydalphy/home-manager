<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>What we know — Home Manager</title>
<style>
  /* What we know (design_handoff_home_manager §7, option 5d, approved).
     Replaces the old pre-redesign memory.html page entirely — see
     README's Phase 4 notes for the People/Taste/Rhythm-vs-structured-data
     judgment call and what happened to the old field-by-field editor. */
  * { box-sizing: border-box; }
  body { max-width: 480px; margin: 0 auto; padding: 0 0 40px; background: var(--page, #EFE6D6); }
  .wwk-header { padding: 20px 20px 6px; }
  .wwk-back { font-family: var(--font-body); font-weight: 700; font-size: 0.82rem; color: var(--midnight-violet); text-decoration: none; display: block; margin-bottom: 8px; }
  .wwk-title { font-family: var(--font-heading); font-weight: 700; font-size: 1.8rem; color: var(--midnight-violet); margin: 0 0 16px; }

  .wwk-tabs { display: flex; gap: 6px; padding: 0 16px 12px; }
  .wwk-tab { flex: 1; padding: 11px 0; border-radius: 10px; border: none; font-family: var(--font-body); font-weight: 700; font-size: 0.86rem; cursor: pointer; background: #fff; color: #6B5A63; }
  .wwk-tab.active { background: var(--midnight-violet); color: var(--oat-cream); font-weight: 800; }

  .wwk-content { padding: 0 20px 20px; }
  .wwk-card { background: #fff; border-radius: 18px; padding: 17px 19px 11px; margin-bottom: 16px; }
  .wwk-intro { font-family: var(--font-body); font-size: 0.94rem; color: #6B5A63; margin: 0 0 6px; }
  .wwk-fact-row { padding: 11px 0; border-top: 1px solid #F1E8DA; display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
  .wwk-fact-text { font-family: var(--font-body); font-size: 0.96rem; line-height: 1.45; color: var(--ink); flex: 1; }
  .wwk-fact-edit { font-family: var(--font-body); font-weight: 700; font-size: 0.86rem; color: #A8825C; flex: none; }
  .wwk-add-row { padding: 11px 0; border-top: 1px solid #F1E8DA; font-family: var(--font-body); font-weight: 700; font-size: 0.9rem; color: var(--midnight-violet); cursor: pointer; }
  /* Setup answers on the Taste tab. Styled as part of the same list as the
     freeform facts rather than as a separate widget — they're the same kind
     of thing to the household, and only differ in where they're stored. */
  .wwk-pref-label { font-family: var(--font-body); font-weight: 700; color: var(--midnight-violet); }
  .wwk-pref-empty { color: #A8998F; font-style: italic; }
  .wwk-pref-chips-row { cursor: default; }
  .wwk-pref-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 4px; }
  .wwk-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--violet-soft, #F1E4EC); color: var(--midnight-violet);
    border-radius: 999px; padding: 6px 8px 6px 14px;
    font-family: var(--font-body); font-size: 0.86rem;
  }
  .wwk-chip button {
    background: none; border: none; color: inherit; cursor: pointer;
    font-size: 1.05rem; line-height: 1; padding: 6px; min-width: 32px; min-height: 32px;
  }

  .wwk-editor { border-top: 1px solid #F1E8DA; padding: 11px 0; }
  .wwk-editor textarea { width: 100%; box-sizing: border-box; border: 2px solid var(--midnight-violet); border-radius: 12px; background: #FFFDF6; font-family: var(--font-body); font-size: 0.96rem; line-height: 1.45; padding: 12px 14px; height: 78px; resize: none; }
  .wwk-editor-actions { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
  .wwk-save-btn { background: var(--midnight-violet); color: var(--oat-cream); border: none; border-radius: 11px; padding: 12px 18px; font-weight: 700; font-family: var(--font-body); cursor: pointer; }
  .wwk-cancel-btn { background: none; border: none; font-family: var(--font-body); font-weight: 700; color: #8A7A82; cursor: pointer; }
  .wwk-delete-btn { background: none; border: none; font-family: var(--font-body); font-weight: 700; color: #C0431E; cursor: pointer; margin-left: auto; }

  .wwk-footer-card { background: #ECDFC8; border-radius: 16px; padding: 14px 17px; margin-bottom: 16px; }
  .wwk-footer-text { font-family: var(--font-body); font-size: 0.86rem; color: #4A3A2A; margin: 0; line-height: 1.4; }

  /* Stores tab extra */
  .wwk-store-block { border-top: 1px solid #F1E8DA; padding: 13px 0; }
  .wwk-store-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .wwk-store-name { font-family: var(--font-body); font-weight: 700; font-size: 1rem; color: var(--ink); }
  .wwk-store-count { font-family: var(--font-body); font-size: 0.82rem; color: #9C8B93; margin-left: auto; }
  .wwk-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .wwk-chip { display: inline-flex; align-items: center; gap: 8px; background: #F6EFE1; border-radius: 20px; padding: 9px 8px 9px 13px; font-family: var(--font-body); font-size: 0.9rem; cursor: pointer; }
  /* A real <button> now — it was a <span>, so it could only be clicked,
     never tabbed to. Padding/border reset to keep it looking identical. */
  .wwk-chip-x { padding: 0; border: none; appearance: none; width: 22px; height: 22px; border-radius: 12px; background: #E6DBC6; color: var(--midnight-violet); font-weight: 800; font-size: 0.76rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .wwk-chip-add { border: 1.5px dashed #C4B09C; border-radius: 20px; background: transparent; font-family: var(--font-body); font-weight: 700; font-size: 0.9rem; color: var(--midnight-violet); padding: 9px 15px; cursor: pointer; }
  .wwk-chip-input-row { display: flex; gap: 6px; align-items: center; }
  .wwk-chip-input { border: 2px solid var(--midnight-violet); border-radius: 20px; padding: 9px 15px; font-family: var(--font-body); font-size: 0.9rem; }
  .wwk-import-row { background: #F6EFE1; border-radius: 14px; padding: 13px 15px; display: flex; align-items: center; justify-content: space-between; margin-top: 12px; cursor: pointer; }
  .wwk-import-title { font-family: var(--font-body); font-weight: 700; font-size: 0.94rem; color: var(--ink); margin: 0; }
  .wwk-import-sub { font-family: var(--font-body); font-size: 0.8rem; color: #8A7A82; margin: 2px 0 0; }
  .wwk-import-open { font-family: var(--font-body); font-weight: 700; font-size: 0.86rem; color: var(--midnight-violet); }

  /* Import sheet */
  #wwk-scrim { position: fixed; inset: 0; background: rgba(58,31,46,.42); display: none; z-index: 998; }
  #wwk-scrim.open { display: block; }
  #wwk-import-sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; background: #fff; border-radius: 26px 26px 0 0; padding: 16px 20px 22px; z-index: 999; display: none; }
  #wwk-import-sheet.open { display: block; }
  .wwk-store-picker { display: flex; gap: 8px; margin: 14px 0; }
  .wwk-store-picker button { flex: 1; padding: 13px 0; border-radius: 12px; border: 1.5px solid #E0D3BF; background: #fff; font-family: var(--font-body); cursor: pointer; }
  .wwk-store-picker button.selected { background: #F4E7EF; border-color: var(--midnight-violet); font-weight: 700; color: var(--midnight-violet); }
  #wwk-import-textarea { width: 100%; box-sizing: border-box; border: 2px solid var(--midnight-violet); border-radius: 14px; height: 120px; resize: none; font-family: var(--font-body); font-size: 0.94rem; padding: 12px 14px; margin-bottom: 14px; }
  .wwk-import-footer { display: flex; gap: 10px; }
  .wwk-import-footer button { flex: 1; padding: 15px; border-radius: 13px; font-weight: 700; font-family: var(--font-body); cursor: pointer; border: none; }
  .wwk-import-cancel { background: transparent; border: 1.5px solid var(--midnight-violet) !important; color: var(--midnight-violet); }
  .wwk-import-save { background: var(--midnight-violet); color: var(--oat-cream); }

  #wwk-toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #3A1F2E; color: #FFFDF6; font-family: var(--font-body); font-size: 0.88rem; font-weight: 600; padding: 12px 22px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 1001; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  #wwk-toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="wwk-header">
  <a class="wwk-back" href="/kitchen">&larr; Kitchen</a>
  <h1 class="wwk-title">What we know</h1>
</div>

<div class="wwk-tabs" id="wwk-tabs" role="tablist" aria-label="What we know">
  <button type="button" class="wwk-tab active" data-tab="people" role="tab" aria-selected="true" aria-controls="wwk-content">People</button>
  <button type="button" class="wwk-tab" data-tab="taste" role="tab" aria-selected="false" aria-controls="wwk-content">Taste</button>
  <button type="button" class="wwk-tab" data-tab="rhythm" role="tab" aria-selected="false" aria-controls="wwk-content">Rhythm</button>
  <button type="button" class="wwk-tab" data-tab="stores" role="tab" aria-selected="false" aria-controls="wwk-content">Stores</button>
</div>

<div class="wwk-content" id="wwk-content" role="tabpanel" aria-live="polite"><p style="text-align:center;color:#8A7A82;font-family:var(--font-body)">Loading…</p></div>

<div id="wwk-scrim" aria-hidden="true"></div>
<div id="wwk-import-sheet" role="dialog" aria-modal="true" aria-labelledby="wwk-import-heading">
  <p style="font-family:var(--font-body);font-weight:800;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:#A8825C;margin:0">What you usually buy</p>
  <h2 id="wwk-import-heading" style="font-family:var(--font-heading);font-weight:700;font-size:1.4rem;color:var(--ink);margin:6px 0 0">Import a list</h2>
  <p style="font-family:var(--font-body);font-size:0.9rem;color:#6B5A63;margin:12px 0 0">These items belong to</p>
  <div class="wwk-store-picker" id="wwk-import-store-picker" role="group" aria-label="These items belong to"></div>
  <div class="dictate-row">
    <textarea id="wwk-import-textarea" aria-label="Items, one per line" placeholder="Paste or type one per line — rotisserie chicken, frozen berries, coffee beans…"></textarea>
    <button type="button" class="dictate-btn" id="wwk-import-mic-btn" aria-label="Dictate" title="Dictate">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.07A7 7 0 0 0 19 11z"/></svg>
    </button>
  </div>
  <div class="wwk-import-footer">
    <button class="wwk-import-cancel" id="wwk-import-cancel">Cancel</button>
    <button class="wwk-import-save" id="wwk-import-save">Save</button>
  </div>
</div>

<div id="wwk-toast" role="status" aria-live="polite"></div>

<script src="/static/dictation.js"></script>
<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Same nested-shell fix as inventory.html's back link — see its comment
// for the full explanation. This page is reachable both as a Kitchen hub
// "pushed view" (inside kitchen.html's iframe) and as the rail's standalone
// "What we know" link (a real top-level page, not iframed); only the
// former needs the fix.
(function () {
  var backLink = document.querySelector('.wwk-back');
  if (backLink && window.self !== window.top) {
    backLink.setAttribute('href', '/static/kitchen.html');
  }
})();

function showToast(message) {
  const el = document.getElementById('wwk-toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

const TAB_META = {
  people: { intro: "Who I'm planning for, and what nobody will eat.", footer: "Tap any line to correct it. I'll re-check this week's plan against changes." },
  taste: { intro: 'What tends to work, so suggestions land the first time.', footer: "The more of these you fix, the fewer swaps you'll have to make." },
  rhythm: { intro: 'The shape of your week — I plan around these.', footer: "Tell me about a one-off week in the ask bar instead — these are the standing patterns." },
  stores: { intro: 'Where things come from and what a week usually costs.', footer: 'I use these to decide which list an item lands on.' },
};

let activeTab = 'people';
let openEditorId = null; // fact id being edited, or 'new'
// Which preference field's editor is open ('eating_style' | 'cuisines' | null).
// Separate from openEditorId because that one is keyed by fact id, and these
// aren't facts — they live in meal_preferences.
let openPrefEditor = null;
let memoryCache = null;

document.getElementById('wwk-tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.wwk-tab');
  if (!btn) return;
  activeTab = btn.getAttribute('data-tab');
  openEditorId = null;
  document.querySelectorAll('.wwk-tab').forEach(t => {
    const isActive = t === btn;
    t.classList.toggle('active', isActive);
    t.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });
  render();
});

async function render() {
  if (activeTab === 'stores') return renderStoresTab();
  return renderFactsTab(activeTab);
}

async function renderFactsTab(category) {
  const content = document.getElementById('wwk-content');
  try {
    const res = await fetch('/api/facts?category=' + category);
    const data = res.ok ? await res.json() : {};
    const facts = data.facts || [];
    const onboarding = data.onboarding;
    const preferences = data.preferences;
    const meta = TAB_META[category];
    let html = '';
    if (onboarding && (onboarding.members || []).length) {
      html += `<div class="wwk-card"><p class="wwk-intro">From onboarding — tell me in chat if anything's changed.</p>`;
      onboarding.members.forEach(m => {
        const restrictions = (m.dietary_restrictions || []).join(', ');
        html += `<div class="wwk-fact-row"><span class="wwk-fact-text">${escapeHtml(m.name)}${restrictions ? ' — ' + escapeHtml(restrictions) : ''}</span></div>`;
      });
      if ((onboarding.household_dislikes || []).length) {
        html += `<div class="wwk-fact-row"><span class="wwk-fact-text">Won't eat: ${escapeHtml(onboarding.household_dislikes.join(', '))}</span></div>`;
      }
      html += `</div>`;
    }
    if (preferences) {
      html += renderPreferenceCard(preferences);
    }
    html += `<div class="wwk-card"><p class="wwk-intro">${meta.intro}</p>`;
    facts.forEach(f => {
      if (openEditorId === f.id) {
        html += `<div class="wwk-editor">
          <div class="dictate-row">
            <textarea id="wwk-editor-textarea" aria-label="Edit what we know" autofocus>${escapeHtml(f.text)}</textarea>
            <button type="button" class="dictate-btn" id="wwk-editor-mic-btn" aria-label="Dictate" title="Dictate">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.07A7 7 0 0 0 19 11z"/></svg>
            </button>
          </div>
          <div class="wwk-editor-actions">
            <button class="wwk-save-btn" data-save-fact="${f.id}">Save</button>
            <button class="wwk-cancel-btn" data-cancel-fact="${f.id}">Cancel</button>
            <button class="wwk-delete-btn" data-delete-fact="${f.id}">Delete</button>
          </div>
        </div>`;
      } else {
        html += `<div class="wwk-fact-row" data-open-fact="${f.id}">
          <span class="wwk-fact-text">${escapeHtml(f.text)}</span>
          <span class="wwk-fact-edit">Edit</span>
        </div>`;
      }
    });
    if (openEditorId === 'new') {
      html += `<div class="wwk-editor">
        <div class="dictate-row">
          <textarea id="wwk-editor-textarea" placeholder="What should I know?" aria-label="Add something we should know" autofocus></textarea>
          <button type="button" class="dictate-btn" id="wwk-editor-mic-btn" aria-label="Dictate" title="Dictate">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.07A7 7 0 0 0 19 11z"/></svg>
          </button>
        </div>
        <div class="wwk-editor-actions">
          <button class="wwk-save-btn" data-save-fact="new">Save</button>
          <button class="wwk-cancel-btn" data-cancel-fact="new">Cancel</button>
        </div>
      </div>`;
    } else {
      html += `<div class="wwk-add-row" id="wwk-add-row">+ Tell me something else — it all shapes the plan</div>`;
    }
    html += `</div>`;
    html += `<div class="wwk-footer-card"><p class="wwk-footer-text">${meta.footer}</p></div>`;
    content.innerHTML = html;
    wireFactsActions(category);
    if (preferences) wirePreferenceActions(preferences);
  } catch (err) {
    content.innerHTML = '<p style="text-align:center;color:#8A7A82;font-family:var(--font-body)">Couldn\'t load — try refreshing.</p>';
  }
}

// The two onboarding answers that drive every generated week and were,
// until now, editable nowhere in the app — not here, not on the meal-setup
// screen. Only chat could change them, and only if you thought to ask.
function renderPreferenceCard(prefs) {
  let html = `<div class="wwk-card"><p class="wwk-intro">From your setup answers — these shape every week I plan.</p>`;

  // Eating style: freeform text, one value.
  if (openPrefEditor === 'eating_style') {
    html += `<div class="wwk-editor">
      <textarea id="wwk-pref-textarea" aria-label="Edit eating style"
        placeholder="e.g. high-protein, low-carb — in your own words">${escapeHtml(prefs.eating_style)}</textarea>
      <div class="wwk-editor-actions">
        <button class="wwk-save-btn" data-save-pref="eating_style">Save</button>
        <button class="wwk-cancel-btn" data-cancel-pref="1">Cancel</button>
      </div>
    </div>`;
  } else {
    const shown = prefs.eating_style
      ? escapeHtml(prefs.eating_style)
      : '<span class="wwk-pref-empty">Nothing set — tap to add one</span>';
    html += `<div class="wwk-fact-row" data-open-pref="eating_style">
      <span class="wwk-fact-text"><span class="wwk-pref-label">Eating style</span> ${shown}</span>
      <span class="wwk-fact-edit">Edit</span>
    </div>`;
  }

  // Cuisines: a list, so each one removes individually rather than making
  // someone retype the others to drop one.
  html += `<div class="wwk-fact-row wwk-pref-chips-row">
    <span class="wwk-fact-text"><span class="wwk-pref-label">Excited about</span></span>
  </div>`;
  html += `<div class="wwk-pref-chips">`;
  if ((prefs.cuisines || []).length) {
    prefs.cuisines.forEach(c => {
      html += `<span class="wwk-chip">${escapeHtml(c)}<button type="button" aria-label="Remove ${escapeHtml(c)}" data-remove-cuisine="${escapeHtml(c)}">&times;</button></span>`;
    });
  } else {
    html += `<span class="wwk-pref-empty">Nothing yet</span>`;
  }
  html += `</div>`;
  if (openPrefEditor === 'cuisines') {
    html += `<div class="wwk-editor">
      <textarea id="wwk-pref-textarea" aria-label="Add a cuisine" placeholder="One cuisine, e.g. Sichuan"></textarea>
      <div class="wwk-editor-actions">
        <button class="wwk-save-btn" data-save-pref="cuisines">Add</button>
        <button class="wwk-cancel-btn" data-cancel-pref="1">Cancel</button>
      </div>
    </div>`;
  } else {
    html += `<div class="wwk-add-row" data-open-pref="cuisines">+ Add a cuisine</div>`;
  }
  html += `</div>`;
  return html;
}

function wirePreferenceActions(prefs) {
  const content = document.getElementById('wwk-content');
  content.querySelectorAll('[data-open-pref]').forEach(el => {
    el.addEventListener('click', () => { openPrefEditor = el.getAttribute('data-open-pref'); render(); });
  });
  content.querySelectorAll('[data-cancel-pref]').forEach(btn => {
    btn.addEventListener('click', () => { openPrefEditor = null; render(); });
  });
  content.querySelectorAll('[data-save-pref]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const which = btn.getAttribute('data-save-pref');
      const text = document.getElementById('wwk-pref-textarea').value.trim();
      btn.disabled = true;
      try {
        if (which === 'eating_style') {
          // Empty is a real answer here — it clears the style rather than
          // being an abandoned edit, unlike a blank freeform fact.
          await savePreference('eating_style', text);
        } else {
          if (!text) { openPrefEditor = null; render(); return; }
          const next = (prefs.cuisines || []).slice();
          if (!next.some(c => c.toLowerCase() === text.toLowerCase())) next.push(text);
          await savePreference('cuisine_preferences', next);
        }
        openPrefEditor = null;
        render();
      } catch (err) { btn.disabled = false; alert("Couldn't save that — try again."); }
    });
  });
  content.querySelectorAll('[data-remove-cuisine]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      btn.disabled = true;
      try {
        const res = await fetch('/api/memory/delete', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ field: 'cuisine_preferences', item: btn.getAttribute('data-remove-cuisine') }),
        });
        if (!res.ok) throw new Error('failed');
        render();
      } catch (err) { btn.disabled = false; alert("Couldn't remove that — try again."); }
    });
  });
}

async function savePreference(field, value) {
  const res = await fetch('/api/memory/edit', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ field, value }),
  });
  if (!res.ok) throw new Error('failed');
}

function wireFactsActions(category) {
  const content = document.getElementById('wwk-content');
  content.querySelectorAll('[data-open-fact]').forEach(row => {
    row.addEventListener('click', () => { openEditorId = parseInt(row.getAttribute('data-open-fact'), 10); render(); });
  });
  const addRow = document.getElementById('wwk-add-row');
  if (addRow) addRow.addEventListener('click', () => { openEditorId = 'new'; render(); });
  content.querySelectorAll('[data-save-fact]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const key = btn.getAttribute('data-save-fact');
      const text = document.getElementById('wwk-editor-textarea').value.trim();
      if (!text) { openEditorId = null; render(); return; } // abandoned empty fact never persists
      btn.disabled = true;
      try {
        if (key === 'new') await fetch('/api/facts/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ category, text }) });
        else await fetch(`/api/facts/${key}/update`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
        openEditorId = null;
        render();
      } catch (err) { btn.disabled = false; alert("Couldn't save that — try again."); }
    });
  });
  content.querySelectorAll('[data-cancel-fact]').forEach(btn => {
    btn.addEventListener('click', () => { openEditorId = null; render(); }); // switching tabs/cancelling drops any empty draft — nothing was saved yet
  });
  content.querySelectorAll('[data-delete-fact]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-delete-fact');
      btn.disabled = true;
      try { await fetch(`/api/facts/${id}/delete`, { method: 'POST' }); openEditorId = null; render(); }
      catch (err) { btn.disabled = false; alert("Couldn't delete that — try again."); }
    });
  });
  const textarea = document.getElementById('wwk-editor-textarea');
  if (textarea) {
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); content.querySelector('[data-save-fact]').click(); }
    });
    setupDictation(textarea, document.getElementById('wwk-editor-mic-btn'), { onMessage: showToast });
  }
}

async function renderStoresTab() {
  const content = document.getElementById('wwk-content');
  try {
    const res = await fetch('/api/memory');
    const memory = res.ok ? await res.json() : { usual_stores: [], store_typical_items: {} };
    memoryCache = memory;
    const meta = TAB_META.stores;
    const stores = memory.usual_stores || [];
    const typical = memory.store_typical_items || {};
    let html = `<div class="wwk-card"><p class="wwk-intro">${meta.intro}</p>`;
    if (!stores.length) {
      html += `<p style="font-family:var(--font-body);font-size:0.9rem;color:#8A7A82;padding:10px 0">No usual stores saved yet — add one below, or mention it in chat (e.g. "we usually shop at Trader Joe's").</p>`;
    }
    for (const store of stores) {
      const items = typical[store] || [];
      html += `<div class="wwk-store-block">
        <div class="wwk-store-header"><span class="wwk-store-name">${escapeHtml(store)}</span><span class="wwk-store-count">${items.length} item${items.length === 1 ? '' : 's'}</span></div>
        <div class="wwk-chips" data-store-chips="${escapeHtml(store)}">
          ${items.map(it => `<span class="wwk-chip" data-move-item="${escapeHtml(it)}" data-from-store="${escapeHtml(store)}"><span>${escapeHtml(it)}</span><button type="button" class="wwk-chip-x" data-forget-item="${escapeHtml(it)}" data-forget-store="${escapeHtml(store)}" aria-label="Forget ${escapeHtml(it)} at ${escapeHtml(store)}">&times;</button></span>`).join('')}
          <button type="button" class="wwk-chip-add" data-add-chip-store="${escapeHtml(store)}" aria-label="Add an item you usually buy at ${escapeHtml(store)}">+ Add</button>
        </div>
      </div>`;
    }
    html += `<div class="wwk-add-row" id="wwk-add-store-row">+ Add a store</div>`;
    if (stores.length) {
      html += `<div class="wwk-import-row" id="wwk-open-import"><div><p class="wwk-import-title">Import a whole list</p><p class="wwk-import-sub">Paste your notes app, or photograph a receipt</p></div><span class="wwk-import-open">Open</span></div>`;
    }
    html += `</div>`;
    html += `<div class="wwk-footer-card"><p class="wwk-footer-text">${meta.footer}</p></div>`;
    content.innerHTML = html;
    wireStoresActions(stores);
  } catch (err) {
    content.innerHTML = '<p style="text-align:center;color:#8A7A82;font-family:var(--font-body)">Couldn\'t load — try refreshing.</p>';
  }
}

function wireStoresActions(stores) {
  const content = document.getElementById('wwk-content');
  // Tap a chip label to move it to the other store (only meaningful with exactly 2 usual stores, per the design's toggle framing)
  content.querySelectorAll('[data-move-item]').forEach(chip => {
    chip.querySelector('span').addEventListener('click', async (e) => {
      const item = chip.getAttribute('data-move-item');
      const fromStore = chip.getAttribute('data-from-store');
      const otherStore = stores.find(s => s !== fromStore);
      if (!otherStore) return;
      try {
        await fetch('/api/memory/store-items/remove', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ store: fromStore, item }) });
        await fetch('/api/memory/store-items/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ store: otherStore, item }) });
        showToast(`${item} → ${otherStore}`);
        renderStoresTab();
      } catch (err) { alert("Couldn't move that — try again."); }
    });
  });
  content.querySelectorAll('[data-forget-item]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const item = btn.getAttribute('data-forget-item');
      const store = btn.getAttribute('data-forget-store');
      try { await fetch('/api/memory/store-items/remove', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ store, item }) }); renderStoresTab(); }
      catch (err) { alert("Couldn't remove that — try again."); }
    });
  });
  content.querySelectorAll('[data-add-chip-store]').forEach(btn => {
    btn.addEventListener('click', () => {
      const store = btn.getAttribute('data-add-chip-store');
      const wrap = document.querySelector(`[data-store-chips="${CSS.escape(store)}"]`);
      const row = document.createElement('div');
      row.className = 'wwk-chip-input-row';
      row.innerHTML = `<input type="text" class="wwk-chip-input" placeholder="e.g. Rotisserie chicken" aria-label="Item you usually buy at ${escapeHtml(store)}" /><button type="button" class="wwk-chip-add" data-confirm-add="${escapeHtml(store)}">Add</button>`;
      btn.replaceWith(row);
      const input = row.querySelector('input');
      input.focus();
      async function commit() {
        const val = input.value.trim();
        if (val) {
          try { await fetch('/api/memory/store-items/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ store, item: val }) }); } catch (err) { /* ignore, re-render will just not show it */ }
        }
        renderStoresTab();
      }
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') commit(); });
      row.querySelector('[data-confirm-add]').addEventListener('click', commit);
    });
  });
  const openImport = document.getElementById('wwk-open-import');
  if (openImport) openImport.addEventListener('click', () => openImportSheet(stores));

  const addStoreRow = document.getElementById('wwk-add-store-row');
  if (addStoreRow) {
    addStoreRow.addEventListener('click', () => {
      const row = document.createElement('div');
      row.className = 'wwk-chip-input-row';
      row.innerHTML = `<input type="text" class="wwk-chip-input" id="wwk-new-store-input" placeholder="e.g. Trader Joe's" aria-label="Store name" />` +
        `<button type="button" class="dictate-btn" id="wwk-new-store-mic-btn" aria-label="Dictate" title="Dictate">` +
        `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.07A7 7 0 0 0 19 11z"/></svg></button>` +
        `<button type="button" class="wwk-chip-add" id="wwk-confirm-new-store">Add</button>`;
      addStoreRow.replaceWith(row);
      const input = row.querySelector('#wwk-new-store-input');
      input.focus();
      setupDictation(input, row.querySelector('#wwk-new-store-mic-btn'), { onMessage: showToast });
      async function commit() {
        const name = input.value.trim();
        if (!name) { renderStoresTab(); return; }
        // Case-insensitive dedupe against stores already saved — matches
        // add_usual_stores' own merge behavior (app/tools.py) so this button
        // and mentioning a store in chat can't diverge on what "duplicate" means.
        const already = stores.some(s => s.toLowerCase() === name.toLowerCase());
        if (already) { showToast(`${name} is already on your list`); renderStoresTab(); return; }
        try {
          await fetch('/api/memory/edit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ field: 'usual_stores', value: [...stores, name] }) });
          showToast(`Added ${name}`);
        } catch (err) { alert("Couldn't add that store — try again."); }
        renderStoresTab();
      }
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') commit(); });
      row.querySelector('#wwk-confirm-new-store').addEventListener('click', commit);
    });
  }
}

function openImportSheet(stores) {
  const picker = document.getElementById('wwk-import-store-picker');
  picker.innerHTML = stores.map((s, i) => `<button type="button" data-store="${escapeHtml(s)}" class="${i === 0 ? 'selected' : ''}" aria-pressed="${i === 0}">${escapeHtml(s)}</button>`).join('');
  picker.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    picker.querySelectorAll('button').forEach(x => {
      x.classList.remove('selected');
      x.setAttribute('aria-pressed', 'false');
    });
    b.classList.add('selected');
    b.setAttribute('aria-pressed', 'true');
  }));
  document.getElementById('wwk-import-textarea').value = '';
  document.getElementById('wwk-scrim').classList.add('open');
  document.getElementById('wwk-import-sheet').classList.add('open');
}
function closeImportSheet() {
  document.getElementById('wwk-scrim').classList.remove('open');
  document.getElementById('wwk-import-sheet').classList.remove('open');
}
document.getElementById('wwk-scrim').addEventListener('click', closeImportSheet);
document.getElementById('wwk-import-cancel').addEventListener('click', closeImportSheet);
document.getElementById('wwk-import-save').addEventListener('click', async () => {
  const picker = document.getElementById('wwk-import-store-picker');
  const selected = picker.querySelector('button.selected');
  const store = selected ? selected.getAttribute('data-store') : null;
  if (!store) { closeImportSheet(); return; }
  const raw = document.getElementById('wwk-import-textarea').value;
  // Split on newlines and commas, strip leading bullets/numbering, trim, drop
  // entries <=1 char, drop case-insensitive duplicates already on that store's list.
  const existing = new Set(((memoryCache && memoryCache.store_typical_items && memoryCache.store_typical_items[store]) || []).map(s => s.trim().toLowerCase()));
  const parts = raw.split(/[\n,]/).map(s => s.replace(/^[-•\s\d.]+/, '').trim()).filter(s => s.length > 1);
  const toAdd = [];
  const seen = new Set();
  for (const p of parts) {
    const key = p.toLowerCase();
    if (existing.has(key) || seen.has(key)) continue;
    seen.add(key);
    toAdd.push(p);
  }
  const btn = document.getElementById('wwk-import-save');
  btn.disabled = true;
  try {
    for (const item of toAdd) {
      await fetch('/api/memory/store-items/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ store, item }) });
    }
    btn.disabled = false;
    closeImportSheet();
    showToast(`Added ${toAdd.length} item${toAdd.length === 1 ? '' : 's'} to ${store}`);
    renderStoresTab();
  } catch (err) { btn.disabled = false; alert("Couldn't import that — try again."); }
});

setupDictation(document.getElementById('wwk-import-textarea'), document.getElementById('wwk-import-mic-btn'), { onMessage: showToast });

render();
</script>
