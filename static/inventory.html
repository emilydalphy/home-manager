<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<link rel="preload" href="/static/fonts/figtree-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Inventory — Pomona</title>
<style>
  /* Inventory, in Bright Dusk: the sheet "See what's home" opens, framed.
     Same page, same hooks: a plain head, the add card, a store-style
     switcher, two-across tiles, sheets that slide up. Tokens from theme.css. */
  * { box-sizing: border-box; }
  body { max-width: 480px; margin: 0 auto; padding: 0 0 40px; background: var(--ground); color: var(--ink); font-family: var(--font-body); }
  .inv-header { padding: 14px 20px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .inv-back { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; font-size: 14px; color: var(--ink); text-decoration: none; }
  .inv-title { font-weight: 700; font-size: 32px; line-height: 38px; letter-spacing: -0.03em; color: var(--ink); margin: 0; }
  .inv-summary { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--slate); margin: 0; }

  .inv-content { padding: 14px 16px 0; }
  .inv-card { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
  .inv-card-header { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; }
  .inv-card-name { font-weight: 700; font-size: 16px; line-height: 22px; color: var(--ink); margin: 0; }
  .inv-card-count { font-size: 13px; line-height: 18px; color: var(--slate); }
  .inv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; min-height: 86px; padding: 14px; background: var(--white); border-radius: var(--radius-card); box-shadow: var(--shadow-card); cursor: pointer; }
  .inv-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--tick-ring); }
  .inv-dot.soon { background: var(--clay); }
  .inv-dot.low { background: var(--apricot); }
  .inv-name { flex: 1 1 0; min-width: 0; font-size: 16px; line-height: 20px; font-weight: 500; color: var(--ink); overflow-wrap: anywhere; }
  .inv-qty { flex: 0 0 100%; font-size: 13px; line-height: 18px; color: var(--slate); }
  /* The "N to use soon" count is a control, not a label. */
  .inv-soon-btn { min-height: 44px; font: inherit; font-weight: 600; color: var(--clay); background: none; border: none; padding: 0; cursor: pointer; }
  .inv-soon-btn[aria-pressed="true"] { background: var(--blush); border-radius: var(--radius-pill); padding: 0 12px; }
  .inv-filter-note { font-size: 14px; line-height: 20px; color: var(--slate); margin: 0 4px 10px; }
  .inv-flag { font-weight: 600; font-size: 13px; line-height: 18px; }
  .inv-flag.soon { color: var(--clay); }
  .inv-flag.low { color: var(--slate); }
  .inv-empty { margin: 0; padding: 14px; background: var(--white); border-radius: var(--radius-card); box-shadow: var(--shadow-card); font-size: 16px; line-height: 22px; font-weight: 500; color: var(--ink); }

  .inv-add-card { background: var(--white); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 14px; margin-bottom: 0; }
  .inv-add-title { font-weight: 700; color: var(--ink); font-size: 16px; line-height: 22px; margin: 0 0 10px; }
  .inv-add-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .inv-add-row input, .inv-add-row select { height: 44px; border: 0; border-radius: var(--radius-control); background: var(--blush); padding: 0 12px; font-family: var(--font-body); font-weight: 500; font-size: 16px; color: var(--ink); min-width: 0; }
  .inv-add-row input#inv-add-item { flex: 1; min-width: 120px; }
  .inv-add-row button { min-height: 44px; background: var(--blush); color: var(--ink); border: none; border-radius: var(--radius-button); padding: 0 18px; font-family: var(--font-body); font-weight: 700; font-size: 14px; cursor: pointer; }
  /* ".inv-add-row button" above outranks theme.css's ".dictate-btn" (QA
     corners: a blank square), so it is restated here with two classes. */
  .inv-add-row .dictate-btn { width: 44px; height: 44px; background: transparent; color: var(--ink); padding: 0; border-radius: var(--radius-pill); }
  input::placeholder { color: var(--slate); }

  /* Photo capture. Backend endpoints /api/inventory/scan-receipt|scan-fridge|
     scan-pantry|confirm-scan; this is UI only. */
  .inv-scan-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .inv-scan-btn { flex: 1; min-width: 100px; min-height: 44px; background: var(--blush); color: var(--ink); border: 0; border-radius: var(--radius-button); padding: 8px 10px; font-family: var(--font-body); font-weight: 600; font-size: 13px; line-height: 18px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
  .inv-scan-btn svg { width: 16px; height: 16px; flex: none; }

  #inv-scan-sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; background: var(--ground); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; padding: 10px 16px 30px; display: none; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow-sheet); z-index: 51; animation: invSheetUp var(--motion-base) var(--motion-ease); }
  #inv-scan-sheet.open { display: block; }
  .inv-scan-title { font-weight: 700; font-size: 26px; line-height: 30px; letter-spacing: -0.025em; color: var(--ink); margin: 0 0 4px; }
  .inv-scan-sub { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--slate); margin: 0 0 12px; }
  .inv-scan-loading { padding: 28px 4px; color: var(--slate); font-size: 14px; }
  .inv-scan-item { background: var(--white); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 12px 14px; margin-bottom: 10px; }
  .inv-scan-item-row1 { display: flex; gap: 6px; margin-bottom: 6px; }
  .inv-scan-item-row1 input { flex: 1; min-width: 0; height: 44px; font-family: var(--font-body); font-weight: 500; border: 0; border-radius: var(--radius-control); background: var(--blush); padding: 0 10px; font-size: 16px; color: var(--ink); }
  .inv-scan-item-row1 input.inv-scan-qty { flex: none; width: 64px; }
  .inv-scan-item-row2 { display: flex; gap: 6px; align-items: center; }
  .inv-scan-item-row2 select { height: 44px; font-family: var(--font-body); font-weight: 500; border: 0; border-radius: var(--radius-control); background: var(--blush); padding: 0 8px; font-size: 14px; color: var(--ink); }
  .inv-scan-low-badge { font-weight: 600; font-size: 13px; color: var(--clay); }
  .inv-scan-remove { margin-left: auto; width: 44px; height: 44px; background: none; border: none; color: var(--slate); font-size: 16px; cursor: pointer; padding: 0; }
  .inv-scan-empty-note { color: var(--slate); padding: 14px 4px; font-size: 14px; }
  .inv-scan-actions { display: flex; gap: 10px; margin-top: 12px; }
  .inv-scan-actions button { flex: 1; min-height: 52px; padding: 0 12px; border-radius: var(--radius-button); font-weight: 700; font-size: 16px; cursor: pointer; font-family: var(--font-body); border: none; color: var(--night-ink); }
  .inv-scan-save { background: var(--apricot); }
  .inv-scan-cancel { background: var(--blush); }

  /* The location switcher: jump to a shelf instead of scrolling past the
     others. "All" keeps the stacked view. */
  .inv-loc-nav { display: flex; gap: 2px; margin: 14px 20px 0; padding: 3px; height: 46px; background: var(--blush); border-radius: var(--radius-button); }
  .inv-loc-nav:empty { display: none; }
  .inv-loc-pill::after, .inv-location-btn::after { content: ""; position: absolute; inset: -3px 0; }
  .inv-loc-pill { position: relative; flex: 1 1 0; min-width: 0; font-family: var(--font-body); font-weight: 500; font-size: 14px; padding: 0 12px; border-radius: var(--radius-control); border: 0; background: none; color: var(--slate); cursor: pointer; }
  .inv-loc-pill.active { background: var(--white); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-seg); }
  .inv-card.inv-card-highlight { animation: invCardPulse 1s ease; }
  @keyframes invCardPulse { 0%, 100% { opacity: 1; } 30% { opacity: .7; } }

  /* Item detail sheet */
  #inv-scrim, .inv-scan-scrim-el { position: fixed; inset: 0; background: var(--scrim); display: none; z-index: 50; animation: invFadeIn var(--motion-fast) ease-out; }
  #inv-scrim.open, .inv-scan-scrim-el.open { display: block; }
  #inv-sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; background: var(--ground); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; padding: 10px 16px 30px; display: none; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow-sheet); z-index: 51; animation: invSheetUp var(--motion-base) var(--motion-ease); }
  #inv-sheet.open { display: block; }
  @keyframes invFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes invSheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #inv-sheet, #inv-scan-sheet, #inv-scrim, .inv-scan-scrim-el { animation: none; } }
  /* A real <button> that closes the sheet, drawn as the grab handle, its tap
     the full 44px. */
  .inv-sheet-handle { position: relative; display: block; width: 40px; height: 4px; padding: 0; border: none; appearance: none; border-radius: 2px; background: var(--grab); margin: 0 auto 14px; cursor: pointer; }
  .inv-sheet-handle::after { content: ""; position: absolute; inset: -20px -10px; }
  .inv-sheet-kicker { font-weight: 600; font-size: 13px; line-height: 18px; color: var(--slate); margin: 0 0 2px; }
  .inv-sheet-name { font-weight: 700; font-size: 26px; line-height: 30px; letter-spacing: -0.025em; color: var(--ink); margin: 0 0 14px; }
  .inv-sheet-label { font-size: 16px; line-height: 22px; font-weight: 700; color: var(--ink); margin: 0 0 6px; }
  .inv-stepper-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; }
  .inv-stepper-btn { width: 44px; height: 44px; border-radius: var(--radius-pill); background: var(--blush); border: none; font-family: var(--font-body); font-weight: 700; font-size: 16px; color: var(--ink); cursor: pointer; }
  .inv-stepper-value { width: 120px; text-align: center; font-weight: 700; font-size: 16px; }
  .inv-location-row { display: flex; gap: 2px; margin-bottom: 14px; height: 46px; padding: 3px; background: var(--blush); border-radius: var(--radius-button); }
  .inv-location-btn { position: relative; flex: 1; border-radius: var(--radius-control); border: 0; background: none; font-family: var(--font-body); font-weight: 500; font-size: 14px; color: var(--slate); cursor: pointer; }
  .inv-location-btn.selected { background: var(--white); box-shadow: var(--shadow-seg); font-weight: 600; color: var(--ink); }
  .inv-bb-card { background: var(--white); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .inv-bb-left .inv-bb-title { font-size: 16px; line-height: 20px; font-weight: 500; color: var(--ink); margin: 0; }
  .inv-bb-left .inv-bb-relative { font-size: 13px; line-height: 18px; margin: 2px 0 0; color: var(--slate); }
  .inv-bb-left .inv-bb-relative.soon { color: var(--clay); }
  .inv-bb-right { display: flex; align-items: center; gap: 8px; }
  .inv-bb-btn { width: 44px; height: 44px; border-radius: var(--radius-pill); background: var(--blush); border: none; font-weight: 700; font-family: var(--font-body); font-size: 16px; color: var(--ink); cursor: pointer; }
  .inv-bb-date { width: 90px; text-align: center; font-weight: 600; font-size: 14px; }
  .inv-sheet-actions { display: flex; flex-direction: column; gap: 10px; }
  .inv-action-btn { min-height: 52px; border-radius: var(--radius-button); font-weight: 700; font-size: 16px; cursor: pointer; font-family: var(--font-body); border: none; color: var(--night-ink); }
  .inv-action-add { background: var(--apricot); }
  .inv-action-add.on-list { background: var(--blush); cursor: default; }
  .inv-action-used { background: var(--blush); }

  #inv-toast { position: fixed; left: 16px; right: 16px; bottom: 24px; padding: 14px 16px; border-radius: var(--radius-button); background: var(--toast-bg); color: var(--toast-ink); font-size: 14px; line-height: 20px; font-weight: 500; box-shadow: var(--shadow-float); opacity: 0; pointer-events: none; transition: opacity var(--motion-fast) ease; z-index: 60; }
  #inv-toast.show { opacity: 1; }

  /* ---------- Dark mode: the leftovers ----------
     theme.css carries every token; these are the rgba washes that were mixed
     for a light ground and cannot follow a token. Inside the media query, so
     light mode is untouched by construction. */
  @media (prefers-color-scheme: dark) {
    /* Tint washes: a 12-16% dark-red / apricot over a light card reads as a
       soft flag. Over the dark ground the same mix is invisible, so the wash
       inverts to the accent's own dark value at a higher alpha. */
    :where(:root:not([data-theme="light"])) .inv-soon-btn[aria-pressed="true"],
    :where(:root:not([data-theme="light"])) .inv-flag.soon { background: rgba(230, 112, 91, .20); }
    :where(:root:not([data-theme="light"])) .inv-flag.low { background: rgba(233, 161, 108, .20); }
    :where(:root:not([data-theme="light"])) .inv-scan-low-badge { background: rgba(233, 161, 108, .22); }
    /* A 15% black hairline disappears on a dark ground. */
    :where(:root:not([data-theme="light"])) .inv-add-row input, :where(:root:not([data-theme="light"])) .inv-add-row select,
    :where(:root:not([data-theme="light"])) .inv-scan-item-row1 input, :where(:root:not([data-theme="light"])) .inv-scan-item-row2 select {
      border-color: var(--hairline-strong);
      background: var(--surface);
      color: var(--ink);
    }
    /* The three status dots. --urgent and --apricot already follow the
       theme; only the neutral "fine" dot needed its own dark step. */
    :where(:root:not([data-theme="light"])) .inv-dot { background: var(--ink-inactive); }
    /* Same UA-default placeholder problem as the shell — no ::placeholder
       rule exists here either, so these fell through to Chrome's #757575
       (3.21:1 on the dark card). Light is untouched and keeps the UA grey. */
    :where(:root:not([data-theme="light"])) input::placeholder, :where(:root:not([data-theme="light"])) textarea::placeholder { color: var(--ink-placeholder); }

    /* Ivory text on a spruce fill. These say `color: var(--ground)`, and
       --oat-cream is an alias for --ground, which INVERTS: in dark it is
       #101F19, i.e. dark text on a spruce button. --ivory-ink is the token
       that means "text on spruce" and is right in both modes, but it is
       #F6EEE1 against --ground's #FBF6EE, so swapping the declaration
       outright would have nudged light mode. Overriding here instead keeps
       light byte-identical. */
    :where(:root:not([data-theme="light"])) .inv-add-row button, :where(:root:not([data-theme="light"])) .inv-scan-save, :where(:root:not([data-theme="light"])) .inv-loc-pill.active,
    :where(:root:not([data-theme="light"])) .inv-action-add { color: var(--ivory-ink); }
    :where(:root:not([data-theme="light"])) #inv-toast { box-shadow: 0 6px 20px rgba(0,0,0,.6); }
    :where(:root:not([data-theme="light"])) #inv-scrim, :where(:root:not([data-theme="light"])) .inv-scan-scrim-el { background: var(--scrim); }
  }
  /* Forced dark (Settings → Appearance → Dark): the twin of the block above.
     tests/test_appearance.py checks the two match. */
  :where(:root[data-theme="dark"]) .inv-soon-btn[aria-pressed="true"],
  :where(:root[data-theme="dark"]) .inv-flag.soon { background: rgba(230, 112, 91, .20); }
  :where(:root[data-theme="dark"]) .inv-flag.low { background: rgba(233, 161, 108, .20); }
  :where(:root[data-theme="dark"]) .inv-scan-low-badge { background: rgba(233, 161, 108, .22); }
  :where(:root[data-theme="dark"]) .inv-add-row input, :where(:root[data-theme="dark"]) .inv-add-row select,
  :where(:root[data-theme="dark"]) .inv-scan-item-row1 input, :where(:root[data-theme="dark"]) .inv-scan-item-row2 select {
    border-color: var(--hairline-strong);
    background: var(--surface);
    color: var(--ink);
  }
  :where(:root[data-theme="dark"]) .inv-dot { background: var(--ink-inactive); }
  :where(:root[data-theme="dark"]) input::placeholder, :where(:root[data-theme="dark"]) textarea::placeholder { color: var(--ink-placeholder); }
  :where(:root[data-theme="dark"]) .inv-add-row button, :where(:root[data-theme="dark"]) .inv-scan-save, :where(:root[data-theme="dark"]) .inv-loc-pill.active,
  :where(:root[data-theme="dark"]) .inv-action-add { color: var(--ivory-ink); }
  :where(:root[data-theme="dark"]) #inv-toast { box-shadow: 0 6px 20px rgba(0,0,0,.6); }
  :where(:root[data-theme="dark"]) #inv-scrim, :where(:root[data-theme="dark"]) .inv-scan-scrim-el { background: var(--scrim); }
</style>
<script src="/static/error-reporter.js"></script>
<!-- Every server call goes through api.js (one base address, cookies sent). Before any page script, after the reporter whose fetch wrapper it calls through. -->
<script src="/static/api.js"></script>
</head>
<body>

<div class="inv-header">
  <!-- See memory.html's matching comment. The marker sits on this wrapper so
       the back link AND the page's own title both hide inside the shell (the
       Kitchen sheet's header supplies both), while #inv-summary below stays —
       that line is content, not chrome. -->
  <div data-shell-back="hide">
    <a class="inv-back" href="/kitchen">&larr; Cook</a>
    <h1 class="inv-title">Inventory</h1>
  </div>
  <p class="inv-summary" id="inv-summary" role="status">Loading…</p>
</div>

<div class="inv-content" style="padding-bottom:0">
  <div class="inv-add-card">
    <p class="inv-add-title">Add to inventory</p>
    <div class="inv-add-row">
      <input type="text" id="inv-add-item" placeholder="Item, e.g. ground beef" aria-label="Item to add to inventory" />
      <button type="button" class="dictate-btn" id="inv-add-item-mic-btn" aria-label="Dictate item" title="Dictate item">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.07A7 7 0 0 0 19 11z"/></svg>
      </button>
      <input type="text" id="inv-add-qty" placeholder="Qty" style="width:70px" aria-label="Quantity" />
      <select id="inv-add-location" aria-label="Where it lives">
        <option value="fridge">Fridge</option>
        <option value="freezer">Freezer</option>
        <option value="pantry" selected>Pantry</option>
      </select>
      <button id="inv-add-btn">Add</button>
    </div>
    <div class="inv-scan-row">
      <button type="button" class="inv-scan-btn" id="inv-scan-receipt-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l3 3v17H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
        Scan a receipt
      </button>
      <button type="button" class="inv-scan-btn" id="inv-scan-fridge-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M4 9h16M8 4.5v3M8 12v6"/></svg>
        Scan the fridge
      </button>
      <button type="button" class="inv-scan-btn" id="inv-scan-pantry-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18"/></svg>
        Scan the pantry
      </button>
    </div>
    <input type="file" accept="image/*" capture="environment" id="inv-scan-receipt-input" hidden />
    <input type="file" accept="image/*" capture="environment" id="inv-scan-fridge-input" hidden />
    <input type="file" accept="image/*" capture="environment" id="inv-scan-pantry-input" hidden />
  </div>
</div>

<div class="inv-loc-nav" id="inv-loc-nav"></div>

<div class="inv-content" id="inv-content" role="status"><p class="inv-empty">Loading…</p></div>

<div id="inv-scan-scrim" class="inv-scan-scrim-el" aria-hidden="true"></div>
<div id="inv-scan-sheet" role="dialog" aria-modal="true" aria-labelledby="inv-scan-title">
  <button type="button" class="inv-sheet-handle" id="inv-scan-sheet-close" aria-label="Close"></button>
  <h2 class="inv-scan-title" id="inv-scan-title">Reading your photo&hellip;</h2>
  <p class="inv-scan-sub" id="inv-scan-sub">This can take a few seconds.</p>
  <div id="inv-scan-content" role="status"><div class="inv-scan-loading">Looking closely&hellip;</div></div>
</div>

<div id="inv-scrim" aria-hidden="true"></div>
<div id="inv-sheet" role="dialog" aria-modal="true" aria-labelledby="inv-sheet-name">
  <button type="button" class="inv-sheet-handle" id="inv-sheet-close" aria-label="Close"></button>
  <p class="inv-sheet-kicker" id="inv-sheet-kicker">Location · added this month</p>
  <h2 class="inv-sheet-name" id="inv-sheet-name">Item</h2>

  <p class="inv-sheet-label">How much is left</p>
  <div class="inv-stepper-row">
    <button type="button" class="inv-stepper-btn" id="inv-qty-minus" aria-label="Less of this item">&minus;</button>
    <span class="inv-stepper-value" id="inv-qty-value" role="status" aria-label="Amount left">0</span>
    <button type="button" class="inv-stepper-btn" id="inv-qty-plus" aria-label="More of this item">+</button>
  </div>

  <p class="inv-sheet-label">Where it lives</p>
  <div class="inv-location-row" id="inv-location-row" role="group" aria-label="Where it lives">
    <button type="button" class="inv-location-btn" data-loc="fridge" aria-pressed="false">Fridge</button>
    <button type="button" class="inv-location-btn" data-loc="freezer" aria-pressed="false">Freezer</button>
    <button type="button" class="inv-location-btn" data-loc="pantry" aria-pressed="false">Pantry</button>
  </div>

  <div class="inv-bb-card">
    <div class="inv-bb-left">
      <p class="inv-bb-title">Best before</p>
      <p class="inv-bb-relative" id="inv-bb-relative">—</p>
    </div>
    <div class="inv-bb-right">
      <button type="button" class="inv-bb-btn" id="inv-bb-minus" aria-label="Best before one day earlier">&minus;</button>
      <span class="inv-bb-date" id="inv-bb-date" role="status" aria-label="Best before date">—</span>
      <button type="button" class="inv-bb-btn" id="inv-bb-plus" aria-label="Best before one day later">+</button>
    </div>
  </div>

  <div class="inv-sheet-actions">
    <button class="inv-action-btn inv-action-add" id="inv-add-to-grocery">Add to grocery list</button>
    <button class="inv-action-btn inv-action-used" id="inv-used-up">Used it up</button>
  </div>
</div>

<div id="inv-toast" role="status" aria-live="polite"></div>

<script src="/static/dictation.js"></script>
<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// The Kitchen hub (kitchen.html) links here as a "pushed view" inside its
// own iframe (window.location.href = '/inventory', not a real shell
// navigation) — see design_handoff_home_manager README's Kitchen hub note.
// The "‹ Kitchen" back link's plain href="/kitchen" doesn't know that: when
// this page is itself running inside that iframe, following it loads the
// full shell.html (rail + tab bar + ask bar) a second time nested inside
// the already-small Kitchen tab panel, stacked under the real outer shell —
// confirmed via a sandbox screenshot, not a hypothetical. Fixed by
// detecting the iframe case and going back to the hub's own embed src
// instead, which stays inside the same iframe with no nested shell. When
// this page is reached directly (the rail's standalone "Inventory" link,
// which is NOT inside an iframe), the plain '/kitchen' navigation is
// correct as-is and left alone.
const LOCATION_ORDER = ['fridge', 'freezer', 'pantry'];
const LOCATION_LABELS = { fridge: 'Fridge', freezer: 'Freezer', pantry: 'Pantry' };

let currentItem = null;
let neededItemNames = new Set();

function isLow(quantity) {
  const m = /^\s*([\d.]+)/.exec(quantity || '');
  return !!m && parseFloat(m[1]) <= 1;
}

// "Use soon" is defined here and only here. The threshold used to be
// written out at each of its three call sites (the summary count, the row
// flag, and tools.get_expiring_soon's default), which is how a filter ends
// up disagreeing with the badge sitting next to it.
const USE_SOON_DAYS = 4;
function isUseSoon(item) {
  const d = daysUntil(item.expiration_date);
  return d != null && d <= USE_SOON_DAYS;
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}
function relativeWording(days) {
  if (days == null) return null;
  if (days < 0) return `${-days} day${-days === 1 ? '' : 's'} past`;
  if (days === 0) return 'today';
  if (days === 1) return 'tomorrow';
  if (days <= 7) return `in ${days} days`;
  if (days <= 60) { const w = Math.round(days / 7); return `in ${w} week${w === 1 ? '' : 's'}`; }
  const mo = Math.round(days / 30); return `in ${mo} month${mo === 1 ? '' : 's'}`;
}

async function loadNeededItemNames() {
  try {
    // status=all, filtered to 'needed' client-side — status=needed alone
    // hides anything currently caught by the "Already have this?" cross-
    // reference banner (see app/main.py's get_grocery_list_view), which
    // would otherwise make an inventory item's own "Add to grocery list"
    // button flip back to un-checked the moment it's added, since that's
    // exactly the case that banner exists to catch.
    const res = await Api.fetch('/api/grocery-list?status=all');
    if (!res.ok) return;
    const data = await res.json();
    neededItemNames = new Set();
    (data.sections || []).forEach(s => s.items.forEach(it => { if (it.status === 'needed') neededItemNames.add(it.item.trim().toLowerCase()); }));
  } catch (err) { /* non-critical */ }
}

// Whether the list is filtered to just what needs using. Lives outside
// loadInventory because toggling it re-runs that function.
let useSoonOnly = false;

async function loadInventory() {
  const content = document.getElementById('inv-content');
  try {
    await loadNeededItemNames();
    const res = await Api.fetch('/api/inventory/by-location');
    if (!res.ok) throw new Error('failed');
    const data = await res.json();
    const locations = data.locations || [];
    const totalItems = locations.reduce((n, l) => n + l.items.length, 0);
    let soonCount = 0, lowCount = 0;
    locations.forEach(l => l.items.forEach(it => {
      if (isUseSoon(it)) soonCount++;
      if (isLow(it.quantity)) lowCount++;
    }));
    const summaryEl = document.getElementById('inv-summary');
    if (soonCount) {
      summaryEl.innerHTML =
        `<button type="button" class="inv-soon-btn" id="inv-soon-filter" aria-pressed="${useSoonOnly}">` +
        `${soonCount} to use soon</button> · ${lowCount} running low`;
      document.getElementById('inv-soon-filter').addEventListener('click', () => {
        useSoonOnly = !useSoonOnly;
        loadInventory();
      });
    } else {
      // Nothing to filter to, so no control — an inert button that always
      // finds nothing is worse than plain text.
      useSoonOnly = false;
      summaryEl.textContent = `${soonCount} to use soon · ${lowCount} running low`;
    }

    const navEl = document.getElementById('inv-loc-nav');
    if (!totalItems) {
      content.innerHTML = '<p class="inv-empty">Nothing tracked yet — add something below, or it fills in automatically as you check off the grocery list.</p>';
      navEl.innerHTML = '';
      return;
    }

    // Pill nav: only for locations that actually have something in them —
    // no point offering to jump to an empty Freezer card that isn't even
    // rendered. Clicking scrolls straight to that section instead of
    // scrolling past everything above it.
    const presentLocs = LOCATION_ORDER.filter(loc => {
      const g = locations.find(l => l.location === loc);
      return g && g.items.length;
    });
    navEl.innerHTML = presentLocs.length > 1
      ? presentLocs.map(loc => `<button type="button" class="inv-loc-pill" data-jump="${loc}">${LOCATION_LABELS[loc]}</button>`).join('')
      : '';
    navEl.querySelectorAll('[data-jump]').forEach(pill => {
      pill.addEventListener('click', () => {
        const card = document.getElementById('inv-card-' + pill.getAttribute('data-jump'));
        if (!card) return;
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        card.classList.add('inv-card-highlight');
        setTimeout(() => card.classList.remove('inv-card-highlight'), 1000);
      });
    });

    let html = '';
    if (useSoonOnly) {
      html += `<p class="inv-filter-note">Showing only what needs using. ` +
        `<button type="button" class="inv-soon-btn" id="inv-show-all">Show everything</button></p>`;
    }
    for (const loc of LOCATION_ORDER) {
      const group = locations.find(l => l.location === loc);
      if (!group || !group.items.length) continue;
      // Filtering happens per location so a card that has nothing to use
      // soon disappears entirely, rather than sitting there empty.
      const shown = useSoonOnly ? group.items.filter(isUseSoon) : group.items;
      if (!shown.length) continue;
      html += `<div class="inv-card" id="inv-card-${loc}">
        <div class="inv-card-header">
          <p class="inv-card-name">${LOCATION_LABELS[loc]}</p>
          <span class="inv-card-count">${shown.length} item${shown.length === 1 ? '' : 's'}</span>
        </div>`;
      for (const it of shown) {
        const soon = isUseSoon(it);
        const low = !soon && isLow(it.quantity);
        const dotClass = soon ? 'soon' : (low ? 'low' : '');
        html += `<div class="inv-row" data-item-id="${it.id}">
          <span class="inv-dot ${dotClass}"></span>
          <span class="inv-name">${escapeHtml(it.item)}</span>
          <span class="inv-qty">${escapeHtml(it.quantity || '')}</span>
          ${soon ? '<span class="inv-flag soon">use soon</span>' : (low ? '<span class="inv-flag low">low</span>' : '')}
        </div>`;
      }
      html += `</div>`;
    }
    content.innerHTML = html;
    const showAll = document.getElementById('inv-show-all');
    if (showAll) {
      showAll.addEventListener('click', () => { useSoonOnly = false; loadInventory(); });
    }
    content.querySelectorAll('[data-item-id]').forEach(row => {
      row.addEventListener('click', () => openItemSheet(parseInt(row.getAttribute('data-item-id'), 10), locations));
    });
  } catch (err) {
    content.innerHTML = '<p class="inv-empty">Couldn\'t load inventory right now — try refreshing.</p>';
  }
}

function showToast(message) {
  const el = document.getElementById('inv-toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

function openItemSheet(itemId, locations) {
  let item = null;
  for (const l of locations) { const found = l.items.find(it => it.id === itemId); if (found) item = found; }
  if (!item) return;
  currentItem = item;
  renderSheet();
  document.getElementById('inv-scrim').classList.add('open');
  document.getElementById('inv-sheet').classList.add('open');
}
function closeItemSheet() {
  document.getElementById('inv-scrim').classList.remove('open');
  document.getElementById('inv-sheet').classList.remove('open');
  currentItem = null;
}
document.getElementById('inv-scrim').addEventListener('click', closeItemSheet);
document.getElementById('inv-sheet-close').addEventListener('click', closeItemSheet);

// "added this month" / "added Oct 31" / "added earlier". created_at is
// SQLite's datetime('now') — UTC with no zone — so it is read as UTC: read
// as the phone's own time it is off by the whole UTC offset, and from 8pm
// on the last of a month in Toronto a thing just added read "added Nov 1".
function addedWhen(stamp, now) {
  const created = stamp ? new Date(String(stamp).replace(' ', 'T') + 'Z') : null;
  if (!created || isNaN(created)) return 'added earlier';
  now = now || new Date();
  if (created.getFullYear() === now.getFullYear() && created.getMonth() === now.getMonth()) return 'added this month';
  return 'added ' + created.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function renderSheet() {
  const it = currentItem;
  const kickerLoc = LOCATION_LABELS[it.location] || 'Pantry';
  document.getElementById('inv-sheet-kicker').textContent = `${kickerLoc} · ${addedWhen(it.created_at)}`;
  document.getElementById('inv-sheet-name').textContent = it.item;

  const m = /^\s*([\d.]+)/.exec(it.quantity || '');
  const qtyValue = m ? m[1] : (it.quantity ? '1' : '0');
  document.getElementById('inv-qty-value').textContent = it.quantity || '0';
  // Name the steppers after the item they're adjusting, so a screen reader
  // says "Less of ground beef" rather than "minus, button".
  document.getElementById('inv-qty-minus').setAttribute('aria-label', `Less of ${it.item}`);
  document.getElementById('inv-qty-plus').setAttribute('aria-label', `More of ${it.item}`);

  document.querySelectorAll('.inv-location-btn').forEach(btn => {
    const selected = btn.getAttribute('data-loc') === it.location;
    btn.classList.toggle('selected', selected);
    // The "selected" styling is the only signal a sighted user needs;
    // aria-pressed carries the same state to everyone else.
    btn.setAttribute('aria-pressed', selected ? 'true' : 'false');
  });

  const d = daysUntil(it.expiration_date);
  const rel = relativeWording(d);
  const relEl = document.getElementById('inv-bb-relative');
  relEl.textContent = rel || 'not set';
  relEl.classList.toggle('soon', d != null && d <= 4);
  document.getElementById('inv-bb-date').textContent = it.expiration_date
    ? new Date(it.expiration_date + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
    : '—';

  const onList = neededItemNames.has((it.item || '').trim().toLowerCase());
  const addBtn = document.getElementById('inv-add-to-grocery');
  addBtn.textContent = onList ? 'On the list ✓' : 'Add to grocery list';
  addBtn.classList.toggle('on-list', onList);
  addBtn.disabled = onList;
}

async function refreshAfterSheetChange() {
  await loadInventory();
  if (currentItem) {
    const res = await Api.fetch('/api/inventory/by-location');
    if (res.ok) {
      const data = await res.json();
      const locations = data.locations || [];
      let item = null;
      for (const l of locations) { const found = l.items.find(it => it.id === currentItem.id); if (found) item = found; }
      if (item) { currentItem = item; renderSheet(); } else { closeItemSheet(); }
    }
  }
}

document.getElementById('inv-qty-minus').addEventListener('click', async () => {
  if (!currentItem) return;
  try { await Api.fetch(`/api/inventory/${currentItem.id}/quantity`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ delta: -1 }) }); await refreshAfterSheetChange(); }
  catch (err) { alert("Couldn't update that — try again."); }
});
document.getElementById('inv-qty-plus').addEventListener('click', async () => {
  if (!currentItem) return;
  try { await Api.fetch(`/api/inventory/${currentItem.id}/quantity`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ delta: 1 }) }); await refreshAfterSheetChange(); }
  catch (err) { alert("Couldn't update that — try again."); }
});
document.getElementById('inv-location-row').addEventListener('click', async (e) => {
  const btn = e.target.closest('.inv-location-btn');
  if (!btn || !currentItem) return;
  try { await Api.fetch(`/api/inventory/${currentItem.id}/location`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ location: btn.getAttribute('data-loc') }) }); await refreshAfterSheetChange(); }
  catch (err) { alert("Couldn't move that — try again."); }
});
document.getElementById('inv-bb-minus').addEventListener('click', async () => {
  if (!currentItem) return;
  try { await Api.fetch(`/api/inventory/${currentItem.id}/expiration`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ delta_days: -1 }) }); await refreshAfterSheetChange(); }
  catch (err) { alert("Couldn't update that — try again."); }
});
document.getElementById('inv-bb-plus').addEventListener('click', async () => {
  if (!currentItem) return;
  try { await Api.fetch(`/api/inventory/${currentItem.id}/expiration`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ delta_days: 1 }) }); await refreshAfterSheetChange(); }
  catch (err) { alert("Couldn't update that — try again."); }
});
document.getElementById('inv-add-to-grocery').addEventListener('click', async () => {
  if (!currentItem) return;
  const btn = document.getElementById('inv-add-to-grocery');
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    await Api.fetch('/api/grocery-list/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item: currentItem.item, category: currentItem.category || 'other' }) });
    await loadNeededItemNames();
    renderSheet();
  } catch (err) { btn.disabled = false; alert("Couldn't add that — try again."); }
});
document.getElementById('inv-used-up').addEventListener('click', async () => {
  if (!currentItem) return;
  const name = currentItem.item;
  const btn = document.getElementById('inv-used-up');
  btn.disabled = true;
  try {
    await Api.fetch(`/api/inventory/${currentItem.id}/remove`, { method: 'POST' });
    closeItemSheet();
    showToast(`${name} marked used up`);
    loadInventory();
  } catch (err) { btn.disabled = false; alert("Couldn't remove that — try again."); }
});

document.getElementById('inv-add-btn').addEventListener('click', async () => {
  const itemInput = document.getElementById('inv-add-item');
  const qtyInput = document.getElementById('inv-add-qty');
  const locSelect = document.getElementById('inv-add-location');
  const item = itemInput.value.trim();
  if (!item) return;
  try {
    await Api.json('/api/inventory/update', {
      body: { item, action: 'add', quantity: qtyInput.value.trim(), location: locSelect.value }, quiet: true,
    });
    itemInput.value = ''; qtyInput.value = '';
    loadInventory();
  } catch (err) {
    // The server's own sentence only for the amount it refused; a dropped
    // line or a 500 keeps the generic one.
    alert(err && err.status === 400 && err.detail === "That amount doesn't look right."
      ? err.detail : "Couldn't add that — try again.");
  }
});

// ---------- Photo capture (receipt / fridge / pantry scan) ----------
// Restored per testing feedback — the backend (/api/inventory/scan-receipt,
// scan-fridge, scan-pantry, confirm-scan) was never removed when this page
// was rewritten; only the UI entry points were dropped, since the design
// package's spec for this screen explicitly called photo capture out of
// scope. Nothing here is trusted silently: every scan comes back as a
// draft list in a review sheet — editable, removable — before anything is
// written to inventory_items via confirm-scan.
const SCAN_CATEGORIES = ['produce', 'dairy', 'meat/seafood', 'pantry', 'canned', 'frozen', 'other'];
const CATEGORY_LABELS_SCAN = { 'produce': 'Produce', 'dairy': 'Dairy', 'meat/seafood': 'Meat/Seafood', 'pantry': 'Pantry', 'canned': 'Canned', 'frozen': 'Frozen', 'other': 'Other' };
let scanDraftItems = [];
let scanKind = null; // 'receipt' | 'fridge' | 'pantry'

function guessLocationForCategory(category) {
  if (category === 'frozen') return 'freezer';
  if (category === 'dairy' || category === 'meat/seafood' || category === 'produce') return 'fridge';
  return 'pantry';
}

function openScanSheet() {
  document.getElementById('inv-scan-scrim').classList.add('open');
  document.getElementById('inv-scan-sheet').classList.add('open');
}
function closeScanSheet() {
  document.getElementById('inv-scan-scrim').classList.remove('open');
  document.getElementById('inv-scan-sheet').classList.remove('open');
  scanDraftItems = [];
  scanKind = null;
}
document.getElementById('inv-scan-scrim').addEventListener('click', closeScanSheet);
document.getElementById('inv-scan-sheet-close').addEventListener('click', closeScanSheet);

function renderScanReview() {
  const titles = { receipt: "Here's what I read off the receipt", fridge: "Here's what I spotted in the fridge", pantry: "Here's what I spotted in the pantry" };
  document.getElementById('inv-scan-title').textContent = titles[scanKind] || 'Review before saving';
  document.getElementById('inv-scan-sub').textContent = scanDraftItems.length
    ? 'Check names and quantities, remove anything wrong, then save.'
    : "Didn't find anything usable — try a clearer, closer photo.";

  const content = document.getElementById('inv-scan-content');
  if (!scanDraftItems.length) {
    content.innerHTML = '<div class="inv-scan-empty-note">Nothing to add from that photo.</div>';
    return;
  }
  content.innerHTML = scanDraftItems.map((it, i) => `
    <div class="inv-scan-item" data-idx="${i}">
      <div class="inv-scan-item-row1">
        <input type="text" class="inv-scan-name" value="${escapeHtml(it.item)}" placeholder="Item name" aria-label="Item name" />
        <input type="text" class="inv-scan-qty" value="${escapeHtml(it.quantity || '')}" placeholder="Qty" aria-label="Quantity" />
      </div>
      <div class="inv-scan-item-row2">
        <select class="inv-scan-category">
          ${SCAN_CATEGORIES.map(c => `<option value="${c}" ${c === it.category ? 'selected' : ''}>${CATEGORY_LABELS_SCAN[c]}</option>`).join('')}
        </select>
        <select class="inv-scan-location">
          ${LOCATION_ORDER.map(l => `<option value="${l}" ${l === it.location ? 'selected' : ''}>${LOCATION_LABELS[l]}</option>`).join('')}
        </select>
        ${it.confidence === 'low' ? '<span class="inv-scan-low-badge">double-check</span>' : ''}
        <button type="button" class="inv-scan-remove" data-remove="${i}" aria-label="Remove ${escapeHtml(it.item)}">&times;</button>
      </div>
    </div>
  `).join('') + `
    <div class="inv-scan-actions">
      <button type="button" class="inv-scan-cancel" id="inv-scan-cancel-btn">Cancel</button>
      <button type="button" class="inv-scan-save" id="inv-scan-save-btn">Save ${scanDraftItems.length} item${scanDraftItems.length === 1 ? '' : 's'}</button>
    </div>
  `;

  content.querySelectorAll('.inv-scan-item').forEach(row => {
    const idx = parseInt(row.getAttribute('data-idx'), 10);
    row.querySelector('.inv-scan-name').addEventListener('input', (e) => { scanDraftItems[idx].item = e.target.value; });
    row.querySelector('.inv-scan-qty').addEventListener('input', (e) => { scanDraftItems[idx].quantity = e.target.value; });
    row.querySelector('.inv-scan-category').addEventListener('change', (e) => { scanDraftItems[idx].category = e.target.value; });
    row.querySelector('.inv-scan-location').addEventListener('change', (e) => { scanDraftItems[idx].location = e.target.value; });
  });
  content.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      scanDraftItems.splice(parseInt(btn.getAttribute('data-remove'), 10), 1);
      renderScanReview();
    });
  });
  const cancelBtn = document.getElementById('inv-scan-cancel-btn');
  if (cancelBtn) cancelBtn.addEventListener('click', closeScanSheet);
  const saveBtn = document.getElementById('inv-scan-save-btn');
  if (saveBtn) saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    try {
      const items = scanDraftItems
        .filter(it => (it.item || '').trim())
        .map(it => ({ item: it.item.trim(), quantity: it.quantity || '', category: it.category || 'other', location: it.location || 'pantry' }));
      // Which photo this was. The server records it per row, because a
      // receipt names food and never a shelf — the location select above
      // is pre-filled from guessLocationForCategory for those, which is a
      // guess wearing a stated answer's clothes, and the freezer check
      // must not read it as one. See tools/inventory.py's scan_source.
      await Api.fetch('/api/inventory/confirm-scan', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items, kind: scanKind || '' }),
      });
      closeScanSheet();
      showToast(`Added ${items.length} item${items.length === 1 ? '' : 's'} to inventory`);
      loadInventory();
    } catch (err) {
      saveBtn.disabled = false;
      saveBtn.textContent = `Save ${scanDraftItems.length} item${scanDraftItems.length === 1 ? '' : 's'}`;
      alert("Couldn't save those — try again.");
    }
  });
}

async function runScan(kind, file) {
  scanKind = kind;
  scanDraftItems = [];
  document.getElementById('inv-scan-title').textContent = 'Reading your photo…';
  document.getElementById('inv-scan-sub').textContent = 'This can take a few seconds.';
  document.getElementById('inv-scan-content').innerHTML = '<div class="inv-scan-loading">Looking closely&hellip;</div>';
  openScanSheet();
  try {
    const form = new FormData();
    form.append('photo', file);
    const res = await Api.fetch(`/api/inventory/scan-${kind}`, { method: 'POST', body: form });
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).detail || ''; } catch (e) { /* not JSON */ }
      throw new Error(detail || 'Scan failed');
    }
    const data = await res.json();
    scanDraftItems = (data.items || []).map(it => ({
      item: it.item || '',
      quantity: it.quantity || '',
      category: it.category || 'other',
      confidence: it.confidence || 'high',
      location: it.location || guessLocationForCategory(it.category || 'other'),
    }));
    renderScanReview();
  } catch (err) {
    // A scan needs Claude, and Claude needs a connection: with no signal
    // say that, plainly, rather than "Failed to fetch".
    const noSignal = navigator.onLine === false || (err && err.name === 'TypeError');
    document.getElementById('inv-scan-title').textContent = noSignal ? "I need a signal for this one" : "Couldn't read that photo";
    document.getElementById('inv-scan-sub').textContent = noSignal ? "Try again when you’re back." : (err.message || 'Try again with a clearer photo.');
    document.getElementById('inv-scan-content').innerHTML = '<div class="inv-scan-actions"><button type="button" class="inv-scan-cancel" id="inv-scan-cancel-btn2" style="flex:1">Close</button></div>';
    const closeBtn = document.getElementById('inv-scan-cancel-btn2');
    if (closeBtn) closeBtn.addEventListener('click', closeScanSheet);
  }
}

[['receipt', 'inv-scan-receipt-btn', 'inv-scan-receipt-input'],
 ['fridge', 'inv-scan-fridge-btn', 'inv-scan-fridge-input'],
 ['pantry', 'inv-scan-pantry-btn', 'inv-scan-pantry-input']].forEach(([kind, btnId, inputId]) => {
  const btn = document.getElementById(btnId);
  const input = document.getElementById(inputId);
  btn.addEventListener('click', () => input.click());
  input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    input.value = ''; // allow re-selecting the same file next time
    if (file) runScan(kind, file);
  });
});

setupDictation(document.getElementById('inv-add-item'), document.getElementById('inv-add-item-mic-btn'));

loadInventory();
</script>
<script src="/static/embedded-page.js"></script>
</body>
</html>
