<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Inventory — Home Manager</title>
<style>
  /* Inventory (design_handoff_home_manager §6, option 5a, approved). This
     replaces the old pre-redesign page (section toggle, scan buttons,
     plain rows) entirely — see README's Phase 4 notes for what that page
     used to do and what happened to receipt/fridge/pantry scanning. */
  * { box-sizing: border-box; }
  body { max-width: 480px; margin: 0 auto; padding: 0 0 40px; background: var(--page, #EFE6D6); }
  .inv-header { padding: 20px 20px 6px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .inv-back { font-family: var(--font-body); font-weight: 700; font-size: 0.82rem; color: var(--midnight-violet); text-decoration: none; display: block; margin-bottom: 8px; }
  .inv-title { font-family: var(--font-heading); font-weight: 700; font-size: 1.8rem; color: var(--midnight-violet); margin: 0; }
  .inv-summary { font-family: var(--font-body); font-size: 0.84rem; color: #6B5A63; text-align: right; white-space: nowrap; padding-top: 8px; }

  .inv-content { padding: 6px 20px 20px; }
  .inv-card { background: #fff; border-radius: 18px; padding: 16px 18px 10px; margin-bottom: 16px; }
  .inv-card-header { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid #F1E8DA; padding-bottom: 10px; margin-bottom: 4px; }
  .inv-card-name { font-family: var(--font-heading); font-weight: 700; font-size: 1.2rem; color: var(--midnight-violet); margin: 0; }
  .inv-card-count { font-family: var(--font-body); font-size: 0.84rem; color: #9C8B93; }
  .inv-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F1E8DA; cursor: pointer; }
  .inv-row:last-child { border-bottom: none; }
  .inv-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #C4B09C; }
  .inv-dot.soon { background: #E8562A; }
  .inv-dot.low { background: #F0B429; }
  .inv-name { font-family: var(--font-body); font-size: 1rem; color: var(--ink); flex: 1; }
  .inv-qty { font-family: var(--font-body); font-size: 0.92rem; color: #8A7A82; }
  .inv-flag { font-family: var(--font-body); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
  .inv-flag.soon { color: #C0431E; background: rgba(232,86,42,.12); }
  .inv-flag.low { color: #B98A12; background: rgba(240,180,41,.14); }
  .inv-empty { text-align: center; padding: 60px 20px; font-family: var(--font-body); color: #8A7A82; }

  .inv-add-card { background: #fff; border-radius: 18px; padding: 16px 18px; margin-bottom: 16px; }
  .inv-add-title { font-family: var(--font-body); font-weight: 700; color: var(--ink); font-size: 0.9rem; margin: 0 0 10px; }
  .inv-add-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .inv-add-row input, .inv-add-row select { font-family: var(--font-body); border: 1px solid rgba(0,0,0,.15); border-radius: 10px; padding: 10px 12px; font-size: 0.88rem; }
  .inv-add-row input#inv-add-item { flex: 1; min-width: 120px; }
  .inv-add-row button { background: var(--midnight-violet); color: var(--oat-cream); border: none; border-radius: 10px; padding: 10px 18px; font-weight: 700; cursor: pointer; font-family: var(--font-body); }

  /* Photo capture (restored — see design_handoff_home_manager README's
     Phase 4 note on why this was originally dropped, and the later
     testing-feedback note on why it's back). Backend endpoints
     (/api/inventory/scan-receipt|scan-fridge|scan-pantry|confirm-scan)
     were never removed — this is UI-only. */
  .inv-scan-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .inv-scan-btn { flex: 1; min-width: 100px; background: #F6EFE1; color: var(--midnight-violet); border: 1.5px solid #E0D3BF; border-radius: 10px; padding: 10px 10px; font-weight: 700; font-size: 0.82rem; cursor: pointer; font-family: var(--font-body); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .inv-scan-btn:hover { background: #EFE4CF; }
  .inv-scan-btn svg { width: 16px; height: 16px; flex: none; }

  #inv-scan-sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; background: #fff; border-radius: 26px 26px 0 0; padding: 16px 20px 24px; z-index: 999; display: none; max-height: 88vh; overflow-y: auto; animation: invSheetUp .24s cubic-bezier(.2,.8,.2,1); }
  #inv-scan-sheet.open { display: block; }
  .inv-scan-title { font-family: var(--font-heading); font-weight: 700; font-size: 1.3rem; color: var(--ink); margin: 0 0 4px; }
  .inv-scan-sub { font-family: var(--font-body); font-size: 0.86rem; color: #6B5A63; margin: 0 0 16px; }
  .inv-scan-loading { text-align: center; padding: 40px 10px; font-family: var(--font-body); color: #8A7A82; }
  .inv-scan-item { background: #F6EFE1; border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .inv-scan-item-row1 { display: flex; gap: 6px; margin-bottom: 6px; }
  .inv-scan-item-row1 input { flex: 1; min-width: 0; font-family: var(--font-body); border: 1px solid rgba(0,0,0,.15); border-radius: 8px; padding: 8px 10px; font-size: 0.88rem; }
  .inv-scan-item-row1 input.inv-scan-qty { flex: none; width: 64px; }
  .inv-scan-item-row2 { display: flex; gap: 6px; align-items: center; }
  .inv-scan-item-row2 select { font-family: var(--font-body); border: 1px solid rgba(0,0,0,.15); border-radius: 8px; padding: 7px 8px; font-size: 0.82rem; background: #fff; }
  .inv-scan-low-badge { font-family: var(--font-body); font-weight: 700; font-size: 0.68rem; text-transform: uppercase; letter-spacing: .04em; color: #B98A12; background: rgba(240,180,41,.16); padding: 3px 7px; border-radius: 999px; }
  .inv-scan-remove { margin-left: auto; background: none; border: none; color: #A3939B; font-size: 1.1rem; cursor: pointer; padding: 2px 6px; }
  .inv-scan-empty-note { font-family: var(--font-body); color: #8A7A82; text-align: center; padding: 20px 10px; }
  .inv-scan-actions { display: flex; gap: 10px; margin-top: 14px; }
  .inv-scan-actions button { flex: 1; padding: 14px; border-radius: 13px; font-weight: 700; font-size: 0.92rem; cursor: pointer; font-family: var(--font-body); border: none; }
  .inv-scan-save { background: var(--midnight-violet); color: var(--oat-cream); }
  .inv-scan-cancel { background: transparent; border: 1.5px solid var(--midnight-violet) !important; color: var(--midnight-violet); }

  /* Location pill nav — jump straight to a section instead of scrolling
     past a long stacked list of every location's card. "All" (default)
     keeps the original stacked view; picking a location scrolls to and
     highlights just that card. */
  .inv-loc-nav { display: flex; gap: 8px; padding: 0 20px 10px; overflow-x: auto; }
  .inv-loc-pill { flex: none; font-family: var(--font-body); font-weight: 700; font-size: 0.84rem; padding: 8px 16px; border-radius: 999px; border: 1.5px solid #E0D3BF; background: #fff; color: var(--midnight-violet); cursor: pointer; white-space: nowrap; }
  .inv-loc-pill.active { background: var(--midnight-violet); border-color: var(--midnight-violet); color: var(--oat-cream); }
  .inv-card.inv-card-highlight { animation: invCardPulse 1s ease; }
  @keyframes invCardPulse { 0%, 100% { box-shadow: none; } 30% { box-shadow: 0 0 0 3px var(--turmeric-gold, #F0B429); } }

  /* Item detail sheet */
  #inv-scrim, .inv-scan-scrim-el { position: fixed; inset: 0; background: rgba(58,31,46,.42); display: none; z-index: 998; animation: invFadeIn .18s ease; }
  #inv-scrim.open, .inv-scan-scrim-el.open { display: block; }
  #inv-sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; background: #fff; border-radius: 26px 26px 0 0; padding: 16px 20px 26px; z-index: 999; display: none; max-height: 88vh; overflow-y: auto; animation: invSheetUp .24s cubic-bezier(.2,.8,.2,1); }
  #inv-sheet.open { display: block; }
  @keyframes invFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes invSheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  /* A real <button> now (it closes the sheet, and was previously a <div>
     that only a mouse could use) — reset the UA button styling so it
     still renders as the same grab handle. */
  .inv-sheet-handle { display: block; width: 44px; height: 5px; padding: 0; border: none; appearance: none; border-radius: 999px; background: #E0D3BF; margin: 0 auto 14px; cursor: pointer; }
  .inv-sheet-kicker { font-family: var(--font-body); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: #A8825C; margin: 0 0 4px; }
  .inv-sheet-name { font-family: var(--font-heading); font-weight: 700; font-size: 1.5rem; color: var(--ink); margin: 0 0 18px; }
  .inv-sheet-label { font-family: var(--font-body); font-size: 0.92rem; color: #6B5A63; margin: 0 0 8px; }
  .inv-stepper-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 20px; }
  .inv-stepper-btn { width: 44px; height: 44px; border-radius: 12px; background: #F6EFE1; border: none; font-family: var(--font-body); font-weight: 800; font-size: 20px; color: var(--midnight-violet); cursor: pointer; }
  .inv-stepper-btn:hover { background: #EFE4CF; }
  .inv-stepper-value { width: 120px; text-align: center; font-family: var(--font-heading); font-weight: 700; font-size: 1.1rem; }
  .inv-location-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .inv-location-btn { flex: 1; padding: 13px 0; border-radius: 12px; border: 1.5px solid #E0D3BF; background: #fff; font-family: var(--font-body); font-weight: 400; color: var(--ink); cursor: pointer; text-align: center; }
  .inv-location-btn.selected { background: #F4E7EF; border-color: var(--midnight-violet); font-weight: 700; color: var(--midnight-violet); }
  .inv-bb-card { background: #F6EFE1; border-radius: 14px; padding: 13px 13px 13px 17px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .inv-bb-left .inv-bb-title { font-family: var(--font-body); font-size: 0.96rem; color: var(--ink); margin: 0; }
  .inv-bb-left .inv-bb-relative { font-family: var(--font-body); font-size: 0.84rem; margin: 2px 0 0; color: #3A1F2E; }
  .inv-bb-left .inv-bb-relative.soon { color: #C0431E; }
  .inv-bb-right { display: flex; align-items: center; gap: 8px; }
  .inv-bb-btn { width: 38px; height: 38px; border-radius: 10px; background: #fff; border: none; font-weight: 800; font-family: var(--font-body); font-size: 18px; color: var(--midnight-violet); cursor: pointer; }
  .inv-bb-date { width: 90px; text-align: center; font-family: var(--font-body); font-weight: 700; font-size: 0.9rem; }
  .inv-sheet-actions { display: flex; flex-direction: column; gap: 10px; }
  .inv-action-btn { padding: 15px; border-radius: 13px; font-weight: 700; font-size: 0.94rem; cursor: pointer; font-family: var(--font-body); border: none; }
  .inv-action-add { background: var(--midnight-violet); color: var(--oat-cream); }
  .inv-action-add.on-list { background: #F0F7EA; color: #4D8A33; cursor: default; }
  .inv-action-used { background: transparent; border: 1.5px solid var(--midnight-violet); color: var(--midnight-violet); }

  #inv-toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #3A1F2E; color: #FFFDF6; font-family: var(--font-body); font-size: 0.88rem; font-weight: 600; padding: 12px 22px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 1001; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  #inv-toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="inv-header">
  <div>
    <a class="inv-back" href="/kitchen">&larr; Kitchen</a>
    <h1 class="inv-title">Inventory</h1>
  </div>
  <p class="inv-summary" id="inv-summary" role="status">Loading…</p>
</div>

<div class="inv-content" style="padding-bottom:0">
  <div class="inv-add-card">
    <p class="inv-add-title">Add to inventory</p>
    <div class="inv-add-row">
      <input type="text" id="inv-add-item" placeholder="Item, e.g. ground beef" aria-label="Item to add to inventory" />
      <button type="button" class="dictate-btn" id="inv-add-item-mic-btn" aria-label="Dictate item" title="Dictate item">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.07A7 7 0 0 0 19 11z"/></svg>
      </button>
      <input type="text" id="inv-add-qty" placeholder="Qty" style="width:70px" aria-label="Quantity" />
      <select id="inv-add-location" aria-label="Where it lives">
        <option value="fridge">Fridge</option>
        <option value="freezer">Freezer</option>
        <option value="pantry" selected>Pantry</option>
      </select>
      <button id="inv-add-btn">Add</button>
    </div>
    <div class="inv-scan-row">
      <button type="button" class="inv-scan-btn" id="inv-scan-receipt-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l3 3v17H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
        Scan a receipt
      </button>
      <button type="button" class="inv-scan-btn" id="inv-scan-fridge-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M4 9h16M8 4.5v3M8 12v6"/></svg>
        Scan the fridge
      </button>
      <button type="button" class="inv-scan-btn" id="inv-scan-pantry-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18"/></svg>
        Scan the pantry
      </button>
    </div>
    <input type="file" accept="image/*" capture="environment" id="inv-scan-receipt-input" hidden />
    <input type="file" accept="image/*" capture="environment" id="inv-scan-fridge-input" hidden />
    <input type="file" accept="image/*" capture="environment" id="inv-scan-pantry-input" hidden />
  </div>
</div>

<div class="inv-loc-nav" id="inv-loc-nav"></div>

<div class="inv-content" id="inv-content" style="padding-top:0" role="status"><p class="inv-empty">Loading…</p></div>

<div id="inv-scan-scrim" class="inv-scan-scrim-el" aria-hidden="true"></div>
<div id="inv-scan-sheet" role="dialog" aria-modal="true" aria-labelledby="inv-scan-title">
  <button type="button" class="inv-sheet-handle" id="inv-scan-sheet-close" aria-label="Close"></button>
  <h2 class="inv-scan-title" id="inv-scan-title">Reading your photo&hellip;</h2>
  <p class="inv-scan-sub" id="inv-scan-sub">This can take a few seconds.</p>
  <div id="inv-scan-content" role="status"><div class="inv-scan-loading">Looking closely&hellip;</div></div>
</div>

<div id="inv-scrim" aria-hidden="true"></div>
<div id="inv-sheet" role="dialog" aria-modal="true" aria-labelledby="inv-sheet-name">
  <button type="button" class="inv-sheet-handle" id="inv-sheet-close" aria-label="Close"></button>
  <p class="inv-sheet-kicker" id="inv-sheet-kicker">Location · added this month</p>
  <h2 class="inv-sheet-name" id="inv-sheet-name">Item</h2>

  <p class="inv-sheet-label">How much is left</p>
  <div class="inv-stepper-row">
    <button type="button" class="inv-stepper-btn" id="inv-qty-minus" aria-label="Less of this item">&minus;</button>
    <span class="inv-stepper-value" id="inv-qty-value" role="status" aria-label="Amount left">0</span>
    <button type="button" class="inv-stepper-btn" id="inv-qty-plus" aria-label="More of this item">+</button>
  </div>

  <p class="inv-sheet-label">Where it lives</p>
  <div class="inv-location-row" id="inv-location-row" role="group" aria-label="Where it lives">
    <button type="button" class="inv-location-btn" data-loc="fridge" aria-pressed="false">Fridge</button>
    <button type="button" class="inv-location-btn" data-loc="freezer" aria-pressed="false">Freezer</button>
    <button type="button" class="inv-location-btn" data-loc="pantry" aria-pressed="false">Pantry</button>
  </div>

  <div class="inv-bb-card">
    <div class="inv-bb-left">
      <p class="inv-bb-title">Best before</p>
      <p class="inv-bb-relative" id="inv-bb-relative">—</p>
    </div>
    <div class="inv-bb-right">
      <button type="button" class="inv-bb-btn" id="inv-bb-minus" aria-label="Best before one day earlier">&minus;</button>
      <span class="inv-bb-date" id="inv-bb-date" role="status" aria-label="Best before date">—</span>
      <button type="button" class="inv-bb-btn" id="inv-bb-plus" aria-label="Best before one day later">+</button>
    </div>
  </div>

  <div class="inv-sheet-actions">
    <button class="inv-action-btn inv-action-add" id="inv-add-to-grocery">Add to grocery list</button>
    <button class="inv-action-btn inv-action-used" id="inv-used-up">Used it up</button>
  </div>
</div>

<div id="inv-toast" role="status" aria-live="polite"></div>

<script src="/static/dictation.js"></script>
<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// The Kitchen hub (kitchen.html) links here as a "pushed view" inside its
// own iframe (window.location.href = '/inventory', not a real shell
// navigation) — see design_handoff_home_manager README's Kitchen hub note.
// The "‹ Kitchen" back link's plain href="/kitchen" doesn't know that: when
// this page is itself running inside that iframe, following it loads the
// full shell.html (rail + tab bar + ask bar) a second time nested inside
// the already-small Kitchen tab panel, stacked under the real outer shell —
// confirmed via a sandbox screenshot, not a hypothetical. Fixed by
// detecting the iframe case and going back to the hub's own embed src
// instead, which stays inside the same iframe with no nested shell. When
// this page is reached directly (the rail's standalone "Inventory" link,
// which is NOT inside an iframe), the plain '/kitchen' navigation is
// correct as-is and left alone.
(function () {
  var backLink = document.querySelector('.inv-back');
  if (backLink && window.self !== window.top) {
    backLink.setAttribute('href', '/static/kitchen.html');
  }
})();
const LOCATION_ORDER = ['fridge', 'freezer', 'pantry'];
const LOCATION_LABELS = { fridge: 'Fridge', freezer: 'Freezer', pantry: 'Pantry' };

let currentItem = null;
let neededItemNames = new Set();

function isLow(quantity) {
  const m = /^\s*([\d.]+)/.exec(quantity || '');
  return !!m && parseFloat(m[1]) <= 1;
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}
function relativeWording(days) {
  if (days == null) return null;
  if (days < 0) return `${-days} day${-days === 1 ? '' : 's'} past`;
  if (days === 0) return 'today';
  if (days === 1) return 'tomorrow';
  if (days <= 7) return `in ${days} days`;
  if (days <= 60) { const w = Math.round(days / 7); return `in ${w} week${w === 1 ? '' : 's'}`; }
  const mo = Math.round(days / 30); return `in ${mo} month${mo === 1 ? '' : 's'}`;
}

async function loadNeededItemNames() {
  try {
    // status=all, filtered to 'needed' client-side — status=needed alone
    // hides anything currently caught by the "Already have this?" cross-
    // reference banner (see app/main.py's get_grocery_list_view), which
    // would otherwise make an inventory item's own "Add to grocery list"
    // button flip back to un-checked the moment it's added, since that's
    // exactly the case that banner exists to catch.
    const res = await fetch('/api/grocery-list?status=all');
    if (!res.ok) return;
    const data = await res.json();
    neededItemNames = new Set();
    (data.sections || []).forEach(s => s.items.forEach(it => { if (it.status === 'needed') neededItemNames.add(it.item.trim().toLowerCase()); }));
  } catch (err) { /* non-critical */ }
}

async function loadInventory() {
  const content = document.getElementById('inv-content');
  try {
    await loadNeededItemNames();
    const res = await fetch('/api/inventory/by-location');
    if (!res.ok) throw new Error('failed');
    const data = await res.json();
    const locations = data.locations || [];
    const totalItems = locations.reduce((n, l) => n + l.items.length, 0);
    let soonCount = 0, lowCount = 0;
    locations.forEach(l => l.items.forEach(it => {
      const d = daysUntil(it.expiration_date);
      if (d != null && d <= 4) soonCount++;
      if (isLow(it.quantity)) lowCount++;
    }));
    document.getElementById('inv-summary').textContent = `${soonCount} to use soon · ${lowCount} running low`;

    const navEl = document.getElementById('inv-loc-nav');
    if (!totalItems) {
      content.innerHTML = '<p class="inv-empty">Nothing tracked yet — add something below, or it fills in automatically as you check off the grocery list.</p>';
      navEl.innerHTML = '';
      return;
    }

    // Pill nav: only for locations that actually have something in them —
    // no point offering to jump to an empty Freezer card that isn't even
    // rendered. Clicking scrolls straight to that section instead of
    // scrolling past everything above it.
    const presentLocs = LOCATION_ORDER.filter(loc => {
      const g = locations.find(l => l.location === loc);
      return g && g.items.length;
    });
    navEl.innerHTML = presentLocs.length > 1
      ? presentLocs.map(loc => `<button type="button" class="inv-loc-pill" data-jump="${loc}">${LOCATION_LABELS[loc]}</button>`).join('')
      : '';
    navEl.querySelectorAll('[data-jump]').forEach(pill => {
      pill.addEventListener('click', () => {
        const card = document.getElementById('inv-card-' + pill.getAttribute('data-jump'));
        if (!card) return;
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        card.classList.add('inv-card-highlight');
        setTimeout(() => card.classList.remove('inv-card-highlight'), 1000);
      });
    });

    let html = '';
    for (const loc of LOCATION_ORDER) {
      const group = locations.find(l => l.location === loc);
      if (!group || !group.items.length) continue;
      html += `<div class="inv-card" id="inv-card-${loc}">
        <div class="inv-card-header">
          <p class="inv-card-name">${LOCATION_LABELS[loc]}</p>
          <span class="inv-card-count">${group.items.length} item${group.items.length === 1 ? '' : 's'}</span>
        </div>`;
      for (const it of group.items) {
        const d = daysUntil(it.expiration_date);
        const soon = d != null && d <= 4;
        const low = !soon && isLow(it.quantity);
        const dotClass = soon ? 'soon' : (low ? 'low' : '');
        html += `<div class="inv-row" data-item-id="${it.id}">
          <span class="inv-dot ${dotClass}"></span>
          <span class="inv-name">${escapeHtml(it.item)}</span>
          <span class="inv-qty">${escapeHtml(it.quantity || '')}</span>
          ${soon ? '<span class="inv-flag soon">use soon</span>' : (low ? '<span class="inv-flag low">low</span>' : '')}
        </div>`;
      }
      html += `</div>`;
    }
    content.innerHTML = html;
    content.querySelectorAll('[data-item-id]').forEach(row => {
      row.addEventListener('click', () => openItemSheet(parseInt(row.getAttribute('data-item-id'), 10), locations));
    });
  } catch (err) {
    content.innerHTML = '<p class="inv-empty">Couldn\'t load inventory right now — try refreshing.</p>';
  }
}

function showToast(message) {
  const el = document.getElementById('inv-toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

function openItemSheet(itemId, locations) {
  let item = null;
  for (const l of locations) { const found = l.items.find(it => it.id === itemId); if (found) item = found; }
  if (!item) return;
  currentItem = item;
  renderSheet();
  document.getElementById('inv-scrim').classList.add('open');
  document.getElementById('inv-sheet').classList.add('open');
}
function closeItemSheet() {
  document.getElementById('inv-scrim').classList.remove('open');
  document.getElementById('inv-sheet').classList.remove('open');
  currentItem = null;
}
document.getElementById('inv-scrim').addEventListener('click', closeItemSheet);
document.getElementById('inv-sheet-close').addEventListener('click', closeItemSheet);

function renderSheet() {
  const it = currentItem;
  const created = it.created_at ? new Date(it.created_at.replace(' ', 'T')) : null;
  const now = new Date();
  const sameMonth = created && created.getFullYear() === now.getFullYear() && created.getMonth() === now.getMonth();
  const kickerLoc = LOCATION_LABELS[it.location] || 'Pantry';
  document.getElementById('inv-sheet-kicker').textContent = `${kickerLoc} · ${sameMonth ? 'added this month' : 'added ' + (created ? created.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : 'earlier')}`;
  document.getElementById('inv-sheet-name').textContent = it.item;

  const m = /^\s*([\d.]+)/.exec(it.quantity || '');
  const qtyValue = m ? m[1] : (it.quantity ? '1' : '0');
  document.getElementById('inv-qty-value').textContent = it.quantity || '0';
  // Name the steppers after the item they're adjusting, so a screen reader
  // says "Less of ground beef" rather than "minus, button".
  document.getElementById('inv-qty-minus').setAttribute('aria-label', `Less of ${it.item}`);
  document.getElementById('inv-qty-plus').setAttribute('aria-label', `More of ${it.item}`);

  document.querySelectorAll('.inv-location-btn').forEach(btn => {
    const selected = btn.getAttribute('data-loc') === it.location;
    btn.classList.toggle('selected', selected);
    // The "selected" styling is the only signal a sighted user needs;
    // aria-pressed carries the same state to everyone else.
    btn.setAttribute('aria-pressed', selected ? 'true' : 'false');
  });

  const d = daysUntil(it.expiration_date);
  const rel = relativeWording(d);
  const relEl = document.getElementById('inv-bb-relative');
  relEl.textContent = rel || 'not set';
  relEl.classList.toggle('soon', d != null && d <= 4);
  document.getElementById('inv-bb-date').textContent = it.expiration_date
    ? new Date(it.expiration_date + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
    : '—';

  const onList = neededItemNames.has((it.item || '').trim().toLowerCase());
  const addBtn = document.getElementById('inv-add-to-grocery');
  addBtn.textContent = onList ? 'On the list ✓' : 'Add to grocery list';
  addBtn.classList.toggle('on-list', onList);
  addBtn.disabled = onList;
}

async function refreshAfterSheetChange() {
  await loadInventory();
  if (currentItem) {
    const res = await fetch('/api/inventory/by-location');
    if (res.ok) {
      const data = await res.json();
      const locations = data.locations || [];
      let item = null;
      for (const l of locations) { const found = l.items.find(it => it.id === currentItem.id); if (found) item = found; }
      if (item) { currentItem = item; renderSheet(); } else { closeItemSheet(); }
    }
  }
}

document.getElementById('inv-qty-minus').addEventListener('click', async () => {
  if (!currentItem) return;
  try { await fetch(`/api/inventory/${currentItem.id}/quantity`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ delta: -1 }) }); await refreshAfterSheetChange(); }
  catch (err) { alert("Couldn't update that — try again."); }
});
document.getElementById('inv-qty-plus').addEventListener('click', async () => {
  if (!currentItem) return;
  try { await fetch(`/api/inventory/${currentItem.id}/quantity`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ delta: 1 }) }); await refreshAfterSheetChange(); }
  catch (err) { alert("Couldn't update that — try again."); }
});
document.getElementById('inv-location-row').addEventListener('click', async (e) => {
  const btn = e.target.closest('.inv-location-btn');
  if (!btn || !currentItem) return;
  try { await fetch(`/api/inventory/${currentItem.id}/location`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ location: btn.getAttribute('data-loc') }) }); await refreshAfterSheetChange(); }
  catch (err) { alert("Couldn't move that — try again."); }
});
document.getElementById('inv-bb-minus').addEventListener('click', async () => {
  if (!currentItem) return;
  try { await fetch(`/api/inventory/${currentItem.id}/expiration`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ delta_days: -1 }) }); await refreshAfterSheetChange(); }
  catch (err) { alert("Couldn't update that — try again."); }
});
document.getElementById('inv-bb-plus').addEventListener('click', async () => {
  if (!currentItem) return;
  try { await fetch(`/api/inventory/${currentItem.id}/expiration`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ delta_days: 1 }) }); await refreshAfterSheetChange(); }
  catch (err) { alert("Couldn't update that — try again."); }
});
document.getElementById('inv-add-to-grocery').addEventListener('click', async () => {
  if (!currentItem) return;
  const btn = document.getElementById('inv-add-to-grocery');
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    await fetch('/api/grocery-list/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item: currentItem.item, category: currentItem.category || 'other' }) });
    await loadNeededItemNames();
    renderSheet();
  } catch (err) { btn.disabled = false; alert("Couldn't add that — try again."); }
});
document.getElementById('inv-used-up').addEventListener('click', async () => {
  if (!currentItem) return;
  const name = currentItem.item;
  const btn = document.getElementById('inv-used-up');
  btn.disabled = true;
  try {
    await fetch(`/api/inventory/${currentItem.id}/remove`, { method: 'POST' });
    closeItemSheet();
    showToast(`${name} marked used up`);
    loadInventory();
  } catch (err) { btn.disabled = false; alert("Couldn't remove that — try again."); }
});

document.getElementById('inv-add-btn').addEventListener('click', async () => {
  const itemInput = document.getElementById('inv-add-item');
  const qtyInput = document.getElementById('inv-add-qty');
  const locSelect = document.getElementById('inv-add-location');
  const item = itemInput.value.trim();
  if (!item) return;
  try {
    await fetch('/api/inventory/update', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item, action: 'add', quantity: qtyInput.value.trim(), location: locSelect.value }),
    });
    itemInput.value = ''; qtyInput.value = '';
    loadInventory();
  } catch (err) { alert("Couldn't add that — try again."); }
});

// ---------- Photo capture (receipt / fridge / pantry scan) ----------
// Restored per testing feedback — the backend (/api/inventory/scan-receipt,
// scan-fridge, scan-pantry, confirm-scan) was never removed when this page
// was rewritten; only the UI entry points were dropped, since the design
// package's spec for this screen explicitly called photo capture out of
// scope. Nothing here is trusted silently: every scan comes back as a
// draft list in a review sheet — editable, removable — before anything is
// written to inventory_items via confirm-scan.
const SCAN_CATEGORIES = ['produce', 'dairy', 'meat/seafood', 'pantry', 'frozen', 'other'];
const CATEGORY_LABELS_SCAN = { 'produce': 'Produce', 'dairy': 'Dairy', 'meat/seafood': 'Meat/Seafood', 'pantry': 'Pantry', 'frozen': 'Frozen', 'other': 'Other' };
let scanDraftItems = [];
let scanKind = null; // 'receipt' | 'fridge' | 'pantry'

function guessLocationForCategory(category) {
  if (category === 'frozen') return 'freezer';
  if (category === 'dairy' || category === 'meat/seafood' || category === 'produce') return 'fridge';
  return 'pantry';
}

function openScanSheet() {
  document.getElementById('inv-scan-scrim').classList.add('open');
  document.getElementById('inv-scan-sheet').classList.add('open');
}
function closeScanSheet() {
  document.getElementById('inv-scan-scrim').classList.remove('open');
  document.getElementById('inv-scan-sheet').classList.remove('open');
  scanDraftItems = [];
  scanKind = null;
}
document.getElementById('inv-scan-scrim').addEventListener('click', closeScanSheet);
document.getElementById('inv-scan-sheet-close').addEventListener('click', closeScanSheet);

function renderScanReview() {
  const titles = { receipt: "Here's what I read off the receipt", fridge: "Here's what I spotted in the fridge", pantry: "Here's what I spotted in the pantry" };
  document.getElementById('inv-scan-title').textContent = titles[scanKind] || 'Review before saving';
  document.getElementById('inv-scan-sub').textContent = scanDraftItems.length
    ? 'Check names and quantities, remove anything wrong, then save.'
    : "Didn't find anything usable — try a clearer, closer photo.";

  const content = document.getElementById('inv-scan-content');
  if (!scanDraftItems.length) {
    content.innerHTML = '<div class="inv-scan-empty-note">Nothing to add from that photo.</div>';
    return;
  }
  content.innerHTML = scanDraftItems.map((it, i) => `
    <div class="inv-scan-item" data-idx="${i}">
      <div class="inv-scan-item-row1">
        <input type="text" class="inv-scan-name" value="${escapeHtml(it.item)}" placeholder="Item name" aria-label="Item name" />
        <input type="text" class="inv-scan-qty" value="${escapeHtml(it.quantity || '')}" placeholder="Qty" aria-label="Quantity" />
      </div>
      <div class="inv-scan-item-row2">
        <select class="inv-scan-category">
          ${SCAN_CATEGORIES.map(c => `<option value="${c}" ${c === it.category ? 'selected' : ''}>${CATEGORY_LABELS_SCAN[c]}</option>`).join('')}
        </select>
        <select class="inv-scan-location">
          ${LOCATION_ORDER.map(l => `<option value="${l}" ${l === it.location ? 'selected' : ''}>${LOCATION_LABELS[l]}</option>`).join('')}
        </select>
        ${it.confidence === 'low' ? '<span class="inv-scan-low-badge">double-check</span>' : ''}
        <button type="button" class="inv-scan-remove" data-remove="${i}" aria-label="Remove ${escapeHtml(it.item)}">&times;</button>
      </div>
    </div>
  `).join('') + `
    <div class="inv-scan-actions">
      <button type="button" class="inv-scan-cancel" id="inv-scan-cancel-btn">Cancel</button>
      <button type="button" class="inv-scan-save" id="inv-scan-save-btn">Save ${scanDraftItems.length} item${scanDraftItems.length === 1 ? '' : 's'}</button>
    </div>
  `;

  content.querySelectorAll('.inv-scan-item').forEach(row => {
    const idx = parseInt(row.getAttribute('data-idx'), 10);
    row.querySelector('.inv-scan-name').addEventListener('input', (e) => { scanDraftItems[idx].item = e.target.value; });
    row.querySelector('.inv-scan-qty').addEventListener('input', (e) => { scanDraftItems[idx].quantity = e.target.value; });
    row.querySelector('.inv-scan-category').addEventListener('change', (e) => { scanDraftItems[idx].category = e.target.value; });
    row.querySelector('.inv-scan-location').addEventListener('change', (e) => { scanDraftItems[idx].location = e.target.value; });
  });
  content.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      scanDraftItems.splice(parseInt(btn.getAttribute('data-remove'), 10), 1);
      renderScanReview();
    });
  });
  const cancelBtn = document.getElementById('inv-scan-cancel-btn');
  if (cancelBtn) cancelBtn.addEventListener('click', closeScanSheet);
  const saveBtn = document.getElementById('inv-scan-save-btn');
  if (saveBtn) saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    try {
      const items = scanDraftItems
        .filter(it => (it.item || '').trim())
        .map(it => ({ item: it.item.trim(), quantity: it.quantity || '', category: it.category || 'other', location: it.location || 'pantry' }));
      await fetch('/api/inventory/confirm-scan', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items }),
      });
      closeScanSheet();
      showToast(`Added ${items.length} item${items.length === 1 ? '' : 's'} to inventory`);
      loadInventory();
    } catch (err) {
      saveBtn.disabled = false;
      saveBtn.textContent = `Save ${scanDraftItems.length} item${scanDraftItems.length === 1 ? '' : 's'}`;
      alert("Couldn't save those — try again.");
    }
  });
}

async function runScan(kind, file) {
  scanKind = kind;
  scanDraftItems = [];
  document.getElementById('inv-scan-title').textContent = 'Reading your photo…';
  document.getElementById('inv-scan-sub').textContent = 'This can take a few seconds.';
  document.getElementById('inv-scan-content').innerHTML = '<div class="inv-scan-loading">Looking closely&hellip;</div>';
  openScanSheet();
  try {
    const form = new FormData();
    form.append('photo', file);
    const res = await fetch(`/api/inventory/scan-${kind}`, { method: 'POST', body: form });
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).detail || ''; } catch (e) { /* not JSON */ }
      throw new Error(detail || 'Scan failed');
    }
    const data = await res.json();
    scanDraftItems = (data.items || []).map(it => ({
      item: it.item || '',
      quantity: it.quantity || '',
      category: it.category || 'other',
      confidence: it.confidence || 'high',
      location: it.location || guessLocationForCategory(it.category || 'other'),
    }));
    renderScanReview();
  } catch (err) {
    document.getElementById('inv-scan-title').textContent = "Couldn't read that photo";
    document.getElementById('inv-scan-sub').textContent = err.message || 'Try again with a clearer photo.';
    document.getElementById('inv-scan-content').innerHTML = '<div class="inv-scan-actions"><button type="button" class="inv-scan-cancel" id="inv-scan-cancel-btn2" style="flex:1">Close</button></div>';
    const closeBtn = document.getElementById('inv-scan-cancel-btn2');
    if (closeBtn) closeBtn.addEventListener('click', closeScanSheet);
  }
}

[['receipt', 'inv-scan-receipt-btn', 'inv-scan-receipt-input'],
 ['fridge', 'inv-scan-fridge-btn', 'inv-scan-fridge-input'],
 ['pantry', 'inv-scan-pantry-btn', 'inv-scan-pantry-input']].forEach(([kind, btnId, inputId]) => {
  const btn = document.getElementById(btnId);
  const input = document.getElementById(inputId);
  btn.addEventListener('click', () => input.click());
  input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    input.value = ''; // allow re-selecting the same file next time
    if (file) runScan(kind, file);
  });
});

setupDictation(document.getElementById('inv-add-item'), document.getElementById('inv-add-item-mic-btn'));

loadInventory();
</script>
