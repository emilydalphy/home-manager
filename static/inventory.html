<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Inventory — Home Manager</title>
<link rel="manifest" href="/static/manifest.json" />
<link rel="icon" href="/static/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<meta name="theme-color" content="#2b6cb0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Home Manager" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 24px;
    background: #f7f7f5;
    color: #222;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.subtitle { color: #666; margin-top: 0; font-size: 0.9rem; }
  p.subtitle a { color: #2b6cb0; }
  h2.section-title { font-size: 0.95rem; margin: 20px 0 8px; color: #444; text-transform: capitalize; }
  h3.category-subheading { font-size: 0.78rem; margin: 0; padding: 10px 0 4px; color: #999; text-transform: uppercase; letter-spacing: 0.03em; }
  h3.category-subheading:first-child { padding-top: 4px; }
  .card {
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 4px 16px;
    margin-bottom: 10px;
  }
  .item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .item-row:last-child { border-bottom: none; }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-weight: 500; margin: 0; }
  .item-meta { color: #888; font-size: 0.78rem; margin: 2px 0 0; }
  .qty-input {
    width: 90px;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 0.85rem;
  }
  .cat-select {
    width: 118px;
    padding: 5px 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 0.8rem;
    background: white;
    color: #444;
  }
  .cat-select:disabled { opacity: 0.6; }
  .loc-select {
    width: 100px;
    padding: 5px 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 0.8rem;
    background: white;
    color: #444;
  }
  .loc-select:disabled { opacity: 0.6; }
  @media (max-width: 520px) {
    .item-row { flex-wrap: wrap; }
    .cat-select, .loc-select, .qty-input { flex: 1; min-width: 100px; }
  }
  .view-toggle { display: flex; gap: 6px; margin-bottom: 12px; }
  button.toggle-btn {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #ccc;
    background: white;
    color: #555;
    font-size: 0.82rem;
    cursor: pointer;
  }
  button.toggle-btn.active { background: #2b6cb0; border-color: #2b6cb0; color: white; }
  .duplicates-banner {
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 0.88rem;
    background: #eef4fb;
    border: 1px solid #cfe0f2;
    color: #1e4a75;
  }
  .duplicates-banner h2 { font-size: 0.9rem; margin: 0 0 8px; color: inherit; }
  .duplicates-banner ul { margin: 0; padding-left: 20px; }
  .duplicates-banner li { margin-bottom: 5px; }
  .duplicates-banner .tag { font-weight: 600; }
  .duplicates-banner .locs { color: #4a6b8a; }
  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.95rem;
    padding: 4px 7px;
    border-radius: 6px;
    color: #888;
  }
  .icon-btn:hover { background: #f0f0f0; }
  .icon-btn.save { color: #2b6cb0; }
  .icon-btn.remove { color: #b00020; }
  .empty { color: #999; font-size: 0.9rem; font-style: italic; padding: 8px 0; }
  .error { color: #b00020; font-size: 0.9rem; }
  .add-card {
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 20px;
  }
  .add-card h2 { font-size: 0.95rem; margin: 0 0 10px; color: #444; }
  .add-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .add-row input[type=text] {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 0.9rem;
    background: white;
    color: #222;
  }
  #add-item { flex: 2; min-width: 140px; }
  #add-qty { flex: 1; min-width: 90px; }
  select#add-category {
    flex: 1;
    min-width: 120px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 0.9rem;
    background: white;
    color: #222;
  }
  button.action {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: #2b6cb0;
    color: white;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button.action:disabled { opacity: 0.6; cursor: default; }
  .expiring-banner {
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 0.88rem;
  }
  .expiring-banner.has-expired { background: #fdeaea; border: 1px solid #f3c6c6; color: #8a1f1f; }
  .expiring-banner.soon-only { background: #fff8e6; border: 1px solid #f3e0a8; color: #7a5b00; }
  .expiring-banner h2 { font-size: 0.9rem; margin: 0 0 8px; color: inherit; }
  .expiring-banner ul { margin: 0; padding-left: 20px; }
  .expiring-banner li { margin-bottom: 3px; }
  .expiring-banner .tag { font-weight: 600; }
  .scan-card {
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .scan-card h2 { font-size: 0.95rem; margin: 0 0 4px; color: #444; }
  .scan-card p.hint { color: #888; font-size: 0.82rem; margin: 0 0 10px; }
  .scan-row { display: flex; gap: 8px; flex-wrap: wrap; }
  button.scan-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #2b6cb0;
    background: white;
    color: #2b6cb0;
    font-size: 0.88rem;
    cursor: pointer;
  }
  button.scan-btn:disabled { opacity: 0.6; cursor: default; }
  .review-card {
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .review-card h2 { font-size: 0.95rem; margin: 0 0 4px; color: #444; }
  .review-card p.hint { color: #888; font-size: 0.82rem; margin: 0 0 10px; }
  .review-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
    flex-wrap: wrap;
  }
  .review-row:last-child { border-bottom: none; }
  .review-row input[type=checkbox] { flex: 0 0 auto; }
  .review-row input[type=text].review-name { flex: 2; min-width: 110px; padding: 6px 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.85rem; }
  .review-row input[type=text].review-qty { flex: 1; min-width: 80px; padding: 6px 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.85rem; }
  .review-row select.review-cat, .review-row select.review-loc { flex: 1; min-width: 100px; padding: 6px 6px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.8rem; background: white; color: #444; }
  .low-conf-badge { background: #fff8e6; color: #7a5b00; border: 1px solid #f3e0a8; border-radius: 5px; font-size: 0.7rem; padding: 2px 6px; flex: 0 0 auto; }
  .review-actions { display: flex; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>

<h1>Inventory</h1>
<p class="subtitle">What's actually on hand — pantry, fridge, and freezer. <a href="/">&larr; Back to chat</a></p>

<div id="expiring-banner"></div>
<div id="duplicates-banner"></div>

<div class="scan-card">
  <h2>Scan instead of typing</h2>
  <p class="hint">Photograph a grocery receipt, your fridge, or your pantry, and review what's detected before it's added.</p>
  <div class="scan-row">
    <button class="scan-btn" id="scan-receipt-btn">📷 Scan a receipt</button>
    <button class="scan-btn" id="scan-fridge-btn">📷 Scan fridge</button>
    <button class="scan-btn" id="scan-pantry-btn">📷 Scan pantry</button>
  </div>
  <input type="file" id="scan-receipt-input" accept="image/*" capture="environment" style="display:none" />
  <input type="file" id="scan-fridge-input" accept="image/*" capture="environment" style="display:none" />
  <input type="file" id="scan-pantry-input" accept="image/*" capture="environment" style="display:none" />
</div>

<div id="review-container"></div>

<div class="view-toggle">
  <button class="toggle-btn active" id="view-section-btn">By store section</button>
  <button class="toggle-btn" id="view-location-btn">By fridge/pantry</button>
</div>

<div id="content">
  <p class="empty">Loading...</p>
</div>

<div class="add-card">
  <h2>Add or update an item</h2>
  <div class="add-row">
    <input type="text" id="add-item" placeholder="Item, e.g. ground beef" />
    <input type="text" id="add-qty" placeholder="Quantity, e.g. 2 lbs" />
    <select id="add-category">
      <option value="produce">Produce</option>
      <option value="dairy">Dairy</option>
      <option value="meat/seafood">Meat/seafood</option>
      <option value="pantry">Pantry</option>
      <option value="frozen">Frozen</option>
      <option value="other" selected>Other</option>
    </select>
    <select id="add-location">
      <option value="">Location (auto)</option>
      <option value="fridge">Fridge</option>
      <option value="freezer">Freezer</option>
      <option value="pantry">Pantry</option>
    </select>
    <button class="action" id="add-btn">Add</button>
  </div>
</div>

<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

const CATEGORIES = ['produce', 'dairy', 'meat/seafood', 'pantry', 'frozen', 'other'];
function categoryOptions(current) {
  return CATEGORIES.map(c => `<option value="${c}" ${c === current ? 'selected' : ''}>${c === 'meat/seafood' ? 'Meat/seafood' : c[0].toUpperCase() + c.slice(1)}</option>`).join('');
}

const LOCATIONS = ['fridge', 'freezer', 'pantry'];
const LOCATION_LABELS = { fridge: 'Fridge', freezer: 'Freezer', pantry: 'Pantry' };
function locationOptions(current) {
  return LOCATIONS.map(l => `<option value="${l}" ${l === current ? 'selected' : ''}>${LOCATION_LABELS[l]}</option>`).join('');
}

let currentView = 'section'; // 'section' | 'location'

function itemRowHtml(it) {
  return `<div class="item-row" data-item-id="${it.id}">
    <div class="item-info">
      <p class="item-name">${escapeHtml(it.item)}</p>
      ${it.expiration_date ? `<p class="item-meta">Exp ${escapeHtml(it.expiration_date)}</p>` : ''}
    </div>
    <select class="cat-select" data-item-name="${escapeHtml(it.item)}" data-loc="${escapeHtml(it.location || '')}">${categoryOptions(it.category)}</select>
    <select class="loc-select" data-item-name="${escapeHtml(it.item)}" data-cat="${escapeHtml(it.category)}">${locationOptions(it.location)}</select>
    <input type="text" class="qty-input" value="${escapeHtml(it.quantity || '')}" data-item-name="${escapeHtml(it.item)}" data-category="${escapeHtml(it.category)}" data-location="${escapeHtml(it.location || '')}" />
    <button class="icon-btn save" title="Save quantity">&check;</button>
    <button class="icon-btn remove" title="Remove" data-item-id="${it.id}">&times;</button>
  </div>`;
}

function categorySubgroups(items) {
  // Within a location group, still break items out by category (produce,
  // dairy, etc.) rather than one flat list — location answers "where is
  // it" but category still matters for scanning a list quickly.
  const byCat = {};
  for (const it of items) {
    const cat = it.category || 'other';
    byCat[cat] = byCat[cat] || [];
    byCat[cat].push(it);
  }
  return CATEGORIES.filter(c => byCat[c] && byCat[c].length).map(c => ({ label: CATEGORY_LABELS[c], items: byCat[c] }));
}

function render(view) {
  const content = document.getElementById('content');
  const groups = currentView === 'location'
    ? (view.locations || []).map(g => ({ label: LOCATION_LABELS[g.location] || g.location, items: g.items }))
    : (view.sections || []).map(g => ({ label: g.section, items: g.items }));

  if (!groups.length) {
    content.innerHTML = '<p class="empty">Nothing tracked yet — mention what you have in chat ("picked up a rotisserie chicken"), or add items below.</p>';
    return;
  }

  let html = '';
  for (const g of groups) {
    html += `<h2 class="section-title">${escapeHtml(g.label)}</h2><div class="card">`;
    if (currentView === 'location') {
      for (const sub of categorySubgroups(g.items)) {
        html += `<h3 class="category-subheading">${escapeHtml(sub.label)}</h3>`;
        for (const it of sub.items) {
          html += itemRowHtml(it);
        }
      }
    } else {
      for (const it of g.items) {
        html += itemRowHtml(it);
      }
    }
    html += `</div>`;
  }
  content.innerHTML = html;

  function currentRowValues(row) {
    const catSelect = row.querySelector('.cat-select');
    const locSelect = row.querySelector('.loc-select');
    const qtyInput = row.querySelector('.qty-input');
    return {
      item: catSelect.getAttribute('data-item-name'),
      quantity: qtyInput.value,
      category: catSelect.value,
      location: locSelect.value,
    };
  }

  async function saveRow(row, disableEl) {
    disableEl.disabled = true;
    try {
      const res = await fetch('/api/inventory/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...currentRowValues(row), action: 'set' }),
      });
      if (!res.ok) throw new Error('failed');
      render(await res.json());
      refreshBanner();
      refreshDuplicates();
    } catch (err) {
      disableEl.disabled = false;
      alert("Couldn't save that — try again.");
    }
  }

  content.querySelectorAll('.cat-select, .loc-select').forEach(sel => {
    sel.addEventListener('change', () => saveRow(sel.closest('.item-row'), sel));
  });

  content.querySelectorAll('.icon-btn.save').forEach(btn => {
    btn.addEventListener('click', () => saveRow(btn.closest('.item-row'), btn));
  });

  content.querySelectorAll('.icon-btn.remove').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        const res = await fetch('/api/inventory/' + btn.getAttribute('data-item-id') + '/remove', { method: 'POST' });
        if (!res.ok) throw new Error('failed');
        render(await res.json());
        refreshBanner();
        refreshDuplicates();
      } catch (err) {
        btn.disabled = false;
        alert("Couldn't remove that — try again.");
      }
    });
  });
}

async function refreshBanner() {
  try {
    const res = await fetch('/api/inventory/expiring');
    if (res.ok) renderExpiringBanner((await res.json()).items);
  } catch (err) { /* non-critical, ignore */ }
}

function renderExpiringBanner(items) {
  const banner = document.getElementById('expiring-banner');
  if (!items || !items.length) {
    banner.innerHTML = '';
    return;
  }
  const hasExpired = items.some(i => i.status === 'expired');
  banner.innerHTML = `
    <div class="expiring-banner ${hasExpired ? 'has-expired' : 'soon-only'}">
      <h2>${hasExpired ? 'Some items have gone bad' : 'Going bad soon'}</h2>
      <ul>
        ${items.map(i => `<li><span class="tag">${escapeHtml(i.item)}</span>${i.quantity ? ' (' + escapeHtml(i.quantity) + ')' : ''} — ${i.status === 'expired' ? 'expired' : 'expires'} ${escapeHtml(i.expiration_date)}</li>`).join('')}
      </ul>
    </div>
  `;
}

async function refreshDuplicates() {
  try {
    const res = await fetch('/api/inventory/duplicates');
    if (res.ok) renderDuplicatesBanner((await res.json()).duplicates);
  } catch (err) { /* non-critical, ignore */ }
}

function renderDuplicatesBanner(duplicates) {
  const banner = document.getElementById('duplicates-banner');
  if (!duplicates || !duplicates.length) {
    banner.innerHTML = '';
    return;
  }
  banner.innerHTML = `
    <div class="duplicates-banner">
      <h2>Tracked in more than one place</h2>
      <ul>
        ${duplicates.map(d => `<li><span class="tag">${escapeHtml(d.item)}</span> — <span class="locs">${d.entries.map(e => `${LOCATION_LABELS[e.location] || e.location}${e.quantity ? ' (' + escapeHtml(e.quantity) + ')' : ''}`).join(' and ')}</span>. Worth using up the opened one before buying more.</li>`).join('')}
      </ul>
    </div>
  `;
}

async function load() {
  const content = document.getElementById('content');
  try {
    const invUrl = currentView === 'location' ? '/api/inventory/by-location' : '/api/inventory';
    const [invRes, expRes, dupRes] = await Promise.all([
      fetch(invUrl),
      fetch('/api/inventory/expiring'),
      fetch('/api/inventory/duplicates'),
    ]);
    if (!invRes.ok) throw new Error('Could not load');
    render(await invRes.json());
    if (expRes.ok) {
      renderExpiringBanner((await expRes.json()).items);
    }
    if (dupRes.ok) {
      renderDuplicatesBanner((await dupRes.json()).duplicates);
    }
  } catch (err) {
    content.innerHTML = '<p class="error">Couldn\'t load inventory right now — try refreshing.</p>';
  }
}

document.getElementById('view-section-btn').addEventListener('click', () => {
  if (currentView === 'section') return;
  currentView = 'section';
  document.getElementById('view-section-btn').classList.add('active');
  document.getElementById('view-location-btn').classList.remove('active');
  load();
});

document.getElementById('view-location-btn').addEventListener('click', () => {
  if (currentView === 'location') return;
  currentView = 'location';
  document.getElementById('view-location-btn').classList.add('active');
  document.getElementById('view-section-btn').classList.remove('active');
  load();
});

document.getElementById('add-btn').addEventListener('click', async () => {
  const itemInput = document.getElementById('add-item');
  const qtyInput = document.getElementById('add-qty');
  const catSelect = document.getElementById('add-category');
  const locSelect = document.getElementById('add-location');
  const btn = document.getElementById('add-btn');
  const name = itemInput.value.trim();
  if (!name) return;
  btn.disabled = true;
  try {
    const res = await fetch('/api/inventory/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item: name, action: 'set', quantity: qtyInput.value, category: catSelect.value, location: locSelect.value || null }),
    });
    if (!res.ok) throw new Error('failed');
    render(await res.json());
    refreshBanner();
    refreshDuplicates();
    itemInput.value = '';
    qtyInput.value = '';
    catSelect.value = 'other';
    locSelect.value = '';
  } catch (err) {
    alert("Couldn't add that — try again.");
  } finally {
    btn.disabled = false;
  }
});

const CATEGORY_LABELS = { produce: 'Produce', dairy: 'Dairy', 'meat/seafood': 'Meat/seafood', pantry: 'Pantry', frozen: 'Frozen', other: 'Other' };
function reviewCategoryOptions(current) {
  return CATEGORIES.map(c => `<option value="${c}" ${c === current ? 'selected' : ''}>${CATEGORY_LABELS[c]}</option>`).join('');
}

function reviewLocationOptions(current) {
  const opts = [`<option value="" ${!current ? 'selected' : ''}>Location (auto)</option>`];
  for (const l of LOCATIONS) {
    opts.push(`<option value="${l}" ${l === current ? 'selected' : ''}>${LOCATION_LABELS[l]}</option>`);
  }
  return opts.join('');
}

function renderReview(items, kind) {
  const container = document.getElementById('review-container');
  if (!items || !items.length) {
    container.innerHTML = `<div class="review-card"><h2>Nothing detected</h2><p class="hint">Couldn't make out any items in that photo — try again with better lighting, or add items directly below.</p></div>`;
    return;
  }
  const titles = { receipt: 'Review scanned receipt', fridge: 'Review scanned fridge photo', pantry: 'Review scanned pantry photo' };
  container.innerHTML = `
    <div class="review-card">
      <h2>${titles[kind] || 'Review scanned photo'}</h2>
      <p class="hint">Uncheck anything that's wrong, fix names/quantities/categories/locations as needed, then add the rest to inventory.</p>
      <div id="review-rows"></div>
      <div class="review-actions">
        <button class="action" id="review-confirm-btn">Add to inventory</button>
        <button class="icon-btn" id="review-cancel-btn">Cancel</button>
      </div>
    </div>
  `;
  const rowsDiv = document.getElementById('review-rows');
  rowsDiv.innerHTML = items.map((it, idx) => `
    <div class="review-row" data-idx="${idx}">
      <input type="checkbox" class="review-include" checked />
      <input type="text" class="review-name" value="${escapeHtml(it.item || '')}" />
      <input type="text" class="review-qty" value="${escapeHtml(it.quantity || '')}" placeholder="Quantity" />
      <select class="review-cat">${reviewCategoryOptions(it.category || 'other')}</select>
      <select class="review-loc">${reviewLocationOptions(it.location || '')}</select>
      ${it.confidence === 'low' ? '<span class="low-conf-badge">double-check</span>' : ''}
    </div>
  `).join('');

  document.getElementById('review-cancel-btn').addEventListener('click', () => {
    container.innerHTML = '';
  });

  document.getElementById('review-confirm-btn').addEventListener('click', async () => {
    const btn = document.getElementById('review-confirm-btn');
    const rows = rowsDiv.querySelectorAll('.review-row');
    const confirmed = [];
    rows.forEach(row => {
      if (!row.querySelector('.review-include').checked) return;
      const name = row.querySelector('.review-name').value.trim();
      if (!name) return;
      confirmed.push({
        item: name,
        quantity: row.querySelector('.review-qty').value.trim(),
        category: row.querySelector('.review-cat').value,
        location: row.querySelector('.review-loc').value || null,
      });
    });
    if (!confirmed.length) {
      container.innerHTML = '';
      return;
    }
    btn.disabled = true;
    try {
      const res = await fetch('/api/inventory/confirm-scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: confirmed }),
      });
      if (!res.ok) throw new Error('failed');
      render(await res.json());
      refreshBanner();
      refreshDuplicates();
      container.innerHTML = `<div class="review-card"><h2>Added</h2><p class="hint">${confirmed.length} item(s) added to inventory.</p></div>`;
      setTimeout(() => { container.innerHTML = ''; }, 2500);
    } catch (err) {
      btn.disabled = false;
      alert("Couldn't save those items — try again.");
    }
  });
}

function wireScanInput(buttonId, inputId, endpoint, kind) {
  const btn = document.getElementById(buttonId);
  const input = document.getElementById(inputId);
  btn.addEventListener('click', () => input.click());
  input.addEventListener('change', async () => {
    const file = input.files[0];
    input.value = '';
    if (!file) return;
    const container = document.getElementById('review-container');
    container.innerHTML = `<div class="review-card"><h2>Reading photo...</h2><p class="hint">This can take a few seconds.</p></div>`;
    btn.disabled = true;
    try {
      const formData = new FormData();
      formData.append('photo', file);
      const res = await fetch(endpoint, { method: 'POST', body: formData });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || 'Scan failed');
      }
      const data = await res.json();
      renderReview(data.items, kind);
    } catch (err) {
      container.innerHTML = `<div class="review-card"><h2>Couldn't read that photo</h2><p class="hint">${escapeHtml(err.message || 'Try again.')}</p></div>`;
    } finally {
      btn.disabled = false;
    }
  });
}

wireScanInput('scan-receipt-btn', 'scan-receipt-input', '/api/inventory/scan-receipt', 'receipt');
wireScanInput('scan-fridge-btn', 'scan-fridge-input', '/api/inventory/scan-fridge', 'fridge');
wireScanInput('scan-pantry-btn', 'scan-pantry-input', '/api/inventory/scan-pantry', 'pantry');

load();
</script>
