<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>This week's meals</title>
<link rel="icon" href="/static/icons/icon-192.png" />
<meta name="theme-color" content="#66304E" />
<meta name="robots" content="noindex, nofollow" />
<style>
  * { box-sizing: border-box; }
  body {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px;
  }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.subtitle { margin: 0 0 1.5rem; display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .freshness-tag {
    display: inline-flex;
    align-items: center;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.78rem;
    color: #fff;
    background: var(--vivid-leaf);
    border-radius: var(--radius-pill);
    padding: 3px 11px;
  }
  .first-run-banner {
    background: rgba(111, 184, 76, 0.14);
    color: #2f5a1f;
    border: 1px solid rgba(111, 184, 76, 0.4);
    border-radius: var(--radius-card);
    padding: 0.8rem 1rem;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.9rem;
    margin-bottom: 14px;
  }
  .suggested-note {
    background: var(--violet-soft);
    color: var(--midnight-violet);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-card);
    padding: 0.7rem 1rem;
    font-family: var(--font-body);
    font-size: 0.85rem;
    margin-bottom: 14px;
  }
  .day-card {
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 1rem 1.15rem;
    margin-bottom: 10px;
  }
  .day-card .date {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 0.8rem;
    color: var(--text-muted);
    margin: 0 0 8px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .menu-row {
    display: flex;
    gap: 10px;
    padding: 0.45rem 0;
    border-bottom: 1px solid var(--card-border);
    align-items: baseline;
  }
  .menu-row:last-child { border-bottom: none; }
  .menu-row .slot {
    font-family: var(--font-body);
    font-weight: 500;
    color: var(--text-muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    width: 72px;
    flex-shrink: 0;
    padding-top: 0.15rem;
  }
  .menu-row .meal { font-family: var(--font-body); color: var(--text-body); font-size: 1rem; }
  .empty, .error { color: var(--text-muted); font-size: 0.95rem; padding: 1rem 0; }
  .pool-toggle {
    display: block;
    text-align: center;
    font-family: var(--font-body);
    font-weight: 700;
    color: var(--midnight-violet);
    font-size: 0.85rem;
    background: transparent;
    border: 1px solid var(--midnight-violet);
    border-radius: var(--radius-control);
    padding: 12px 0;
    min-height: 44px;
    cursor: pointer;
    width: 100%;
    margin-top: 6px;
    transition: background 0.15s ease;
  }
  .pool-toggle:hover { background: var(--violet-soft); }
  h2.category-title {
    font-family: var(--font-heading);
    font-weight: 600;
    font-size: 1rem;
    margin: 20px 0 8px;
    color: var(--midnight-violet);
    text-transform: capitalize;
  }
  h2.category-title:first-child { margin-top: 0; }
  .component-card {
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 0.4rem 1.15rem;
    margin-bottom: 10px;
  }
  .component-card .item {
    font-family: var(--font-body);
    color: var(--text-body);
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--card-border);
    font-size: 1.05rem;
  }
  .component-card .item:last-child { border-bottom: none; }
  #pool { display: none; }
  #pool.open { display: block; }
  .footer-note { color: var(--text-muted); font-size: 0.8rem; margin-top: 1.5rem; text-align: center; }
</style>
</head>
<body>

<h1 id="page-title">This week's meals</h1>
<p class="subtitle">
  <span id="subtitle">Loading...</span>
  <span id="freshness-tag" class="freshness-tag" style="display:none"></span>
</p>
<div id="first-run-banner" class="first-run-banner" style="display:none"></div>
<div id="suggested-note" class="suggested-note" style="display:none">
  These are suggested plate combos put together from this week's mix-and-match pool — the
  household is free to combine things differently. The full pool is below if you'd rather browse
  it directly.
</div>
<div id="days"></div>
<button id="pool-toggle" class="pool-toggle" style="display:none">Show the full pool &darr;</button>
<div id="pool"></div>
<p class="footer-note" id="footer-note" style="display:none">This link always shows the current plan — no need to ask for a new one.</p>

<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
}

const SLOT_ORDER = ['breakfast', 'lunch', 'dinner', 'snack'];
const SLOT_LABELS = { breakfast: 'Breakfast', lunch: 'Lunch', dinner: 'Dinner', snack: 'Snack' };

// Renders the day-by-day menu grid shared by both planning modes — real
// planned meals for day-based, suggested combos for component-based (see
// plan.menu_is_suggested). Blank slots (nothing planned/suggested for that
// meal that day) are simply omitted rather than shown as empty rows.
function renderMenu(days) {
  return days.map(day => {
    const rows = SLOT_ORDER
      .filter(slot => day[slot])
      .map(slot => `
        <div class="menu-row">
          <span class="slot">${SLOT_LABELS[slot]}</span>
          <span class="meal">${escapeHtml(day[slot])}</span>
        </div>`)
      .join('');
    if (!rows) return '';
    return `
      <div class="day-card">
        <p class="date">${escapeHtml(formatDate(day.date))}</p>
        ${rows}
      </div>`;
  }).join('');
}

async function load() {
  const token = window.location.pathname.split('/').filter(Boolean).pop();
  const daysDiv = document.getElementById('days');
  const subtitle = document.getElementById('subtitle');
  const title = document.getElementById('page-title');
  const footerNote = document.getElementById('footer-note');
  const suggestedNote = document.getElementById('suggested-note');
  const poolToggle = document.getElementById('pool-toggle');
  const poolDiv = document.getElementById('pool');
  const freshnessTag = document.getElementById('freshness-tag');
  const firstRunBanner = document.getElementById('first-run-banner');

  try {
    const res = await fetch('/api/share/' + encodeURIComponent(token));
    if (res.status === 404) {
      subtitle.textContent = '';
      daysDiv.innerHTML = '<p class="error">This link isn\'t valid — ask whoever shared it for a fresh one.</p>';
      freshnessTag.style.display = 'none';
      firstRunBanner.style.display = 'none';
      return;
    }
    if (!res.ok) throw new Error('Could not load the plan');
    const plan = await res.json();

    if (plan.household_name) {
      title.textContent = plan.household_name + "'s meals this week";
    }

    if (!plan.weekly_plan_id || !plan.meals || !plan.meals.length) {
      subtitle.textContent = '';
      daysDiv.innerHTML = '<p class="empty">No plan has been made for this week yet — check back soon.</p>';
      suggestedNote.style.display = 'none';
      poolToggle.style.display = 'none';
      freshnessTag.style.display = 'none';
      firstRunBanner.style.display = 'none';
      return;
    }

    subtitle.textContent = 'Week of ' + formatDate(plan.week_start_date);
    suggestedNote.style.display = plan.menu_is_suggested ? 'block' : 'none';

    // Freshness signal — how many of this week's meals are recipes never
    // cooked before (see get_weekly_plan's new_recipe_count). Only shown
    // when there's actually something new to point to.
    if (plan.new_recipe_count > 0) {
      freshnessTag.textContent = plan.new_recipe_count === 1
        ? '1 new recipe this week'
        : `${plan.new_recipe_count} new recipes this week`;
      freshnessTag.style.display = 'inline-flex';
    } else {
      freshnessTag.style.display = 'none';
    }

    // First-run intro — only ever true for a household's very first
    // generated plan (see get_weekly_plan's is_first_plan), so this makes
    // the "made for you" moment explicit instead of looking identical to
    // a routine week.
    if (plan.is_first_plan) {
      firstRunBanner.textContent = "Here's your first week — built around what you told me.";
      firstRunBanner.style.display = 'block';
    } else {
      firstRunBanner.style.display = 'none';
    }

    const menu = plan.menu || [];
    daysDiv.innerHTML = renderMenu(menu) || '<p class="empty">Nothing to show yet.</p>';

    if (plan.planning_mode === 'component_based' && plan.components && plan.components.length) {
      poolToggle.style.display = 'block';
      poolDiv.innerHTML = plan.components.map(c => `
        <h2 class="category-title">${escapeHtml(c.category)}</h2>
        <div class="component-card">
          ${c.items.map(item => `<p class="item">${escapeHtml(item || '')}</p>`).join('')}
        </div>
      `).join('');
    } else {
      poolToggle.style.display = 'none';
      poolDiv.classList.remove('open');
      poolDiv.innerHTML = '';
    }

    footerNote.style.display = 'block';
  } catch (err) {
    subtitle.textContent = '';
    daysDiv.innerHTML = '<p class="error">Couldn\'t load the plan right now — try refreshing.</p>';
    suggestedNote.style.display = 'none';
    poolToggle.style.display = 'none';
    freshnessTag.style.display = 'none';
    firstRunBanner.style.display = 'none';
  }
}

document.getElementById('pool-toggle').addEventListener('click', () => {
  const pool = document.getElementById('pool');
  const btn = document.getElementById('pool-toggle');
  const open = pool.classList.toggle('open');
  btn.textContent = open ? 'Hide the full pool ↑' : 'Show the full pool ↓';
});

load();
// This is a read-only link others may leave open in a background tab, so it
// polls quietly rather than relying on a manual refresh — keeps it in sync
// as meals get added/swapped in chat without anyone needing to reload.
setInterval(load, 60000);
</script>
</body>
</html>
