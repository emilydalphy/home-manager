<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<link rel="preload" href="/static/fonts/figtree-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>This week's meals</title>
<link rel="icon" href="/static/icons/icon-192.png" />
<meta name="theme-color" content="#FFFAF3" />
<meta name="robots" content="noindex, nofollow" />
<style>
  /*
    DELIBERATELY LIGHT IN BOTH MODES. `data-theme="light"` on <html> opts this
    page out of theme.css's dark block (which is scoped
    `:root:not([data-theme="light"])`). Two reasons, and they are the same
    reason the block below uses literals rather than tokens:
      - This is a printed menu card, not an app screen. It is the one surface
        whose job is to look like a physical object someone was handed.
      - It is a PUBLIC link. The person opening it is usually not Emily and
        has no relationship with the app; the card should look the same for
        everyone rather than reformatting itself to a stranger's phone
        setting. member-share.html, which IS a functional app page, does
        follow the system setting.
    FLAGGED FOR EMILY: this is a judgment call, and it is reversible by
    deleting the data-theme attribute — the page's own literals would then
    need a dark pass.

    Restaurant-menu redesign of the weekly meals share view — per the
    "Weekly Meals Card" design handoff (option-6a.html). Colors/type/
    spacing/radii below are pixel-close to that spec using its exact
    values, not remapped to theme.css's slightly-different tokens, since
    the handoff called this high-fidelity. Everything outside the card
    itself (suggested-note, pool toggle)
    still uses the shared brand tokens, since those weren't part of the
    handoff and are the same five brand colors anyway.
  */
  /* The public week: the same tiles and switcher as the app. It keeps its
     own light look for every recipient (data-theme="light"). */
  * { box-sizing: border-box; }
  body {
    max-width: 640px;
    margin: 0 auto;
    padding: 58px 16px 34px;
    -webkit-font-smoothing: antialiased;
  }
  h1 { margin: 0 4px 3px; font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.03em; }
  p.subtitle-line { margin: 0 4px 14px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--slate); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .suggested-note {
    background: var(--blush);
    color: var(--night-ink);
    border-radius: var(--radius-button);
    padding: 12px 14px;
    font-size: 14px;
    line-height: 20px;
    margin-bottom: 14px;
  }
  /* The days: the switcher across the top, the day's tile under it. */
  .menu-card { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .sidebar {
    display: flex;
    gap: 2px;
    height: 46px;
    padding: 3px;
    background: var(--blush);
    border-radius: var(--radius-button);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .sidebar::-webkit-scrollbar { display: none; }
  .sidebar-tab {
    flex: 1 0 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    border-radius: var(--radius-control);
    position: relative;
    cursor: pointer;
  }
  .sidebar-tab::after { content: ""; position: absolute; inset: -3px 0; }
  .sidebar-tab.active {
    background: var(--white);
    font-weight: 600;
    box-shadow: var(--shadow-seg);
    cursor: default;
  }
  .content-col {
    background: var(--white);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 14px;
    min-width: 0;
  }
  .content-header { margin-bottom: 10px; }
  .day-eyebrow { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--slate); }
  .day-title { font-size: 26px; line-height: 30px; font-weight: 700; letter-spacing: -0.025em; color: var(--ink); }
  .meal-block { padding: 8px 0; border-top: 1px solid var(--line); }
  .meal-badge { display: block; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--slate); }
  .meal-name { font-size: 16px; line-height: 20px; font-weight: 500; color: var(--ink); }
  .meal-divider { display: none; }
  .empty, .error { color: var(--slate); font-size: 16px; line-height: 22px; padding: 14px 4px; }
  .pool-toggle {
    display: block;
    width: 100%;
    height: 52px;
    margin-top: 6px;
    border: 0;
    border-radius: var(--radius-button);
    background: var(--blush);
    color: var(--night-ink);
    font: 700 16px var(--font-body);
    cursor: pointer;
  }
  h2.category-title { margin: 18px 4px 6px; font-size: 16px; line-height: 22px; font-weight: 700; color: var(--ink); text-transform: capitalize; }
  h2.category-title:first-child { margin-top: 0; }
  .component-card {
    background: var(--white);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 4px 14px;
    margin-bottom: 10px;
  }
  .component-card .item {
    color: var(--ink);
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 16px;
    line-height: 20px;
  }
  .component-card .item:last-child { border-bottom: none; }
  #pool { display: none; }
  #pool.open { display: block; }
  .footer-note { color: var(--slate); font-size: 13px; line-height: 18px; margin-top: 20px; text-align: center; }
</style>
</head>
<body>

<h1 id="page-title">This week's meals</h1>
<p class="subtitle-line">
  <span id="subtitle">Loading...</span>
</p>
<div id="suggested-note" class="suggested-note" style="display:none">
  These are suggested plate combos put together from this week's mix-and-match pool — the
  household is free to combine things differently. The full pool is below if you'd rather browse
  it directly.
</div>

<div id="menu-card" class="menu-card" style="display:none">
  <div class="sidebar" id="sidebar"></div>
  <div class="content-col">
    <div class="content-header">
      <div class="day-eyebrow" id="day-eyebrow"></div>
      <div class="day-title" id="day-title"></div>
    </div>
    <div id="day-meals"></div>
  </div>
</div>
<div id="status-area"></div>

<button id="pool-toggle" class="pool-toggle" style="display:none">Show the full pool &darr;</button>
<div id="pool"></div>
<p class="footer-note" id="footer-note" style="display:none">This link always shows the current plan — no need to ask for a new one.</p>

<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
}

const WEEKDAY_ABBR = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const SLOT_ORDER = ['breakfast', 'lunch', 'dinner', 'snack'];
const SLOT_LABELS = { breakfast: 'Breakfast', lunch: 'Lunch', dinner: 'Dinner', snack: 'Snack' };
// Fixed per meal type, matching the design handoff exactly (breakfast -2,
// lunch +2, dinner -2, snack +2) rather than alternating by position, so
// a day missing a slot doesn't throw off the rotation of the ones that
// remain.
const BADGE_ROTATION_CLASS = { breakfast: 'breakfast', lunch: 'lunch', dinner: 'dinner', snack: 'snack' };

// The design calls for a "★" on the day's standout meal but doesn't
// define how that's determined from real data. Dinner is the one meal
// that always gets a full, specific, built-out recipe when a plan is
// generated (breakfast/lunch/snack are deliberately lower-effort — see
// generate_weekly_plan's prompt), so it's the closest real signal to
// "the meal of the day" this app actually has — using that rather than
// inventing a fake distinction.
const STANDOUT_SLOT = 'dinner';

let currentMenu = [];
let selectedIdx = null; // null until the first load picks a sensible default

// The phone's own date, from local fields — never toISOString(), which is
// UTC (defect hunt, 2026-10-11). From 8pm in Toronto (7pm in winter) UTC is
// already tomorrow, so this page opened on tomorrow's meals and called
// them "Today's Table", and on a Sunday evening — tomorrow being past the
// week — fell back to Monday. Same rule as plan-week.html's isoLocal and
// shell.js's todayLocalStr.
function todayIsoDate() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = currentMenu.map((day, idx) => {
    const d = new Date((day.date || '') + 'T00:00:00');
    const label = isNaN(d) ? '' : WEEKDAY_ABBR[d.getDay()];
    const rotClass = idx % 2 === 0 ? 'rot-r' : 'rot-l';
    const activeClass = idx === selectedIdx ? 'active' : '';
    return `<div class="sidebar-tab ${rotClass} ${activeClass}" data-idx="${idx}">${escapeHtml(label)}</div>`;
  }).join('');

  sidebar.querySelectorAll('.sidebar-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      selectDay(parseInt(tab.getAttribute('data-idx'), 10));
    });
  });
}

function renderDayContent() {
  const day = currentMenu[selectedIdx];
  const eyebrow = document.getElementById('day-eyebrow');
  const title = document.getElementById('day-title');
  const mealsDiv = document.getElementById('day-meals');
  if (!day) {
    eyebrow.textContent = '';
    title.textContent = '';
    mealsDiv.innerHTML = '';
    return;
  }

  const d = new Date((day.date || '') + 'T00:00:00');
  const weekdayName = isNaN(d) ? '' : d.toLocaleDateString(undefined, { weekday: 'long' });
  eyebrow.textContent = formatDate(day.date);
  title.textContent = day.date === todayIsoDate() ? "Today's Table" : (weekdayName ? weekdayName + "'s Table" : 'The Table');

  // Every snack of the day, not just the first (2026-10-29: `snack` holds
  // one, `snacks` all of them — Meals shows both).
  const rows = [];
  SLOT_ORDER.forEach(slot => {
    if (slot === 'snack') {
      const snacks = (day.snacks && day.snacks.length) ? day.snacks : (day.snack ? [day.snack] : []);
      snacks.forEach(name => rows.push({ slot, name }));
    } else if (day[slot]) {
      rows.push({ slot, name: day[slot] });
    }
  });
  // Deliberately no "Why this?" reasoning toggle on this view — this page
  // is styled to read like an actual restaurant menu for whoever's
  // browsing what's for dinner (not necessarily the person who set up the
  // plan), and the AI's behind-the-scenes rationale for each pick felt out
  // of place against that menu-card presentation. It's still shown on the
  // Cooker view, where it's useful working context for the person actually
  // planning/cooking.
  mealsDiv.innerHTML = rows.map(({ slot, name }, i) => {
    const badgeText = SLOT_LABELS[slot];
    const divider = i > 0 ? '<div class="meal-divider"></div>' : '';
    return `
      ${divider}
      <div class="meal-block">
        <div class="meal-badge ${BADGE_ROTATION_CLASS[slot]}">${badgeText}</div>
        <div class="meal-name">${escapeHtml(name)}</div>
      </div>`;
  }).join('') || '<p class="empty">Nothing planned for this day yet.</p>';
}

function selectDay(idx) {
  if (idx < 0 || idx >= currentMenu.length || idx === selectedIdx) return;
  selectedIdx = idx;
  renderSidebar();
  renderDayContent();
}

// Picks the most useful default day on first load: today's date if it's
// in this week's menu, otherwise the first day that actually has
// anything planned, otherwise just the first day.
function pickDefaultDayIndex(menu) {
  const todayIdx = menu.findIndex(d => d.date === todayIsoDate());
  if (todayIdx !== -1) return todayIdx;
  const firstWithContent = menu.findIndex(d => SLOT_ORDER.some(slot => d[slot]));
  return firstWithContent !== -1 ? firstWithContent : 0;
}

async function load() {
  const token = window.location.pathname.split('/').filter(Boolean).pop();
  const subtitle = document.getElementById('subtitle');
  const title = document.getElementById('page-title');
  const footerNote = document.getElementById('footer-note');
  const suggestedNote = document.getElementById('suggested-note');
  const poolToggle = document.getElementById('pool-toggle');
  const poolDiv = document.getElementById('pool');
  const menuCard = document.getElementById('menu-card');
  const statusArea = document.getElementById('status-area');

  try {
    const res = await fetch('/api/share/' + encodeURIComponent(token));
    if (res.status === 404) {
      subtitle.textContent = '';
      menuCard.style.display = 'none';
      statusArea.innerHTML = '<p class="error">This link isn\'t valid — ask whoever shared it for a fresh one.</p>';
      return;
    }
    if (!res.ok) throw new Error('Could not load the plan');
    const plan = await res.json();

    if (plan.household_name) {
      // "Meals this week at Emily’s house" (2026-11-01): households are
      // named "Emily’s house" now, and "Emily’s house's meals" read badly.
      title.textContent = 'Meals this week at ' + plan.household_name;
    }

    if (!plan.weekly_plan_id || !plan.meals || !plan.meals.length) {
      subtitle.textContent = '';
      menuCard.style.display = 'none';
      statusArea.innerHTML = '<p class="empty">No plan has been made for this week yet — check back soon.</p>';
      suggestedNote.style.display = 'none';
      poolToggle.style.display = 'none';
      return;
    }

    statusArea.innerHTML = '';
    // The period's own first day, not the Monday it is filed under: a week
    // that starts on a Thursday is "Week of Thursday, Oct 22".
    subtitle.textContent = 'Week of ' + formatDate(plan.period_start_date || plan.week_start_date);
    suggestedNote.style.display = plan.menu_is_suggested ? 'block' : 'none';

    currentMenu = plan.menu || [];
    if (!currentMenu.length) {
      menuCard.style.display = 'none';
      statusArea.innerHTML = '<p class="empty">Nothing to show yet.</p>';
    } else {
      menuCard.style.display = 'flex';
      // Keep whatever day the visitor already had open across a poll
      // refresh; only pick a fresh default on the very first load, or if
      // the previously-selected day no longer exists in the new menu.
      if (selectedIdx === null || selectedIdx >= currentMenu.length) {
        selectedIdx = pickDefaultDayIndex(currentMenu);
      }
      renderSidebar();
      renderDayContent();
    }

    if (plan.planning_mode === 'component_based' && plan.components && plan.components.length) {
      poolToggle.style.display = 'block';
      poolDiv.innerHTML = plan.components.map(c => `
        <h2 class="category-title">${escapeHtml(c.category)}</h2>
        <div class="component-card">
          ${c.items.map(item => `<p class="item">${escapeHtml(item || '')}</p>`).join('')}
        </div>
      `).join('');
    } else {
      poolToggle.style.display = 'none';
      poolDiv.classList.remove('open');
      poolDiv.innerHTML = '';
    }

    footerNote.style.display = 'block';
  } catch (err) {
    subtitle.textContent = '';
    menuCard.style.display = 'none';
    statusArea.innerHTML = '<p class="error">Couldn\'t load the plan right now — try refreshing.</p>';
    suggestedNote.style.display = 'none';
    poolToggle.style.display = 'none';
  }
}

document.getElementById('pool-toggle').addEventListener('click', () => {
  const pool = document.getElementById('pool');
  const btn = document.getElementById('pool-toggle');
  const open = pool.classList.toggle('open');
  btn.textContent = open ? 'Hide the full pool ↑' : 'Show the full pool ↓';
});

load();
// This is a read-only link others may leave open in a background tab, so it
// polls quietly rather than relying on a manual refresh — keeps it in sync
// as meals get added/swapped in chat without anyone needing to reload.
setInterval(load, 60000);
</script>
</body>
</html>
