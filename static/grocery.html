<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Grocery List — Home Manager</title>
<link rel="manifest" href="/static/manifest.json" />
<link rel="icon" href="/static/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<meta name="theme-color" content="#66304E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Home Manager" />
<style>
  * { box-sizing: border-box; }
  body {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px;
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.subtitle { margin-top: 0; }
  p.subtitle a { color: var(--midnight-violet); font-weight: 700; text-decoration: none; }
  p.subtitle a:hover { text-decoration: underline; }

  /* Frequent, low-stakes utility actions — ghost style, never gold. */
  .refresh-btn {
    background: transparent;
    border: 1px solid var(--midnight-violet);
    border-radius: var(--radius-control);
    padding: 10px 14px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--midnight-violet);
    cursor: pointer;
    flex-shrink: 0;
    min-height: 44px;
  }
  .refresh-btn:hover { background: var(--violet-soft); }
  .refresh-btn:disabled { opacity: 0.6; cursor: default; }

  .voice-btn {
    background: transparent;
    border: 1px solid var(--midnight-violet);
    color: var(--midnight-violet);
    border-radius: var(--radius-pill);
    padding: 10px 16px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
    min-height: 44px;
  }
  /* Hands-free is actively listening/recording — the one spot on this
     screen where an Electric Coral fill is warranted (a live/urgent
     indicator), used on a single control only. */
  .voice-btn.active { background: var(--electric-coral); border-color: var(--electric-coral); color: #fff; animation: voice-pulse 1.6s ease-in-out infinite; }
  @keyframes voice-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
  .voice-status {
    display: none;
    border-radius: var(--radius-card);
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 0.85rem;
    background: var(--violet-soft);
    border: 1px solid var(--card-border);
    color: var(--text-body);
  }
  .voice-status.showing { display: block; }
  .voice-status .voice-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--electric-coral); margin-right: 6px; animation: voice-pulse 1.2s ease-in-out infinite; }
  .voice-status .voice-note { display: block; margin-top: 6px; color: var(--text-muted); font-size: 0.78rem; }
  .voice-status .voice-log { margin: 6px 0 0; padding: 0; list-style: none; }
  .voice-status .voice-log li { padding: 2px 0; border-top: 1px solid var(--card-border); }
  .voice-status .voice-log li:first-child { border-top: none; }

  h2.section-title {
    font-family: var(--font-heading);
    font-weight: 600;
    font-size: 1.05rem;
    margin: 20px 0 8px;
    color: var(--midnight-violet);
    text-transform: capitalize;
  }
  h2.section-title:first-child { margin-top: 0; }
  h2.store-title {
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 1.2rem;
    margin: 22px 0 6px;
    color: var(--midnight-violet);
  }
  h2.store-title:first-child { margin-top: 0; }

  .suggestion-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .suggestion-label { color: var(--text-muted); font-size: 0.8rem; margin-right: 2px; font-weight: 500; }
  .suggestion-chip {
    background: var(--violet-soft);
    color: var(--midnight-violet);
    border: 1px solid var(--violet-soft);
    border-radius: var(--radius-pill);
    padding: 8px 14px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
    min-height: 44px;
  }
  .suggestion-chip:hover { background: #e7d9e2; }
  .suggestion-chip:disabled { opacity: 0.5; cursor: default; }

  .card {
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 4px 16px;
    margin-bottom: 10px;
  }
  .item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--card-border);
    flex-wrap: wrap;
  }
  .item-row:last-child { border-bottom: none; }
  /* Checked-off items keep their strikethrough but stay visible/legible,
     per the screen spec (fade, don't hide). */
  .item-row.checked-off { opacity: 0.65; }
  .item-row.checked-off .item-name { text-decoration: line-through; color: var(--text-muted); }
  .item-info { flex: 1; min-width: 120px; }
  .item-name { font-family: var(--font-body); font-weight: 500; margin: 0; color: var(--text-body); }
  .item-meta { font-family: var(--font-body); font-weight: 500; color: var(--text-muted); font-size: 0.78rem; margin: 2px 0 0; }

  /* Large 44x44 tap target on the primary in-store action. */
  input.buy-checkbox {
    width: 26px;
    height: 26px;
    min-width: 44px;
    min-height: 44px;
    margin: 0;
    accent-color: var(--midnight-violet);
    cursor: pointer;
    flex-shrink: 0;
  }

  .qty-input {
    width: 90px;
    padding: 10px 8px;
    border-radius: var(--radius-control);
    border: 1px solid var(--oat-cream-dark);
    font-family: var(--font-body);
    font-size: 0.85rem;
    color: var(--text-body);
    background: #fff;
    min-height: 44px;
  }
  .store-input {
    width: 110px;
    padding: 10px 8px;
    border-radius: var(--radius-control);
    border: 1px solid var(--oat-cream-dark);
    font-family: var(--font-body);
    font-size: 0.85rem;
    color: var(--text-body);
    background: #fff;
    min-height: 44px;
  }
  .cat-select {
    width: 118px;
    padding: 10px 6px;
    border-radius: var(--radius-control);
    border: 1px solid var(--oat-cream-dark);
    font-family: var(--font-body);
    font-size: 0.8rem;
    background: #fff;
    color: var(--text-body);
    min-height: 44px;
  }
  @media (max-width: 520px) {
    .cat-select, .qty-input, .store-input { flex: 1; min-width: 100px; }
  }

  .view-toggle { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  /* Store-tab-style toggle: active view in Midnight Violet, inactive muted
     — restyled only, the underlying to-buy/by-store/purchased logic is
     unchanged. */
  button.toggle-btn {
    padding: 10px 14px;
    min-height: 44px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--oat-cream-dark);
    background: #fff;
    color: var(--text-muted);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
  }
  button.toggle-btn.active { background: var(--midnight-violet); border-color: var(--midnight-violet); color: #fff; }

  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.95rem;
    padding: 4px 7px;
    min-width: 44px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-control);
    color: var(--text-muted);
  }
  .icon-btn:hover { background: var(--violet-soft); }
  .icon-btn.save { color: var(--midnight-violet); }
  /* Destructive action — the sparing, appropriate use of Electric Coral
     for an urgent/irreversible action. */
  .icon-btn.remove { color: var(--electric-coral); }
  .icon-btn.exclude, .icon-btn.undo, .icon-btn.keep { font-size: 0.78rem; white-space: nowrap; font-weight: 700; color: var(--midnight-violet); }

  .empty {
    color: var(--text-muted);
    font-size: 0.95rem;
    padding: 8px 0;
  }
  .error { color: var(--electric-coral); font-size: 0.9rem; }

  .add-card {
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 14px 16px;
    margin-top: 20px;
  }
  .add-card h2 { font-family: var(--font-heading); font-weight: 600; font-size: 1rem; margin: 0 0 10px; color: var(--midnight-violet); }
  .add-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .add-row input[type=text] {
    padding: 10px 10px;
    border-radius: var(--radius-control);
    border: 1px solid var(--oat-cream-dark);
    font-family: var(--font-body);
    font-size: 0.9rem;
    background: #fff;
    color: var(--text-body);
    min-height: 44px;
  }
  #add-item { flex: 2; min-width: 140px; }
  #add-qty { flex: 1; min-width: 90px; }
  select#add-category {
    flex: 1;
    min-width: 120px;
    padding: 10px 10px;
    border-radius: var(--radius-control);
    border: 1px solid var(--oat-cream-dark);
    font-family: var(--font-body);
    font-size: 0.9rem;
    background: #fff;
    color: var(--text-body);
    min-height: 44px;
  }
  /* "+ Add item" is frequent and low-stakes — Midnight Violet ghost
     button, never gold (gold is reserved for a single most-important CTA,
     and nothing on this list screen qualifies). */
  button.action {
    padding: 10px 16px;
    min-height: 44px;
    border-radius: var(--radius-control);
    border: 1px solid var(--midnight-violet);
    background: transparent;
    color: var(--midnight-violet);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button.action:hover:not(:disabled) { background: var(--violet-soft); }
  button.action:disabled { opacity: 0.6; cursor: default; }

  .already-have-banner {
    border-radius: var(--radius-card);
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 0.88rem;
    background: var(--violet-soft);
    border: 1px solid var(--card-border);
    color: var(--text-body);
  }
  .already-have-banner h2 { font-family: var(--font-heading); font-weight: 600; font-size: 1rem; margin: 0 0 4px; color: var(--midnight-violet); }
  .already-have-banner p.hint { margin: 0 0 10px; color: var(--text-muted); font-size: 0.82rem; }
  .already-have-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--card-border);
    flex-wrap: wrap;
  }
  .already-have-row:last-child { border-bottom: none; }
  .already-have-row .info { flex: 1; min-width: 160px; }
  .already-have-row .tag { font-weight: 700; color: var(--text-body); }
  .already-have-row .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .ah-btn {
    border: none;
    border-radius: var(--radius-control);
    padding: 8px 12px;
    min-height: 44px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
  }
  /* Removing from the list is the more consequential of the two actions
     here — Electric Coral, used sparingly on this single control. */
  .ah-btn.remove-btn { background: var(--electric-coral); color: #fff; }
  .ah-btn.keep-btn { background: #fff; border: 1px solid var(--midnight-violet); color: var(--midnight-violet); }
  .ah-btn:disabled { opacity: 0.6; cursor: default; }

  /* All-done state — everything checked off the To buy list. */
  .all-done-state { padding: 12px 0; }
  .all-done-state .pill { margin-bottom: 8px; }
  .all-done-state p { margin: 0; color: var(--text-muted); font-size: 0.95rem; }
</style>
</head>
<body>

<div class="header-row">
  <h1>Grocery List</h1>
  <button class="refresh-btn" id="refresh-btn" title="Reload the latest list">&#8635; Refresh</button>
</div>
<p class="subtitle">This week's shopping list. <a href="/">&larr; Back to chat</a></p>

<div id="voice-status" class="voice-status"></div>
<div id="already-have-banner"></div>

<div class="view-toggle">
  <button class="toggle-btn active" id="view-needed-btn" data-view="needed">To buy</button>
  <button class="toggle-btn" id="view-store-btn" data-view="store">By store</button>
  <button class="toggle-btn" id="view-purchased-btn" data-view="purchased">Purchased</button>
  <button class="voice-btn" id="voice-toggle-btn" title="Hands-free: check off, add, or ask about items by voice">&#127908; Hands-free</button>
</div>

<datalist id="usual-stores-list"></datalist>

<div id="content">
  <p class="empty">Loading...</p>
</div>

<div class="add-card">
  <h2>Add an item</h2>
  <div class="add-row">
    <input type="text" id="add-item" placeholder="Item, e.g. ground beef" />
    <input type="text" id="add-qty" placeholder="Quantity, e.g. 2 lbs" />
    <select id="add-category">
      <option value="produce">Produce</option>
      <option value="dairy">Dairy</option>
      <option value="meat/seafood">Meat/seafood</option>
      <option value="pantry">Pantry</option>
      <option value="frozen">Frozen</option>
      <option value="other" selected>Other</option>
    </select>
    <button class="action" id="add-btn">Add</button>
  </div>
</div>

<script src="/static/voice-session.js"></script>
<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

const CATEGORIES = ['produce', 'dairy', 'meat/seafood', 'pantry', 'frozen', 'other'];
const CATEGORY_LABELS = { produce: 'Produce', dairy: 'Dairy', 'meat/seafood': 'Meat/seafood', pantry: 'Pantry', frozen: 'Frozen', other: 'Other' };
function categoryOptions(current) {
  return CATEGORIES.map(c => `<option value="${c}" ${c === current ? 'selected' : ''}>${CATEGORY_LABELS[c]}</option>`).join('');
}

let currentView = 'needed'; // 'needed' | 'store' | 'purchased'
let usualStores = []; // household's usual stores, from /api/memory — populates the store-input datalist
let storeTypicalItems = {}; // store -> typically-bought-there items, from /api/memory — powers "usually get here" suggestions in the By Store view

async function loadUsualStores() {
  try {
    const res = await fetch('/api/memory');
    if (!res.ok) return;
    const memory = await res.json();
    usualStores = memory.usual_stores || [];
    storeTypicalItems = memory.store_typical_items || {};
    const dl = document.getElementById('usual-stores-list');
    if (dl) dl.innerHTML = usualStores.map(s => `<option value="${escapeHtml(s)}"></option>`).join('');
    // Suggestions depend on this data — if the By Store view already
    // rendered before this fetch resolved, refresh it once we have it.
    if (currentView === 'store') load();
  } catch (err) {
    // Store suggestions are a nicety, not load-bearing — the plain text
    // input still works fine without them.
  }
}

// ---------- Phase 5: hands-free voice (Shopper case, §4.2) ----------
// Reuses the exact same engine as Cooker view (/static/voice-session.js)
// rather than a second implementation, per the PRD. Scoped to the 'needed'
// (To buy) list regardless of which toggle view happens to be showing,
// since that's the actual shopping list — commands always fetch a fresh
// copy of it rather than relying on whatever's currently rendered, so a
// spoken command works correctly even mid-way through browsing By store or
// Purchased.

let voiceSession = null;
let voiceLog = [];

function setVoiceStatus(text) {
  const el = document.getElementById('voice-status');
  if (!text) {
    voiceLog = [];
    el.classList.remove('showing');
    el.innerHTML = '';
    return;
  }
  // Keep a short scrollback rather than a single overwritten line — a
  // single line was flashing by before it could be read, making it
  // impossible to tell what was actually heard when a command failed.
  voiceLog.unshift(text);
  voiceLog = voiceLog.slice(0, 5);
  el.classList.add('showing');
  el.innerHTML = `<span class="voice-dot"></span>Listening…` +
    `<ul class="voice-log">${voiceLog.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>` +
    `<span class="voice-note">Say "hey home manager" plus a command, or tap Hands-free again to stop.</span>`;
}

function updateVoiceButton() {
  const btn = document.getElementById('voice-toggle-btn');
  const isOn = !!(voiceSession && voiceSession.isActive());
  btn.classList.toggle('active', isOn);
  btn.innerHTML = isOn ? '&#127908; Stop hands-free' : '&#127908; Hands-free';
}

// Same loose-matching approach as the Cooker view's voice handler
// (duplicated rather than shared, since these are two separate static
// pages with no shared JS beyond the voice engine itself) — exact match
// first, then substring overlap, then word overlap. Never silently
// changes data on a weak match alone; the caller always confirms back via
// TTS what it acted on.
function groceryVoiceFuzzyFind(text, candidates, getLabel) {
  const t = (text || '').trim().toLowerCase();
  if (!t || !candidates || !candidates.length) return null;
  for (const c of candidates) {
    if (getLabel(c).trim().toLowerCase() === t) return c;
  }
  for (const c of candidates) {
    const label = getLabel(c).trim().toLowerCase();
    if (label && (label.includes(t) || t.includes(label))) return c;
  }
  const words = t.split(/\s+/);
  let best = null, bestScore = 0;
  for (const c of candidates) {
    const labelWords = getLabel(c).trim().toLowerCase().split(/\s+/);
    const score = words.filter(w => labelWords.includes(w)).length;
    if (score > bestScore) { bestScore = score; best = c; }
  }
  return bestScore > 0 ? best : null;
}

// Keyword-anywhere-in-phrase matching (not exact leading-phrase anchoring)
// — see cooker.html's handlers for the same rationale: natural phrasing
// varies too much to require an exact sentence structure.
function isVoiceEndCommand(command) {
  return /\b(stop|cancel|exit|goodbye|end session|that'?s all|all done)\b/i.test(command) ||
    /^done$/i.test(command.trim());
}

async function fetchNeededItemsFlat() {
  const res = await fetch('/api/grocery-list?status=needed');
  if (!res.ok) return [];
  const view = await res.json();
  const items = [];
  (view.sections || []).forEach(s => items.push(...s.items));
  return items;
}

async function handleShopperVoiceCommand(command) {
  if (isVoiceEndCommand(command)) return { spoken: 'Ending hands-free.', endSession: true };

  // "What store/section is X in" — checked before the check-off/add
  // patterns since it's the most specific (has its own keyword pair).
  if (/\b(what|which)\b/i.test(command) && /\b(store|section)\b/i.test(command)) {
    const afterKeyword = command.replace(/^.*?\b(store|section)\b\s*(?:is|does)?\s*/i, '').replace(/\bin\??$/i, '').trim();
    const items = await fetchNeededItemsFlat();
    const item = groceryVoiceFuzzyFind(afterKeyword, items, i => i.item);
    if (!item) return { spoken: "I don't see that on the list." };
    const storeText = item.store && item.store.trim() ? item.store : 'no store assigned';
    return { spoken: `${item.item} is ${item.category}, ${storeText}.` };
  }

  if (/\b(check off|got|grabbed|found|bought|picked up)\b/i.test(command)) {
    const afterKeyword = command.replace(/^.*?\b(check off|got|grabbed|found|bought|picked up)\b\s*/i, '').trim();
    const items = await fetchNeededItemsFlat();
    const item = groceryVoiceFuzzyFind(afterKeyword, items, i => i.item);
    if (!item) return { spoken: "I don't see that on the list." };
    const res = await fetch('/api/grocery-list/' + item.id + '/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'purchased' }),
    });
    if (!res.ok) return null;
    if (currentView === 'needed' || currentView === 'purchased' || currentView === 'store') load();
    return { spoken: `Got it, ${item.item} checked off.` };
  }

  if (/\b(add|put|need)\b/i.test(command)) {
    const name = command
      .replace(/^.*?\b(add)\b\s*/i, '')
      .replace(/\b(to the list|to my list|on the list|on my list)\b/gi, '')
      .replace(/^(put|we need|need)\s+/i, '')
      .trim();
    if (!name) return null;
    const res = await fetch('/api/grocery-list/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item: name, quantity: '', category: 'other' }),
    });
    if (!res.ok) return null;
    if (currentView === 'needed') load();
    return { spoken: `Added ${name} to the list.` };
  }

  return null;
}

function startShopperVoiceSession() {
  if (voiceSession && voiceSession.isActive()) {
    voiceSession.stop();
    return;
  }
  voiceSession = createVoiceSession({
    onListeningChange: (isListening) => {
      updateVoiceButton();
      if (!isListening) setVoiceStatus('');
    },
    onStatus: (text) => setVoiceStatus(text),
    onCommand: (command) => handleShopperVoiceCommand(command),
    onEnd: () => updateVoiceButton(),
  });
  if (voiceSession.isStandaloneIOS()) {
    setVoiceStatus('Heads up: hands-free voice can be unreliable in the installed home-screen app on iOS — if it doesn\'t seem to hear you, try this from a regular Safari tab instead.');
  }
  voiceSession.start();
  updateVoiceButton();
}

document.getElementById('voice-toggle-btn').addEventListener('click', startShopperVoiceSession);

function itemRowHtml(it) {
  const checkedOff = currentView === 'purchased';
  const editable = currentView === 'needed' || currentView === 'store';
  return `<div class="item-row ${checkedOff ? 'checked-off' : ''}" data-item-id="${it.id}">
    ${currentView === 'needed' ? `<input type="checkbox" class="buy-checkbox" title="Mark purchased" />` : ''}
    ${currentView === 'purchased' ? `<button class="icon-btn undo" title="Move back to To buy">&#8630;</button>` : ''}
    <div class="item-info">
      <p class="item-name">${escapeHtml(it.item)}</p>
    </div>
    <select class="cat-select" ${!editable ? 'disabled' : ''}>${categoryOptions(it.category)}</select>
    <input type="text" class="qty-input" value="${escapeHtml(it.quantity || '')}" placeholder="Quantity" ${!editable ? 'disabled' : ''} />
    ${editable ? `<input type="text" class="store-input" list="usual-stores-list" value="${escapeHtml(it.store || '')}" placeholder="Store" />` : ''}
    ${editable ? `<button class="icon-btn save" title="Save changes">&check;</button>` : ''}
    ${currentView === 'needed' ? `<button class="icon-btn exclude" title="Get elsewhere — hide from this list">elsewhere</button>` : ''}
    <button class="icon-btn remove" title="Delete">&times;</button>
  </div>`;
}

function wireRowActions(content) {
  content.querySelectorAll('.buy-checkbox').forEach(cb => {
    cb.addEventListener('change', async () => {
      const row = cb.closest('.item-row');
      const itemId = row.getAttribute('data-item-id');
      cb.disabled = true;
      try {
        const res = await fetch('/api/grocery-list/' + itemId + '/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'purchased' }),
        });
        if (!res.ok) throw new Error('failed');
        load();
      } catch (err) {
        cb.disabled = false;
        cb.checked = false;
        alert("Couldn't update that — try again.");
      }
    });
  });

  content.querySelectorAll('.icon-btn.undo').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('.item-row');
      const itemId = row.getAttribute('data-item-id');
      btn.disabled = true;
      try {
        const res = await fetch('/api/grocery-list/' + itemId + '/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'needed' }),
        });
        if (!res.ok) throw new Error('failed');
        load();
      } catch (err) {
        btn.disabled = false;
        alert("Couldn't update that — try again.");
      }
    });
  });

  content.querySelectorAll('.icon-btn.save').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('.item-row');
      const itemId = row.getAttribute('data-item-id');
      const qty = row.querySelector('.qty-input').value;
      const cat = row.querySelector('.cat-select').value;
      const storeInput = row.querySelector('.store-input');
      btn.disabled = true;
      try {
        const calls = [
          fetch('/api/grocery-list/' + itemId + '/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ quantity: qty, category: cat }),
          }),
        ];
        if (storeInput) {
          calls.push(fetch('/api/grocery-list/' + itemId + '/store', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ store: storeInput.value.trim() }),
          }));
        }
        const results = await Promise.all(calls);
        if (results.some(r => !r.ok)) throw new Error('failed');
        load();
      } catch (err) {
        btn.disabled = false;
        alert("Couldn't save that — try again.");
      }
    });
  });

  content.querySelectorAll('.icon-btn.exclude').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('.item-row');
      const itemId = row.getAttribute('data-item-id');
      btn.disabled = true;
      try {
        const res = await fetch('/api/grocery-list/' + itemId + '/exclude', { method: 'POST' });
        if (!res.ok) throw new Error('failed');
        load();
      } catch (err) {
        btn.disabled = false;
        alert("Couldn't update that — try again.");
      }
    });
  });

  content.querySelectorAll('.icon-btn.remove').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('.item-row');
      const itemId = row.getAttribute('data-item-id');
      btn.disabled = true;
      try {
        const res = await fetch('/api/grocery-list/' + itemId + '/remove', { method: 'POST' });
        if (!res.ok) throw new Error('failed');
        load();
      } catch (err) {
        btn.disabled = false;
        alert("Couldn't remove that — try again.");
      }
    });
  });
}

function renderNeededOrPurchased(view) {
  const content = document.getElementById('content');
  const sections = view.sections || [];

  if (!sections.length) {
    if (currentView === 'needed') {
      content.innerHTML = `<div class="all-done-state">
        <span class="pill pill-success">You're all set!</span>
        <p>Nothing left to buy — add items below, or they'll show up automatically from meal planning.</p>
      </div>`;
    } else {
      content.innerHTML = `<p class="empty">Nothing marked purchased yet — check things off as you shop.</p>`;
    }
    return;
  }

  let html = '';
  for (const s of sections) {
    html += `<h2 class="section-title">${escapeHtml(s.section)}</h2><div class="card">`;
    for (const it of s.items) {
      html += itemRowHtml(it);
    }
    html += `</div>`;
  }
  content.innerHTML = html;
  wireRowActions(content);
}

function renderByStore(view) {
  const content = document.getElementById('content');
  const stores = view.stores || [];

  // A store with saved typical items but nothing currently on the list
  // (e.g. a usual store just added, no items tagged to it yet) wouldn't
  // otherwise appear here at all — but that's exactly where a suggestion
  // row is most useful, so synthesize an empty entry for it too.
  const knownStoreNames = new Set(stores.map(s => s.store));
  const allStores = [...stores];
  for (const store of Object.keys(storeTypicalItems)) {
    if (!knownStoreNames.has(store) && (storeTypicalItems[store] || []).length) {
      allStores.push({ store, sections: [] });
    }
  }

  const hasAnything = allStores.some(s => (s.sections && s.sections.length) || (storeTypicalItems[s.store] || []).length);
  if (!hasAnything) {
    content.innerHTML = '<p class="empty">Nothing on the list yet — add what you need below.</p>';
    return;
  }

  let html = '';
  for (const store of allStores) {
    const hasSections = store.sections && store.sections.length;
    const typicalItems = store.store === 'Unassigned' ? [] : (storeTypicalItems[store.store] || []);
    if (!hasSections && !typicalItems.length) continue;

    const currentNames = new Set();
    (store.sections || []).forEach(s => s.items.forEach(it => currentNames.add((it.item || '').toLowerCase())));
    const suggestions = typicalItems.filter(i => !currentNames.has(i.toLowerCase()));

    html += `<h2 class="store-title">${escapeHtml(store.store)}</h2>`;
    if (suggestions.length) {
      html += `<div class="suggestion-row" data-store="${escapeHtml(store.store)}">
        <span class="suggestion-label">Usually get here:</span>
        ${suggestions.map(i => `<button class="suggestion-chip" data-store="${escapeHtml(store.store)}" data-item="${escapeHtml(i)}">+ ${escapeHtml(i)}</button>`).join('')}
      </div>`;
    }
    for (const s of (store.sections || [])) {
      html += `<h2 class="section-title">${escapeHtml(s.section)}</h2><div class="card">`;
      for (const it of s.items) {
        html += itemRowHtml(it);
      }
      html += `</div>`;
    }
  }
  content.innerHTML = html;
  wireRowActions(content);
  wireSuggestionChips(content);
}

async function confirmStoreSuggestion(store, item) {
  try {
    const addRes = await fetch('/api/grocery-list/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item, quantity: '', category: 'other' }),
    });
    if (!addRes.ok) throw new Error('add failed');
    const added = await addRes.json();
    // Tag it with the store it was suggested from in the same action, so
    // confirming a suggestion doesn't leave the item unassigned.
    await fetch('/api/grocery-list/' + added.item_id + '/store', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ store }),
    });
    load();
  } catch (err) {
    alert("Couldn't add that — try again.");
  }
}

function wireSuggestionChips(content) {
  content.querySelectorAll('.suggestion-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.disabled = true;
      confirmStoreSuggestion(btn.dataset.store, btn.dataset.item);
    });
  });
}

async function renderAlreadyHaveBanner() {
  const banner = document.getElementById('already-have-banner');
  if (currentView !== 'needed') {
    banner.innerHTML = '';
    return;
  }
  let items = [];
  try {
    const res = await fetch('/api/grocery-list/already-have');
    if (res.ok) items = (await res.json()).items || [];
  } catch (err) { /* non-critical, ignore */ }

  if (!items.length) {
    banner.innerHTML = '';
    return;
  }

  banner.innerHTML = `
    <div class="already-have-banner">
      <h2>Already have this?</h2>
      <p class="hint">These are on the list, but inventory shows some already on hand — pulled out here for a quick check before shopping.</p>
      ${items.map(it => `
        <div class="already-have-row" data-item-id="${it.item_id}">
          <div class="info">
            <span class="tag">${escapeHtml(it.item)}</span>${it.quantity ? ' (' + escapeHtml(it.quantity) + ' wanted)' : ''}
            — tracking ${escapeHtml(it.inventory_quantity || 'some')}${it.inventory_location ? ' in the ' + escapeHtml(it.inventory_location) : ''}
          </div>
          <div class="actions">
            <button class="ah-btn keep-btn">Keep it, I need it</button>
            <button class="ah-btn remove-btn">Remove from list</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;

  banner.querySelectorAll('.already-have-row').forEach(row => {
    const itemId = row.getAttribute('data-item-id');
    const keepBtn = row.querySelector('.keep-btn');
    const removeBtn = row.querySelector('.remove-btn');
    async function act(endpoint) {
      keepBtn.disabled = true;
      removeBtn.disabled = true;
      try {
        const res = await fetch('/api/grocery-list/' + itemId + endpoint, { method: 'POST' });
        if (!res.ok) throw new Error('failed');
        load();
      } catch (err) {
        keepBtn.disabled = false;
        removeBtn.disabled = false;
        alert("Couldn't update that — try again.");
      }
    }
    keepBtn.addEventListener('click', () => act('/keep'));
    removeBtn.addEventListener('click', () => act('/remove'));
  });
}

// The "By store" tab only earns its place once there's actually more than
// one store involved (Phase 6 §4.1/§4.4 audit finding: it used to show
// unconditionally with no signal behind it) — see is_multi_store_household
// in tools.py for the "usual store list OR item-tagged store" definition.
// Toggled off the /api/grocery-list response since that's the endpoint
// already hit on every normal page load; if the household happens to be
// mid-"By store" browsing when it drops to single-store, bounce back to
// "To buy" rather than leaving a dead tab selected.
function applyMultiStoreVisibility(multiStore) {
  const btn = document.getElementById('view-store-btn');
  btn.style.display = multiStore ? '' : 'none';
  if (!multiStore && currentView === 'store') {
    setView('needed', 'view-needed-btn');
  }
}

async function load() {
  const content = document.getElementById('content');
  try {
    if (currentView === 'store') {
      const res = await fetch('/api/grocery-list/by-store?status=needed');
      if (!res.ok) throw new Error('Could not load');
      renderByStore(await res.json());
    } else {
      const status = currentView === 'purchased' ? 'purchased' : 'needed';
      const res = await fetch('/api/grocery-list?status=' + encodeURIComponent(status));
      if (!res.ok) throw new Error('Could not load');
      const result = await res.json();
      applyMultiStoreVisibility(!!result.multi_store);
      renderNeededOrPurchased(result);
    }
    renderAlreadyHaveBanner();
  } catch (err) {
    content.innerHTML = '<p class="error">Couldn\'t load the grocery list right now — try refreshing.</p>';
  }
}

function setView(view, btnId) {
  if (currentView === view) return;
  currentView = view;
  document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(btnId).classList.add('active');
  load();
}

document.getElementById('view-needed-btn').addEventListener('click', () => setView('needed', 'view-needed-btn'));
document.getElementById('view-store-btn').addEventListener('click', () => setView('store', 'view-store-btn'));
document.getElementById('view-purchased-btn').addEventListener('click', () => setView('purchased', 'view-purchased-btn'));

document.getElementById('add-btn').addEventListener('click', async () => {
  const itemInput = document.getElementById('add-item');
  const qtyInput = document.getElementById('add-qty');
  const catSelect = document.getElementById('add-category');
  const btn = document.getElementById('add-btn');
  const name = itemInput.value.trim();
  if (!name) return;
  btn.disabled = true;
  try {
    const res = await fetch('/api/grocery-list/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item: name, quantity: qtyInput.value, category: catSelect.value }),
    });
    if (!res.ok) throw new Error('failed');
    itemInput.value = '';
    qtyInput.value = '';
    catSelect.value = 'other';
    if (currentView !== 'needed') setView('needed', 'view-needed-btn');
    else load();
  } catch (err) {
    alert("Couldn't add that — try again.");
  } finally {
    btn.disabled = false;
  }
});

const refreshBtn = document.getElementById('refresh-btn');
refreshBtn.addEventListener('click', async () => {
  refreshBtn.disabled = true;
  const original = refreshBtn.innerHTML;
  refreshBtn.innerHTML = '&#8635; Refreshing…';
  try {
    await load();
  } finally {
    refreshBtn.disabled = false;
    refreshBtn.innerHTML = original;
  }
});

load();
loadUsualStores();
</script>
