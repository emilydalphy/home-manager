<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Grocery List — Home Manager</title>
<link rel="manifest" href="/static/manifest.json" />
<link rel="icon" href="/static/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<meta name="theme-color" content="#66304E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Home Manager" />
<style>
  /* ===========================================================
     Grocery List — design 13a (four-screen redesign)
     Screens: To buy / Plan your stops / Shopping <store> / Review.
     See README.md "Grocery list" section for the full write-up,
     including deliberate deviations from the design handoff.
     =========================================================== */
  * { box-sizing: border-box; }
  body {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 0 28px;
    background: var(--page, #EFE6D6);
  }
  #app-shell {
    background: var(--oat-cream);
    min-height: 100vh;
    border-radius: 0;
    position: relative;
    padding-bottom: 24px;
  }
  a.back-link { color: var(--midnight-violet); font-weight: 700; text-decoration: none; font-size: 0.82rem; }
  a.back-link:hover { text-decoration: underline; }

  /* ---------- Header / progress wheel ---------- */
  .gl-header { padding: 26px 20px 14px; }
  .gl-header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .gl-wheel {
    width: 74px; height: 74px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: conic-gradient(var(--violet-light) 0 var(--pct, 0%), rgba(176,97,154,.18) var(--pct, 0%) 100%);
  }
  .gl-wheel-inner {
    width: 58px; height: 58px; border-radius: 50%; background: var(--oat-cream);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .gl-wheel-pct { font-family: var(--font-heading); font-weight: 700; font-size: 17px; color: var(--midnight-violet); line-height: 1.1; }
  .gl-wheel-frac { font-family: var(--font-body); font-weight: 700; font-size: 10px; text-transform: uppercase; color: var(--ink-faint); letter-spacing: 0.04em; }
  .gl-title-block { flex: 1; }
  .gl-title { font-family: var(--font-heading); font-weight: 700; font-size: 25px; color: var(--midnight-violet); margin: 0; }
  .gl-sub { font-family: var(--font-body); font-size: 13px; color: var(--ink-muted); margin: 4px 0 0; }
  .gl-refresh {
    background: transparent; border: 1px solid var(--violet-light); border-radius: 12px;
    padding: 8px 10px; color: var(--violet-light); font-weight: 700; font-size: 0.78rem;
    cursor: pointer; min-height: 40px; flex-shrink: 0;
  }
  .gl-refresh:disabled { opacity: 0.6; cursor: default; }

  /* ---------- Tabs ---------- */
  .gl-tabs { display: flex; gap: 6px; margin-top: 20px; flex-wrap: wrap; }
  .gl-tab {
    padding: 9px 16px; border-radius: 13px; border: none; cursor: pointer;
    font-family: var(--font-body); font-size: 13px; background: #fff; color: #7A6570; font-weight: 600;
  }
  .gl-tab.active { background: var(--violet-light); color: #fff; font-weight: 700; }

  .gl-content { padding: 4px 20px 0; }

  /* ---------- Eyebrow / section labels ---------- */
  .eyebrow {
    font-family: var(--font-body); font-weight: 700; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px;
  }

  /* ---------- Store group card (Screen 1) ---------- */
  .store-card { background: #fff; border-radius: 20px; box-shadow: 0 8px 20px -16px rgba(58,31,46,.55); margin-bottom: 14px; overflow: hidden; }
  .store-card-header {
    display: flex; align-items: center; gap: 12px; padding: 15px 17px;
    background: rgba(176,97,154,.1); cursor: pointer;
  }
  .store-avatar {
    width: 34px; height: 34px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-heading); font-weight: 700; font-size: 15px; color: #fff;
  }
  .store-name { font-family: var(--font-heading); font-weight: 700; font-size: 17px; color: var(--ink); flex: 1; margin: 0; }
  .badge-left { font-family: var(--font-body); font-weight: 700; font-size: 12px; color: var(--midnight-violet); background: rgba(102,48,78,.09); padding: 4px 10px; border-radius: 999px; }
  .badge-done { font-family: var(--font-body); font-weight: 700; font-size: 12px; color: var(--leaf-dark); background: rgba(111,184,76,.18); padding: 4px 10px; border-radius: 999px; }
  .chevron { color: var(--ink-faint); font-weight: 700; font-size: 14px; margin-left: 4px; }

  .aisle-subhead { display: flex; align-items: center; gap: 8px; padding: 12px 17px 4px; border-top: 1px solid rgba(58,31,46,.06); }
  .aisle-subhead:first-of-type { border-top: none; }
  .aisle-spine { width: 7px; height: 14px; border-radius: 3px; flex-shrink: 0; }
  .aisle-name { flex: 1; }
  .aisle-count { font-family: var(--font-body); font-weight: 700; font-size: 11px; }
  .aisle-count.left { color: var(--midnight-violet); }
  .aisle-count.done { color: var(--leaf-dark); }

  .gl-row {
    display: flex; align-items: center; gap: 13px; min-height: 52px; padding: 0 17px;
    cursor: pointer; border-bottom: 1px solid rgba(58,31,46,.06);
  }
  .gl-row:last-child { border-bottom: none; }
  .gl-row:hover { background: rgba(176,97,154,.07); }
  .gl-row.tall { min-height: 58px; gap: 14px; }
  /* A real <button role="checkbox"> now — it was a <div> inside a clickable
     row, so the list could only be checked off with a mouse. Background and
     padding are reset so it renders exactly as before. */
  .gl-box {
    padding: 0; background: none; appearance: none; cursor: pointer;
    width: 26px; height: 26px; border-radius: 8px; border: 2px solid rgba(176,97,154,.5);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px;
  }
  .gl-row.tall .gl-box { width: 28px; height: 28px; border-radius: 9px; }
  .gl-box.checked { background: #6FB84C; border-color: #6FB84C; color: #fff; font-weight: 700; }
  .gl-name { font-family: var(--font-body); font-weight: 600; font-size: 17px; color: var(--ink); flex: 1; margin: 0; }
  .gl-row.tall .gl-name { font-size: 18px; }
  .gl-row.done .gl-name { color: var(--ink-done); text-decoration: line-through; }
  .gl-qty-chip { font-family: var(--font-body); font-weight: 600; font-size: 13px; color: var(--midnight-violet); background: var(--oat-cream); padding: 5px 10px; border-radius: 9px; flex-shrink: 0; }
  .gl-row.tall .gl-qty-chip { font-size: 14px; }
  .gl-row.done .gl-qty-chip { color: var(--qty-done); background: transparent; }

  /* small overflow menu for edit/exclude/already-have, kept off the main
     row to stay close to spec visuals — see README deviations note */
  .gl-overflow-btn { background: none; border: none; color: var(--ink-faint); font-size: 18px; cursor: pointer; min-width: 32px; min-height: 44px; flex-shrink: 0; }
  .gl-row-actions { display: none; flex-wrap: wrap; gap: 6px; padding: 0 17px 12px; }
  .gl-row-actions.open { display: flex; }
  .gl-row-actions input, .gl-row-actions select {
    padding: 8px 9px; border-radius: 9px; border: 1px solid var(--oat-cream-dark); font-size: 0.8rem;
    background: #fff; color: var(--text-body); min-height: 38px;
  }
  .gl-row-actions button {
    border: none; border-radius: 9px; padding: 8px 11px; font-family: var(--font-body);
    font-weight: 700; font-size: 0.78rem; cursor: pointer; min-height: 38px;
  }
  .gl-row-actions button.mini-save { background: var(--midnight-violet); color: #fff; }
  .gl-row-actions button.mini-elsewhere { background: var(--violet-soft); color: var(--midnight-violet); }
  .gl-row-actions button.mini-have { background: rgba(111,184,76,.18); color: var(--leaf-dark); }
  .gl-row-actions button.mini-remove { background: var(--electric-coral); color: #fff; }

  /* ---------- Add an item card ---------- */
  .add-card { background: #fff; border-radius: 20px; box-shadow: 0 8px 20px -16px rgba(58,31,46,.55); padding: 16px; margin: 14px 0; }
  .add-card-title { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .add-chip { width: 26px; height: 26px; border-radius: 8px; background: var(--turmeric-gold); color: var(--ink); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .add-card-title span { font-family: var(--font-heading); font-weight: 700; font-size: 16px; color: var(--ink); }
  .add-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .add-row input[type=text] { flex: 1; min-width: 130px; background: var(--oat-cream); border: none; border-radius: 12px; padding: 12px 13px; font-family: var(--font-body); font-size: 14px; min-height: 44px; }
  .add-row input.add-qty-input { flex: 0 0 80px; min-width: 80px; }
  .add-row button.add-btn { background: var(--midnight-violet); color: var(--oat-cream); border: none; border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 14px; cursor: pointer; min-height: 44px; }
  .add-row button.add-btn:disabled { opacity: 0.6; cursor: default; }
  .add-row select { flex: 1; min-width: 110px; background: var(--oat-cream); border: none; border-radius: 12px; padding: 12px 13px; font-family: var(--font-body); font-size: 14px; min-height: 44px; }

  /* ---------- Done section ---------- */
  .done-card { background: #fff; border-radius: 20px; box-shadow: 0 8px 20px -16px rgba(58,31,46,.55); margin-bottom: 14px; overflow: hidden; }
  .done-card-header { display: flex; align-items: center; gap: 10px; padding: 14px 17px; cursor: pointer; }
  .done-chip { width: 26px; height: 26px; border-radius: 50%; background: #6FB84C; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .done-label { font-family: var(--font-body); font-weight: 700; font-size: 15px; color: var(--ink); flex: 1; }
  .done-body { display: none; }
  .done-body.open { display: block; border-top: 1px solid rgba(58,31,46,.06); }

  /* ---------- Floating mic ---------- */
  .mic-btn {
    position: fixed; right: max(20px, calc((100vw - 480px) / 2 + 20px)); bottom: 20px;
    width: 60px; height: 60px; border-radius: 18px; background: var(--midnight-violet); color: var(--oat-cream);
    border: none; box-shadow: 0 10px 22px -8px rgba(102,48,78,.6); font-size: 22px; cursor: pointer; z-index: 20;
  }
  .mic-btn.active { background: var(--electric-coral); animation: voice-pulse 1.6s ease-in-out infinite; }
  @keyframes voice-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
  .content-pad { padding-bottom: 100px; }
  .voice-status {
    display: none; border-radius: 16px; padding: 10px 14px; margin: 12px 0 0; font-size: 0.85rem;
    background: var(--violet-soft); border: 1px solid var(--card-border); color: var(--text-body);
  }
  .voice-status.showing { display: block; }
  .voice-status .voice-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--electric-coral); margin-right: 6px; animation: voice-pulse 1.2s ease-in-out infinite; }
  .voice-status .voice-note { display: block; margin-top: 6px; color: var(--text-muted); font-size: 0.78rem; }
  .voice-status .voice-log { margin: 6px 0 0; padding: 0; list-style: none; }
  .voice-status .voice-log li { padding: 2px 0; border-top: 1px solid var(--card-border); }
  .voice-status .voice-log li:first-child { border-top: none; }

  /* ---------- Pre-shop check — "Maybe already home" (PRE_SHOP_CHECK.md, option 1a) ----------
     Replaces the old three-action "Already have this?" banner entirely.
     Shared .ps-* rules below are the phone layout; the #dg-pre-shop
     overrides further down restyle the same markup pattern (rendered by a
     separate desktop template function) into the desktop row shape. */
  .ps-card { background: #F3E6EE; border: 1px solid #E4CEDE; border-radius: 18px; padding: 16px 18px 8px; margin: 0 0 13px; overflow: hidden; }
  .ps-header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .ps-title { font-family: var(--font-heading); font-weight: 700; font-size: 19px; color: var(--midnight-violet); margin: 0; }
  .ps-keep-all { background: none; border: none; padding: 0; font-family: var(--font-body); font-weight: 700; font-size: 14px; color: #8A4A6E; cursor: pointer; flex-shrink: 0; min-height: 44px; }
  .ps-keep-all:hover { color: var(--midnight-violet); }
  .ps-helper { font-family: var(--font-body); font-size: 14px; line-height: 1.5; color: #7D6A74; margin: 4px 0 6px; }
  .ps-row { border-top: 1px solid #E7D4E1; padding: 13px 0 12px; }
  .ps-row:first-of-type { border-top: none; }
  .ps-name { font-family: var(--font-body); font-weight: 700; font-size: 17px; color: var(--ink); margin: 0 0 2px; }
  .ps-sentence { font-family: var(--font-body); font-size: 15px; line-height: 1.45; color: #7D6A74; margin: 0 0 10px; }
  .ps-actions { display: flex; gap: 8px; }
  .ps-btn { flex: 1; min-height: 44px; border-radius: 12px; font-family: var(--font-body); font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; text-align: center; }
  .ps-btn:disabled { opacity: 0.6; cursor: default; }
  .ps-btn-buy { background: var(--midnight-violet); border: none; color: #fff; }
  .ps-btn-buy:hover { background: #7C3D5E; }
  .ps-btn-drop { background: transparent; border: 1.5px solid #C9B3C1; color: var(--midnight-violet); }
  .ps-btn-drop:hover { background: #ECDBE6; }
  .ps-more { display: block; background: none; border: none; padding: 6px 0 2px; font-family: var(--font-body); font-weight: 700; font-size: 14px; color: #8A4A6E; cursor: pointer; text-align: left; min-height: 32px; }
  .ps-more:hover { color: var(--midnight-violet); }

  /* Desktop shape: one-line header, and each row goes name/sentence/pill-buttons
     in a single flex row instead of phone's stacked layout. */
  @keyframes psPopIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  #dg-pre-shop .ps-card { border-radius: 20px; padding: 18px 22px 10px; margin: 0 0 20px; animation: psPopIn .2s ease; }
  #dg-pre-shop .ps-header { align-items: center; }
  #dg-pre-shop .ps-helper { flex: 1; margin: 0; color: #9C8B93; }
  #dg-pre-shop .ps-row { display: flex; align-items: center; min-height: 58px; gap: 16px; padding: 0; }
  #dg-pre-shop .ps-name { min-width: 130px; flex-shrink: 0; margin: 0; }
  #dg-pre-shop .ps-sentence { flex: 1; font-size: 16px; margin: 0; }
  #dg-pre-shop .ps-actions { flex-shrink: 0; }
  #dg-pre-shop .ps-btn { flex: none; min-height: 40px; border-radius: 20px; padding: 10px 17px; }

  .all-done-state { padding: 12px 0; }
  .all-done-state .pill { display: inline-block; margin-bottom: 8px; background: #6FB84C; color: #fff; font-weight: 700; font-size: 13px; padding: 5px 12px; border-radius: 999px; }
  .all-done-state p { margin: 0; color: var(--text-muted); font-size: 0.95rem; }
  .empty { color: var(--text-muted); font-size: 0.95rem; padding: 12px 0; }
  .error { color: var(--electric-coral); font-size: 0.9rem; padding: 12px 0; }

  /* ---------- Screen 2: Plan your stops ---------- */
  .plan-header { padding: 22px 20px 4px; }
  .plan-title { font-family: var(--font-heading); font-weight: 700; font-size: 23px; color: var(--midnight-violet); margin: 0; }
  .plan-sub { font-family: var(--font-body); font-size: 13px; color: var(--ink-muted); margin: 4px 0 0; }

  .to-sort-card { background: #fff; border-radius: 20px; padding: 2px 16px; box-shadow: 0 8px 20px -16px rgba(58,31,46,.55); }
  .to-sort-row { padding-top: 14px; border-bottom: 1px solid rgba(58,31,46,.07); }
  .to-sort-row:last-child { border-bottom: none; }
  .to-sort-row-head { display: flex; align-items: baseline; gap: 8px; cursor: pointer; padding-bottom: 14px; }
  .to-sort-name { font-family: var(--font-heading); font-weight: 700; font-size: 17px; color: var(--ink); }
  .to-sort-qty { font-family: var(--font-body); font-size: 13px; color: var(--ink-muted); flex: 1; }
  .to-sort-caret { font-family: var(--font-body); font-weight: 700; font-size: 16px; color: var(--violet-light); }
  .store-pills { display: none; flex-wrap: wrap; gap: 8px; padding: 12px 0 14px; }
  .store-pills.open { display: flex; }
  .store-pill { border: 1.5px solid rgba(176,97,154,.5); color: var(--midnight-violet); background: transparent; border-radius: 999px; padding: 10px 16px; font-family: var(--font-body); font-weight: 700; font-size: 14px; cursor: pointer; }
  .store-pill.selected { background: var(--midnight-violet); color: var(--oat-cream); border-color: var(--midnight-violet); }
  .to-sort-footer { font-family: var(--font-body); font-weight: 700; font-size: 13px; color: var(--ink-muted); padding: 12px 0; text-align: center; cursor: pointer; }

  .bucket-card { background: #fff; border-radius: 20px; box-shadow: 0 8px 20px -16px rgba(58,31,46,.55); margin-bottom: 11px; overflow: hidden; }
  .bucket-header { display: flex; align-items: center; gap: 12px; padding: 16px; background: rgba(176,97,154,.1); cursor: pointer; }
  .bucket-avatar { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--font-heading); font-weight: 700; font-size: 14px; flex-shrink: 0; }
  .bucket-name { font-family: var(--font-heading); font-weight: 700; font-size: 17px; color: var(--ink); flex: 1; }
  .bucket-chevron { color: var(--violet-light); font-weight: 700; transition: transform 0.15s ease; }
  .bucket-chevron.expanded { transform: rotate(90deg); }
  .bucket-collapsed-count { color: var(--ink-faint); font-size: 12px; }
  .bucket-body { display: none; }
  .bucket-body.open { display: block; }
  .bucket-aisle-row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 16px; border-bottom: 1px solid rgba(58,31,46,.06); }
  .bucket-aisle-row:last-child { border-bottom: none; }
  .bucket-item-name { font-family: var(--font-body); font-weight: 600; font-size: 16px; color: var(--ink); flex: 1; }
  .bucket-item-qty { font-family: var(--font-body); font-size: 13px; color: var(--ink-muted); }
  .bucket-move { background: none; border: none; font-family: var(--font-body); font-weight: 700; font-size: 12px; color: var(--violet-light); cursor: pointer; padding: 6px 4px; min-height: 32px; }
  /* Flags a store assignment that was auto-applied from a remembered
     item->store preference (see set_grocery_item_store/get_item_store_preferences)
     rather than picked fresh this week — "not this time" clears just this
     row without forgetting the preference for future weeks. */
  .usually-tag { font-family: var(--font-body); font-weight: 700; font-size: 11px; color: var(--leaf-dark); background: rgba(111,184,76,.16); border-radius: 999px; padding: 3px 8px; white-space: nowrap; }
  .shop-this-store-btn { display: block; width: calc(100% - 32px); margin: 12px 16px 16px; background: var(--midnight-violet); color: var(--oat-cream); border: none; border-radius: 999px; padding: 13px; font-weight: 700; font-size: 15px; cursor: pointer; }

  /* ---------- Screen 3: Shopping a store ---------- */
  .shop-header { background: var(--violet-light); color: #fff; padding: 22px 20px; display: flex; align-items: center; gap: 16px; margin: -1px -1px 0; }
  .shop-wheel { width: 60px; height: 60px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: conic-gradient(var(--turmeric-gold) 0 var(--pct, 0%), rgba(255,255,255,.3) var(--pct, 0%) 100%); }
  .shop-wheel-inner { width: 46px; height: 46px; border-radius: 50%; background: var(--violet-light); display: flex; align-items: center; justify-content: center; font-family: var(--font-heading); font-weight: 700; font-size: 15px; }
  .shop-header-text .eyebrow { color: rgba(255,255,255,.8); opacity: 0.8; margin-bottom: 4px; }
  .shop-store-name { font-family: var(--font-heading); font-weight: 700; font-size: 26px; margin: 0; }
  .shop-back { background: none; border: none; color: #fff; opacity: 0.85; font-size: 0.8rem; font-weight: 700; cursor: pointer; padding: 0; margin-top: 6px; }

  .shop-aisle-card { background: #fff; border-radius: 20px; box-shadow: 0 8px 20px -16px rgba(58,31,46,.55); margin: 12px 0; overflow: hidden; }
  .shop-aisle-header { display: flex; align-items: center; gap: 10px; padding: 13px 16px; background: rgba(246,239,225,.75); }
  .shop-aisle-header .aisle-spine { width: 9px; height: 22px; }
  .shop-aisle-header .aisle-name { font-family: var(--font-heading); font-weight: 700; font-size: 16px; color: var(--ink); }

  .done-here-row { background: rgba(111,184,76,.14); border-radius: 20px; padding: 15px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; margin-top: 14px; }
  .done-here-row .done-chip { background: #6FB84C; }
  .done-here-row .done-label { color: var(--ink); }
  .done-here-row .caret { color: #4D8A33; font-weight: 700; }

  /* ---------- Screen 4: Review ---------- */
  .review-title { font-family: var(--font-heading); font-weight: 700; font-size: 23px; color: var(--midnight-violet); margin: 0; }
  .review-sub { font-family: var(--font-body); font-size: 13px; color: var(--ink-muted); margin: 4px 0 16px; }
  .flag-card { background: #fff; border-radius: 20px; padding: 16px; box-shadow: 0 8px 20px -16px rgba(58,31,46,.55); margin-bottom: 12px; cursor: pointer; }
  .flag-card-top { display: flex; align-items: center; gap: 12px; }
  .flag-badge { width: 28px; height: 28px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .flag-title { font-family: var(--font-body); font-weight: 700; font-size: 15px; color: var(--ink); flex: 1; }
  .flag-caret { color: var(--ink-faint); font-weight: 700; }
  .flag-detail { font-family: var(--font-body); font-size: 13px; color: var(--ink-muted); margin-top: 8px; padding-left: 39px; display: none; }
  .flag-detail.open { display: block; }
  .flag-fix-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; flex-wrap: wrap; }
  .flag-fix-row input { padding: 7px 9px; border-radius: 8px; border: 1px solid var(--oat-cream-dark); font-size: 0.8rem; min-height: 34px; }
  .flag-fix-row button { border: none; border-radius: 8px; padding: 7px 10px; font-weight: 700; font-size: 0.76rem; cursor: pointer; background: var(--midnight-violet); color: #fff; min-height: 34px; }
  .flag-fix-row button.secondary { background: var(--violet-soft); color: var(--midnight-violet); }

  .summary-card { background: #fff; border-radius: 20px; padding: 4px 16px; box-shadow: 0 8px 20px -16px rgba(58,31,46,.55); margin-bottom: 14px; }
  .summary-card .eyebrow { padding-top: 12px; }
  .summary-row { display: flex; align-items: center; justify-content: space-between; min-height: 40px; border-top: 1px solid rgba(58,31,46,.06); }
  .summary-row:first-of-type { border-top: none; }
  .summary-row .aisle { font-family: var(--font-body); font-weight: 600; font-size: 16px; color: var(--ink); }
  .summary-row .count { font-family: var(--font-body); font-size: 14px; color: var(--ink-muted); }

  .confirm-btn { display: block; width: 100%; background: var(--midnight-violet); color: var(--oat-cream); border: none; border-radius: 999px; padding: 17px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 6px; }
  .confirm-btn:disabled { opacity: 0.6; cursor: default; }
  .all-clear-note { font-family: var(--font-body); color: var(--leaf-dark); background: rgba(111,184,76,.14); border-radius: 16px; padding: 12px 16px; font-size: 0.88rem; margin-bottom: 14px; }
  .plan-stops-cta {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--midnight-violet); color: #fff; border-radius: 16px;
    padding: 14px 18px; margin-bottom: 14px; cursor: pointer;
    font-family: var(--font-body); font-weight: 700; font-size: 0.92rem;
  }
  .plan-stops-cta-arrow { font-size: 1.3rem; flex-shrink: 0; }

  /* ===========================================================
     Desktop Grocery (option 5f) — 3-column layout, ≥1024px only.
     Phone screens above stay completely untouched; this is an
     additive layout swapped in/out purely by JS (applyGroceryLayoutMode),
     not a CSS breakpoint, because it only replaces the "To buy" screen —
     Plan/Shop/Review stay as the existing phone-style overlays even on
     a wide viewport (Shopping mode is Phase 3 scope). See README.md
     "Grocery — desktop" for the write-up and deviations.
     =========================================================== */
  #desktop-grocery { display: none; max-width: 1180px; margin: 0 auto; grid-template-columns: 220px 1fr 280px; min-height: 100vh; }
  .dg-rail { padding: 28px 16px; border-right: 1px solid rgba(0,0,0,.08); }
  .dg-rail-title { font-family: var(--font-display); font-weight: 700; color: var(--midnight-violet); font-size: 1.3rem; margin: 0 0 18px; }
  .dg-rail-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; cursor: pointer; font-family: var(--font-body); font-size: 0.94rem; color: var(--ink); }
  .dg-rail-row:hover { background: rgba(0,0,0,.04); }
  .dg-rail-row.active { background: var(--midnight-violet); color: var(--oat-cream); }
  .dg-rail-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dg-rail-name { flex: 1; }
  .dg-rail-count { font-size: 0.8rem; opacity: 0.75; }
  .dg-rail-toggle { display: flex; align-items: center; gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(0,0,0,.08); font-family: var(--font-body); font-size: 0.85rem; color: var(--ink-muted); cursor: pointer; }
  .dg-rail-note { font-family: var(--font-body); font-size: 0.78rem; color: var(--ink-muted); margin-top: 14px; line-height: 1.4; }

  .dg-center { padding: 28px 28px 60px; overflow-y: auto; }
  .dg-center-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
  .dg-title { font-family: var(--font-display); font-weight: 700; color: var(--midnight-violet); font-size: 1.6rem; margin: 0; }
  .dg-sub { font-family: var(--font-body); color: var(--ink-muted); margin: 4px 0 0; font-size: 0.92rem; }
  .dg-people { display: flex; gap: 6px; }
  .dg-person { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 0.82rem; cursor: pointer; border: 2px solid transparent; font-family: var(--font-body); }
  .dg-person.active { border-color: var(--midnight-violet); }
  .dg-add-row { display: flex; gap: 8px; margin: 16px 0 22px; }
  .dg-add-row input { font-family: var(--font-body); border: 1px solid rgba(0,0,0,.15); border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; }
  .dg-add-row input#dg-add-item { flex: 1; }
  .dg-add-row input#dg-add-qty { width: 90px; }
  .dg-add-row button { background: var(--midnight-violet); color: var(--oat-cream); border: none; border-radius: 10px; padding: 10px 18px; font-weight: 700; cursor: pointer; font-family: var(--font-body); }

  .dg-unassigned { background: rgba(240,180,41,.14); border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; }
  .dg-unassigned-title { font-family: var(--font-body); font-weight: 700; color: var(--ink); font-size: 0.88rem; margin: 0 0 10px; }
  .dg-unassigned-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; flex-wrap: wrap; }
  .dg-unassigned-name { font-family: var(--font-body); font-size: 0.9rem; flex: 1; min-width: 90px; }
  .dg-store-pill { font-family: var(--font-body); font-size: 0.78rem; background: #fff; border: 1px solid rgba(0,0,0,.15); border-radius: 999px; padding: 5px 12px; cursor: pointer; }

  .dg-store-card { background: var(--oat-cream); border: 1px solid rgba(0,0,0,.08); border-radius: 16px; padding: 18px 20px; margin-bottom: 18px; }
  .dg-store-card-title { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; color: var(--midnight-violet); font-size: 1.05rem; margin: 0 0 10px; }
  .dg-aisle-label { font-family: var(--font-body); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted); margin: 14px 0 6px; }
  .dg-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(0,0,0,.06); }
  .dg-row.dg-row-got .dg-row-name { text-decoration: line-through; color: var(--ink-muted); }
  .dg-row-name { font-family: var(--font-body); font-size: 0.92rem; flex: 1; }
  .dg-row-qty { font-family: var(--font-body); font-size: 0.8rem; color: var(--ink-muted); }
  .dg-row-avatar { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.68rem; font-weight: 700; flex: none; }
  .dg-row-ah { background: none; border: none; color: var(--midnight-violet); font-family: var(--font-body); font-size: 0.78rem; text-decoration: underline; cursor: pointer; padding: 0; }
  .dg-row-got-btn { font-family: var(--font-body); font-size: 0.78rem; font-weight: 700; border: 1px solid var(--vivid-leaf); color: var(--leaf-dark); background: rgba(111,184,76,.14); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .dg-empty-state { text-align: center; padding: 60px 20px; font-family: var(--font-body); color: var(--ink-muted); }

  .dg-trip { border-left: 1px solid rgba(0,0,0,.08); padding: 28px 20px; }
  .dg-trip-title { font-family: var(--font-display); font-weight: 700; color: var(--midnight-violet); font-size: 1.05rem; margin: 0 0 4px; }
  .dg-trip-sub { font-family: var(--font-body); color: var(--ink-muted); font-size: 0.82rem; margin: 0 0 16px; }
  .dg-trip-aisle-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-family: var(--font-body); font-size: 0.86rem; color: var(--ink); }
  .dg-trip-aisle-row.zero { color: var(--ink-muted); opacity: 0.6; }
  .dg-trip-meals { font-family: var(--font-body); font-size: 0.82rem; color: var(--ink-muted); margin-top: 14px; line-height: 1.5; }
  .dg-trip-note { font-family: var(--font-body); font-size: 0.78rem; color: var(--ink-muted); margin-top: 18px; line-height: 1.4; font-style: italic; }
  .dg-trip-cta { display: block; width: 100%; background: var(--electric-coral); color: #fff; border: none; border-radius: 999px; padding: 13px; font-weight: 700; font-size: 0.92rem; cursor: pointer; margin-top: 18px; }
  .dg-trip-empty { font-family: var(--font-body); color: var(--ink-muted); font-size: 0.88rem; line-height: 1.5; }

  body.dg-active { max-width: none; background: var(--page, #EFE6D6); }
  body.dg-active #app-shell { max-width: 1180px; margin: 0 auto; background: transparent; }
  body.dg-active #desktop-grocery { display: grid; }
  body.dg-active #screen-buy, body.dg-active .mic-btn, body.dg-active #pre-shop-block { display: none !important; }

  /* ===========================================================
     Desktop Shopping mode (option 5g) — full-screen plum, ≥1024px
     only, entered from the desktop Grocery trip panel's "Start
     shopping {Store}". Phone's existing in-store screen (predates
     this package — design 13a) is untouched at narrow widths.
     =========================================================== */
  #desktop-shopping { display: none; min-height: 100vh; background: var(--midnight-violet); color: #fff; }
  body.ds-active #app-shell { max-width: none; margin: 0; background: transparent; }
  body.ds-active #screen-shop, body.ds-active .mic-btn { display: none !important; }
  body.ds-active #desktop-shopping { display: block; }
  body.ds-active { background: var(--midnight-violet); }
  .ds-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 30px 40px 18px; max-width: 1180px; margin: 0 auto; }
  .ds-kicker { font-family: var(--font-body); font-weight: 800; font-size: 0.76rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--turmeric-gold); margin: 0 0 6px; }
  .ds-heading { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; color: #fff; margin: 0; }
  .ds-counter { font-family: var(--font-display); font-weight: 700; font-size: 1.75rem; color: #fff; }
  .ds-counter .ds-counter-total { color: rgba(255,255,255,.5); font-size: 1.25rem; }
  .ds-right { display: flex; align-items: center; gap: 18px; }
  .ds-done-btn { background: transparent; border: 1.5px solid rgba(255,255,255,.4); color: #fff; border-radius: 999px; padding: 13px 22px; font-weight: 700; font-size: 0.9rem; cursor: pointer; font-family: var(--font-body); height: 50px; }
  .ds-body { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1180px; margin: 0 auto; padding: 10px 40px 40px; }
  .ds-aisle-card { background: var(--oat-cream); border-radius: 22px; padding: 20px 26px 12px; }
  .ds-aisle-header { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #E2D7C4; padding-bottom: 10px; margin-bottom: 4px; }
  .ds-aisle-name { font-family: var(--font-body); font-weight: 800; font-size: 0.76rem; letter-spacing: 0.08em; text-transform: uppercase; color: #A8825C; }
  .ds-aisle-left { margin-left: auto; font-family: var(--font-body); font-weight: 700; font-size: 0.82rem; color: #8A7A82; }
  .ds-row { display: flex; align-items: center; gap: 16px; padding: 18px 0; border-bottom: 1px solid #F1E8DA; cursor: pointer; }
  .ds-row:last-child { border-bottom: none; }
  .ds-row-box { width: 34px; height: 34px; border-radius: 10px; border: 2.5px solid #C4B09C; flex: none; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
  .ds-row.got .ds-row-box { background: var(--vivid-leaf); border-color: var(--vivid-leaf); }
  .ds-row-name { font-family: var(--font-body); font-weight: 600; font-size: 1.35rem; color: var(--ink); flex: 1; }
  .ds-row.got .ds-row-name { color: #8A7A82; text-decoration: line-through; opacity: 0.5; }
  .ds-row-qty { font-family: var(--font-body); font-size: 1rem; color: #8A7A82; }
  .ds-row.got .ds-row-qty { opacity: 0.5; }
  .ds-empty { text-align: center; color: rgba(255,255,255,.7); font-family: var(--font-body); padding: 60px 20px; grid-column: 1 / -1; }
  .ds-footer { max-width: 1180px; margin: 0 auto; padding: 0 40px 40px; }
  .ds-progress-track { height: 8px; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; margin-bottom: 14px; }
  .ds-progress-fill { height: 100%; background: var(--vivid-leaf); border-radius: 999px; }
  .ds-footer-row { display: flex; align-items: center; justify-content: space-between; }
  .ds-footer-note { font-family: var(--font-body); font-size: 0.92rem; color: rgba(255,255,255,.8); }
  .ds-next-btn { background: var(--turmeric-gold); color: #3A2A0A; border: none; border-radius: 13px; padding: 15px 26px; font-weight: 700; font-size: 0.95rem; cursor: pointer; font-family: var(--font-body); }
</style>
</head>
<body>

<div id="app-shell">
  <div style="padding: 12px 20px 0;">
    <a class="back-link" href="/">&larr; Back to chat</a>
  </div>

  <div id="screen-buy">
    <div class="gl-header">
      <div class="gl-header-top">
        <div class="gl-wheel" id="gl-wheel">
          <div class="gl-wheel-inner">
            <span class="gl-wheel-pct" id="gl-wheel-pct">0%</span>
            <span class="gl-wheel-frac" id="gl-wheel-frac">0/0</span>
          </div>
        </div>
        <div class="gl-title-block">
          <h1 class="gl-title">Grocery List</h1>
          <p class="gl-sub" id="gl-sub">Loading…</p>
        </div>
        <button type="button" class="gl-refresh" id="refresh-btn" title="Reload the latest list" aria-label="Reload the latest list">&#8635;</button>
      </div>
      <div class="gl-tabs">
        <button type="button" class="gl-tab active" id="tab-buy" data-screen="buy" role="tab" aria-selected="true">To buy</button>
        <button type="button" class="gl-tab" id="tab-plan" data-screen="plan" role="tab" aria-selected="false">Plan stops</button>
        <button type="button" class="gl-tab" id="tab-review" data-screen="review" role="tab" aria-selected="false">Review</button>
      </div>
    </div>

    <div class="gl-content content-pad">
      <div id="pre-shop-block"></div>
      <div id="voice-status" class="voice-status"></div>
      <div id="buy-content"><p class="empty">Loading…</p></div>
      <div class="add-card">
        <div class="add-card-title"><span class="add-chip">+</span><span>Add an item</span></div>
        <div class="add-row">
          <input type="text" id="add-item" placeholder="Item, e.g. ground beef" aria-label="Item to add to the list" />
          <button type="button" class="dictate-btn" id="add-item-mic-btn" aria-label="Dictate item" title="Dictate item">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.07A7 7 0 0 0 19 11z"/></svg>
          </button>
          <input type="text" class="add-qty-input" id="add-qty" placeholder="Qty" aria-label="Quantity" />
          <button class="add-btn" id="add-btn">Add</button>
        </div>
      </div>
    </div>
  </div>

  <div id="desktop-grocery">
    <div class="dg-rail" id="dg-rail"></div>
    <div class="dg-center">
      <div class="dg-center-header">
        <div>
          <h1 class="dg-title">Grocery List</h1>
          <p class="dg-sub" id="dg-sub">Loading…</p>
        </div>
        <div class="dg-people" id="dg-people"></div>
      </div>
      <div class="dg-add-row">
        <input type="text" id="dg-add-item" placeholder="Add an item…" aria-label="Item to add to the list" />
        <button type="button" class="dictate-btn" id="dg-add-item-mic-btn" aria-label="Dictate item" title="Dictate item">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.07A7 7 0 0 0 19 11z"/></svg>
        </button>
        <input type="text" id="dg-add-qty" placeholder="Qty" aria-label="Quantity" />
        <button id="dg-add-btn">Add</button>
      </div>
      <div id="dg-unassigned"></div>
      <div id="dg-pre-shop"></div>
      <div id="dg-store-list"></div>
    </div>
    <div class="dg-trip" id="dg-trip"></div>
  </div>

  <div id="desktop-shopping">
    <div class="ds-header">
      <div>
        <p class="ds-kicker" id="ds-kicker">Shopping</p>
        <h1 class="ds-heading" id="ds-heading">Loading…</h1>
      </div>
      <div class="ds-right">
        <div class="ds-counter" id="ds-counter">0<span class="ds-counter-total">/0</span></div>
        <button class="ds-done-btn" id="ds-done-btn">Done shopping</button>
      </div>
    </div>
    <div class="ds-body" id="ds-body"></div>
    <div class="ds-footer">
      <div class="ds-progress-track"><div class="ds-progress-fill" id="ds-progress-fill" style="width:0%"></div></div>
      <div class="ds-footer-row">
        <span class="ds-footer-note" id="ds-footer-note"></span>
        <button class="ds-next-btn" id="ds-next-btn">Next store</button>
      </div>
    </div>
  </div>

  <div id="screen-plan" style="display:none">
    <div class="plan-header">
      <h1 class="plan-title">Plan your stops</h1>
      <p class="plan-sub">Tap an item to send it to a store</p>
    </div>
    <div class="gl-content content-pad">
      <div id="plan-content"><p class="empty">Loading…</p></div>
    </div>
  </div>

  <div id="screen-shop" style="display:none">
    <div class="shop-header">
      <div class="shop-wheel" id="shop-wheel">
        <div class="shop-wheel-inner" id="shop-wheel-frac">0/0</div>
      </div>
      <div class="shop-header-text">
        <p class="eyebrow" id="shop-stop-label" style="margin:0">Stop 1 of 1</p>
        <h1 class="shop-store-name" id="shop-store-name">Store</h1>
        <button class="shop-back" id="shop-back-btn">&larr; Back to Plan your stops</button>
      </div>
    </div>
    <div class="gl-content content-pad">
      <div id="shop-content"><p class="empty">Loading…</p></div>
    </div>
  </div>

  <div id="screen-review" style="display:none">
    <div class="plan-header">
      <h1 class="review-title">Everything look right?</h1>
      <p class="review-sub" id="review-sub">Confirm before you shop</p>
    </div>
    <div class="gl-content content-pad">
      <div id="review-content"><p class="empty">Loading…</p></div>
      <div class="add-card">
        <div class="add-card-title"><span class="add-chip">+</span><span>Add anything missing</span></div>
        <div class="add-row">
          <input type="text" id="review-add-item" placeholder="Item, e.g. ground beef" aria-label="Item to add to the list" />
          <button type="button" class="dictate-btn" id="review-add-item-mic-btn" aria-label="Dictate item" title="Dictate item">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.07A7 7 0 0 0 19 11z"/></svg>
          </button>
          <button class="add-btn" id="review-add-btn">Add</button>
        </div>
      </div>
      <button class="confirm-btn" id="confirm-btn">Confirm list</button>
    </div>
  </div>

  <button type="button" class="mic-btn" id="voice-toggle-btn" title="Hands-free: check off, add, or ask about items by voice" aria-label="Hands-free voice mode">&#127908;</button>
</div>

<script src="/static/voice-session.js"></script>
<script src="/static/dictation.js"></script>
<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

const CATEGORIES = ['produce', 'dairy', 'meat/seafood', 'pantry', 'frozen', 'other'];
const CATEGORY_LABELS = { produce: 'Produce', dairy: 'Dairy', 'meat/seafood': 'Meat/seafood', pantry: 'Pantry', frozen: 'Frozen', other: 'Other' };
const AISLE_COLORS = { produce: '#6FB84C', dairy: '#F0B429', 'meat/seafood': '#E8562A', pantry: '#B0619A', frozen: '#E8562A', other: '#A3939B' };
function aisleColor(section) { return AISLE_COLORS[section] || '#A3939B'; }
function categoryOptions(current) {
  return CATEGORIES.map(c => `<option value="${c}" ${c === current ? 'selected' : ''}>${CATEGORY_LABELS[c]}</option>`).join('');
}
const STORE_PALETTE = ['#66304E', '#B0619A', '#F0B429', '#6FB84C', '#E8562A', '#8A7A83'];
function storeColor(name) {
  if (!name || name === 'Unassigned') return '#B0619A';
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return STORE_PALETTE[h % STORE_PALETTE.length];
}
function storeLabel(name) { return (!name || name === 'Unassigned') ? 'Any store' : name; }
function storeInitial(name) { return (!name || name === 'Unassigned') ? '?' : (name.trim()[0] || '?').toUpperCase(); }

let currentScreen = 'buy'; // buy | plan | shop | review
let shopStore = null;
let usualStores = []; // household's saved usual stores (from /api/memory) — offered as triage pills even before anything's tagged to them yet
let itemStorePrefs = {}; // item name (lowercase) -> remembered store, from /api/grocery-list/store-preferences

async function loadUsualStores() {

async function loadItemStorePrefs() {

  }
}
function isUsuallyHere(itemName, store) {
  const remembered = itemStorePrefs[(itemName || '').trim().toLowerCase()];
  return !!remembered && remembered === store;
}
let expandedStoreCards = {}; // store name -> bool (screen 1)
let planOpenId = null; // to-sort row currently open (screen 2)
let planPageSize = 5;
let bucketExpanded = {}; // store name -> bool (screen 2), only one true at a time
let doneOpen = false; // screen 1 Done section
let openFlagKey = null; // screen 4

// ---------- Data loading ----------
// Combines the by-store 'needed' view with the flat 'purchased' list (which
// carries each item's store/category too) so every screen can be built
// client-side from one fetch, per the handoff's "no new endpoints" note.
async function loadAllData() {
  const [byStoreRes, purchasedRes, inCartRes] = await Promise.all([
    fetch('/api/grocery-list/by-store?status=needed'),
    fetch('/api/grocery-list?status=purchased'),
    fetch('/api/grocery-list?status=in_cart'),
  ]);
  if (!byStoreRes.ok || !purchasedRes.ok || !inCartRes.ok) throw new Error('load failed');
  const byStore = await byStoreRes.json();
  const purchasedView = await purchasedRes.json();
  const inCartView = await inCartRes.json();

  const purchasedItems = [];
  (purchasedView.sections || []).forEach(s => s.items.forEach(it => purchasedItems.push(it)));
  const inCartItems = [];
  (inCartView.sections || []).forEach(s => s.items.forEach(it => inCartItems.push(it)));

  // storeName -> { sections: [{section, items}], purchased: [items], inCart: [items] }
  const stores = {};
  for (const s of (byStore.stores || [])) {
    stores[s.store] = { sections: s.sections, purchased: [], inCart: [] };
  }
  for (const it of purchasedItems) {
    const key = it.store || 'Unassigned';
    if (!stores[key]) stores[key] = { sections: [], purchased: [], inCart: [] };
    stores[key].purchased.push(it);
  }
  for (const it of inCartItems) {
    const key = it.store || 'Unassigned';
    if (!stores[key]) stores[key] = { sections: [], purchased: [], inCart: [] };
    stores[key].inCart.push(it);
  }
  return { stores, purchasedItems, inCartItems };
}

function neededCountForStore(storeData) {
  return (storeData.sections || []).reduce((n, s) => n + s.items.length, 0);
}

// ---------- Screen switching ----------
function setScreen(screen) {
  currentScreen = screen;
  document.getElementById('screen-buy').style.display = screen === 'buy' ? '' : 'none';
  document.getElementById('screen-plan').style.display = screen === 'plan' ? '' : 'none';
  document.getElementById('screen-shop').style.display = screen === 'shop' ? '' : 'none';
  document.getElementById('screen-review').style.display = screen === 'review' ? '' : 'none';
  document.querySelectorAll('.gl-tab').forEach(b => {
    const isActive = b.dataset.screen === screen;
    b.classList.toggle('active', isActive);
    b.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });
  applyGroceryLayoutMode();
  refreshCurrentScreen();
}
// Desktop Grocery (option 5f) replaces the "To buy" screen; desktop
// Shopping mode (option 5g, Phase 3) replaces "Shop". Plan/Review still
// use the phone-style overlays even at a wide viewport — nothing in the
// package redesigns them for desktop. Toggled purely in JS (not a CSS
// breakpoint) so it can react to both window width and which screen is
// active.
function isDesktopGroceryMode() { return window.innerWidth >= 1024 && currentScreen === 'buy'; }
function isDesktopShoppingMode() { return window.innerWidth >= 1024 && currentScreen === 'shop'; }
function applyGroceryLayoutMode() {
  document.body.classList.toggle('dg-active', isDesktopGroceryMode());
  document.body.classList.toggle('ds-active', isDesktopShoppingMode());
}
window.addEventListener('resize', () => {
  applyGroceryLayoutMode();
  if (lastGroceryData) renderDesktopGrocery(lastGroceryData);
  if (lastGroceryData) renderDesktopShopping(lastGroceryData);
});
document.getElementById('tab-buy').addEventListener('click', () => setScreen('buy'));
document.getElementById('tab-plan').addEventListener('click', () => setScreen('plan'));
document.getElementById('tab-review').addEventListener('click', () => setScreen('review'));
document.getElementById('shop-back-btn').addEventListener('click', () => setScreen('plan'));

let lastGroceryData = null;
async function refreshCurrentScreen() {
  try {
    const data = await loadAllData();
    lastGroceryData = data;
    if (currentScreen === 'buy') renderBuyScreen(data);
    else if (currentScreen === 'plan') renderPlanScreen(data);
    else if (currentScreen === 'shop') renderShopScreen(data);
    else if (currentScreen === 'review') renderReviewScreen(data);
    if (currentScreen === 'buy') renderPreShopBlock();
    if (currentScreen === 'buy') renderDesktopGrocery(data);
    if (currentScreen === 'shop') renderDesktopShopping(data);
  } catch (err) {
    const targetId = currentScreen === 'buy' ? 'buy-content' : currentScreen === 'plan' ? 'plan-content' : currentScreen === 'shop' ? 'shop-content' : 'review-content';
    const el = document.getElementById(targetId);
    if (el) el.innerHTML = '<p class="error">Couldn\'t load the grocery list right now — try refreshing.</p>';
  }
}

function renderBuyScreen(data) {
  const storeNames = Object.keys(data.stores);
  let totalNeeded = 0, totalPurchased = 0, finishedStops = 0;
  for (const name of storeNames) {
    const s = data.stores[name];
    const needed = neededCountForStore(s);
    totalNeeded += needed;
    totalPurchased += s.purchased.length;
    if (name !== 'Unassigned' && needed === 0 && s.purchased.length > 0) finishedStops++;
  }
  const totalAll = totalNeeded + totalPurchased;
  const pct = totalAll ? Math.round((totalPurchased / totalAll) * 100) : 0;
  document.getElementById('gl-wheel').style.setProperty('--pct', pct + '%');
  document.getElementById('gl-wheel-pct').textContent = pct + '%';
  document.getElementById('gl-wheel-frac').textContent = totalPurchased + '/' + totalAll;
  document.getElementById('gl-sub').textContent = `${totalNeeded} to go · ${finishedStops} stop${finishedStops === 1 ? '' : 's'} finished`;

  const content = document.getElementById('buy-content');
  const activeStores = storeNames.filter(n => neededCountForStore(data.stores[n]) > 0 || data.stores[n].purchased.length > 0);

  if (!activeStores.length) {
    content.innerHTML = `<div class="all-done-state">
      <span class="pill">You're all set!</span>
      <p>Nothing left to buy — add items below, or they'll show up automatically from meal planning.</p>
    </div>`;
    return;
  }
  if (totalNeeded === 0) {
    content.innerHTML = `<div class="all-done-state">
      <span class="pill">You're all set!</span>
      <p>Everything's checked off. Nice work.</p>
    </div>`;
  } else {
    let html = '';
    for (const name of activeStores) {
      const s = data.stores[name];
      const needed = neededCountForStore(s);
      if (needed === 0) continue; // fully-purchased stores fold into the global Done section, not shown here
      const isExpanded = expandedStoreCards[name] !== false; // default expanded
      html += `<div class="store-card" data-store="${escapeHtml(name)}">
        <div class="store-card-header" data-toggle-store="${escapeHtml(name)}">
          <div class="store-avatar" style="background:${storeColor(name)}">${storeInitial(name)}</div>
          <p class="store-name">${escapeHtml(storeLabel(name))}</p>
          <span class="badge-left">${needed} left</span>
          <span class="chevron">${isExpanded ? '▾' : '▸'}</span>
        </div>`;
      if (isExpanded) {
        for (const sec of s.sections) {
          if (!sec.items.length) continue;
          html += `<div class="aisle-subhead"><span class="aisle-spine" style="background:${aisleColor(sec.section)}"></span><span class="eyebrow aisle-name" style="margin:0">${escapeHtml(sec.section)}</span></div>`;
          for (const it of sec.items) html += buyRowHtml(it);
        }
      }
      html += `</div>`;
    }
    // Global Done section
    const allPurchased = [];
    for (const name of storeNames) data.stores[name].purchased.forEach(it => allPurchased.push(it));
    html += `<div class="done-card">
      <div class="done-card-header" id="done-toggle">
        <div class="done-chip">&check;</div>
        <span class="done-label">Done &middot; ${allPurchased.length}</span>
        <span class="chevron">${doneOpen ? '▾' : '▸'}</span>
      </div>
      <div class="done-body ${doneOpen ? 'open' : ''}" id="done-body">
        ${allPurchased.map(it => doneRowHtml(it)).join('')}
      </div>
    </div>`;
    content.innerHTML = html;
  }

  wireBuyScreenActions(content);
}

async function postJSON(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  if (!res.ok) throw new Error('request failed');
  return res.json().catch(() => ({}));
}
async function postEmpty(url) {
  const res = await fetch(url, { method: 'POST' });
  if (!res.ok) throw new Error('request failed');
  return res.json().catch(() => ({}));
}

function wireBuyScreenActions(content) {
  content.querySelectorAll('[data-toggle-store]').forEach(el => {

  content.querySelectorAll('[data-action="uncheck"]').forEach(row => {

      catch (err) { btn.disabled = false; alert("Couldn't move that to inventory — try again."); }

  content.querySelectorAll('[data-action="exclude"]').forEach(btn => {
    btn.addEventListener('click', async (e) => {

      try { await postEmpty('/api/grocery-list/' + itemId + '/exclude'); refreshCurrentScreen(); }
      catch (err) { btn.disabled = false; alert("Couldn't update that — try again."); }

  content.querySelectorAll('[data-action="remove"]').forEach(btn => {
    btn.addEventListener('click', async (e) => {

// two templates that share the same row markup, decision/undo/keep-all
// plumbing, and toast below: renderPreShopBlock (phone, #pre-shop-block)
// and renderDgPreShop (desktop, #dg-pre-shop, called from

const PS_CAP = 5;
let psExpanded = false;
let dgPsExpanded = false;

async function fetchPreShopFlags() {
  try {
    const res = await fetch('/api/grocery-list/pre-shop-flags');

function psRowHtml(f) {
  const title = f.onHandLocation ? `In the ${f.onHandLocation}` : '';
  return `<div class="ps-row" data-ps-item-id="${f.itemId}">
    <p class="ps-name">${escapeHtml(f.name)}</p>

    <div class="ps-actions">

function wirePreShopActions(root, getAuthor) {
  root.querySelectorAll('[data-ps-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const itemId = btn.getAttribute('data-ps-item-id');

        refreshCurrentScreen();
      } catch (err) {
        row.querySelectorAll('button').forEach(b => b.disabled = false);
        alert("Couldn't update that — try again.");
      }

}

async function undoPreShopDrop(itemId) {
  try { await postEmpty('/api/grocery-list/' + itemId + '/pre-shop-undo'); refreshCurrentScreen(); }
  catch (err) { alert("Couldn't undo that — try again."); }
}

async function keepAllPreShop() {
  try {
    await postEmpty('/api/grocery-list/pre-shop/keep-all');
    showPreShopToast('Kept all — nothing dropped');
    refreshCurrentScreen();
  } catch (err) { alert("Couldn't update those — try again."); }

function showPreShopToast(message, onUndo) {
  let el = document.getElementById('ps-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'ps-toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#3A1F2E;color:#FFFDF6;font-family:var(--font-body);font-size:0.88rem;font-weight:600;padding:12px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:9999;opacity:0;transition:opacity .2s ease;display:flex;align-items:center;gap:14px;white-space:nowrap;';
    document.body.appendChild(el);
  }
  el.textContent = message;
  if (onUndo) {
    const undoBtn = document.createElement('button');
    undoBtn.type = 'button';
    undoBtn.textContent = 'Undo';
    undoBtn.style.cssText = 'background:none;border:none;color:#F0B429;font-weight:700;font-family:var(--font-body);font-size:0.88rem;cursor:pointer;padding:0;';
    undoBtn.addEventListener('click', () => { el.style.opacity = '0'; onUndo(); });
    el.appendChild(undoBtn);
  }
  el.style.opacity = '1';
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(() => { el.style.opacity = '0'; }, 5000);
}

function preShopRowsHtml(flags, expanded) {
  const shown = expanded ? flags : flags.slice(0, PS_CAP);
  const remaining = flags.length - shown.length;
  return shown.map(psRowHtml).join('') +
    (remaining > 0 ? `<button type="button" class="ps-more" data-ps-more>+${remaining} more like this</button>` : '');
}
