// ======================================================================
// Desktop Grocery (option 5f) — left rail / center aisle-grouped store
// cards / right "this trip" panel. Additive: reuses the same data shape
// and the same endpoints as the phone screens (add, store, already-have,
// status). See README.md "Grocery — desktop" for judgment calls:
//   - Store is metadata keyed by name (app/schema.sql `stores` table), not
//     a real FK on grocery_items, so nothing here changes how items are
//     stored — it just reads /api/stores for habit/role/aisle_order.
//   - "Already have it" reuses the existing inventory-promoting endpoint
//     (moves the item into Kitchen inventory) rather than the simpler
//     soft-remove the raw spec text describes — a superset, not a swap.
//   - Full soft-delete/undo and the Trip entity are deferred; "Got it"
//     here is the existing purchased/needed status toggle.
// ======================================================================
const AISLE_ORDER = ["Produce", "Bakery", "Dairy", "Meat", "Frozen", "Pantry", "Household"];
const CATEGORY_TO_AISLE = { produce: "Produce", dairy: "Dairy", "meat/seafood": "Meat", frozen: "Frozen", pantry: "Pantry", other: "Household" };
function aisleForCategory(cat) { return CATEGORY_TO_AISLE[cat] || "Household"; }

let dgSelectedStore = null; // null = "Everything"
let dgShowAlreadyGot = false;
let dgPeople = [];
let dgCurrentPerson = 'user';
let dgStoresMeta = [];

async function dgLoadPeople() {
  try {
    const res = await fetch('/api/people');
    if (!res.ok) return;
    dgPeople = (await res.json()).people || [];
    if (dgPeople.length && dgCurrentPerson === 'user') dgCurrentPerson = dgPeople[0].name;
    if (lastGroceryData) renderDesktopGrocery(lastGroceryData);
  } catch (err) { /* identity switcher is a nicety, not load-bearing */ }
}
async function dgLoadStoresMeta() {
  try {
    const res = await fetch('/api/stores');
    if (res.ok) dgStoresMeta = (await res.json()).stores || [];
  } catch (err) { /* store metadata (habit/role) isn't shown yet — safe to skip */ }
}

function dgPersonColor(name) {
  const p = dgPeople.find(p => p.name === name);
  return p ? p.color : '#8A7A83';
}
function dgPersonInitial(name) {
  const p = dgPeople.find(p => p.name === name);
  if (p) return p.initial;
  return (name || '?').trim()[0].toUpperCase();
}

function renderDesktopGrocery(data) {
  if (!isDesktopGroceryMode()) return;
  const storeNames = Object.keys(data.stores).filter(n => n !== 'Unassigned');
  const unassigned = (data.stores['Unassigned'] ? data.stores['Unassigned'].sections : []).reduce((acc, s) => acc.concat(s.items), []);
  let totalNeeded = 0;
  storeNames.forEach(n => totalNeeded += neededCountForStore(data.stores[n]));
  totalNeeded += unassigned.length;

  // ---- Left rail ----
  const rail = document.getElementById('dg-rail');
  let railHtml = `<p class="dg-rail-title">Stores</p>`;
  railHtml += `<div class="dg-rail-row ${dgSelectedStore === null ? 'active' : ''}" data-dg-store="">
    <span class="dg-rail-name">Everything</span><span class="dg-rail-count">${totalNeeded}</span>
  </div>`;
  if (unassigned.length) {
    railHtml += `<div class="dg-rail-row ${dgSelectedStore === 'Unassigned' ? 'active' : ''}" data-dg-store="Unassigned">
      <span class="dg-rail-dot" style="background:${storeColor('Unassigned')}"></span>
      <span class="dg-rail-name">Unassigned</span><span class="dg-rail-count">${unassigned.length}</span>
    </div>`;
  }
  for (const name of storeNames) {
    const needed = neededCountForStore(data.stores[name]);
    if (needed === 0 && !dgShowAlreadyGot) continue;
    railHtml += `<div class="dg-rail-row ${dgSelectedStore === name ? 'active' : ''}" data-dg-store="${escapeHtml(name)}">
      <span class="dg-rail-dot" style="background:${storeColor(name)}"></span>
      <span class="dg-rail-name">${escapeHtml(name)}</span><span class="dg-rail-count">${needed}</span>
    </div>`;
  }
  railHtml += `<div class="dg-rail-toggle" id="dg-already-got-toggle">
    <input type="checkbox" id="dg-already-got-check" ${dgShowAlreadyGot ? 'checked' : ''} /> <label for="dg-already-got-check">Already got</label>
  </div>`;
  railHtml += `<p class="dg-rail-note">Shared list — anything you or your partner adds shows up here for both of you.</p>`;
  rail.innerHTML = railHtml;
  rail.querySelectorAll('[data-dg-store]').forEach(el => {
    el.addEventListener('click', () => { dgSelectedStore = el.getAttribute('data-dg-store') || null; renderDesktopGrocery(lastGroceryData); });
  });
  const agToggle = document.getElementById('dg-already-got-check');
  if (agToggle) agToggle.addEventListener('change', () => { dgShowAlreadyGot = agToggle.checked; renderDesktopGrocery(lastGroceryData); });

  // ---- Center: header sub, people switcher ----
  document.getElementById('dg-sub').textContent = `${totalNeeded} item${totalNeeded === 1 ? '' : 's'} to go`;
  const peopleWrap = document.getElementById('dg-people');
  peopleWrap.innerHTML = dgPeople.map(p => `<div class="dg-person ${dgCurrentPerson === p.name ? 'active' : ''}" style="background:${p.color}" data-dg-person="${escapeHtml(p.name)}" title="Adding as ${escapeHtml(p.name)}">${escapeHtml(p.initial)}</div>`).join('');
  peopleWrap.querySelectorAll('[data-dg-person]').forEach(el => {
    el.addEventListener('click', () => { dgCurrentPerson = el.getAttribute('data-dg-person'); renderDesktopGrocery(lastGroceryData); });
  });

  // ---- Center: unassigned triage ----
  const unassignedWrap = document.getElementById('dg-unassigned');
  if (!unassigned.length) {
    unassignedWrap.innerHTML = '';
  } else {
    unassignedWrap.innerHTML = `<p class="dg-unassigned-title">Unassigned &middot; assign to a store</p>
      ${unassigned.map(it => `<div class="dg-unassigned-row">
        <span class="dg-unassigned-name">${escapeHtml(it.item)}${it.quantity ? ' — ' + escapeHtml(it.quantity) : ''}</span>
        ${storeNames.map(n => `<button type="button" class="dg-store-pill" data-dg-assign="${it.id}" data-dg-assign-store="${escapeHtml(n)}" aria-label="Buy ${escapeHtml(it.item)} at ${escapeHtml(n)}">${escapeHtml(n)}</button>`).join('')}
      </div>`).join('')}`;
    unassignedWrap.querySelectorAll('[data-dg-assign]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try { await postJSON('/api/grocery-list/' + btn.getAttribute('data-dg-assign') + '/store', { store: btn.getAttribute('data-dg-assign-store') }); refreshCurrentScreen(); }
        catch (err) { btn.disabled = false; alert("Couldn't assign that — try again."); }
      });
    });
  }

  // ---- Center: pre-shop check ("Maybe already home", PRE_SHOP_CHECK.md) ----
  renderDgPreShop();

  // ---- Center: aisle-grouped store card(s) ----
  const listWrap = document.getElementById('dg-store-list');
  const namesToShow = dgSelectedStore === null ? storeNames : (dgSelectedStore === 'Unassigned' ? [] : [dgSelectedStore]);
  let listHtml = '';
  for (const name of namesToShow) {
    const s = data.stores[name];
    if (!s) continue; // store no longer has any needed/purchased/in-cart items at all
    const needed = neededCountForStore(s);
    if (needed === 0 && !dgShowAlreadyGot) continue;
    const items = [];
    for (const sec of s.sections) for (const it of sec.items) items.push({ ...it, __aisle: aisleForCategory(sec.section) });
    if (dgShowAlreadyGot) for (const it of s.purchased) items.push({ ...it, __aisle: aisleForCategory(it.category), __got: true });
    if (!items.length) continue;
    listHtml += `<div class="dg-store-card"><p class="dg-store-card-title"><span class="dg-rail-dot" style="background:${storeColor(name)}"></span>${escapeHtml(storeLabel(name))}</p>`;
    for (const aisle of AISLE_ORDER) {
      const inAisle = items.filter(it => it.__aisle === aisle);
      if (!inAisle.length) continue;
      listHtml += `<p class="dg-aisle-label">${aisle}</p>`;
      for (const it of inAisle) listHtml += dgRowHtml(it);
    }
    listHtml += `</div>`;
  }
  if (dgSelectedStore === 'Unassigned') {
    listHtml = '';
  }
  if (!listHtml) {
    listHtml = `<div class="dg-empty-state">${totalNeeded === 0 ? "You're all set — nothing left to buy." : 'Nothing here yet.'}</div>`;
  }
  listWrap.innerHTML = listHtml;
  wireDgRowActions(listWrap);

  // ---- Right: this trip ----
  renderDgTripPanel(data, storeNames);
}

function dgRowHtml(it) {
  const got = !!it.__got;
  return `<div class="dg-row ${got ? 'dg-row-got' : ''}" data-dg-item-id="${it.id}">
    <div class="dg-row-avatar" style="background:${dgPersonColor(it.added_by)}">${escapeHtml(dgPersonInitial(it.added_by))}</div>
    <span class="dg-row-name">${escapeHtml(it.item)}</span>
    ${it.quantity ? `<span class="dg-row-qty">${escapeHtml(it.quantity)}</span>` : ''}
    ${got
      ? `<button class="dg-row-got-btn" data-dg-action="unget" data-dg-item-id="${it.id}">Got it &check;</button>`
      : `<button class="dg-row-ah" data-dg-action="already-have" data-dg-item-id="${it.id}">Already have it</button>
         <button class="dg-row-got-btn" data-dg-action="got" data-dg-item-id="${it.id}">Got it</button>`}
  </div>`;
}
function wireDgRowActions(wrap) {
  wrap.querySelectorAll('[data-dg-action="got"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try { await postJSON('/api/grocery-list/' + btn.getAttribute('data-dg-item-id') + '/status', { status: 'purchased' }); refreshCurrentScreen(); }
      catch (err) { btn.disabled = false; alert("Couldn't update that — try again."); }
    });
  });
  wrap.querySelectorAll('[data-dg-action="unget"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try { await postJSON('/api/grocery-list/' + btn.getAttribute('data-dg-item-id') + '/status', { status: 'needed' }); refreshCurrentScreen(); }
      catch (err) { btn.disabled = false; alert("Couldn't update that — try again."); }
    });
  });
  wrap.querySelectorAll('[data-dg-action="already-have"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try { await postEmpty('/api/grocery-list/' + btn.getAttribute('data-dg-item-id') + '/already-have'); refreshCurrentScreen(); }
      catch (err) { btn.disabled = false; alert("Couldn't move that to inventory — try again."); }
    });
  });
}

function renderDgTripPanel(data, storeNames) {
  const panel = document.getElementById('dg-trip');
  if (dgSelectedStore === null || dgSelectedStore === 'Unassigned') {
    panel.innerHTML = `<p class="dg-trip-title">This trip</p>
      <p class="dg-trip-empty">Pick a store on the left to see what's in this trip and start shopping.</p>`;
    return;
  }
  const s = data.stores[dgSelectedStore];
  if (!s) { panel.innerHTML = ''; return; }
  const items = [];
  for (const sec of s.sections) for (const it of sec.items) items.push({ ...it, __aisle: aisleForCategory(sec.section) });
  const counts = {};
  AISLE_ORDER.forEach(a => counts[a] = 0);
  items.forEach(it => counts[it.__aisle] = (counts[it.__aisle] || 0) + 1);

  panel.innerHTML = `<p class="dg-trip-title">${escapeHtml(dgSelectedStore)}</p>
    <p class="dg-trip-sub">${items.length} item${items.length === 1 ? '' : 's'} on this trip</p>
    ${AISLE_ORDER.map(a => `<div class="dg-trip-aisle-row ${counts[a] ? '' : 'zero'}"><span class="dg-rail-dot" style="background:${aisleColor(Object.keys(CATEGORY_TO_AISLE).find(k => CATEGORY_TO_AISLE[k] === a) || 'other')}"></span>${a} &middot; ${counts[a]}</div>`).join('')}
    <p class="dg-trip-note">Shared with your household — anything checked off here updates for everyone.</p>
    <button class="dg-trip-cta" id="dg-trip-cta">Start shopping ${escapeHtml(dgSelectedStore)}</button>`;
  const cta = document.getElementById('dg-trip-cta');
  if (cta) cta.addEventListener('click', () => { shopStore = dgSelectedStore; setScreen('shop'); });
}

document.getElementById('dg-add-btn').addEventListener('click', async () => {
  const itemInput = document.getElementById('dg-add-item');
  const qtyInput = document.getElementById('dg-add-qty');
  const item = itemInput.value.trim();
  if (!item) return;
  try {
    await postJSON('/api/grocery-list/add', { item, quantity: qtyInput.value.trim(), category: 'other', added_by: dgCurrentPerson });
    itemInput.value = ''; qtyInput.value = '';
    refreshCurrentScreen();
  } catch (err) { alert("Couldn't add that — try again."); }
});

function showDgToast(message) {
  let el = document.getElementById('dg-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'dg-toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#3A1F2E;color:#FFFDF6;font-family:var(--font-body);font-size:0.88rem;font-weight:600;padding:12px 22px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:9999;opacity:0;transition:opacity .2s ease;';
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.style.opacity = '1';
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(() => { el.style.opacity = '0'; }, 3200);
}

// ======================================================================
// Desktop Shopping mode (option 5g, Phase 3) — full-screen plum, oversized
// rows, aisle cards, progress footer, next-store handoff. Entered only
// from the desktop Grocery trip panel's "Start shopping {Store}"; phone's
// existing in-store screen (design 13a, predates this package) is left
// completely alone. Rows reuse the same needed↔in_cart toggle the phone
// shop screen already uses; "Done shopping"/"Next store" batch-promote
// in_cart → purchased (which is what actually adds items to inventory —
// see mark_grocery_item/_add_to_inventory) and record a closed
// shopping_trips row (see README's "Grocery — desktop" Phase 3 notes for
// the reasoning: promotion already happens per item at checkoff, so trip
// close is bookkeeping, not a second promotion pass).
// ======================================================================
function dsAisleColorForName(aisleName) {
  const cat = Object.keys(CATEGORY_TO_AISLE).find(k => CATEGORY_TO_AISLE[k] === aisleName);
  return aisleColor(cat || 'other');
}

function dsStoresWithRemainingNeeded(data, excludeStore) {
  return Object.keys(data.stores).filter(n => n !== 'Unassigned' && n !== excludeStore && neededCountForStore(data.stores[n]) > 0);
}

function renderDesktopShopping(data) {
  if (!isDesktopShoppingMode()) return;
  if (!shopStore || !data.stores[shopStore]) {
    document.getElementById('ds-heading').textContent = 'Pick a store first';
    document.getElementById('ds-body').innerHTML = '<p class="ds-empty">Head back to the list and choose a store to shop.</p>';
    return;
  }
  const s = data.stores[shopStore];
  const items = [];
  for (const sec of s.sections) for (const it of sec.items) items.push({ ...it, __aisle: aisleForCategory(sec.section), __got: false });
  for (const it of s.inCart) items.push({ ...it, __aisle: aisleForCategory(it.category), __got: true });

  const neededItems = items.filter(it => !it.__got);
  const gotCount = s.inCart.length;
  const total = neededItems.length + gotCount;

  document.getElementById('ds-kicker').textContent = `Shopping · ${shopStore}`;
  const firstUnfinishedAisle = AISLE_ORDER.find(a => neededItems.some(it => it.__aisle === a));
  document.getElementById('ds-heading').textContent = firstUnfinishedAisle ? `${firstUnfinishedAisle} first` : "Everything's in the cart";
  document.getElementById('ds-counter').innerHTML = `${gotCount}<span class="ds-counter-total">/${total}</span>`;

  const body = document.getElementById('ds-body');
  let html = '';
  for (const aisle of AISLE_ORDER) {
    const inAisle = items.filter(it => it.__aisle === aisle);
    if (!inAisle.length) continue;
    const left = inAisle.filter(it => !it.__got).length;
    html += `<div class="ds-aisle-card">
      <div class="ds-aisle-header">
        <span class="dg-rail-dot" style="background:${dsAisleColorForName(aisle)}"></span>
        <span class="ds-aisle-name">${aisle} &middot; ${inAisle.length} item${inAisle.length === 1 ? '' : 's'}</span>
        <span class="ds-aisle-left">${left} left</span>
      </div>`;
    for (const it of inAisle) {
      html += `<div class="ds-row ${it.__got ? 'got' : ''}" data-ds-item-id="${it.id}" data-ds-got="${it.__got ? '1' : '0'}">
        <div class="ds-row-box">${it.__got ? '&check;' : ''}</div>
        <span class="ds-row-name">${escapeHtml(it.item)}</span>
        ${it.quantity ? `<span class="ds-row-qty">${escapeHtml(it.quantity)}</span>` : ''}
      </div>`;
    }
    html += `</div>`;
  }
  body.innerHTML = html || '<p class="ds-empty">Nothing here — head back to the list.</p>';
  body.querySelectorAll('[data-ds-item-id]').forEach(row => {
    row.addEventListener('click', async () => {
      const itemId = row.getAttribute('data-ds-item-id');
      const wasGot = row.getAttribute('data-ds-got') === '1';
      try { await postJSON('/api/grocery-list/' + itemId + '/status', { status: wasGot ? 'needed' : 'in_cart' }); refreshCurrentScreen(); }
      catch (err) { alert("Couldn't update that — try again."); }
    });
  });

  const pct = total ? Math.round((gotCount / total) * 100) : 0;
  document.getElementById('ds-progress-fill').style.width = pct + '%';

  const otherStores = dsStoresWithRemainingNeeded(data, shopStore);
  const footerNote = document.getElementById('ds-footer-note');
  const nextBtn = document.getElementById('ds-next-btn');
  if (otherStores.length) {
    const nextStore = otherStores[0];
    const nextCount = neededCountForStore(data.stores[nextStore]);
    footerNote.textContent = `${nextStore} next · ${nextCount} item${nextCount === 1 ? '' : 's'}`;
    nextBtn.textContent = 'Next store';
  } else {
    footerNote.textContent = 'Last stop of the trip';
    nextBtn.textContent = 'Back to list';
  }
}

async function dsFinishStore(store) {
  const data = lastGroceryData || await loadAllData();
  const s = data.stores[store];
  const inCartItems = s ? s.inCart : [];
  await Promise.all(inCartItems.map(it => postJSON('/api/grocery-list/' + it.id + '/status', { status: 'purchased' })));
  try { await postJSON('/api/shopping-trips/close', { store, item_count: inCartItems.length }); } catch (err) { /* bookkeeping only — never block the flow on it */ }
}

document.getElementById('ds-done-btn').addEventListener('click', async () => {
  const btn = document.getElementById('ds-done-btn');
  btn.disabled = true;
  try {
    await dsFinishStore(shopStore);
    setScreen('buy');
    showDgToast("Trip saved — I'll remember what you bought where");
  } catch (err) { btn.disabled = false; alert("Couldn't finish this stop — try again."); }
});

document.getElementById('ds-next-btn').addEventListener('click', async () => {
  const btn = document.getElementById('ds-next-btn');
  btn.disabled = true;
  try {
    const data = lastGroceryData || await loadAllData();
    const otherStores = dsStoresWithRemainingNeeded(data, shopStore);
    await dsFinishStore(shopStore);
    if (otherStores.length) {
      shopStore = otherStores[0];
      btn.disabled = false;
      refreshCurrentScreen();
    } else {
      setScreen('buy');
      showDgToast("Trip saved — I'll remember what you bought where");
    }
  } catch (err) { btn.disabled = false; alert("Couldn't finish this stop — try again."); }
});

// ======================================================================
// Screen 2 — Plan your stops
// ======================================================================
function renderPlanScreen(data) {
  const content = document.getElementById('plan-content');
  const unsorted = (data.stores['Unassigned'] ? data.stores['Unassigned'].sections : [])
    .reduce((acc, s) => acc.concat(s.items), []);
  const bucketNames = Object.keys(data.stores).filter(n => n !== 'Unassigned' && neededCountForStore(data.stores[n]) > 0);

  if (!unsorted.length && !bucketNames.length) {
    content.innerHTML = '<p class="empty">Nothing on the list yet — add items from the To buy tab.</p>';
    return;
  }

  let html = '';
  if (unsorted.length) {
    if (planOpenId == null) planOpenId = unsorted[0].id;
    const shown = unsorted.slice(0, planPageSize);
    const remaining = unsorted.length - shown.length;
    html += `<p class="eyebrow">To sort &middot; ${unsorted.length} &middot; tap to assign</p><div class="to-sort-card">`;
    for (const it of shown) {
      const isOpen = planOpenId === it.id;
      html += `<div class="to-sort-row">
        <div class="to-sort-row-head" data-toggle-sort="${it.id}">
          <span class="to-sort-name">${escapeHtml(it.item)}</span>
          <span class="to-sort-qty">${escapeHtml(it.quantity || '')}</span>
          <span class="to-sort-caret">${isOpen ? '⌄' : '›'}</span>
        </div>
        <div class="store-pills ${isOpen ? 'open' : ''}" data-pills-for="${it.id}">
          ${Array.from(new Set([...Object.keys(data.stores).filter(n => n !== 'Unassigned'), ...usualStores])).map(n => `<button type="button" class="store-pill" data-assign-store="${escapeHtml(n)}" data-item-id="${it.id}" aria-label="Buy ${escapeHtml(it.item)} at ${escapeHtml(n)}">${escapeHtml(n)}</button>`).join('')}
          <button type="button" class="store-pill" data-assign-store="" data-item-id="${it.id}" aria-label="No particular store for ${escapeHtml(it.item)}">Any</button>
        </div>
      </div>`;
    }
    html += `</div>`;
    if (remaining > 0) html += `<div class="to-sort-footer" id="to-sort-more">+${remaining} more to sort</div>`;
  }

  for (const name of bucketNames) {
    const s = data.stores[name];
    const items = s.sections.reduce((acc, sec) => acc.concat(sec.items.map(it => ({ ...it, __section: sec.section }))), []);
    const aisleCount = s.sections.filter(sec => sec.items.length).length;
    const expanded = bucketExpanded[name];
    if (expanded) {
      html += `<div class="bucket-card" data-bucket="${escapeHtml(name)}">
        <div class="bucket-header" data-toggle-bucket="${escapeHtml(name)}">
          <div class="bucket-avatar" style="background:${storeColor(name)}">${items.length}</div>
          <span class="bucket-name">${escapeHtml(name)}</span>
          <span class="bucket-chevron expanded">&rsaquo;</span>
        </div>
        <div class="bucket-body open">`;
      for (const sec of s.sections) {
        if (!sec.items.length) continue;
        html += `<div class="aisle-subhead"><span class="aisle-spine" style="background:${aisleColor(sec.section)}"></span><span class="eyebrow aisle-name" style="margin:0">${escapeHtml(sec.section)}</span><span class="aisle-count left">${sec.items.length} left</span></div>`;
        for (const it of sec.items) {
          const usually = isUsuallyHere(it.item, name);
          html += `<div class="bucket-aisle-row">
            <span class="bucket-item-name">${escapeHtml(it.item)}</span>
            ${usually ? `<span class="usually-tag" title="Auto-assigned from what you usually get here">usually here</span>` : ''}
            <span class="bucket-item-qty">${escapeHtml(it.quantity || '')}</span>
            ${usually ? `<button class="bucket-move" data-not-this-time="${it.id}">not this time</button>` : ''}
            <button class="bucket-move" data-move-item="${it.id}">move</button>
          </div>`;
        }
      }
      html += `</div>
        <button class="shop-this-store-btn" data-shop-store="${escapeHtml(name)}">Shop this store</button>
      </div>`;
    } else {
      html += `<div class="bucket-card" data-bucket="${escapeHtml(name)}">
        <div class="bucket-header" data-toggle-bucket="${escapeHtml(name)}">
          <div class="bucket-avatar" style="background:${storeColor(name)}">${items.length}</div>
          <span class="bucket-name">${escapeHtml(name)}</span>
          <span class="bucket-collapsed-count">${items.length} item${items.length === 1 ? '' : 's'} &middot; ${aisleCount} aisle${aisleCount === 1 ? '' : 's'}</span>
          <span class="bucket-chevron">&rsaquo;</span>
        </div>
      </div>`;
    }
  }

  content.innerHTML = html || '<p class="empty">Nothing left to sort — nice work.</p>';
  wirePlanScreenActions(content, data);
}

function wirePlanScreenActions(content, data) {
  content.querySelectorAll('[data-toggle-sort]').forEach(el => {
    el.addEventListener('click', () => {
      const id = parseInt(el.getAttribute('data-toggle-sort'), 10);
      planOpenId = planOpenId === id ? null : id;
      refreshCurrentScreen();
    });
  });
  content.querySelectorAll('[data-assign-store]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const itemId = btn.getAttribute('data-item-id');
      const store = btn.getAttribute('data-assign-store');
      btn.disabled = true;
      try {
        await postJSON('/api/grocery-list/' + itemId + '/store', { store });
        const fresh = await loadAllData();
        const stillUnsorted = (fresh.stores['Unassigned'] ? fresh.stores['Unassigned'].sections : [])
          .reduce((acc, s) => acc.concat(s.items), []);
        planOpenId = stillUnsorted.length ? stillUnsorted[0].id : null;
        // Auto-expand the store just assigned to, so the shopper sees where it landed.
        if (store) bucketExpanded = { [store]: true };
        renderPlanScreen(fresh);
      } catch (err) { btn.disabled = false; alert("Couldn't assign that — try again."); }
    });
  });
  const moreEl = content.querySelector('#to-sort-more');
  if (moreEl) moreEl.addEventListener('click', () => { planPageSize += 5; refreshCurrentScreen(); });

  content.querySelectorAll('[data-toggle-bucket]').forEach(el => {
    el.addEventListener('click', () => {
      const name = el.getAttribute('data-toggle-bucket');
      const wasOpen = !!bucketExpanded[name];
      bucketExpanded = {};
      if (!wasOpen) bucketExpanded[name] = true;
      refreshCurrentScreen();
    });
  });
  content.querySelectorAll('[data-move-item]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const itemId = btn.getAttribute('data-move-item');
      btn.disabled = true;
      try { await postJSON('/api/grocery-list/' + itemId + '/store', { store: '' }); refreshCurrentScreen(); }
      catch (err) { btn.disabled = false; alert("Couldn't move that — try again."); }
    });
  });
  // "not this time" on an auto-tagged ("usually here") row — sends it back
  // to unsorted for this week only. Clearing a row's store this way never
  // touches the remembered preference itself (see set_grocery_item_store),
  // so it'll still auto-tag there again next week unless explicitly
  // reassigned somewhere else via the triage pills.
  content.querySelectorAll('[data-not-this-time]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const itemId = btn.getAttribute('data-not-this-time');
      btn.disabled = true;
      try { await postJSON('/api/grocery-list/' + itemId + '/store', { store: '' }); refreshCurrentScreen(); }
      catch (err) { btn.disabled = false; alert("Couldn't update that — try again."); }
    });
  });
  content.querySelectorAll('[data-shop-store]').forEach(btn => {
    btn.addEventListener('click', () => {
      shopStore = btn.getAttribute('data-shop-store');
      setScreen('shop');
    });
  });
}

// ======================================================================
// Screen 3 — Shopping a store
// ======================================================================
function renderShopScreen(data) {
  if (!shopStore || !data.stores[shopStore]) {
    document.getElementById('shop-content').innerHTML = '<p class="empty">Pick a store from Plan your stops first.</p>';
    return;
  }
  const s = data.stores[shopStore];
  const storeNames = Object.keys(data.stores).filter(n => n !== 'Unassigned' && (neededCountForStore(data.stores[n]) > 0 || data.stores[n].inCart.length > 0 || data.stores[n].purchased.length > 0));
  const stopIndex = storeNames.indexOf(shopStore);

  const inCartCount = s.inCart.length;
  const neededCount = neededCountForStore(s);
  const doneCount = s.purchased.length + inCartCount;
  const totalForWheel = neededCount + doneCount;
  const pct = totalForWheel ? Math.round((doneCount / totalForWheel) * 100) : 0;
  document.getElementById('shop-wheel').style.setProperty('--pct', pct + '%');
  document.getElementById('shop-wheel-frac').textContent = doneCount + '/' + totalForWheel;
  document.getElementById('shop-stop-label').textContent = `Stop ${stopIndex >= 0 ? stopIndex + 1 : 1} of ${Math.max(storeNames.length, 1)}`;
  document.getElementById('shop-store-name').textContent = shopStore;

  const content = document.getElementById('shop-content');
  let html = '';
  const inCartBySection = {};
  s.inCart.forEach(it => { const cat = it.category || 'other'; (inCartBySection[cat] = inCartBySection[cat] || []).push(it); });

  const sectionsSeen = new Set();
  for (const sec of s.sections) {
    if (!sec.items.length && !(inCartBySection[sec.section] || []).length) continue;
    sectionsSeen.add(sec.section);
    const left = sec.items.length;
    html += `<div class="shop-aisle-card">
      <div class="shop-aisle-header">
        <span class="aisle-spine" style="background:${aisleColor(sec.section)}"></span>
        <span class="aisle-name">${escapeHtml(sec.section)}</span>
        <span class="aisle-count left" style="margin-left:auto">${left} left</span>
      </div>`;
    for (const it of sec.items) html += shopRowHtml(it, false);
    for (const it of (inCartBySection[sec.section] || [])) html += shopRowHtml(it, true);
    html += `</div>`;
  }
  for (const cat of Object.keys(inCartBySection)) {
    if (sectionsSeen.has(cat)) continue;
    html += `<div class="shop-aisle-card">
      <div class="shop-aisle-header">
        <span class="aisle-spine" style="background:${aisleColor(cat)}"></span>
        <span class="aisle-name">${escapeHtml(cat)}</span>
        <span class="aisle-count done" style="margin-left:auto">all ${inCartBySection[cat].length} &check;</span>
      </div>`;
    for (const it of inCartBySection[cat]) html += shopRowHtml(it, true);
    html += `</div>`;
  }
  if (!html) html = '<p class="empty">Nothing left here — head to "Done here" or back to Plan your stops.</p>';

  html += `<div class="done-here-row" id="done-here-btn">
    <div class="done-chip">&check;</div>
    <span class="done-label">Done here &middot; ${inCartCount}</span>
    <span class="caret" style="margin-left:auto">&rsaquo;</span>
  </div>`;

  content.innerHTML = html;
  wireShopScreenActions(content);
}

function shopRowHtml(it, inCart) {
  return `<div class="gl-row tall ${inCart ? 'done' : ''}" data-item-id="${it.id}" data-in-cart="${inCart ? '1' : '0'}">
    <div class="gl-box ${inCart ? 'checked' : ''}">${inCart ? '&check;' : ''}</div>
    <p class="gl-name">${escapeHtml(it.item)}</p>
    ${it.quantity ? `<span class="gl-qty-chip">${escapeHtml(it.quantity)}</span>` : ''}
  </div>`;
}

function wireShopScreenActions(content) {
  content.querySelectorAll('.gl-row[data-item-id]').forEach(row => {
    row.addEventListener('click', async () => {
      const itemId = row.getAttribute('data-item-id');
      const inCart = row.getAttribute('data-in-cart') === '1';
      try { await postJSON('/api/grocery-list/' + itemId + '/status', { status: inCart ? 'needed' : 'in_cart' }); refreshCurrentScreen(); }
      catch (err) { alert("Couldn't update that — try again."); }
    });
  });
  const doneHereBtn = content.querySelector('#done-here-btn');
  if (doneHereBtn) doneHereBtn.addEventListener('click', async () => {
    doneHereBtn.style.pointerEvents = 'none';
    try {
      const data = await loadAllData();
      const s = data.stores[shopStore];
      await Promise.all((s ? s.inCart : []).map(it => postJSON('/api/grocery-list/' + it.id + '/status', { status: 'purchased' })));
      setScreen('plan');
    } catch (err) { doneHereBtn.style.pointerEvents = ''; alert("Couldn't finish this stop — try again."); }
  });
}

// ======================================================================
// Screen 4 — Review
// ======================================================================
function renderReviewScreen(data) {
  const content = document.getElementById('review-content');
  const allNeeded = [];
  for (const name of Object.keys(data.stores)) {
    for (const sec of data.stores[name].sections) sec.items.forEach(it => allNeeded.push(it));
  }
  document.getElementById('review-sub').textContent = `${allNeeded.length} item${allNeeded.length === 1 ? '' : 's'} to review · confirm before you shop`;

  const missingQty = allNeeded.filter(it => !(it.quantity || '').trim());
  const noStore = allNeeded.filter(it => !(it.store || '').trim());
  const seen = {};
  const dupeGroups = {};
  allNeeded.forEach(it => {
    const key = it.item.trim().toLowerCase();
    (dupeGroups[key] = dupeGroups[key] || []).push(it);
  });
  const duplicates = Object.values(dupeGroups).filter(g => g.length > 1);

  let html = '';
  // Always-visible forward link to Plan stops — the "Confirm list" button
  // at the bottom of this screen returns to To buy, so without this, the
  // only way into Plan stops was noticing the separate tab up top
  // (feedback: it was too easy to miss coming from Review).
  html += `<div class="plan-stops-cta" data-goto-plan="1">
    <span class="plan-stops-cta-text">Ready to shop? Plan your stops by store next.</span>
    <span class="plan-stops-cta-arrow">&rsaquo;</span>
  </div>`;
  if (!missingQty.length && !noStore.length && !duplicates.length) {
    html += `<div class="all-clear-note">Nothing flagged — this list is ready to shop.</div>`;
  }

  if (missingQty.length) {
    const open = openFlagKey === 'qty';
    html += `<div class="flag-card" data-flag-toggle="qty">
      <div class="flag-card-top">
        <div class="flag-badge" style="background:#E8562A">!</div>
        <span class="flag-title">Missing quantity</span>
        <span class="flag-caret">&rsaquo;</span>
      </div>
      <div class="flag-detail ${open ? 'open' : ''}">
        ${missingQty.map(it => `<div class="flag-fix-row" data-fix-qty="${it.id}">
          <span>${escapeHtml(it.item)}</span>
          <input type="text" class="fix-qty-input" placeholder="Add a quantity" aria-label="Quantity for ${escapeHtml(it.item)}" />
          <button data-save-qty="${it.id}">Save</button>
        </div>`).join('')}
      </div>
    </div>`;
  }
  if (noStore.length) {
    const open = openFlagKey === 'store';
    html += `<div class="flag-card" data-flag-toggle="store">
      <div class="flag-card-top">
        <div class="flag-badge" style="background:#F0B429">!</div>
        <span class="flag-title">No store assigned</span>
        <span class="flag-caret">&rsaquo;</span>
      </div>
      <div class="flag-detail ${open ? 'open' : ''}">
        ${noStore.map(it => escapeHtml(it.item)).join(', ')}
        <div class="flag-fix-row"><button data-goto-plan="1">Assign in Plan your stops</button></div>
      </div>
    </div>`;
  }
  if (duplicates.length) {
    const open = openFlagKey === 'dupe';
    html += `<div class="flag-card" data-flag-toggle="dupe">
      <div class="flag-card-top">
        <div class="flag-badge" style="background:#B0619A">!</div>
        <span class="flag-title">Possible duplicate</span>
        <span class="flag-caret">&rsaquo;</span>
      </div>
      <div class="flag-detail ${open ? 'open' : ''}">
        ${duplicates.map(g => `<div class="flag-fix-row">
          <span>${escapeHtml(g[0].item)} appears ${g.length} times</span>
          <button class="secondary" data-merge-dupe="${g.map(it => it.id).join(',')}">Merge</button>
        </div>`).join('')}
      </div>
    </div>`;
  }

  // Aisle summary
  const bySection = {};
  allNeeded.forEach(it => { (bySection[it.category] = bySection[it.category] || []).push(it); });
  html += `<div class="summary-card"><p class="eyebrow">Summary</p>`;
  CATEGORIES.forEach(cat => {
    if (!bySection[cat] || !bySection[cat].length) return;
    html += `<div class="summary-row"><span class="aisle">${escapeHtml(CATEGORY_LABELS[cat])}</span><span class="count">${bySection[cat].length} item${bySection[cat].length === 1 ? '' : 's'}</span></div>`;
  });
  html += `</div>`;

  document.getElementById('confirm-btn').textContent = `Confirm list · ${allNeeded.length} items`;
  content.innerHTML = html;
  wireReviewScreenActions(content);
}

function wireReviewScreenActions(content) {
  content.querySelectorAll('[data-flag-toggle]').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.flag-fix-row')) return;
      const key = el.getAttribute('data-flag-toggle');
      openFlagKey = openFlagKey === key ? null : key;
      refreshCurrentScreen();
    });
  });
  content.querySelectorAll('[data-save-qty]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const itemId = btn.getAttribute('data-save-qty');
      const row = btn.closest('.flag-fix-row');
      const qty = row.querySelector('.fix-qty-input').value.trim();
      if (!qty) return;
      btn.disabled = true;
      try { await postJSON('/api/grocery-list/' + itemId + '/update', { quantity: qty }); refreshCurrentScreen(); }
      catch (err) { btn.disabled = false; alert("Couldn't save that — try again."); }
    });
  });
  content.querySelectorAll('[data-goto-plan]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); setScreen('plan'); });
  });
  content.querySelectorAll('[data-merge-dupe]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const ids = btn.getAttribute('data-merge-dupe').split(',');
      if (!confirm('Merge these into one line? The extra lines will be removed.')) return;
      btn.disabled = true;
      try {
        const [keepId, ...rest] = ids;
        await Promise.all(rest.map(id => postEmpty('/api/grocery-list/' + id + '/remove')));
        refreshCurrentScreen();
      } catch (err) { btn.disabled = false; alert("Couldn't merge those — try again."); }
    });
  });
}

// ---------- Hands-free voice (reused engine, same commands as before) ----------
let voiceSession = null;
let voiceLog = [];

function setVoiceStatus(text) {
  const el = document.getElementById('voice-status');
  if (!text) { voiceLog = []; el.classList.remove('showing'); el.innerHTML = ''; return; }
  voiceLog.unshift(text);
  voiceLog = voiceLog.slice(0, 5);
  el.classList.add('showing');
  el.innerHTML = `<span class="voice-dot"></span>Listening…` +
    `<ul class="voice-log">${voiceLog.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>` +
    `<span class="voice-note">Say "hey home manager" plus a command, or tap the mic again to stop.</span>`;
}
function updateVoiceButton() {
  const btn = document.getElementById('voice-toggle-btn');
  const isOn = !!(voiceSession && voiceSession.isActive());
  btn.classList.toggle('active', isOn);
}
function groceryVoiceFuzzyFind(text, candidates, getLabel) {
  const t = (text || '').trim().toLowerCase();
  if (!t || !candidates || !candidates.length) return null;
  for (const c of candidates) if (getLabel(c).trim().toLowerCase() === t) return c;
  for (const c of candidates) {
    const label = getLabel(c).trim().toLowerCase();
    if (label && (label.includes(t) || t.includes(label))) return c;
  }
  const words = t.split(/\s+/);
  let best = null, bestScore = 0;
  for (const c of candidates) {
    const labelWords = getLabel(c).trim().toLowerCase().split(/\s+/);
    const score = words.filter(w => labelWords.includes(w)).length;
    if (score > bestScore) { bestScore = score; best = c; }
  }
  return bestScore > 0 ? best : null;
}
function isVoiceEndCommand(command) {
  return /\b(stop|cancel|exit|goodbye|end session|that'?s all|all done)\b/i.test(command) || /^done$/i.test(command.trim());
}
async function fetchNeededItemsFlat() {
  const res = await fetch('/api/grocery-list?status=needed');
  if (!res.ok) return [];
  const view = await res.json();
  const items = [];
  (view.sections || []).forEach(s => items.push(...s.items));
  return items;
}
async function handleShopperVoiceCommand(command) {
  if (isVoiceEndCommand(command)) return { spoken: 'Ending hands-free.', endSession: true };
  if (/\b(what|which)\b/i.test(command) && /\b(store|section)\b/i.test(command)) {
    const afterKeyword = command.replace(/^.*?\b(store|section)\b\s*(?:is|does)?\s*/i, '').replace(/\bin\??$/i, '').trim();
    const items = await fetchNeededItemsFlat();
    const item = groceryVoiceFuzzyFind(afterKeyword, items, i => i.item);
    if (!item) return { spoken: "I don't see that on the list." };
    const storeText = item.store && item.store.trim() ? item.store : 'no store assigned';
    return { spoken: `${item.item} is ${item.category}, ${storeText}.` };
  }
  if (/\b(check off|got|grabbed|found|bought|picked up)\b/i.test(command)) {
    const afterKeyword = command.replace(/^.*?\b(check off|got|grabbed|found|bought|picked up)\b\s*/i, '').trim();
    const items = await fetchNeededItemsFlat();
    const item = groceryVoiceFuzzyFind(afterKeyword, items, i => i.item);
    if (!item) return { spoken: "I don't see that on the list." };
    try { await postJSON('/api/grocery-list/' + item.id + '/status', { status: 'purchased' }); } catch (err) { return null; }
    refreshCurrentScreen();
    return { spoken: `Got it, ${item.item} checked off.` };
  }
  if (/\b(add|put|need)\b/i.test(command)) {
    const name = command
      .replace(/^.*?\b(add)\b\s*/i, '')
      .replace(/\b(to the list|to my list|on the list|on my list)\b/gi, '')
      .replace(/^(put|we need|need)\s+/i, '')
      .trim();
    if (!name) return null;
    try { await postJSON('/api/grocery-list/add', { item: name, quantity: '', category: 'other' }); } catch (err) { return null; }
    refreshCurrentScreen();
    return { spoken: `Added ${name} to the list.` };
  }
  return null;
}
function startShopperVoiceSession() {
  if (voiceSession && voiceSession.isActive()) { voiceSession.stop(); return; }
  voiceSession = createVoiceSession({
    onListeningChange: (isListening) => { updateVoiceButton(); if (!isListening) setVoiceStatus(''); },
    onStatus: (text) => setVoiceStatus(text),
    onCommand: (command) => handleShopperVoiceCommand(command),
    onEnd: () => updateVoiceButton(),
  });
  if (voiceSession.isStandaloneIOS()) {
    setVoiceStatus('Heads up: hands-free voice can be unreliable in the installed home-screen app on iOS — if it doesn\'t seem to hear you, try this from a regular Safari tab instead.');
  }
  voiceSession.start();
  updateVoiceButton();
}
document.getElementById('voice-toggle-btn').addEventListener('click', startShopperVoiceSession);
