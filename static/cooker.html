<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cooker View — Home Manager</title>
<link rel="manifest" href="/static/manifest.json" />
<link rel="icon" href="/static/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<meta name="theme-color" content="#2b6cb0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Home Manager" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 24px;
    background: #f7f7f5;
    color: #222;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.subtitle { color: #666; margin-top: 0; font-size: 0.9rem; }
  p.subtitle a { color: #2b6cb0; }
  .progress-bar-wrap {
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .progress-stat { flex: 1; min-width: 140px; }
  .progress-stat .label { color: #888; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.02em; margin: 0 0 3px; }
  .progress-stat .value { font-size: 1.3rem; font-weight: 600; margin: 0; }
  .progress-track { background: #eee; border-radius: 6px; height: 6px; overflow: hidden; margin-top: 6px; }
  .progress-fill { background: #2b6cb0; height: 100%; border-radius: 6px; transition: width 0.3s ease; }
  h2.section-title { font-size: 1rem; margin: 20px 0 8px; color: #444; }
  .card {
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .card.done { opacity: 0.6; }
  .card-top { display: flex; align-items: flex-start; gap: 10px; }
  .check-toggle {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #cfe0f2;
    background: white;
    cursor: pointer;
    color: #2b6cb0;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin-top: 2px;
  }
  .check-toggle.checked { background: #2b6cb0; border-color: #2b6cb0; color: white; }
  .card-body { flex: 1; min-width: 0; }
  .meal-name { font-size: 1.05rem; font-weight: 600; margin: 0; }
  .meal-name.done { text-decoration: line-through; }
  .meal-meta { color: #888; font-size: 0.78rem; margin: 2px 0 0; text-transform: capitalize; }
  .badge {
    display: inline-block;
    background: #fff4e5;
    color: #b06a00;
    border: 1px solid #ffe0b3;
    border-radius: 12px;
    padding: 2px 9px;
    font-size: 0.72rem;
    margin-left: 6px;
  }
  .detail-toggle {
    background: none;
    border: none;
    color: #2b6cb0;
    font-size: 0.82rem;
    cursor: pointer;
    padding: 6px 0 0;
    text-align: left;
  }
  .detail { display: none; margin-top: 10px; font-size: 0.9rem; }
  .detail.open { display: block; }
  .detail h4 { margin: 10px 0 4px; font-size: 0.82rem; color: #666; text-transform: uppercase; letter-spacing: 0.02em; }
  .detail h4:first-child { margin-top: 0; }
  .detail ul, .detail ol { margin: 0; padding-left: 20px; }
  .detail li { margin-bottom: 3px; }
  .no-recipe { color: #999; font-style: italic; font-size: 0.85rem; margin-top: 8px; }
  .fill-recipe-btn {
    background: #2b6cb0;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .fill-recipe-btn:disabled { opacity: 0.6; cursor: default; }
  .prep-task { display: flex; align-items: center; gap: 10px; }
  .prep-task .desc { flex: 1; }
  .prep-task .date { color: #2b6cb0; font-weight: 600; font-size: 0.78rem; text-transform: uppercase; margin: 0 0 2px; }
  .prep-task.done .desc-text { text-decoration: line-through; color: #999; }
  .empty { color: #999; font-size: 0.9rem; font-style: italic; padding: 8px 0; }
  .error { color: #b00020; font-size: 0.9rem; }
  .attention-banner {
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 0.88rem;
    background: #eef4fb;
    border: 1px solid #cfe0f2;
    color: #1e4a75;
  }
  .attention-banner h2 { font-size: 0.9rem; margin: 0 0 8px; color: inherit; }
  .attention-item { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; }
  .attention-item .summary { flex: 1; }
  .attention-item .attn-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .attn-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.85rem;
    padding: 2px 6px;
    border-radius: 5px;
    color: #1e4a75;
  }
  .attn-btn:hover { background: #dbe8f5; }
  .attn-btn.dismiss { color: #7a5b00; }
  .attention-item.feedback-item { flex-direction: column; align-items: stretch; }
  .attention-item .feedback-row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .attention-item .feedback-row .fb-btn {
    background: white;
    border: 1px solid #cfe0f2;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 0.85rem;
    color: #1e4a75;
    cursor: pointer;
  }
  .attention-item .feedback-row .fb-btn:hover { background: #dbe8f5; }
  .attention-item .feedback-row .fb-btn:disabled { opacity: 0.6; cursor: default; }
  .attention-item .feedback-row .fb-notes {
    flex: 1;
    min-width: 120px;
    border: 1px solid #cfe0f2;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 0.85rem;
  }
  .attention-item.usage-item { flex-direction: column; align-items: stretch; }
  .attention-item .usage-row { display: flex; gap: 6px; margin-top: 6px; }
  .attention-item .usage-row input {
    flex: 1;
    border: 1px solid #cfe0f2;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 0.85rem;
  }
  .attention-item .usage-row button.log-btn {
    background: #2b6cb0;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 0.82rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .attention-item .usage-row button.log-btn:disabled { opacity: 0.6; cursor: default; }
  .attention-item .usage-row button.skip-btn {
    background: none;
    border: none;
    color: #7a5b00;
    font-size: 0.82rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .refresh-btn {
    background: white;
    border: 1px solid #d8d8d4;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 0.85rem;
    color: #2b6cb0;
    cursor: pointer;
    flex-shrink: 0;
  }
  .refresh-btn:hover { background: #f0f4f8; }
  .refresh-btn:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>

<div class="header-row">
  <h1>Cooker View</h1>
  <button class="refresh-btn" id="refresh-btn" title="Reload latest plan/inventory data">&#8635; Refresh</button>
</div>
<p class="subtitle" id="subtitle">This week's plan, ready to cook. <a href="/">&larr; Back to chat</a></p>

<div id="attention-banner"></div>

<div id="content">
  <p class="empty">Loading...</p>
</div>

<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
}

let cache = null;
let openDetailIdx = null;

function render(view) {
  cache = view;
  const content = document.getElementById('content');

  if (!view.weekly_plan_id) {
    content.innerHTML = '<p class="empty">No plan yet this week — generate one in chat first.</p>';
    return;
  }

  const mealsPct = view.meals_total ? Math.round(100 * view.meals_done / view.meals_total) : 0;
  const prepPct = view.prep_total ? Math.round(100 * view.prep_done / view.prep_total) : 0;

  let html = '';
  html += `<div class="progress-bar-wrap">
    <div class="progress-stat">
      <p class="label">Meals cooked</p>
      <p class="value">${view.meals_done} / ${view.meals_total}</p>
      <div class="progress-track"><div class="progress-fill" style="width:${mealsPct}%"></div></div>
    </div>
    <div class="progress-stat">
      <p class="label">Prep done</p>
      <p class="value">${view.prep_done} / ${view.prep_total}</p>
      <div class="progress-track"><div class="progress-fill" style="width:${prepPct}%"></div></div>
    </div>
  </div>`;

  if (view.prep_tasks && view.prep_tasks.length) {
    html += '<h2 class="section-title">Prep schedule</h2>';
    for (const t of view.prep_tasks) {
      const isDone = t.status === 'done';
      html += `<div class="card prep-task ${isDone ? 'done' : ''}">
        <button class="check-toggle ${isDone ? 'checked' : ''}" data-prep-id="${t.id}" data-next="${isDone ? 'pending' : 'done'}">${isDone ? '&check;' : ''}</button>
        <div class="desc">
          <p class="date">${escapeHtml(formatDate(t.task_date))}</p>
          <p class="desc-text" style="margin:0">${escapeHtml(t.description)}${t.related_meal ? ' <span style="color:#999">(' + escapeHtml(t.related_meal) + ')</span>' : ''}</p>
        </div>
      </div>`;
    }
  }

  html += '<h2 class="section-title">Meals</h2>';
  if (!view.meals.length) {
    html += '<p class="empty">No meals on this plan yet.</p>';
  }
  view.meals.forEach((m, idx) => {
    const isDone = m.cooked_status === 'done';
    const metaBits = [];
    if (m.component_category) metaBits.push(m.component_category);
    else {
      if (m.date) metaBits.push(formatDate(m.date));
      if (m.slot) metaBits.push(m.slot);
    }
    if (m.prep_time_minutes || m.cook_time_minutes) {
      const bits = [];
      if (m.prep_time_minutes) bits.push(m.prep_time_minutes + 'm prep');
      if (m.cook_time_minutes) bits.push(m.cook_time_minutes + 'm cook');
      metaBits.push(bits.join(' + '));
    }

    html += `<div class="card ${isDone ? 'done' : ''}">
      <div class="card-top">
        <button class="check-toggle ${isDone ? 'checked' : ''}" data-entry-id="${m.entry_id}" data-next="${isDone ? 'pending' : 'done'}">${isDone ? '&check;' : ''}</button>
        <div class="card-body">
          <p class="meal-name ${isDone ? 'done' : ''}">${escapeHtml(m.meal || '')}${m.advance_prep_notes ? '<span class="badge">advance prep</span>' : ''}</p>
          <p class="meal-meta">${escapeHtml(metaBits.join(' · '))}</p>`;

    if (m.has_full_recipe) {
      html += `<button class="detail-toggle" data-toggle="${idx}">Show recipe &darr;</button>
        <div class="detail" id="detail-${idx}">
          ${m.default_servings ? `<p style="margin:0;color:#888;font-size:0.82rem">Serves ${m.default_servings}</p>` : ''}
          ${m.advance_prep_notes ? `<h4>Advance prep</h4><p style="margin:0">${escapeHtml(m.advance_prep_notes)}</p>` : ''}
          <h4>Ingredients</h4>
          <ul>${(m.ingredients || []).map(i => `<li>${escapeHtml((i.qty ? i.qty + ' ' : '') + (i.item || ''))}</li>`).join('') || '<li class="empty" style="padding:0">None listed</li>'}</ul>
          <h4>Instructions</h4>
          ${m.instructions && m.instructions.length
            ? `<ol>${m.instructions.map(step => `<li>${escapeHtml(step)}</li>`).join('')}</ol>`
            : `<p class="empty" style="padding:0 0 8px">No steps saved yet.</p>
               <button class="fill-recipe-btn" data-recipe-name="${escapeHtml(m.meal || '')}">Fill in this recipe</button>`}
        </div>`;
    } else {
      html += `<p class="no-recipe">Freeform meal — no saved recipe detail. Ask in chat for the full recipe.</p>`;
    }

    html += `</div></div></div>`;
  });

  content.innerHTML = html;

  if (openDetailIdx !== null) {
    const detail = document.getElementById('detail-' + openDetailIdx);
    const toggleBtn = content.querySelector(`.detail-toggle[data-toggle="${openDetailIdx}"]`);
    if (detail) {
      detail.classList.add('open');
      if (toggleBtn) toggleBtn.textContent = 'Hide recipe ↑';
    }
  }

  content.querySelectorAll('.detail-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-toggle');
      const detail = document.getElementById('detail-' + id);
      const open = detail.classList.toggle('open');
      btn.textContent = open ? 'Hide recipe ↑' : 'Show recipe ↓';
      openDetailIdx = open ? id : null;
    });
  });

  content.querySelectorAll('.fill-recipe-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const recipeName = btn.getAttribute('data-recipe-name');
      const idx = btn.closest('.detail').id.replace('detail-', '');
      btn.disabled = true;
      btn.textContent = 'Writing recipe…';
      openDetailIdx = idx;
      try {
        const res = await fetch('/api/cooker/fill-recipe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ recipe_name: recipeName }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || 'failed');
        }
        render(await res.json());
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Fill in this recipe';
        alert("Couldn't generate that recipe right now — try again.");
      }
    });
  });

  content.querySelectorAll('.check-toggle[data-entry-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        const res = await fetch('/api/cooker/check-meal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ entry_id: parseInt(btn.getAttribute('data-entry-id')), status: btn.getAttribute('data-next') }),
        });
        if (!res.ok) throw new Error('failed');
        render(await res.json());
        refreshAttention(); // checking a meal off can queue new inventory-depletion items
      } catch (err) {
        btn.disabled = false;
        alert("Couldn't update that — try again.");
      }
    });
  });

  content.querySelectorAll('.check-toggle[data-prep-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        const res = await fetch('/api/cooker/check-prep', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prep_task_id: parseInt(btn.getAttribute('data-prep-id')), status: btn.getAttribute('data-next') }),
        });
        if (!res.ok) throw new Error('failed');
        render(await res.json());
      } catch (err) {
        btn.disabled = false;
        alert("Couldn't update that — try again.");
      }
    });
  });
}

function renderAttentionBanner(items) {
  const banner = document.getElementById('attention-banner');
  if (!items || !items.length) {
    banner.innerHTML = '';
    return;
  }
  banner.innerHTML = `
    <div class="attention-banner">
      <h2>Needs your attention</h2>
      ${items.map(it => {
        const needsAmount = it.id != null && it.detail && it.detail.needs_amount_used;
        if (needsAmount) {
          return `
            <div class="attention-item usage-item" data-item-id="${it.id}" data-mode="usage">
              <span class="summary">${escapeHtml(it.summary)}</span>
              <span class="usage-row">
                <input type="text" class="usage-input" placeholder="e.g. 1 cup, or leave blank for all of it" />
                <button class="log-btn">Log it</button>
                <button class="skip-btn" title="Skip for now">Skip</button>
              </span>
            </div>`;
        }
        if (it.kind === 'feedback_nudge') {
          const mealName = (it.detail && it.detail.meal) || '';
          return `
            <div class="attention-item feedback-item" data-mode="feedback" data-meal="${escapeHtml(mealName)}">
              <span class="summary">${escapeHtml(it.summary)}</span>
              <span class="feedback-row">
                <button class="fb-btn liked">&#128077; Liked it</button>
                <button class="fb-btn disliked">&#128078; Not a hit</button>
                <input type="text" class="fb-notes" placeholder="Notes (optional)" />
              </span>
            </div>`;
        }
        return `
          <div class="attention-item" data-item-id="${it.id == null ? '' : it.id}">
            <span class="summary">${escapeHtml(it.summary)}</span>
            ${it.id != null ? `
              <span class="attn-actions">
                <button class="attn-btn resolve" title="Mark handled">&check;</button>
                <button class="attn-btn dismiss" title="Not relevant">&times;</button>
              </span>` : ''}
          </div>`;
      }).join('')}
    </div>
  `;

  banner.querySelectorAll('.attention-item').forEach(row => {
    if (row.getAttribute('data-mode') === 'feedback') {
      const mealName = row.getAttribute('data-meal');
      const likedBtn = row.querySelector('.fb-btn.liked');
      const dislikedBtn = row.querySelector('.fb-btn.disliked');
      const notesInput = row.querySelector('.fb-notes');
      async function rate(rating) {
        likedBtn.disabled = true;
        dislikedBtn.disabled = true;
        try {
          const res = await fetch('/api/recipe-feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ recipe_name: mealName, rating, notes: notesInput.value.trim() }),
          });
          if (!res.ok) throw new Error('failed');
          refreshAttention();
        } catch (err) {
          likedBtn.disabled = false;
          dislikedBtn.disabled = false;
          alert("Couldn't save that rating — try again.");
        }
      }
      likedBtn.addEventListener('click', () => rate('liked'));
      dislikedBtn.addEventListener('click', () => rate('disliked'));
      return;
    }

    const itemId = row.getAttribute('data-item-id');
    if (!itemId) return; // the feedback-nudge entry (id=None) has no other action buttons

    if (row.getAttribute('data-mode') === 'usage') {
      const input = row.querySelector('.usage-input');
      const logBtn = row.querySelector('.log-btn');
      const skipBtn = row.querySelector('.skip-btn');
      async function logUsage() {
        logBtn.disabled = true;
        skipBtn.disabled = true;
        try {
          const res = await fetch('/api/attention/' + itemId + '/use', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount_used: input.value.trim() }),
          });
          if (!res.ok) throw new Error('failed');
          renderAttentionBanner((await res.json()).items);
        } catch (err) {
          logBtn.disabled = false;
          skipBtn.disabled = false;
          alert("Couldn't log that — try again.");
        }
      }
      logBtn.addEventListener('click', logUsage);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') logUsage(); });
      skipBtn.addEventListener('click', async () => {
        logBtn.disabled = true;
        skipBtn.disabled = true;
        try {
          const res = await fetch('/api/attention/' + itemId + '/resolve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'dismissed' }),
          });
          if (!res.ok) throw new Error('failed');
          renderAttentionBanner((await res.json()).items);
        } catch (err) {
          logBtn.disabled = false;
          skipBtn.disabled = false;
          alert("Couldn't update that — try again.");
        }
      });
      return;
    }

    const resolveBtn = row.querySelector('.attn-btn.resolve');
    const dismissBtn = row.querySelector('.attn-btn.dismiss');
    async function resolve(status) {
      resolveBtn.disabled = true;
      dismissBtn.disabled = true;
      try {
        const res = await fetch('/api/attention/' + itemId + '/resolve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status }),
        });
        if (!res.ok) throw new Error('failed');
        renderAttentionBanner((await res.json()).items);
      } catch (err) {
        resolveBtn.disabled = false;
        dismissBtn.disabled = false;
        alert("Couldn't update that — try again.");
      }
    }
    resolveBtn.addEventListener('click', () => resolve('resolved'));
    dismissBtn.addEventListener('click', () => resolve('dismissed'));
  });
}

async function refreshAttention() {
  try {
    const res = await fetch('/api/attention');
    if (res.ok) renderAttentionBanner((await res.json()).items);
  } catch (err) { /* non-critical, ignore */ }
}

async function load() {
  const content = document.getElementById('content');
  try {
    const [viewRes, attnRes] = await Promise.all([
      fetch('/api/cooker-view'),
      fetch('/api/attention'),
    ]);
    if (!viewRes.ok) throw new Error('Could not load');
    render(await viewRes.json());
    if (attnRes.ok) {
      renderAttentionBanner((await attnRes.json()).items);
    }
  } catch (err) {
    content.innerHTML = '<p class="error">Couldn\'t load the Cooker view right now — try refreshing.</p>';
  }
}

const refreshBtn = document.getElementById('refresh-btn');
refreshBtn.addEventListener('click', async () => {
  refreshBtn.disabled = true;
  const original = refreshBtn.innerHTML;
  refreshBtn.innerHTML = '&#8635; Refreshing…';
  try {
    await load();
  } finally {
    refreshBtn.disabled = false;
    refreshBtn.innerHTML = original;
  }
});

load();
</script>
</body>
</html>
