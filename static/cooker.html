<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cooker View — Home Manager</title>
<link rel="manifest" href="/static/manifest.json" />
<link rel="icon" href="/static/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<meta name="theme-color" content="#66304E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Home Manager" />
<link rel="stylesheet" href="/static/theme.css">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-body, "Karla", sans-serif);
    max-width: 720px;
    margin: 0 auto;
    padding: 24px;
    background: var(--oat-cream, #F6EFE1);
    color: var(--text-body, #3A2E33);
  }
  h1 { font-family: var(--font-heading, "Quicksand", sans-serif); font-size: 1.7rem; font-weight: 700; color: var(--midnight-violet, #66304E); margin-bottom: 4px; }
  p.subtitle { color: var(--text-muted, #8A7F6E); margin-top: 0; font-size: 0.9rem; }
  p.subtitle a { color: var(--midnight-violet, #66304E); font-weight: 700; }
  /* Meals-cooked / prep-done progress — a positive/complete signal, so it
     leans on Vivid Leaf rather than the neutral violet. */
  .progress-bar-wrap {
    background: #fff;
    border: 1px solid var(--card-border, #E7DCC8);
    border-radius: var(--radius-card, 14px);
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .progress-stat { flex: 1; min-width: 140px; }
  .progress-stat .label { color: var(--text-muted, #8A7F6E); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.02em; margin: 0 0 3px; font-weight: 500; }
  .progress-stat .value { font-family: var(--font-heading, "Quicksand", sans-serif); font-size: 1.3rem; font-weight: 700; margin: 0; color: var(--midnight-violet, #66304E); }
  .progress-track { background: var(--oat-cream-dark, #EDE2CC); border-radius: 6px; height: 6px; overflow: hidden; margin-top: 6px; }
  .progress-fill { background: var(--vivid-leaf, #6FB84C); height: 100%; border-radius: 6px; transition: width 0.3s ease; }
  h2.section-title { font-family: var(--font-heading, "Quicksand", sans-serif); font-size: 1.05rem; font-weight: 700; margin: 20px 0 8px; color: var(--midnight-violet, #66304E); }
  .card {
    background: #fff;
    border: 1px solid var(--card-border, #E7DCC8);
    border-radius: var(--radius-card, 14px);
    box-shadow: var(--shadow-card, 0 1px 2px rgba(102, 48, 78, 0.06));
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .card.done { opacity: 0.65; }
  .card-top { display: flex; align-items: flex-start; gap: 12px; }
  /* Checkbox — 44x44 tap target even though the visible circle stays
     compact, per the tap-target minimum for this glanced-at-a-distance
     screen. Checked = done = positive, so it fills Vivid Leaf. */
  .check-toggle {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid var(--card-border, #E7DCC8);
    background: #fff;
    cursor: pointer;
    color: var(--vivid-leaf, #6FB84C);
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: -4px 0;
  }
  .check-toggle.checked { background: var(--vivid-leaf, #6FB84C); border-color: var(--vivid-leaf, #6FB84C); color: #fff; }
  .card-body { flex: 1; min-width: 0; }
  .meal-name { font-family: var(--font-heading, "Quicksand", sans-serif); font-size: 1.1rem; font-weight: 600; color: var(--midnight-violet, #66304E); margin: 0; }
  .meal-name.done { text-decoration: line-through; }
  .meal-meta { color: var(--text-muted, #8A7F6E); font-size: 0.78rem; margin: 2px 0 0; text-transform: capitalize; }
  /* "Why this?" — small, muted, deliberately not competing with the main
     card content (per screen-spec guidance for this affordance). */
  .why-toggle {
    background: none;
    border: none;
    color: var(--text-muted, #8A7F6E);
    font-family: var(--font-body, "Karla", sans-serif);
    font-size: 0.76rem;
    font-weight: 500;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px 0;
    margin: 2px 0 0;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
  }
  .why-text {
    color: var(--text-muted, #8A7F6E);
    font-family: var(--font-body, "Karla", sans-serif);
    font-size: 0.82rem;
    font-style: italic;
    margin: 0 0 4px;
    line-height: 1.4;
  }
  /* "Advance prep" highlight — soft Turmeric Gold tag, not a button. */
  .badge {
    display: inline-block;
    background: rgba(240, 180, 41, 0.22);
    color: #7a5209;
    border: 1px solid rgba(240, 180, 41, 0.55);
    border-radius: 12px;
    padding: 2px 9px;
    font-size: 0.72rem;
    font-weight: 700;
    margin-left: 6px;
  }
  /* Bulk-cook badge/note — a component collapsed from several planned
     meal-uses into one batch (see get_cooker_view); Vivid Leaf rather than
     the gold "advance prep" tag so the two aren't confused at a glance. */
  .badge.batch-badge {
    background: rgba(111, 184, 76, 0.2);
    color: #3F7A29;
    border-color: rgba(111, 184, 76, 0.55);
  }
  .batch-note {
    font-family: var(--font-body, "Karla", sans-serif);
    font-size: 0.8rem;
    color: var(--text-muted, #8A7F6E);
    margin: 2px 0 4px;
  }
  .instr-group-label {
    display: inline-block;
    font-family: var(--font-body, "Karla", sans-serif);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin: 14px 0 6px;
    padding: 3px 10px;
    border-radius: var(--radius-pill, 999px);
  }
  .instr-group-label:first-of-type { margin-top: 4px; }
  /* "Do ahead" — the advance-prep highlight, Turmeric Gold tag.
     "Day of" — the regular/neutral step group, Midnight Violet tag. */
  h5.instr-group-label:nth-of-type(1) { background: rgba(240, 180, 41, 0.22); color: #7a5209; }
  h5.instr-group-label:nth-of-type(2) { background: var(--violet-soft, #F1E4EC); color: var(--midnight-violet, #66304E); }
  .detail-toggle {
    background: none;
    border: none;
    color: var(--midnight-violet, #66304E);
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 12px 0;
    min-height: 44px;
    text-align: left;
  }
  .detail { display: none; margin-top: 10px; font-size: 0.9rem; }
  .detail.open { display: block; }
  .serving-stepper {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0 2px;
  }
  .serving-label {
    font-family: var(--font-body, "Karla", sans-serif);
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--text-muted, #8A7F6E);
  }
  .serving-btn {
    min-width: 44px;
    min-height: 44px;
    border-radius: 50%;
    border: 1px solid var(--midnight-violet, #66304E);
    background: transparent;
    color: var(--midnight-violet, #66304E);
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
  }
  .serving-btn:hover { background: var(--violet-soft, #F1E4EC); }
  .serving-count {
    font-family: var(--font-heading, "Quicksand", sans-serif);
    font-weight: 700;
    font-size: 1rem;
    color: var(--midnight-violet, #66304E);
    min-width: 1.4em;
    text-align: center;
  }
  .unscaled-note {
    color: var(--text-muted, #8A7F6E);
    font-size: 0.78rem;
    font-style: italic;
    margin: 4px 0 0;
  }
  .detail h4 { font-family: var(--font-heading, "Quicksand", sans-serif); margin: 10px 0 4px; font-size: 0.82rem; font-weight: 600; color: var(--midnight-violet, #66304E); text-transform: uppercase; letter-spacing: 0.02em; }
  .detail h4:first-child { margin-top: 0; }
  .detail ul, .detail ol { margin: 0; padding-left: 20px; }
  .detail li { margin-bottom: 4px; }
  .no-recipe { color: var(--text-muted, #8A7F6E); font-style: italic; font-size: 0.85rem; margin-top: 8px; }
  .fill-recipe-btn {
    background: transparent;
    color: var(--midnight-violet, #66304E);
    border: 1px solid var(--midnight-violet, #66304E);
    border-radius: var(--radius-control, 10px);
    padding: 11px 16px;
    min-height: 44px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .fill-recipe-btn:hover:not(:disabled) { background: var(--violet-soft, #F1E4EC); }
  .fill-recipe-btn:disabled { opacity: 0.6; cursor: default; }
  .prep-task { display: flex; align-items: center; gap: 12px; }
  .prep-task .desc { flex: 1; }
  .prep-task .date { color: var(--text-muted, #8A7F6E); font-weight: 500; font-size: 0.78rem; text-transform: none; margin: 0 0 2px; }
  .prep-task.done .desc-text { text-decoration: line-through; color: var(--text-muted, #8A7F6E); }
  .empty { color: var(--text-muted, #8A7F6E); font-size: 0.9rem; font-style: italic; padding: 8px 0; }
  .error { color: var(--electric-coral, #E8562A); font-size: 0.9rem; font-weight: 500; }
  /* Advisory banner — soft gold-tinted highlight, not a CTA. */
  .attention-banner {
    border-radius: var(--radius-card, 14px);
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 0.88rem;
    background: rgba(240, 180, 41, 0.15);
    border: 1px solid rgba(240, 180, 41, 0.45);
    color: var(--text-body, #3A2E33);
  }
  .attention-banner h2 { font-family: var(--font-heading, "Quicksand", sans-serif); font-size: 0.95rem; font-weight: 700; margin: 0 0 8px; color: var(--midnight-violet, #66304E); }
  .attention-item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; }
  .attention-item .summary { flex: 1; }
  .attention-item .attn-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .attn-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
    min-width: 44px;
    min-height: 44px;
    border-radius: 8px;
    color: var(--midnight-violet, #66304E);
  }
  .attn-btn.resolve:hover { background: rgba(111, 184, 76, 0.18); color: #3f7a29; }
  .attn-btn.dismiss:hover { background: rgba(232, 86, 42, 0.15); color: var(--electric-coral, #E8562A); }
  .attention-item.feedback-item { flex-direction: column; align-items: stretch; }
  .attention-item .feedback-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
  /* Feedback rating — Vivid Leaf for "liked", Electric Coral for "not a
     hit", used sparingly as the buttons' outline/hover only. */
  .attention-item .feedback-row .fb-btn {
    background: #fff;
    border: 1px solid var(--card-border, #E7DCC8);
    border-radius: var(--radius-control, 10px);
    padding: 9px 12px;
    min-height: 44px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-body, #3A2E33);
    cursor: pointer;
  }
  .attention-item .feedback-row .fb-btn.liked:hover { border-color: var(--vivid-leaf, #6FB84C); color: #3f7a29; background: rgba(111, 184, 76, 0.1); }
  .attention-item .feedback-row .fb-btn.disliked:hover { border-color: var(--electric-coral, #E8562A); color: var(--electric-coral, #E8562A); background: rgba(232, 86, 42, 0.08); }
  .attention-item .feedback-row .fb-btn:disabled { opacity: 0.6; cursor: default; }
  .attention-item .feedback-row .fb-notes {
    flex: 1;
    min-width: 120px;
    min-height: 44px;
    border: 1px solid var(--card-border, #E7DCC8);
    border-radius: var(--radius-control, 10px);
    padding: 5px 10px;
    font-size: 0.85rem;
    font-family: var(--font-body, "Karla", sans-serif);
  }
  .attention-item.usage-item { flex-direction: column; align-items: stretch; }
  .attention-item .usage-row { display: flex; gap: 8px; margin-top: 6px; }
  .attention-item .usage-row input {
    flex: 1;
    min-height: 44px;
    border: 1px solid var(--card-border, #E7DCC8);
    border-radius: var(--radius-control, 10px);
    padding: 5px 10px;
    font-size: 0.85rem;
    font-family: var(--font-body, "Karla", sans-serif);
  }
  .attention-item .usage-row button.log-btn {
    background: var(--midnight-violet, #66304E);
    color: #fff;
    border: none;
    border-radius: var(--radius-control, 10px);
    padding: 5px 14px;
    min-height: 44px;
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .attention-item .usage-row button.log-btn:hover:not(:disabled) { background: var(--violet-hover, #542640); }
  .attention-item .usage-row button.log-btn:disabled { opacity: 0.6; cursor: default; }
  .attention-item .usage-row button.skip-btn {
    background: none;
    border: none;
    color: var(--text-muted, #8A7F6E);
    font-size: 0.82rem;
    min-height: 44px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .refresh-btn {
    background: transparent;
    border: 1px solid var(--midnight-violet, #66304E);
    border-radius: var(--radius-control, 10px);
    padding: 10px 14px;
    min-height: 44px;
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--midnight-violet, #66304E);
    cursor: pointer;
    flex-shrink: 0;
  }
  .refresh-btn:hover:not(:disabled) { background: var(--violet-soft, #F1E4EC); }
  .refresh-btn:disabled { opacity: 0.6; cursor: default; }
  /* Hands-free mic entry point — the single most important action on this
     screen, so it gets the reserved Turmeric Gold hero treatment (the one
     exception called out in the screen spec). Listening/active state
     switches to a Vivid Leaf pulsing ring with a readable label instead. */
  .voice-btn {
    background: var(--turmeric-gold, #F0B429);
    border: none;
    color: var(--midnight-violet, #66304E);
    border-radius: var(--radius-control, 10px);
    padding: 10px 16px;
    min-height: 44px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    margin: 6px 0;
  }
  .voice-btn:hover:not(.active) { background: var(--gold-hover, #DDA224); }
  .voice-btn.active {
    background: var(--vivid-leaf, #6FB84C);
    color: #fff;
    box-shadow: 0 0 0 0 rgba(111, 184, 76, 0.6);
    animation: voice-pulse-ring 1.6s ease-out infinite;
  }
  @keyframes voice-pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(111, 184, 76, 0.55); }
    70% { box-shadow: 0 0 0 10px rgba(111, 184, 76, 0); }
    100% { box-shadow: 0 0 0 0 rgba(111, 184, 76, 0); }
  }
  /* Listening panel — lives under the same Vivid Leaf "active" language as
     the mic button itself. */
  .voice-status {
    display: none;
    border-radius: var(--radius-card, 14px);
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 0.85rem;
    background: rgba(111, 184, 76, 0.12);
    border: 1px solid rgba(111, 184, 76, 0.4);
    color: var(--text-body, #3A2E33);
  }
  .voice-status.showing { display: block; }
  .voice-status .voice-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--vivid-leaf, #6FB84C); margin-right: 6px; animation: voice-pulse-dot 1.2s ease-in-out infinite; }
  @keyframes voice-pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .voice-status .voice-note { display: block; margin-top: 6px; color: var(--text-muted, #8A7F6E); font-size: 0.78rem; }
  .voice-status .voice-log { margin: 6px 0 0; padding: 0; list-style: none; }
  .voice-status .voice-log li { padding: 3px 0; border-top: 1px solid rgba(111, 184, 76, 0.3); }
  .voice-status .voice-log li:first-child { border-top: none; }
</style>
</head>
<body>

<div class="header-row">
  <h1>Cooker View</h1>
  <button class="refresh-btn" id="refresh-btn" title="Reload latest plan/inventory data">&#8635; Refresh</button>
</div>
<p class="subtitle" id="subtitle">This week's plan, ready to cook. <a id="back-to-chat" href="/">&larr; Back to chat</a></p>

<div id="voice-status" class="voice-status"></div>
<div id="attention-banner"></div>

<div id="content">
  <p class="empty">Loading...</p>
</div>

<script src="/static/voice-session.js"></script>

<script>
// Cook mode is opened inside the shell's Kitchen tab iframe (shell.js's
// forceEmbedSrc, and kitchen.html's "Cook mode" button). Since "/" serves
// shell.html, "Back to chat" would load a second app shell inside that
// iframe -- two ask bars and two tab bars stacked. Embedded, the shell's
// tab bar is already the way back, so hide the link; standalone /cooker
// still has it. Same fix as inventory.html and memory.html (commit af91870).
(function () {
  var backLink = document.getElementById('back-to-chat');
  if (backLink && window.self !== window.top) {
    backLink.style.display = 'none';
  }
})();

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
}

// When a recipe has advance_prep_step_indices (1-based positions within
// `instructions` that are the make-ahead steps), split the instructions
// into a "Do ahead" group and a "Day of" group with their own step
// numbering, instead of one flat numbered list — so it's clear what to
// prep ahead vs. what happens later using what was prepped. Falls back to
// a single flat list when nothing is tagged (most recipes, and any saved
// before this was tracked).
function renderInstructions(m) {
  const steps = m.instructions || [];
  if (!steps.length) {
    return `<p class="empty" style="padding:0 0 8px">No steps saved yet.</p>
            <button class="fill-recipe-btn" data-recipe-name="${escapeHtml(m.meal || '')}">Fill in this recipe</button>`;
  }
  const prepIndices = new Set(m.advance_prep_step_indices || []);
  if (!prepIndices.size) {
    return `<ol>${steps.map(step => `<li>${escapeHtml(step)}</li>`).join('')}</ol>`;
  }
  const doAhead = steps.filter((_, i) => prepIndices.has(i + 1));
  const dayOf = steps.filter((_, i) => !prepIndices.has(i + 1));
  return `
    <h5 class="instr-group-label">Do ahead</h5>
    <ol>${doAhead.map(step => `<li>${escapeHtml(step)}</li>`).join('')}</ol>
    <h5 class="instr-group-label">Day of</h5>
    <ol>${dayOf.map(step => `<li>${escapeHtml(step)}</li>`).join('')}</ol>`;
}

let cache = null;
let openDetailIdx = null;

// ---------- Phase 5: hands-free voice (Cooker case, §4.1/§4.3) ----------
// One session active at a time, scoped either to the prep schedule or to a
// single meal's recipe (matching how the PRD frames activation — "while
// viewing a recipe or the prep schedule"). See /static/voice-session.js for
// the shared engine (also reused by grocery.html for the Shopper case).

let voiceSession = null;
let voiceContext = null; // { type: 'prep' } | { type: 'meal', idx: number }
let voiceStepCursor = {}; // per-meal "what's next" progress, reset each session

let voiceLog = [];

function setVoiceStatus(text) {
  const el = document.getElementById('voice-status');
  if (!text) {
    voiceLog = [];
    el.classList.remove('showing');
    el.innerHTML = '';
    return;
  }
  // Keep a short scrollback (not just the latest line) — a single
  // overwritten status was flashing by before you could read what was
  // actually heard, which made "everything fails" impossible to diagnose.
  voiceLog.unshift(text);
  voiceLog = voiceLog.slice(0, 5);
  el.classList.add('showing');
  el.innerHTML = `<span class="voice-dot"></span>Listening…` +
    `<ul class="voice-log">${voiceLog.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>` +
    `<span class="voice-note">Say "hey home manager" plus a command, or tap Hands-free again to stop.</span>`;
}

function updateVoiceButtons() {
  document.querySelectorAll('.voice-btn').forEach(btn => {
    const ctxType = btn.getAttribute('data-ctx');
    const btnIdx = btn.getAttribute('data-idx');
    const isThisOne = !!(voiceSession && voiceSession.isActive() && voiceContext &&
      voiceContext.type === ctxType && (ctxType !== 'meal' || String(voiceContext.idx) === btnIdx));
    btn.classList.toggle('active', isThisOne);
    btn.innerHTML = isThisOne ? '&#127908; Stop hands-free' : '&#127908; Hands-free';
  });
}

// Loose match for a spoken phrase against a list of candidates (prep task
// descriptions, ingredient names) — exact match first, then substring
// overlap, then a simple word-overlap score. Deliberately permissive since
// spoken transcripts are noisier than typed text; unlike the inventory
// depletion matcher this never silently changes data on a weak match by
// itself — the caller still confirms back via TTS what it acted on.
function voiceFuzzyFind(text, candidates, getLabel) {
  const t = (text || '').trim().toLowerCase();
  if (!t || !candidates || !candidates.length) return null;
  for (const c of candidates) {
    if (getLabel(c).trim().toLowerCase() === t) return c;
  }
  for (const c of candidates) {
    const label = getLabel(c).trim().toLowerCase();
    if (label && (label.includes(t) || t.includes(label))) return c;
  }
  const words = t.split(/\s+/);
  let best = null, bestScore = 0;
  for (const c of candidates) {
    const labelWords = getLabel(c).trim().toLowerCase().split(/\s+/);
    const score = words.filter(w => labelWords.includes(w)).length;
    if (score > bestScore) { bestScore = score; best = c; }
  }
  return bestScore > 0 ? best : null;
}

// Matching is deliberately keyword/anywhere-in-phrase based rather than
// requiring an exact sentence structure — real speech (and imperfect
// transcription) rarely comes back phrased exactly one way. Each handler
// checks for a topic keyword anywhere in the command, not a fixed prefix.
function isEndCommand(command) {
  return /\b(stop|cancel|exit|goodbye|end session|that'?s all|all done)\b/i.test(command) ||
    /^done$/i.test(command.trim());
}

async function handlePrepVoiceCommand(command) {
  if (isEndCommand(command)) return { spoken: 'Ending hands-free.', endSession: true };

  let task = null;
  // Prep steps have no other voice action besides checking them off, so any
  // mention of "step"/"task" plus a number (digit or spoken word) is enough
  // — no need to also match a specific verb like "check off".
  if (/\b(step|task)\b/i.test(command)) {
    const n = voiceParseNumber(command);
    if (n !== null) {
      task = (cache.prep_tasks || [])[n - 1] || null;
      if (!task) return { spoken: `There's no step ${n} — I only count ${(cache.prep_tasks || []).length}.` };
    }
  }
  if (!task) {
    const afterVerb = command.replace(/\b(check off|mark|complete|finish|done with)\b/gi, '');
    task = voiceFuzzyFind(afterVerb, cache.prep_tasks || [], t => t.description);
  }
  if (!task) return null;

  const res = await fetch('/api/cooker/check-prep', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prep_task_id: task.id, status: 'done' }),
  });
  if (!res.ok) return null;
  render(await res.json());
  refreshAttention();
  return { spoken: `Got it, "${task.description}" marked done.` };
}

async function handleMealVoiceCommand(command, idx) {
  const meal = cache && cache.meals ? cache.meals[idx] : null;
  if (!meal) return null;

  if (isEndCommand(command)) return { spoken: 'Ending hands-free.', endSession: true };

  // Recipe instructions aren't individually checkable (only the whole meal
  // and prep tasks are) — so any mention of "step" plus a number is always
  // a read-it-back question, never an action, and there's no ambiguity to
  // resolve against other commands.
  if (/\bstep\b/i.test(command)) {
    const n = voiceParseNumber(command);
    if (n !== null) {
      const step = (meal.instructions || [])[n - 1];
      return step
        ? { spoken: `Step ${n}: ${step}` }
        : { spoken: `There's no step ${n} — this recipe has ${(meal.instructions || []).length} steps.` };
    }
  }

  if (/\bnext\b/i.test(command)) {
    const cursor = voiceStepCursor[idx] || 0;
    const step = (meal.instructions || [])[cursor];
    if (!step) return { spoken: "That's the last step — nothing more after this." };
    voiceStepCursor[idx] = cursor + 1;
    return { spoken: `Step ${cursor + 1}: ${step}` };
  }

  // Marking the whole meal done requires an explicit qualifier ("cooking",
  // "meal", "recipe", "dish", or "it"/"this") specifically so a bare "I'm
  // done" or "finished" doesn't collide with the session-ending "done"/
  // "stop" phrase, which is checked first above.
  if (/\b(done|finish|finished|complete|completed|mark|check off)\b/i.test(command) &&
      /\b(cooking|meal|recipe|dish|this|it)\b/i.test(command)) {
    const res = await fetch('/api/cooker/check-meal', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ entry_id: meal.entry_id, status: 'done' }),
    });
    if (!res.ok) return null;
    render(await res.json());
    refreshAttention();
    return { spoken: `Got it, ${meal.meal} marked done.` };
  }

  if (/\b(how much|amount|how many)\b/i.test(command)) {
    const afterKeyword = command.replace(/^.*?\b(how much|how many|amount of|amount)\b/i, '').trim();
    const ing = voiceFuzzyFind(afterKeyword, meal.ingredients || [], i => i.item || '');
    return ing
      ? { spoken: `${ing.qty || 'No amount tracked'} of ${ing.item}.` }
      : { spoken: "I don't see that ingredient in this recipe." };
  }

  if (/\bsubstitut|\b(swap|swapped|instead|log|note)\b/i.test(command)) {
    const note = command
      .replace(/^(?:log a substitution|log a deviation|log that|note that|note|i substituted|i swapped)[:\s]*/i, '')
      .trim() || command;
    try {
      const res = await fetch('/api/cooker/log-deviation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ recipe_name: meal.meal, note }),
      });
      if (!res.ok) return null;
    } catch (err) {
      return null;
    }
    return { spoken: 'Got it, logged.' };
  }

  return null;
}

function startVoiceSession(ctx) {
  if (voiceSession && voiceSession.isActive()) voiceSession.stop();
  voiceContext = ctx;
  voiceStepCursor = {};
  voiceSession = createVoiceSession({
    onListeningChange: (isListening) => {
      updateVoiceButtons();
      if (!isListening) setVoiceStatus('');
    },
    onStatus: (text) => setVoiceStatus(text),
    onCommand: async (command) => {
      if (ctx.type === 'prep') return handlePrepVoiceCommand(command);
      if (ctx.type === 'meal') return handleMealVoiceCommand(command, ctx.idx);
      return null;
    },
    onEnd: () => { voiceContext = null; updateVoiceButtons(); },
  });
  if (voiceSession.isStandaloneIOS()) {
    setVoiceStatus('Heads up: hands-free voice can be unreliable in the installed home-screen app on iOS — if it doesn\'t seem to hear you, try this from a regular Safari tab instead.');
  }
  voiceSession.start();
  updateVoiceButtons();
}

function render(view) {
  cache = view;
  const content = document.getElementById('content');

  if (!view.weekly_plan_id) {
    content.innerHTML = '<p class="empty">No plan yet this week — generate one in chat first.</p>';
    return;
  }

  const mealsPct = view.meals_total ? Math.round(100 * view.meals_done / view.meals_total) : 0;
  const prepPct = view.prep_total ? Math.round(100 * view.prep_done / view.prep_total) : 0;

  let html = '';
  html += `<div class="progress-bar-wrap">
    <div class="progress-stat">
      <p class="label">Meals cooked</p>
      <p class="value">${view.meals_done} / ${view.meals_total}</p>
      <div class="progress-track"><div class="progress-fill" style="width:${mealsPct}%"></div></div>
    </div>
    <div class="progress-stat">
      <p class="label">Prep done</p>
      <p class="value">${view.prep_done} / ${view.prep_total}</p>
      <div class="progress-track"><div class="progress-fill" style="width:${prepPct}%"></div></div>
    </div>
  </div>`;

  if (view.prep_tasks && view.prep_tasks.length) {
    html += '<h2 class="section-title">Prep schedule</h2>';
    html += `<button class="voice-btn" data-ctx="prep" title="Hands-free: check off prep steps by voice">&#127908; Hands-free</button>`;
    for (const t of view.prep_tasks) {
      const isDone = t.status === 'done';
      html += `<div class="card prep-task ${isDone ? 'done' : ''}">
        <button class="check-toggle ${isDone ? 'checked' : ''}" data-prep-id="${t.id}" data-next="${isDone ? 'pending' : 'done'}">${isDone ? '&check;' : ''}</button>
        <div class="desc">
          <p class="date">${escapeHtml(formatDate(t.task_date))}</p>
          <p class="desc-text" style="margin:0">${escapeHtml(t.description)}${t.related_meal ? ' <span style="color:#999">(' + escapeHtml(t.related_meal) + ')</span>' : ''}</p>
        </div>
      </div>`;
    }
  }

  html += '<h2 class="section-title">Meals</h2>';
  if (!view.meals.length) {
    html += '<p class="empty">No meals on this plan yet.</p>';
  }
  view.meals.forEach((m, idx) => {
    const isDone = m.cooked_status === 'done';
    const metaBits = [];
    if (m.component_category) metaBits.push(m.component_category);
    else {
      if (m.date) metaBits.push(formatDate(m.date));
      if (m.slot) metaBits.push(m.slot);
    }
    if (m.prep_time_minutes || m.cook_time_minutes) {
      const bits = [];
      if (m.prep_time_minutes) bits.push(m.prep_time_minutes + 'm prep');
      if (m.cook_time_minutes) bits.push(m.cook_time_minutes + 'm cook');
      metaBits.push(bits.join(' + '));
    }

    html += `<div class="card ${isDone ? 'done' : ''}">
      <div class="card-top">
        <button class="check-toggle ${isDone ? 'checked' : ''}" data-entry-id="${m.entry_id}" data-next="${isDone ? 'pending' : 'done'}">${isDone ? '&check;' : ''}</button>
        <div class="card-body">
          <p class="meal-name ${isDone ? 'done' : ''}">${escapeHtml(m.meal || '')}${m.advance_prep_notes ? '<span class="badge">advance prep</span>' : ''}${m.batch_note ? '<span class="badge batch-badge">bulk-cook ×' + m.meal_count + '</span>' : ''}</p>
          ${m.batch_note ? `<p class="batch-note">${escapeHtml(m.batch_note)}</p>` : ''}
          <p class="meal-meta">${escapeHtml(metaBits.join(' · '))}</p>
          ${m.reasoning ? `
          <button type="button" class="why-toggle" data-why-toggle="${idx}">Why this? &darr;</button>
          <p class="why-text" id="why-${idx}" style="display:none">${escapeHtml(m.reasoning)}</p>` : ''}`;

    if (m.has_full_recipe) {
      html += `<button class="detail-toggle" data-toggle="${idx}">Show recipe &darr;</button>
        <div class="detail" id="detail-${idx}">
          <button class="voice-btn" data-ctx="meal" data-idx="${idx}" title="Hands-free: check off, ask about ingredients/steps, log a substitution, by voice">&#127908; Hands-free</button>
          ${m.default_servings ? `
          <div class="serving-stepper" data-idx="${idx}" data-recipe="${escapeHtml(m.meal || '')}" data-base="${m.default_servings}">
            <span class="serving-label">Serves</span>
            <button type="button" class="serving-btn" data-delta="-1" aria-label="Fewer servings">&minus;</button>
            <span class="serving-count">${m.default_servings}</span>
            <button type="button" class="serving-btn" data-delta="1" aria-label="More servings">+</button>
          </div>` : ''}
          ${m.advance_prep_notes ? `<h4>Advance prep</h4><p style="margin:0">${escapeHtml(m.advance_prep_notes)}</p>` : ''}
          <h4>Ingredients</h4>
          <ul id="ingredients-${idx}">${(m.ingredients || []).map(i => `<li>${escapeHtml((i.qty ? i.qty + ' ' : '') + (i.item || ''))}</li>`).join('') || '<li class="empty" style="padding:0">None listed</li>'}</ul>
          <p class="unscaled-note" id="unscaled-note-${idx}" style="display:none"></p>
          <h4>Instructions</h4>
          ${renderInstructions(m)}
        </div>`;
    } else {
      html += `<p class="no-recipe">Freeform meal — no saved recipe detail. Ask in chat for the full recipe.</p>`;
    }

    html += `</div></div></div>`;
  });

  content.innerHTML = html;

  if (openDetailIdx !== null) {
    const detail = document.getElementById('detail-' + openDetailIdx);
    const toggleBtn = content.querySelector(`.detail-toggle[data-toggle="${openDetailIdx}"]`);
    if (detail) {
      detail.classList.add('open');
      if (toggleBtn) toggleBtn.textContent = 'Hide recipe ↑';
    }
  }

  content.querySelectorAll('.detail-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-toggle');
      const detail = document.getElementById('detail-' + id);
      const open = detail.classList.toggle('open');
      btn.textContent = open ? 'Hide recipe ↑' : 'Show recipe ↓';
      openDetailIdx = open ? id : null;
    });
  });

  content.querySelectorAll('.voice-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const ctxType = btn.getAttribute('data-ctx');
      const btnIdx = btn.getAttribute('data-idx');
      const isThisActive = voiceSession && voiceSession.isActive() && voiceContext &&
        voiceContext.type === ctxType && (ctxType !== 'meal' || String(voiceContext.idx) === btnIdx);
      if (isThisActive) {
        voiceSession.stop();
        return;
      }
      const ctx = ctxType === 'meal' ? { type: 'meal', idx: parseInt(btnIdx, 10) } : { type: 'prep' };
      startVoiceSession(ctx);
    });
  });
  updateVoiceButtons();

  content.querySelectorAll('.why-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = btn.getAttribute('data-why-toggle');
      const text = document.getElementById('why-' + idx);
      const open = text.style.display !== 'none';
      text.style.display = open ? 'none' : 'block';
      btn.innerHTML = open ? 'Why this? &darr;' : 'Why this? &uarr;';
    });
  });

  content.querySelectorAll('.serving-stepper').forEach(wrap => {
    const idx = wrap.dataset.idx;
    const recipeName = wrap.dataset.recipe;
    const base = parseInt(wrap.dataset.base, 10) || 1;
    const countEl = wrap.querySelector('.serving-count');
    wrap.querySelectorAll('.serving-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const delta = parseInt(btn.getAttribute('data-delta'), 10);
        const current = parseInt(countEl.textContent, 10) || base;
        const next = Math.max(1, current + delta);
        if (next === current) return;
        countEl.textContent = next;
        applyServingScale(idx, recipeName, next);
      });
    });
  });

  content.querySelectorAll('.fill-recipe-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const recipeName = btn.getAttribute('data-recipe-name');
      const idx = btn.closest('.detail').id.replace('detail-', '');
      btn.disabled = true;
      btn.textContent = 'Writing recipe…';
      openDetailIdx = idx;
      try {
        const res = await fetch('/api/cooker/fill-recipe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ recipe_name: recipeName }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || 'failed');
        }
        render(await res.json());
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Fill in this recipe';
        alert("Couldn't generate that recipe right now — try again.");
      }
    });
  });

  content.querySelectorAll('.check-toggle[data-entry-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        const res = await fetch('/api/cooker/check-meal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ entry_id: parseInt(btn.getAttribute('data-entry-id')), status: btn.getAttribute('data-next') }),
        });
        if (!res.ok) throw new Error('failed');
        render(await res.json());
        refreshAttention(); // checking a meal off can queue new inventory-depletion items
      } catch (err) {
        btn.disabled = false;
        alert("Couldn't update that — try again.");
      }
    });
  });

  content.querySelectorAll('.check-toggle[data-prep-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        const res = await fetch('/api/cooker/check-prep', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prep_task_id: parseInt(btn.getAttribute('data-prep-id')), status: btn.getAttribute('data-next') }),
        });
        if (!res.ok) throw new Error('failed');
        render(await res.json());
      } catch (err) {
        btn.disabled = false;
        alert("Couldn't update that — try again.");
      }
    });
  });
}

function renderAttentionBanner(items) {
  const banner = document.getElementById('attention-banner');
  if (!items || !items.length) {
    banner.innerHTML = '';
    return;
  }
  banner.innerHTML = `
    <div class="attention-banner">
      <h2>Needs your attention</h2>
      ${items.map(it => {
        const needsAmount = it.id != null && it.detail && it.detail.needs_amount_used;
        if (needsAmount) {
          return `
            <div class="attention-item usage-item" data-item-id="${it.id}" data-mode="usage">
              <span class="summary">${escapeHtml(it.summary)}</span>
              <span class="usage-row">
                <input type="text" class="usage-input" placeholder="e.g. 1 cup, or leave blank for all of it" />
                <button class="log-btn">Log it</button>
                <button class="skip-btn" title="Skip for now">Skip</button>
              </span>
            </div>`;
        }
        if (it.kind === 'feedback_nudge') {
          const mealName = (it.detail && it.detail.meal) || '';
          return `
            <div class="attention-item feedback-item" data-mode="feedback" data-meal="${escapeHtml(mealName)}">
              <span class="summary">${escapeHtml(it.summary)}</span>
              <span class="feedback-row">
                <button class="fb-btn liked">&#128077; Liked it</button>
                <button class="fb-btn disliked">&#128078; Not a hit</button>
                <input type="text" class="fb-notes" placeholder="Notes (optional)" />
              </span>
            </div>`;
        }
        return `
          <div class="attention-item" data-item-id="${it.id == null ? '' : it.id}">
            <span class="summary">${escapeHtml(it.summary)}</span>
            ${it.id != null ? `
              <span class="attn-actions">
                <button class="attn-btn resolve" title="Mark handled">&check;</button>
                <button class="attn-btn dismiss" title="Not relevant">&times;</button>
              </span>` : ''}
          </div>`;
      }).join('')}
    </div>
  `;

  banner.querySelectorAll('.attention-item').forEach(row => {
    if (row.getAttribute('data-mode') === 'feedback') {
      const mealName = row.getAttribute('data-meal');
      const likedBtn = row.querySelector('.fb-btn.liked');
      const dislikedBtn = row.querySelector('.fb-btn.disliked');
      const notesInput = row.querySelector('.fb-notes');
      async function rate(rating) {
        likedBtn.disabled = true;
        dislikedBtn.disabled = true;
        try {
          const res = await fetch('/api/recipe-feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ recipe_name: mealName, rating, notes: notesInput.value.trim() }),
          });
          if (!res.ok) throw new Error('failed');
          refreshAttention();
        } catch (err) {
          likedBtn.disabled = false;
          dislikedBtn.disabled = false;
          alert("Couldn't save that rating — try again.");
        }
      }
      likedBtn.addEventListener('click', () => rate('liked'));
      dislikedBtn.addEventListener('click', () => rate('disliked'));
      return;
    }

    const itemId = row.getAttribute('data-item-id');
    if (!itemId) return; // the feedback-nudge entry (id=None) has no other action buttons

    if (row.getAttribute('data-mode') === 'usage') {
      const input = row.querySelector('.usage-input');
      const logBtn = row.querySelector('.log-btn');
      const skipBtn = row.querySelector('.skip-btn');
      async function logUsage() {
        logBtn.disabled = true;
        skipBtn.disabled = true;
        try {
          const res = await fetch('/api/attention/' + itemId + '/use', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount_used: input.value.trim() }),
          });
          if (!res.ok) throw new Error('failed');
          renderAttentionBanner((await res.json()).items);
        } catch (err) {
          logBtn.disabled = false;
          skipBtn.disabled = false;
          alert("Couldn't log that — try again.");
        }
      }
      logBtn.addEventListener('click', logUsage);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') logUsage(); });
      skipBtn.addEventListener('click', async () => {
        logBtn.disabled = true;
        skipBtn.disabled = true;
        try {
          const res = await fetch('/api/attention/' + itemId + '/resolve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'dismissed' }),
          });
          if (!res.ok) throw new Error('failed');
          renderAttentionBanner((await res.json()).items);
        } catch (err) {
          logBtn.disabled = false;
          skipBtn.disabled = false;
          alert("Couldn't update that — try again.");
        }
      });
      return;
    }

    const resolveBtn = row.querySelector('.attn-btn.resolve');
    const dismissBtn = row.querySelector('.attn-btn.dismiss');
    async function resolve(status) {
      resolveBtn.disabled = true;
      dismissBtn.disabled = true;
      try {
        const res = await fetch('/api/attention/' + itemId + '/resolve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status }),
        });
        if (!res.ok) throw new Error('failed');
        renderAttentionBanner((await res.json()).items);
      } catch (err) {
        resolveBtn.disabled = false;
        dismissBtn.disabled = false;
        alert("Couldn't update that — try again.");
      }
    }
    resolveBtn.addEventListener('click', () => resolve('resolved'));
    dismissBtn.addEventListener('click', () => resolve('dismissed'));
  });
}

// Serving-size stepper — recalculates ingredient quantities live without a
// full plan reload. Non-numeric/imprecise quantities ("a pinch," "to
// taste") can't scale mathematically, so the backend leaves those as-is
// and flags them in unscaled_items rather than guessing.
async function applyServingScale(idx, recipeName, servings) {
  const list = document.getElementById('ingredients-' + idx);
  const note = document.getElementById('unscaled-note-' + idx);
  try {
    const res = await fetch(`/api/recipes/scale?name=${encodeURIComponent(recipeName)}&servings=${servings}`);
    if (!res.ok) throw new Error('Could not scale');
    const data = await res.json();
    if (list) {
      list.innerHTML = (data.scaled_ingredients || []).map(i =>
        `<li>${escapeHtml((i.qty ? i.qty + ' ' : '') + (i.item || ''))}</li>`
      ).join('') || '<li class="empty" style="padding:0">None listed</li>';
    }
    if (note) {
      if (data.unscaled_items && data.unscaled_items.length) {
        note.textContent = `Eyeball these — they don't scale automatically: ${data.unscaled_items.join(', ')}.`;
        note.style.display = 'block';
      } else {
        note.style.display = 'none';
      }
    }
  } catch (err) {
    // Non-critical — leave the ingredient list as it was rather than
    // breaking the view over a failed scale request.
  }
}

async function refreshAttention() {
  try {
    const res = await fetch('/api/attention');
    if (res.ok) renderAttentionBanner((await res.json()).items);
  } catch (err) { /* non-critical, ignore */ }
}

async function load() {
  const content = document.getElementById('content');
  try {
    const [viewRes, attnRes] = await Promise.all([
      fetch('/api/cooker-view'),
      fetch('/api/attention'),
    ]);
    if (!viewRes.ok) throw new Error('Could not load');
    render(await viewRes.json());
    if (attnRes.ok) {
      renderAttentionBanner((await attnRes.json()).items);
    }
  } catch (err) {
    content.innerHTML = '<p class="error">Couldn\'t load the Cooker view right now — try refreshing.</p>';
  }
}

const refreshBtn = document.getElementById('refresh-btn');
refreshBtn.addEventListener('click', async () => {
  refreshBtn.disabled = true;
  const original = refreshBtn.innerHTML;
  refreshBtn.innerHTML = '&#8635; Refreshing…';
  try {
    await load();
  } finally {
    refreshBtn.disabled = false;
    refreshBtn.innerHTML = original;
  }
});

load();
</script>
