<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Home Manager</title>
<link rel="manifest" href="/static/manifest.json" />
<link rel="icon" href="/static/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<meta name="theme-color" content="#66304E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Home Manager" />
<style>
  body {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.subtitle { margin-top: 0; }
  p.subtitle a { margin: 0 2px; }
  #chat {
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    height: 60vh;
    overflow-y: auto;
    padding: 16px;
    margin-bottom: 12px;
  }
  .msg { margin-bottom: 14px; line-height: 1.4; white-space: pre-wrap; }
  .msg.user { text-align: right; }
  .msg.user .bubble { background: var(--midnight-violet); color: #fff; }
  .msg.assistant .bubble { background: var(--violet-soft); color: var(--text-body); }
  .bubble { display: inline-block; padding: 8px 12px; border-radius: 12px; max-width: 85%; }
  /* A "week at a glance" table (or any markdown table) coming back in a
     reply — scrolls horizontally within the bubble rather than forcing the
     whole bubble wider than the chat column. */
  .msg.assistant .bubble:has(.msg-table) { max-width: 100%; }
  .msg-table {
    display: block;
    overflow-x: auto;
    max-width: 100%;
    border-collapse: collapse;
    margin: 6px 0;
    font-size: 0.85rem;
    white-space: normal;
    background: #fff;
    border-radius: var(--radius-control);
  }
  .msg-table thead, .msg-table tbody { display: table; width: 100%; table-layout: auto; }
  .msg-table th, .msg-table td {
    padding: 7px 10px;
    text-align: left;
    border-bottom: 1px solid var(--card-border);
    white-space: nowrap;
  }
  .msg-table th {
    font-family: var(--font-heading);
    font-weight: 700;
    color: var(--midnight-violet);
    background: var(--oat-cream);
  }
  .msg-table tbody tr:last-child td { border-bottom: none; }
  .msg-table tbody tr:nth-child(even) { background: rgba(102, 48, 78, 0.04); }
  form { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1;
    padding: 10px 12px;
    border-radius: var(--radius-control);
    border: 1px solid var(--card-border);
    font-size: 1rem;
    background: #fff;
    color: var(--text-body);
    font-family: var(--font-body);
  }
  input::placeholder { color: var(--text-muted); }
  button {
    padding: 10px 18px;
    border-radius: var(--radius-control);
    border: none;
    background: var(--turmeric-gold);
    color: var(--midnight-violet);
    font-size: 1rem;
    font-weight: 700;
    font-family: var(--font-body);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover:not(:disabled) { background: var(--gold-hover); }
  button:disabled { opacity: 0.5; cursor: default; }
  #quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .quick-btn {
    background: transparent;
    color: var(--midnight-violet);
    border: 1px solid var(--midnight-violet);
    padding: 6px 12px;
    border-radius: 16px;
    font-size: 0.85rem;
    font-weight: 700;
    font-family: var(--font-body);
    cursor: pointer;
    min-height: 44px;
  }
  .quick-btn:hover { background: var(--violet-soft); }
  #mic-btn {
    flex: 0 0 44px;
    height: 44px;
    min-width: 44px;
    min-height: 44px;
    padding: 0;
    border-radius: var(--radius-control);
    border: 1px solid var(--midnight-violet);
    background: transparent;
    color: var(--midnight-violet);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #mic-btn.active { background: var(--electric-coral); border-color: var(--electric-coral); color: #fff; animation: mic-pulse 1.4s ease-in-out infinite; }
  #mic-btn:disabled { opacity: 0.5; cursor: default; animation: none; }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232, 86, 42, 0.45); }
    50% { box-shadow: 0 0 0 6px rgba(232, 86, 42, 0); }
  }
  .bubble.loading { font-style: italic; color: var(--text-muted); animation: loading-pulse 1.3s ease-in-out infinite; }
  @keyframes loading-pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <h1>Home Manager</h1>
  <p class="subtitle app-nav">Chores, meal plan, groceries — ask it anything. <a href="/onboarding">Edit household setup</a> &middot; <a href="/memory">What we know</a> &middot; <a href="/cooker">Cooker view</a> &middot; <a href="/inventory">Inventory</a> &middot; <a href="/grocery">Grocery list</a> &middot; <a href="#" id="share-link">Share meal plan</a></p>
  <div id="chat"></div>
  <div id="quick-actions">
    <button class="quick-btn" data-msg="Let's set up chores for our household.">Set up chores</button>
    <button class="quick-btn" data-msg="What chores are coming up this week?">This week's chores</button>
    <button class="quick-btn" data-msg="Add a new chore.">Add a chore</button>
    <button class="quick-btn" data-msg="Let's set up meal planning — ask me about dietary restrictions and what we like to eat.">Set up meal planning</button>
    <button class="quick-btn" data-msg="What's the meal plan for this week?">This week's meals</button>
    <button class="quick-btn" data-msg="I want to save a recipe.">Add a recipe</button>
    <button class="quick-btn" data-msg="What's on the grocery list?">Grocery list</button>
  </div>
  <form id="form">
    <input id="input" type="text" placeholder="e.g. what's on the grocery list?" autocomplete="off" />
    <button type="button" id="mic-btn" aria-label="Dictate message" title="Dictate message">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
        <path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.07A7 7 0 0 0 19 11z"/>
      </svg>
    </button>
    <button type="submit">Send</button>
  </form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sessionId = 'default';

// First-time visitors (no household members saved at all) go through the
// onboarding wizard instead of landing straight in chat.
(async () => {
  try {
    const res = await fetch('/api/onboarding/status');
    const data = await res.json();
    if (data.household && data.household.has_members === false) {
      window.location.href = '/onboarding';
    }
  } catch (err) {
    // If the check fails (e.g. server just starting), just stay on chat.
    console.warn('Onboarding status check failed:', err);
  }
})();

// Assistant replies sometimes use light markdown (bold section headers,
// "- " bullet lines, and — especially for a "week at a glance" summary —
// a pipe-delimited table) — textContent used to render all of that
// literally (visible "**" asterisks, raw "| Mon | ... |" rows). This
// escapes HTML first for safety, then converts **bold**, leading "- "/"* "
// bullet markers, and any markdown table block into real HTML; remaining
// line breaks still come from the .msg { white-space: pre-wrap } rule, no
// need to touch those.
function splitTableRow(line) {
  const cells = line.split('|');
  if (cells.length && cells[0].trim() === '') cells.shift();
  if (cells.length && cells[cells.length - 1].trim() === '') cells.pop();
  return cells.map(c => c.trim());
}
const TABLE_ROW_RE = /^\s*\|.*\|\s*$/;
const TABLE_SEPARATOR_RE = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;

function renderMarkdownLite(text) {
  const escaped = String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const bolded = escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const lines = bolded.split('\n');

  const out = [];
  let i = 0;
  while (i < lines.length) {
    if (TABLE_ROW_RE.test(lines[i]) && i + 1 < lines.length && TABLE_SEPARATOR_RE.test(lines[i + 1])) {
      const headerCells = splitTableRow(lines[i]);
      let j = i + 2;
      const rows = [];
      while (j < lines.length && TABLE_ROW_RE.test(lines[j])) {
        rows.push(splitTableRow(lines[j]));
        j++;
      }
      out.push(
        '<table class="msg-table"><thead><tr>' +
        headerCells.map(c => `<th>${c}</th>`).join('') +
        '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') +
        '</tbody></table>'
      );
      i = j;
    } else {
      out.push(lines[i].replace(/^(\s*)[-*]\s+/, '$1&bull;&nbsp;'));
      i++;
    }
  }
  return out.join('\n');
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const bubble = document.createElement('span');
  bubble.className = 'bubble';
  bubble.innerHTML = renderMarkdownLite(text);
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

// Loading phrases, picked by lightly matching the message against what it's
// probably about — falls back to a generic kitchen-themed line for anything
// that doesn't match (chores, general questions, etc.).
const LOADING_PHRASES = {
  grocery: ['Cooking up your list...', 'Sorting the aisles...', 'Filling the cart...'],
  meal: ['Cooking up a plan...', 'Simmering on your week...', 'Plating up some ideas...', 'Preheating the ideas oven...'],
  chore: ['Sweeping up the details...', 'Tidying up your schedule...', 'Dusting things off...'],
  default: ['Whipping this up...', 'Stirring up an answer...', 'Cooking something up...', 'Simmering on it...'],
};
function pickLoadingPhrase(message) {
  const m = (message || '').toLowerCase();
  let bucket = 'default';
  if (/grocer|shopping list|\bcart\b/.test(m)) bucket = 'grocery';
  else if (/meal|dinner|breakfast|lunch|recipe|\bplan\b|cook|\beat\b/.test(m)) bucket = 'meal';
  else if (/chore|clean|tidy|vacuum|dust|laundry/.test(m)) bucket = 'chore';
  const options = LOADING_PHRASES[bucket];
  return options[Math.floor(Math.random() * options.length)];
}

let loadingBubble = null;
function showLoading(message) {
  loadingBubble = addMessage('assistant', pickLoadingPhrase(message));
  loadingBubble.querySelector('.bubble').classList.add('loading');
}
function hideLoading() {
  if (loadingBubble) { loadingBubble.remove(); loadingBubble = null; }
}

async function sendMessage(message) {
  if (!message) return;
  addMessage('user', message);
  input.disabled = true;
  micBtn.disabled = true;
  document.querySelectorAll('.quick-btn').forEach(b => b.disabled = true);
  showLoading(message);

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message }),
    });
    hideLoading();
    if (!res.ok) {
      // Try to parse a JSON error body for a real message; if the response
      // isn't JSON at all (e.g. a platform-level crash/restart page rather
      // than our own app responding), fall back to the HTTP status instead
      // of a totally generic message — status + reason gives something to
      // go on next time instead of a dead end.
      let detail = '';
      try { detail = (await res.json()).detail || ''; } catch (e) { /* not JSON */ }
      throw new Error(detail || `Request failed (${res.status} ${res.statusText})`);
    }
    const data = await res.json();
    addMessage('assistant', data.reply);
  } catch (err) {
    hideLoading();
    addMessage('assistant', 'Error: ' + err.message);
  } finally {
    input.disabled = false;
    micBtn.disabled = false;
    document.querySelectorAll('.quick-btn').forEach(b => b.disabled = false);
    input.focus();
  }
}

// ---------- Voice dictation ----------
// Two very different situations to cover:
// - Android Chrome (and desktop Chrome) expose the Web Speech API, so a mic
//   button can drive an in-page transcription directly.
// - iOS Safari does NOT expose the Web Speech API at all — dictation there
//   only exists as the mic key built into the native keyboard on any text
//   field, which already works with zero code. Our button can't trigger
//   that programmatically, so on iOS it just focuses the input and points
//   at the keyboard mic once, since that affordance is easy to miss.
const micBtn = document.getElementById('mic-btn');
const originalPlaceholder = input.placeholder;
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let recognizing = false;
let dictationBaseValue = ''; // whatever was already typed before dictation started

if (SpeechRecognitionCtor) {
  recognition = new SpeechRecognitionCtor();
  recognition.continuous = false;
  // Interim results stream words into the input as you speak, instead of
  // everything appearing at once after you stop — makes it clear the mic
  // is actually hearing you in real time rather than looking frozen.
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onresult = (e) => {
    let finalText = '';
    let interimText = '';
    for (let i = 0; i < e.results.length; i++) {
      const result = e.results[i];
      if (result.isFinal) finalText += result[0].transcript;
      else interimText += result[0].transcript;
    }
    const spoken = (finalText + interimText).trim();
    input.value = dictationBaseValue ? (dictationBaseValue + ' ' + spoken) : spoken;
  };
  // Errors were being swallowed silently before — the button would just
  // reset with zero feedback, which looks identical whether the mic was
  // blocked, missing, or just didn't catch anything. Surfacing the actual
  // reason so it's diagnosable instead of a mystery "nothing happens".
  recognition.onerror = (e) => {
    recognizing = false;
    micBtn.classList.remove('active');
    const messages = {
      'not-allowed': "Microphone access is blocked for this site — check your browser's site settings (usually the icon left of the address bar) and allow the microphone, then try again.",
      'service-not-allowed': "Microphone access is blocked for this site — check your browser's site settings (usually the icon left of the address bar) and allow the microphone, then try again.",
      'audio-capture': "No microphone found — check that one's connected and selected as your input device.",
      'no-speech': "Didn't catch anything — try again and speak right after tapping the mic.",
      'network': 'Voice dictation needs an internet connection — check your connection and try again.',
    };
    input.placeholder = originalPlaceholder;
    if (e.error === 'aborted') return; // user-initiated stop, not a real error
    addMessage('assistant', messages[e.error] || ('Voice dictation error: ' + e.error));
  };
  recognition.onend = () => {
    recognizing = false;
    micBtn.classList.remove('active');
    input.placeholder = originalPlaceholder;
    input.focus();
  };

  micBtn.addEventListener('click', () => {
    if (recognizing) {
      recognition.stop();
      return;
    }
    dictationBaseValue = input.value.trim();
    recognizing = true;
    micBtn.classList.add('active');
    input.placeholder = 'Listening... tap the mic again to stop';
    try {
      recognition.start();
    } catch (err) {
      recognizing = false;
      micBtn.classList.remove('active');
      input.placeholder = originalPlaceholder;
      addMessage('assistant', 'Could not start voice dictation: ' + err.message);
    }
  });
} else {
  micBtn.addEventListener('click', () => {
    input.focus();
    if (!micBtn.dataset.hinted) {
      addMessage('assistant', 'Tap the microphone icon on your keyboard to dictate your message.');
      micBtn.dataset.hinted = '1';
    }
  });
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  input.value = '';
  sendMessage(message);
});

document.querySelectorAll('.quick-btn').forEach(btn => {
  btn.addEventListener('click', () => sendMessage(btn.dataset.msg));
});

document.getElementById('share-link').addEventListener('click', async (e) => {
  e.preventDefault();
  try {
    const res = await fetch('/api/share-link');
    if (!res.ok) throw new Error('Could not get link');
    const data = await res.json();
    const url = window.location.origin + '/share/' + data.token;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try { await navigator.clipboard.writeText(url); } catch (err) { /* fall through to prompt */ }
    }
    window.prompt('Read-only link — anyone with it can see this week\'s meal plan (nothing else). Copied to your clipboard if supported:', url);
  } catch (err) {
    alert('Could not create a share link right now: ' + err.message);
  }
});

addMessage('assistant', "Hi! I'm your home manager. Tap \"Set up chores\" to get started, or just tell me what you need.");

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/static/service-worker.js').then((reg) => {
      // Proactively check for a newer service worker on every load instead
      // of waiting on the browser's own update schedule — a stale one can
      // otherwise sit active indefinitely, invisible to any future deploy.
      reg.update();
    }).catch((err) => {
      console.warn('Service worker registration failed:', err);
    });

    // When a new service worker actually takes over, reload once
    // automatically so the fresh version is what's actually running,
    // instead of requiring a manual hard refresh every time something
    // changes.
    let reloadedForNewWorker = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloadedForNewWorker) return;
      reloadedForNewWorker = true;
      window.location.reload();
    });
  });
}
</script>
</body>
</html>
