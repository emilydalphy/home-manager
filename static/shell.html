<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700;800&family=Quicksand:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/shell.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Home Manager</title>
<link rel="manifest" href="/static/manifest.json" />
<link rel="icon" href="/static/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<meta name="theme-color" content="#66304E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Home Manager" />
</head>
<body>
  <div id="shell-app">

    <nav id="shell-rail">
      <div class="wordmark">Home Manager</div>
      <div id="rail-rows"></div>
      <div class="rail-divider"></div>
      <a class="rail-row" href="/memory">
        <span class="rail-chip">&#9998;</span>
        <span>What we know</span>
      </a>
      <a class="rail-row" href="/inventory">
        <span class="rail-chip">&#127823;</span>
        <span>Inventory</span>
      </a>
      <div class="rail-spacer"></div>
      <button type="button" id="rail-share" class="rail-share">Share meal plan</button>
    </nav>

    <div id="shell-main">
      <div id="shell-scroll"></div>

      <div id="ask-bar-dock">
        <button type="button" id="ask-bar">
          <span class="ask-placeholder">Ask or add anything&hellip;</span>
          <span class="ask-send">&uarr;</span>
        </button>
      </div>

      <div id="tab-bar"></div>
    </div>

  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- Notifications bell (design_handoff_home_manager Phase 5 /
       NOTIFICATIONS.md) — a live in-app feed, not real scheduled push
       (see README's Phase 5 notes for why). Fixed at body level so it
       floats above both the mobile tab-bar layout and the desktop rail
       layout without needing separate breakpoint placement. -->
  <button type="button" id="notif-bell" class="notif-bell" hidden aria-label="Notifications">
    <span class="notif-bell-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 4 1.5 6 2 7H4c.5-1 2-3 2-7Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></span>
    <span class="notif-badge" id="notif-badge" hidden></span>
  </button>
  <div id="notif-scrim" hidden></div>
  <div id="notif-panel" hidden role="dialog" aria-label="Notifications">
    <div class="notif-panel-header">
      <span class="notif-panel-title">Notifications</span>
      <button type="button" id="notif-panel-close" class="notif-panel-close" aria-label="Close">&times;</button>
    </div>
    <div id="notif-panel-list"></div>
  </div>

  <div id="ask-scrim" hidden></div>
  <div id="ask-sheet" hidden role="dialog" aria-label="Ask Home Manager">
    <div class="ask-sheet-handle" id="ask-sheet-handle"></div>
    <div class="ask-messages" id="ask-messages"></div>
    <div class="ask-chips" id="ask-chips"></div>
    <form id="ask-composer" class="ask-composer-bar">
      <input id="ask-input" class="ask-composer-input" type="text" placeholder="Ask or add anything&hellip;" autocomplete="off" />
      <button type="button" id="ask-mic-btn" class="ask-composer-mic" aria-label="Dictate message" title="Dictate message">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.07A7 7 0 0 0 19 11z"/></svg>
      </button>
      <button type="submit" id="ask-send-btn" class="ask-composer-send" aria-label="Send">&uarr;</button>
    </form>
  </div>

  <!-- This Week's "whole week" bottom sheet (design_handoff_home_manager
       option 6a) — same scrim/sheet pattern as the ask sheet above, kept at
       body level for the same reason (position:fixed needs to sit outside
       the tab-panel's own stacking/scroll context). -->
  <div id="week-sheet-scrim" hidden></div>
  <div id="week-sheet" hidden role="dialog" aria-label="The whole week">
    <div class="ask-sheet-handle" id="week-sheet-handle"></div>
    <div class="week-sheet-title-row">
      <span class="week-sheet-title">The whole week</span>
      <span class="week-sheet-hairline"></span>
      <span class="week-sheet-range" id="week-sheet-range"></span>
    </div>
    <div class="week-sheet-cols">
      <span class="week-sheet-col-spacer"></span>
      <span class="week-sheet-col-head">Breakfast</span>
      <span class="week-sheet-col-head">Lunch</span>
      <span class="week-sheet-col-head week-sheet-col-dinner">Dinner</span>
    </div>
    <div class="week-sheet-rows" id="week-sheet-rows"></div>
    <div class="week-sheet-footer">
      <button type="button" class="btn-outline-plum" id="week-sheet-share">Share</button>
      <button type="button" class="btn-gold" id="week-sheet-back">Back</button>
    </div>
  </div>

  <script src="/static/shell.js"></script>
</body>
</html>
