<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pomona</title>
<!--
  The iPhone app's offline screen. It lives inside the app, not on the
  server: capacitor.config.json's server.errorPath points here, so the app
  shows it whenever a page load fails: no signal at launch with nothing
  cached yet, the server not answering, or a load merely cut short by
  another navigation (the script below retries that case once, unseen).
  Once Pomona has opened with signal, the site's own service worker
  usually opens the cached copy instead and this never shows.

  No fonts or stylesheets from the network: there isn't one. Colors are
  copied from static/theme.css (--cream, --night-ink, --slate,
  --apricot); the font stacks are theme.css's own fallbacks.
-->
<style>
  :root {
    --cream: #FFFAF3;
    --night-ink: #14264A;
    --slate: #55607A;
    --apricot: #FFA45C;
    --font-body: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
    background-color: var(--cream);
    color: var(--night-ink);
    font-family: var(--font-body);
    -webkit-text-size-adjust: 100%;
  }
  /* Hidden until the script has decided what to say (or to retry unseen). */
  .wrap:not(.is-ready) { visibility: hidden; }
  .wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 6px; }
  h1 {
    font-family: var(--font-body);
    font-size: 32px; font-weight: 700; letter-spacing: -0.03em; line-height: 38px;
    margin: 0;
  }
  p { margin: 0; font-size: 16px; line-height: 22px; color: var(--slate); }
  button {
    margin-top: 16px;
    width: 100%; height: 52px;
    font-family: var(--font-body); font-weight: 700; font-size: 16px;
    background: var(--apricot); color: var(--night-ink);
    border: none; border-radius: 16px; padding: 0 16px;
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--night-ink); outline-offset: 3px; }
  button:disabled { opacity: 0.6; }
</style>
</head>
<body>
  <main class="wrap">
    <h1 id="title">No connection right now.</h1>
    <p id="line">Pomona opens once you’re back online.</p>
    <button type="button" id="retry">Try again</button>
  </main>
<script src="app-config.js"></script>
<script>
(function () {
  var url = (window.POMONA_APP && window.POMONA_APP.serverUrl) || '';
  var button = document.getElementById('retry');
  function retry() {
    if (!url) return;
    button.disabled = true;
    try { window.sessionStorage.setItem('pomona.retriedAt', String(Date.now())); } catch (e) { /* private storage off */ }
    // A failed load brings the app straight back to this page, which
    // re-enables the button.
    window.location.replace(url);
  }
  button.addEventListener('click', retry);
  // Signal came back while this screen was up: open Pomona without a tap.
  window.addEventListener('online', retry);

  if (navigator.onLine !== false) {
    // The phone has signal, so this wasn't "no connection". Capacitor shows
    // this page for ANY failed page load -- including one merely cut short
    // by a second navigation (a sign-in redirect mid-launch, a double tap).
    // Try once more straight away; if that fails too, the server really
    // didn't answer, and the page says so plainly.
    var last = 0;
    try { last = Number(window.sessionStorage.getItem('pomona.retriedAt')) || 0; } catch (e) { /* ignore */ }
    if (url && Date.now() - last > 15000) {
      retry();
      return;
    }
    document.getElementById('title').textContent = 'Pomona didn’t open.';
    document.getElementById('line').textContent = 'Nothing’s lost. Try again in a minute.';
  }
  document.querySelector('.wrap').classList.add('is-ready');
})();
</script>
</body>
</html>
