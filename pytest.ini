[pytest]
testpaths = tests
# Put the repo root on sys.path so `from app.main import app` resolves.
# `python -m pytest` adds the current directory for you; a bare `pytest`
# (which is what CI runs) does not — without this the suite passes locally
# and fails in CI with ModuleNotFoundError: No module named 'app'.
pythonpath = .
# The app still uses @app.on_event("startup"); FastAPI deprecated it in
# favour of lifespan handlers. Silenced so a real failure isn't lost in the
# noise — worth migrating separately.
filterwarnings =
    ignore::DeprecationWarning
