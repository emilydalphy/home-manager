<title>Pomona Card Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Phone prototype of Pomona's Bright Dusk tile layout. Light only, by decision. */
:root{--cream:#FFFAF3;--dusk:#1B4392;--ink:#14264A;--apricot:#FFA45C;--soft:#FFC08F;--blush:#FBE9D9;--slate:#55607A;--clay:#A8461A;--on:#FFF6EA;--line:#F4ECE2;--ground:#E9E6E0;
--card:0 1px 2px rgba(20,38,74,.05),0 10px 28px rgba(20,38,74,.07);--font:Figtree,system-ui,-apple-system,sans-serif}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;gap:32px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--dusk);outline-offset:2px}
button:active{transform:scale(.98)}
.note{width:220px;font-size:14px;line-height:20px;color:var(--slate)}.note b{display:block;font-size:16px;color:var(--ink);margin-bottom:6px}
.phone{position:relative;width:390px;height:min(844px,100%);background:var(--cream);overflow:hidden;border-radius:30px;box-shadow:0 20px 50px rgba(20,38,74,.18);flex:none}
@media (max-width:760px){.note{display:none}body{display:block}.phone{width:100%;height:100%;border-radius:0;box-shadow:none}}
.screen{position:absolute;inset:0;overflow-y:auto;padding-bottom:104px;animation:fade .16s ease-out}.screen.bare{padding-bottom:104px}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.head{padding:58px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{margin:0;font-size:32px;line-height:38px;font-weight:700;letter-spacing:-.03em}
h2{margin:0;font-size:26px;line-height:30px;font-weight:700;letter-spacing:-.025em}
.sub{font-size:14px;font-weight:500;color:var(--slate);margin-top:3px}
.round{width:44px;height:44px;border-radius:22px;background:var(--blush);display:flex;align-items:center;justify-content:center;flex:none}
.seg{margin:14px 20px 0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;height:46px;background:var(--blush);border-radius:16px;padding:3px;box-sizing:border-box}
.seg.days{height:52px}
.seg button{font-size:14px;font-weight:500;color:var(--slate);border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(20,38,74,.14)}
.seg small{font-size:11px;line-height:13px}.seg .today{color:var(--clay);font-weight:700}
.bar{margin:14px 20px 0;height:6px;border-radius:3px;background:var(--blush);overflow:hidden}.bar i{display:block;height:6px;border-radius:3px;background:var(--apricot);transition:width .2s}
.tonight{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;width:calc(100% - 32px);margin:14px 16px 0;height:96px;padding:0 16px 0 12px;box-sizing:border-box;background:var(--dusk);color:var(--on);border-radius:22px;box-shadow:0 12px 30px rgba(20,38,74,.2);text-align:left}
.tonight b{display:block;font-size:16px}.tonight span span{display:block;font-size:13px;font-weight:600;color:var(--soft)}
.tiles{margin:10px 16px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
.tile{background:#fff;border-radius:22px;box-shadow:var(--card);padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-sizing:border-box;width:100%}
.tile .pl{filter:drop-shadow(0 2px 5px rgba(20,38,74,.18));display:flex}
.tile b{font-size:16px;line-height:20px;font-weight:500}.tile span{font-size:13px;color:var(--slate)}
.tile.sn{flex-direction:row;text-align:left;padding:0 12px;height:68px;gap:10px}.tile.sn b{font-size:14px;line-height:18px}
.src{display:block;margin-top:3px;font-size:14px;font-weight:600;color:var(--dusk);text-decoration:none}
.sect{padding:18px 20px 0;font-size:16px;font-weight:700}.ing{min-height:46px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:16px;font-weight:500;padding:6px 0;box-sizing:border-box}.ing+.ing{border-top:1px solid var(--line)}.ing em{font-style:normal;font-size:14px;font-weight:400;color:var(--slate);text-align:right}
.label{font-size:13px;font-weight:600;color:var(--slate)}
.box{align-items:stretch;text-align:left;padding:12px 14px;gap:6px}
.tick{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;min-height:32px;text-align:left;font-size:14px;font-weight:500;width:100%}
.tick i{width:22px;height:22px;border-radius:11px;box-shadow:inset 0 0 0 1.6px #8791A8;display:flex;align-items:center;justify-content:center}
.tick.done i{background:var(--apricot);box-shadow:none}.tick.done span{color:var(--slate);text-decoration:line-through}
.kt{align-items:flex-start;text-align:left;padding:14px;height:86px;justify-content:center;gap:2px}
.use{margin:14px 16px 0;background:var(--dusk);color:var(--on);border-radius:22px;box-shadow:0 12px 30px rgba(20,38,74,.2);padding:16px 18px;display:flex;flex-direction:column;gap:3px;font-size:14px}.use b{font-size:16px}.use em{font-style:normal;font-size:13px;font-weight:600;color:var(--soft)}
.main{width:100%;height:52px;border-radius:16px;background:var(--apricot);color:var(--ink);font-size:16px;font-weight:700}
.quiet{background:var(--blush)}
.dock{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 30px;background:rgba(255,250,243,.92)}
.big{margin:14px 16px 0;background:var(--dusk);color:var(--on);border-radius:26px;box-shadow:0 12px 30px rgba(20,38,74,.2);padding:26px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.big .pl{filter:drop-shadow(0 12px 18px rgba(0,0,0,.3));display:flex}.big em{font-style:normal;font-size:13px;font-weight:600;color:var(--soft)}
.rtop{position:relative;padding-top:58px;display:flex;justify-content:center}.rtop .pl{filter:drop-shadow(0 10px 16px rgba(20,38,74,.14));display:flex}.rtop .round{position:absolute;top:58px}
.card{margin:14px 16px 0;background:#fff;border-radius:22px;box-shadow:var(--card);padding:4px 14px}
.step{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:10px 0;font-size:16px;line-height:22px}.step+.step{border-top:1px solid var(--line)}
.step i{width:28px;height:28px;border-radius:14px;background:var(--blush);font-style:normal;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.timer{margin:24px 16px 0;background:var(--dusk);color:var(--on);border-radius:26px;box-shadow:0 12px 30px rgba(20,38,74,.2);padding:20px;display:flex;justify-content:space-between;align-items:center}
.timer em{display:block;font-style:normal;font-size:13px;font-weight:600;color:var(--soft)}.timer b{font-size:32px;line-height:38px;font-variant-numeric:tabular-nums}.timer button{height:44px;padding:0 18px;border-radius:16px;background:rgba(255,255,255,.16);color:#fff;font-size:14px;font-weight:700}
.tabs{position:absolute;left:0;right:0;bottom:0;height:88px;background:var(--dusk);display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 72px;align-items:start;padding:6px 8px 0;box-sizing:border-box;z-index:2}
.tabs button{height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:#C6D2E8}
.tabs button span{height:26px;display:flex;align-items:center;justify-content:center;width:48px;border-radius:13px}
.tabs button.on{font-weight:700;color:#fff}.tabs button.on span{background:rgba(255,255,255,.16)}
.tabs .ask{margin:3px 0 0 6px;width:58px;height:44px;border-radius:22px;background:var(--apricot);color:var(--ink);font-size:14px;font-weight:700}
.dim{position:absolute;inset:0;background:rgba(20,38,74,.45);z-index:3;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--cream);border-radius:26px 26px 0 0;padding:10px 16px 30px;display:flex;flex-direction:column;z-index:4;animation:up .24s ease-out;box-sizing:border-box}
.sheet.tall{height:92%}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:#C9CEDA}
.sh{display:flex;justify-content:space-between;align-items:center;padding:12px 4px 0}
.field{height:52px;width:100%;box-sizing:border-box;border:0;border-radius:16px;background:#fff;box-shadow:var(--card);padding:0 16px;font:500 16px var(--font);color:var(--ink)}
.field::placeholder{color:var(--slate)}
.col{display:flex;flex-direction:column;gap:12px;padding-top:14px}
.chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px 0}
.me,.po{max-width:82%;padding:12px 15px;font-size:16px;line-height:22px}.me{align-self:flex-end;background:var(--dusk);color:var(--on);border-radius:22px 22px 6px 22px}.po{align-self:flex-start;background:#fff;border-radius:22px 22px 22px 6px;box-shadow:var(--card)}
.toast{position:absolute;left:16px;right:16px;bottom:100px;min-height:52px;padding:0 16px;box-sizing:border-box;border-radius:16px;background:var(--ink);color:var(--on);font-size:14px;font-weight:500;display:flex;align-items:center;z-index:2;animation:up .2s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}button:active{transform:none}}
.wl { position: absolute; left: 16px; right: 16px; top: 64px; height: 300px; border-radius: 26px; background: #1B4392; color: #FFF6EA; box-shadow: 0 12px 30px rgba(20,38,74,.2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.wl h1 { margin: 0; font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -.03em; }
.rev { position: absolute; left: 16px; right: 16px; top: 376px; height: 214px; }
.rv { position: absolute; inset: 0; box-sizing: border-box; background: #FFFFFF; border-radius: 22px; box-shadow: 0 1px 2px rgba(20,38,74,.05), 0 10px 28px rgba(20,38,74,.07); padding: 16px; display: flex; flex-direction: column; gap: 4px; opacity: 0; animation: rvspin 12s infinite; }
.rv:nth-child(2) { animation-delay: 3s; }
.rv:nth-child(3) { animation-delay: 6s; }
.rv:nth-child(4) { animation-delay: 9s; }
@keyframes rvspin { 0% { opacity: 0; transform: translateY(14px); } 3% { opacity: 1; transform: none; } 22% { opacity: 1; transform: none; } 25% { opacity: 0; transform: translateY(-14px); } 100% { opacity: 0; } }
.rvh { display: flex; align-items: center; gap: 8px; color: #14264A; }
.rvh b { font-size: 26px; line-height: 30px; font-weight: 700; letter-spacing: -.025em; }
.rv p { margin: 0; font-size: 16px; line-height: 22px; color: #55607A; }
.rvv { flex: 1; display: flex; align-items: center; gap: 10px; padding-top: 6px; }
.rvv svg { filter: drop-shadow(0 2px 5px rgba(20,38,74,.18)); }
.wts { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.wt { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: center; font-size: 14px; font-weight: 500; color: #14264A; }
.wt i { width: 22px; height: 22px; border-radius: 11px; box-shadow: inset 0 0 0 1.6px #8791A8; display: flex; align-items: center; justify-content: center; }
.wt.on i { background: #FFA45C; box-shadow: none; }
.wt.on { color: #55607A; text-decoration: line-through; }
.wuse { background: #1B4392; color: #FFF6EA; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; font-size: 16px; width: 100%; box-sizing: border-box; }
.wuse em { font-style: normal; font-size: 13px; font-weight: 600; color: #FFC08F; }
.wck { display: flex; flex-direction: column; font-size: 16px; color: #14264A; }
.wck span { font-size: 13px; color: #55607A; }
@media (prefers-reduced-motion: reduce) { .rv { animation: none; } .rv:first-child { opacity: 1; } }
</style>
<p class="note"><b>Tile layout prototype</b>Starts on the revolving welcome. Tap anything: meals open recipes, Start cooking walks the steps, Shop ticks off, + adds to the list, Ask opens. Sample meals and groceries.</p>

<script id="d" type="application/json">{"dishes": {"tacos": {"src": "RecipeTin Eats", "srcUrl": "https://www.recipetineats.com/pork-carnitas/", "name": "Pork Tacos", "time": 220, "serves": 4, "steps": ["Heat the oven to 325°F with a rack in the lower third. Pat the 2 lbs pork dry and cut it into 4 big chunks. Rub them all over with 1 1/4 tsp of the salt and the 1/2 tsp pepper.", "Stir the 1 1/2 tsp oregano, 1 tsp of the cumin and 1 tbsp of the oil together in a small bowl and rub it over the pork.", "Cut the onion in half. Chop one half. Cut the other half into two quarters and set them aside for later. Peel and smash 2 of the garlic cloves. Juice the orange. That should be about 1/3 cup.", "Put the chopped onion and the smashed garlic in a Dutch oven and set the pork on top, fat side up. Pour the orange juice and 1 cup water around it. Cover and roast for 2 hours.", "Take the lid off and roast for 45 minutes to 1 hour, until the top is browned and a chunk pulls apart easily with a fork. If you have a thermometer, you're cooking it to about 195°F in the middle. Add a splash of water if the pot looks dry. There should be about 1 cup of juice left at the end.", "Meanwhile, heat the broiler with a rack about 5 inches below it. Peel the husks off the 1 lb tomatillos, rinse off the sticky coating and cut them in half. Put them cut side down on a foil lined baking sheet with the poblano, the jalapeño, one of the onion quarters and the last garlic clove, still in its skin.", "Broil for 8 to 10 minutes, turning the peppers once, until the tomatillos are blistered and soft and the peppers are blackened in spots. Let them cool for a few minutes.", "Pull the stems and seeds out of the poblano and jalapeño and squeeze the garlic out of its skin. Transfer everything from the baking sheet to a blender with any juices. Add a big handful of the cilantro, the juice of 1 lime, the remaining 1/2 tsp cumin and the last 1/2 tsp salt. Pulse until it's mostly smooth with a little texture. That should be about 2 cups. Pour it into a bowl for the table.", "When the pork is done, lift it onto a cutting board and shred it with two forks, pulling out any big pieces of fat. Skim the fat off the juices in the pot.", "Heat the remaining 1 tbsp oil in a large skillet over high. Add half the pork in a thin layer and drizzle it with a few spoonfuls of the juices. Leave it alone for 3 to 4 minutes, until the juices have cooked off and the bottom is golden and crisp. Flip it and cook the other side for 1 minute. Transfer it to a platter and crisp the rest the same way.", "Meanwhile, finely dice the last onion quarter, thinly slice 4 or 5 of the radishes, chop a little more cilantro and cut the other lime into wedges. Crumble the cotija.", "Warm the 12 tortillas in a dry skillet over medium for about 30 seconds a side and wrap them in a clean towel.", "Drizzle the pork with the rest of the juices. Taste it. If it's flat, add a pinch more salt or a squeeze of lime.", "Serve the pork in the warm tortillas with the green tomatillo sauce, onion, radishes, cilantro, cotija and lime wedges."], "ings": [["Boneless pork shoulder", "2 lbs"], ["Salt", "1 3/4 tsp"], ["Black pepper", "1/2 tsp"], ["Dried oregano", "1 1/2 tsp"], ["Ground cumin", "1 1/2 tsp"], ["Olive oil", "2 tbsp"], ["White onion", "1"], ["Garlic", "3 cloves"], ["Orange", "1"], ["Tomatillos", "1 lb"], ["Poblano pepper", "1"], ["Jalapeño", "1"], ["Cilantro", "1 bunch"], ["Limes", "2"], ["Radishes", "1 bunch"], ["Cotija cheese", "1 package"], ["Corn tortillas", "12"]], "plate": "<circle cx=\"50\" cy=\"50\" r=\"48\" fill=\"#FFFFFF\" stroke=\"#E6E3DB\"/><circle cx=\"50\" cy=\"50\" r=\"38\" fill=\"none\" stroke=\"#EFEAE0\" stroke-width=\"1.4\"/><circle cx=\"50\" cy=\"50\" r=\"37\" fill=\"#F4F1EA\"/><g transform=\"rotate(-16 35 54)\"><path d=\"M19 56a16 15 0 0 1 32 0z\" fill=\"#7FA653\" transform=\"translate(0 -5)\"/><path d=\"M20 56a15 13 0 0 1 30 0z\" fill=\"#C9966E\" transform=\"translate(0 -2)\"/><circle cx=\"30\" cy=\"45\" r=\"1.8\" fill=\"#F4D35E\"/><circle cx=\"40\" cy=\"46\" r=\"1.8\" fill=\"#FFF8E8\"/><path d=\"M18 63a17 16 0 0 1 34 0z\" fill=\"#E7B553\"/><path d=\"M25 60h3M36 57h3\" stroke=\"#C98F35\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><\/g><g transform=\"rotate(-16 54 46)\"><path d=\"M38 48a16 15 0 0 1 32 0z\" fill=\"#7FA653\" transform=\"translate(0 -5)\"/><path d=\"M39 48a15 13 0 0 1 30 0z\" fill=\"#C9966E\" transform=\"translate(0 -2)\"/><circle cx=\"49\" cy=\"37\" r=\"1.8\" fill=\"#F4D35E\"/><circle cx=\"59\" cy=\"38\" r=\"1.8\" fill=\"#FFF8E8\"/><path d=\"M37 55a17 16 0 0 1 34 0z\" fill=\"#E7B553\"/><path d=\"M44 52h3M55 49h3\" stroke=\"#C98F35\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><\/g><g transform=\"rotate(-16 66 58)\"><path d=\"M50 60a16 15 0 0 1 32 0z\" fill=\"#7FA653\" transform=\"translate(0 -5)\"/><path d=\"M51 60a15 13 0 0 1 30 0z\" fill=\"#C9966E\" transform=\"translate(0 -2)\"/><circle cx=\"61\" cy=\"49\" r=\"1.8\" fill=\"#F4D35E\"/><circle cx=\"71\" cy=\"50\" r=\"1.8\" fill=\"#FFF8E8\"/><path d=\"M49 67a17 16 0 0 1 34 0z\" fill=\"#E7B553\"/><path d=\"M56 64h3M67 61h3\" stroke=\"#C98F35\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><\/g><circle cx=\"44.8\" cy=\"55.9\" r=\"2.4\" fill=\"#8DB35A\"/><circle cx=\"49.7\" cy=\"35.9\" r=\"2.4\" fill=\"#8DB35A\"/><circle cx=\"62.2\" cy=\"62.8\" r=\"2.4\" fill=\"#8DB35A\"/><circle cx=\"28.6\" cy=\"48.5\" r=\"2.4\" fill=\"#8DB35A\"/><circle cx=\"68.8\" cy=\"35.1\" r=\"2.4\" fill=\"#8DB35A\"/><circle cx=\"45.5\" cy=\"78.3\" r=\"2.4\" fill=\"#8DB35A\"/>"}, "jalfrezi": {"src": "Swasthi's Recipes", "srcUrl": "https://www.indianhealthyrecipes.com/chicken-jalfrezi/", "name": "Chicken Jalfrezi", "time": 37, "serves": 4, "steps": ["Put the rice and 3 cups of water in a pot with a pinch of salt and bring it to a boil. Cover, turn the heat to low and cook for 15 minutes, until the water is gone. Leave it covered off the heat.", "Finely chop the yellow onion. Mince the garlic and 1 tbsp of the ginger. Cut the chicken into 3/4-inch pieces. Cut the bell peppers and the red onion into 1-inch squares. Slice the serrano chilies and put them in a small bowl for the table.", "Heat the oil in a large deep skillet over medium-high heat. Add the cumin seeds and the yellow onion with 1/2 tsp of the salt. Cook, stirring often, for 7 minutes, until golden.", "Add the garlic and ginger and stir for 1 minute.", "Add the chicken and cook, stirring, for 3 minutes, until it turns pale on the outside.", "Add the coriander, paprika, turmeric, garam masala, black pepper and the remaining 1 tsp of salt. Stir for 1 minute, until it smells toasty.", "Add the crushed tomatoes and cook for 6 minutes, stirring now and then, until the oil shows around the edges of the sauce.", "Add the bell peppers, the red onion, the soy sauce, the ketchup and the vinegar. Cook for 4 minutes, until the peppers are soft but still have some bite. If the pan gets dry, add 1/4 cup of water. You're cooking the chicken to 175°F in the middle, so if you have a thermometer, check it there. No thermometer? Cut into the thickest piece: it's done when the juices run clear.", "Take the pan off the heat. Chop 2 tbsp of cilantro and stir in half of it. Taste it. If it's flat, add a pinch more salt.", "Serve over the rice, with the rest of the cilantro on top and the sliced serranos on the table for anyone who wants heat."], "ings": [["Boneless skinless chicken thighs", "1.5 lbs"], ["Yellow onion", "1 large"], ["Red onion", "1 small"], ["Green bell pepper", "1"], ["Red bell pepper", "1"], ["Garlic", "5 cloves"], ["Ginger", "1 piece"], ["Serrano chilies", "2"], ["Cilantro", "1 bunch"], ["Crushed tomatoes", "1 can (14 oz)"], ["Soy sauce", "1 tbsp"], ["Tomato ketchup", "1 tbsp"], ["Rice vinegar", "1 tsp"], ["Vegetable oil", "3 tbsp"], ["Cumin seeds", "1 tsp"], ["Ground coriander", "1 tbsp"], ["Paprika", "1 1/2 tsp"], ["Ground turmeric", "1/2 tsp"], ["Garam masala", "1 tsp"], ["Black pepper", "1/4 tsp"], ["Salt", "1 1/ orm=\"translate(57.4 38.9) rotate(26)\" fill=\"none\" stroke=\"#A8527A\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><path d=\"M-6.5 0Q0 -2.4 6.5 0\" transform=\"translate(52.5 66.8) rotate(121)\" fill=\"none\" stroke=\"#A8527A\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><path d=\"M-6.5 0Q0 2.5 6.5 0\" transform=\"translate(34.0 37.1) rotate(57)\" fill=\"none\" stroke=\"#A8527A\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><circle cx=\"43.7\" cy=\"47.1\" r=\"1.5\" fill=\"#4F7A3A\"/><circle cx=\"60.8\" cy=\"46.6\" r=\"1.5\" fill=\"#4F7A3A\"/><circle cx=\"42.8\" cy=\"62.5\" r=\"1.5\" fill=\"#4F7A3A\"/><circle cx=\"46.1\" cy=\"32.6\" r=\"1.5\" fill=\"#4F7A3A\"/><circle cx=\"66.4\" cy=\"61.4\" r=\"1.5\" fill=\"#4F7A3A\"/><circle cx=\"28.7\" cy=\"52.8\" r=\"1.5\" fill=\"#4F7A3A\"/><circle cx=\"64.8\" cy=\"32.3\" r=\"1.5\" fill=\"#4F7A3A\"/><circle cx=\"51.1\" cy=\"74.4\" r=\"1.5\" fill=\"#4F7A3A\"/>"}, "chowfun": {"src": "The Woks of Life", "srcUrl": "https://thewoksoflife.com/beef-chow-fun/", "name": "Beef Chow Fun", "time": 47, "serves": 4, "steps": ["Slice the 12 oz flank steak against the grain into thin slices, about 1/8 inch thick. If it's too soft to slice neatly, 15 minutes in the freezer firms it up.", "Put the beef in a bowl with 2 tbsp water, the 1/4 tsp baking soda, the 1 tsp cornstarch, the 2 tsp oyster sauce, 2 tsp of the Shaoxing wine and 1 tsp of the soy sauce. Mix with your hands until the liquid is absorbed, and leave it for 30 minutes while you do everything else.", "If the noodles come as whole sheets, cut them into strips about 1 inch wide. If they're stiff from the fridge, bring a pot of water to a boil, dunk them for 30 seconds until they loosen, then drain them well and rinse under cold water. Gently pull the strands apart by hand.", "Halve the green onions lengthwise and cut them into 3-inch pieces, keeping the white parts and the green parts in separate piles. Cut 4 thin slices of the ginger.", "In a small bowl, stir together the rest of the soy sauce (2 1/2 tbsp), the 1 tbsp dark soy sauce, the 1/2 tsp sugar and the 1/2 tsp sesame oil.", "Heat a wok or your largest skillet over high heat until it smokes. Add 1 1/2 tbsp of the oil and spread the beef in one layer. Leave it for about 1 minute, until the underside is browned. Flip the slices and cook the other side for 30 seconds, then move them to a plate.", "Add the last 2 1/2 tbsp oil and the ginger and stir for 15 seconds. Add the green onion whites and stir for 30 seconds.", "Add the noodles and spread them out. Leave them for 30 seconds, then toss them gently with tongs for about 1 minute, until they're hot and a few edges have browned. Pour the last 2 tbsp Shaoxing wine around the edge of the wok.", "Add the soy mixture and the beef with its juices. Toss gently, lifting from the bottom, until the noodles are evenly brown, about 1 minute. Go easy. The noodles break if you stir hard.", "Add the bean sprouts and the green onion greens and toss for 1 minute, until the sprouts just soften but still crunch.", "Taste a noodle. If it's flat, add a pinch of salt and the pinch of white pepper.", "Serve right away."], "ings": [["Flank steak", "12 oz"], ["Fresh wide rice noodles", "1 lb"], ["Bean sprouts", "8 oz"], ["Green onions", "1 bunch"], ["Ginger", "1 small piece"], ["Oyster sauce", "2 tsp"], ["Shaoxing wine", "2 tbsp + 2 tsp"], ["Soy sauce", "2 1/2 tbsp + 1 tsp"], ["Dark soy sauce", "1 tbsp"], ["Cornstarch", "1 tsp"], ["Baking soda", "1/4 tsp"], ["Sugar", "1/2 tsp"], ["Sesame oil", "1/2 tsp"], ["Vegetable oil", "1/4 cup"], ["Salt", "to taste"], ["White pepper", "a pinch"]], "plate": "<circle cx=\"50\" cy=\"50\" r=\"48\" fill=\"#FFFFFF\" stroke=\"#E6E3DB\"/><circle cx=\"50\" cy=\"50\" r=\"38\" fill=\"none\" stroke=\"#EFEAE0\" stroke-width=\"1.4\"/><circle cx=\"50\" cy=\"50\" r=\"37\" fill=\"#6B4226\"/><path d=\"M27.1 31.5a29.6 29.6 0 0 1 27.8 -9.6\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.4\" stroke-linecap=\"round\" opacity=\".22\"/><g =\"1.8\" fill=\"none\" stroke=\"#7FA653\" stroke-width=\"1.3\"/><circle cx=\"57.8\" cy=\"65.8\" r=\"1.8\" fill=\"none\" stroke=\"#7FA653\" stroke-width=\"1.3\"/><circle cx=\"30.7\" cy=\"42.5\" r=\"1.8\" fill=\"none\" stroke=\"#7FA653\" stroke-width=\"1.3\"/><circle cx=\"70.6\" cy=\"42.0\" r=\"1.8\" fill=\"none\" stroke=\"#7FA653\" stroke-width=\"1.3\"/>"}, "albondigas": {"src": "Posh Journal", "srcUrl": "https://poshjournal.com/albondigas-soup-recipe/", "name": "Albondigas Soup", "time": 70, "serves": 4, "steps": ["Put the 1/2 cup rice in a bowl, cover it with cold water and leave it to soak for 20 minutes.", "Meanwhile, chop 1/4 cup of the mint leaves and 1/4 cup of the parsley leaves. Mince the 4 garlic cloves and keep them in two piles of 2.", "Dice the onion. Seed and chop the poblano. Peel and dice the 2 carrots, cut the 2 potatoes into 1 inch pieces and dice the zucchini.", "Drain the rice in a sieve and rinse it. Put it in a large bowl with the 1 lb beef, the egg, the mint, the parsley, one pile of the garlic, the 1 1/4 tsp cumin, the 1 1/4 tsp onion powder, the 1/2 tsp oregano, 3/4 tsp of the salt and the 1/2 tsp pepper.", "Mix it with your hands until it's evenly combined, then stop. Any longer and the meatballs come out tough. Roll it into balls about 1 1/2 inches across, which makes about 20, and put them on a plate in the fridge.", "Heat the 2 tbsp oil in a Dutch oven over medium. Add the onion and cook for 4 minutes, stirring now and then, until it's soft. Add the poblano and cook for 1 minute.", "Add the second pile of garlic and cook for 30 seconds, until you can smell it. Stir in the carrots and the can of tomatoes with their juice and cook for 2 minutes.", "Pour in the 4 cups broth and 2 cups water. Add the potatoes and the remaining 1/2 tsp salt and bring it to a boil over high.", "Lower the meatballs into the soup one at a time with a spoon. Turn the heat down so it simmers gently, cover the pot and cook for 15 minutes. Don't stir. The meatballs are soft until they set.", "Add the zucchini, cover again and simmer for 15 minutes, until the potatoes are tender and the rice in the meatballs is soft. You're cooking the meatballs to 160°F in the middle, so if you have a thermometer, check one there. No thermometer? Cut one in half: it's done when there's no pink left.", "Warm each tortilla in a dry skillet over medium for about 30 seconds, flip it and warm the other side for 30 seconds. Stack them in a clean towel as you go.", "Turn off the heat. Chop a small handful of the parsley and scatter it over the soup. Taste the broth. If it's flat, add a pinch more salt.", "Ladle the soup into bowls with a few meatballs in each and serve with the warm tortillas."], "ings": [["Ground beef", "1 lb"], ["Long grain white rice", "1/2 cup"], ["Eggs", "1"], ["Mint", "1 bunch"], ["Flat-leaf parsley", "1 bunch"], ["Garlic", "4 cloves"], ["Ground cumin", "1 1/4 tsp"], ["Onion powder", "1 1/4 tsp"], ["Mexican oregano", "1/2 tsp"], ["Salt", "1 1/4 tsp"], ["Black pepper", "1/2 tsp"], ["Olive oil", "2 tbsp"], ["Yellow onion", "1"], ["Poblano pepper", "1"], ["Carrots", "2"], ["Diced tomatoes", "1 can (14.5 oz)"], ["Chicken broth", "4 cups"], ["Yukon Gold potatoes", "2"], ["Zucchini", "1"], ["Corn tortillas", "8"]], "plate": "<circle cx=\"50\" cy=\"50\" r=\"48\" fill=\"#FFFFFF\" stroke=\"#E6E3DB\"/><circle cx=\"50\" cy=\"50\" r=\"38\" fill=\"none\" stroke=\"#EFEAE0\" stroke-width=\"1.4\"/><circle cx=\"50\" cy=\"50\" r=\"37\" fill=\"#D9703A\"/><path d=\"M27.1 31.5a29.6 29.6 0 0 1 27.8 -9.6\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.4\" stroke-linecap=\"round\" opacity=\".22\"/><path d=\"M57.4 48.0Q55.4 50.8 51.8 51.6Q48.3 52.4 44.7 51.7Q41.0 51.0 39.9 48.1Q38.8 45.1 39.8 42.2Q40.9 39.2 44.6 37.6Q48.3 36.0 52.3 37.4Q56.3 38.8 57.8 42.0Q59.3 45.1 57.4 48.0z\" fill=\"#7A4A2B\"/><ellipse cx=\"45.3\" cy=\"42.1\" rx=\"3.2\" ry=\"1.8\" fill=\"#A9794C\" opacity=\".8\" transform=\"rotate(-25 48.3 45.1)\"/><path d=\"M66.1 57.3Q65.6 60.4 ound turmeric", "1/4 tsp"], ["Cornstarch", "1/4 cup"], ["Eggs", "4"], ["Sesame oil", "1 tsp"]], "plate": "<circle cx=\"50\" cy=\"50\" r=\"48\" fill=\"#FFFFFF\" stroke=\"#E6E3DB\"/><circle cx=\"50\" cy=\"50\" r=\"38\" fill=\"none\" stroke=\"#EFEAE0\" stroke-width=\"1.4\"/><circle cx=\"50\" cy=\"50\" r=\"37\" fill=\"#E6C877\"/><path d=\"M27.1 31.5a29.6 29.6 0 0 1 27.8 -9.6\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.4\" stroke-linecap=\"round\" opacity=\".22\"/><path d=\"M-8.5 0Q0 -1.5 8.5 0\" transform=\"translate(53.8 50.1) rotate(24)\" fill=\"none\" stroke=\"#FBE27A\" stroke-width=\"3.8\" stroke-linecap=\"round\"/><path d=\"M-8.5 0Q0 -2.6 8.5 0\" transform=\"translate(44.6 54.8) rotate(170)\" fill=\"none\" stroke=\"#FBE27A\" stroke-width=\"3.8\" stroke-linecap=\"round\"/><path d=\"M-8.5 0Q0 0.6 8.5 0\" transform=\"translate(50.9 41.2) rotate(167)\" fill=\"none\" stroke=\"#FBE27A\" stroke-width=\"3.8\" stroke-linecap=\"round\"/><path d=\"M-8.5 0Q0 8.9 8.5 0\" transform=\"translate(55.9 58.0) rotate(15)\" fill=\"none\" stroke=\"#FBE27A\" stroke-width=\"3.8\" stroke-linecap=\"round\"/><path d=\"M-8.5 0Q0 -1.7 8.5 0\" transform=\"translate(37.8 47.6) rotate(65)\" fill=\"none\" stroke=\"#FBE27A\" stroke-width=\"3.8\" stroke-linecap=\"round\"/><path d=\"M-8.5 0Q0 -4.5 8.5 0\" transform=\"translate(61.5 43.0) rotate(65)\" fill=\"none\" stroke=\"#FBE27A\" stroke-width=\"3.8\" stroke-linecap=\"round\"/><path d=\"M-8.5 0Q0 3.1 8.5 0\" transform=\"translate(46.3 63.1) rotate(149)\" fill=\"none\" stroke=\"#FBE27A\" stroke-width=\"3.8\" stroke-linecap=\"round\"/><path d=\"M-8.5 0Q0 5.5 8.5 0\" transform=\"translate(43.4 36.7) rotate(52)\" fill=\"none\" stroke=\"#FBE27A\" stroke-width=\"3.8\" stroke-linecap=\"round\"/><path d=\"M-8.5 0Q0 3.5 8.5 0\" transform=\"translate(65.1 55.8) rotate(99)\" fill=\"none\" stroke=\"#FBE27A\" stroke-width=\"3.8\" stroke-linecap=\"round\"/><path d=\"M-8.5 0Q0 3.0 8.5 0\" transform=\"translate(34.6 56.1) rotate(133)\" fill=\"none\" stroke m/aloo-matar-recipe-aloo-mutter/", "name": "Aloo Matar", "time": 50, "serves": 4, "steps": ["Peel the potatoes and cut them into 1 inch cubes. Keep them in a bowl of cold water until you need them.", "Finely chop the onion and the 3 tomatoes. Grate 1 tsp of the ginger and mince the 2 garlic cloves.", "Slice the green chili thinly and put it in a small bowl for the table.", "Heat the 2 tbsp oil in a heavy pot with a lid over medium heat. Add the 3/4 tsp cumin seeds, the cinnamon and the 2 cardamom pods, and crush the 1 tsp kasuri methi between your palms into the pot. After about 30 seconds the cumin will sizzle and smell toasty.", "Turn the heat to low and stir in the 1/2 tsp turmeric, 1 tsp chili powder and 1 tsp ground coriander for 30 seconds. Don't let them darken.", "Add the onion with 1/4 tsp of the salt and turn the heat back to medium. Cook for 6 to 8 minutes, stirring now and then, until it's soft and golden. If the spices start to stick, add a splash of water.", "Stir in the ginger and garlic and cook for about a minute, until they stop smelling raw.", "Add the tomatoes and cook for 6 to 8 minutes, mashing them with the spoon, until they're soft and mushy and you can see oil at the edges.", "Drain the potatoes and add them to the pot with the remaining 1 tsp salt. Stir for 2 minutes, so every piece is coated in the masala.", "Add 1 cup of the frozen peas and 1 1/2 cups water. Bring it to a boil, then cover, turn the heat to low and simmer for 15 to 20 minutes, stirring a couple of times. The potatoes are done when a knife slides through a cube with no push.", "Mash a few potato cubes against the side of the pot to thicken the gravy. If it's thicker than you like, stir in a splash of water.", "Stir in the 1/2 tsp garam masala and 2 tbsp chopped cilantro. Taste it. If it's flat, add a pinch more salt.", "Serve with roti or rice, with the sliced green chili on the side."], "ings": [["Yukon Gold potatoes", "1.5 lbs"], ["Frozen peas", "1 cup"], ["Yellow onion", }
function kitchen(){
 return `<div class="screen"><div class="head"><h1>Kitchen</h1><button class="round" aria-label="Snap a shelf" data-a="note">${I.plus}</button></div>${seg(['Fridge','Freezer','Pantry'],s.kit,'kit')}<div class="use"><em>Use soon</em><b>Cherry tomatoes</b>Best by Friday</div><div class="tiles">${KIT[s.kit].map(i=>`<div class="tile kt"><b>${i[0]}</b><span>${i[1]}</span></div>`).join('')}</div></div>`;
}
const PREP=[['Move to thaw','5 min',[['Chicken thighs, fridge']]],['Sauces, marinades, drinks','20 min',[['Marinate the pork'],['Blend the salsa verde']]],['In the oven','30 min',[['Roast the sweet potatoes']]],['Chop and wash','25 min',[['Onions'],['Cilantro'],['Bell peppers']]],['On the stove','25 min',[['Brown the ground beef'],['Cook the rice']]],['Pack it up','10 min',[['Portion the lunches']]]];
let prepDone=new Set(['Onions']),prepFold=new Set();
function prep(){
 const all=PREP.flatMap(g=>g[2]).length;
 const tile_=g=>`<div class="tile box"><button data-a="pfold" data-v="${g[0]}" style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px;text-align:left;width:100%"><span class="label">${g[0]}<br><span style="font-weight:400">${g[1]}</span></span><span aria-hidden="true" style="font-size:14px;color:var(--slate);transform:rotate(${prepFold.has(g[0])?'-90deg':'0'})">⌄</span></button>${prepFold.has(g[0])?'':g[2].map(i=>`<button class="tick ${prepDone.has(i[0])?'done':''}" data-a="ptick" data-v="${i[0]}"><i>${prepDone.has(i[0])?I.check:''}</i><span>${i[0]}</span></button>`).join('')}</div>`;
 const col=c=>`<div style="display:flex;flex-direction:column;gap:10px">${c.map(tile_).join('')}</div>`;
 return `<div class="screen" style="padding-bottom:40px"><div class="head"><button class="round" aria-label="Back" data-a="pback">${I.back}</button></div><div style="padding:14px 20px 0"><h1>Prep</h1><div class="sub">Wednesday · up to 2 hours</div></div><div class="bar"><i style="width:${Math.round(prepDone.size/all*100)}%"></i></div><div class="tiles" style="margin-top:14px">${col(PREP.slice(0,3))}${col(PREP.slice(3))}</div><div class="card" style="margin-top:10px;padding:14px"><span class="label">Made on the night</span><div style="font-size:14px;line-height:20px;color:var(--slate);margin-top:2px">These didn't fit in your 2 hours, so they're cooked fresh on the day. Tap Add it to prep one now.</div><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px"><span style="font-size:16px;font-weight:500">Chicken Jalfrezi sauce<br><span style="font-size:13px;font-weight:400;color:var(--slate)">20 min · Cooked fresh on Fri</span></span><button class="main" style="width:84px;height:44px;font-size:14px" data-a="note">Add it</button></div></div></div>`;
}
function cook(){
 return `<div class="screen"><div class="head"><div><h1>Cook</h1><div class="sub">Wednesday</div></div></div><button class="card" style="padding:14px;display:block;text-align:left;width:calc(100% - 32px);box-sizing:border-box" data-a="prep"><span class="label">Prep today · up to 2 hours</span><div style="font-size:16px;line-height:22px;font-weight:500;margin-top:2px">10 things to do</div></button><div class="tiles">${tile('pancon','Breakfast')}${tile('eggdrop','Lunch')}${tile('tacos','Dinner · 35 min')}${tile('jalfrezi','Next up, Fri')}</div></div>`;
}
function recipe(){
 const d=D[s.recipe];
 const body=s.rt==='Ingredients'?`<div class="tiles" style="margin-top:14px">${d.ings.map(i=>`<div class="tile kt" style="height:auto;min-height:72px"><b>${i[0]}</b><span>${i[1]}</span></div>`).join('')}</div>`
 :`<div class="sub" style="padding:14px 20px 0;font-weight:600">Takes about ${d.time} min</div>${d.steps.map((t,i)=>`<div class="card" style="margin-top:${i?10:8}px;padding:0 14px"><div class="step"><i>${i+1}</i><span>${t}</span></div></div>`).join('')}`;
 return `<div class="screen" style="padding-bottom:110px"><div class="rtop"><button class="round" style="left:20px" aria-label="Back" data-a="back">${I.back}</button><button class="round" style="right:20px" aria-label="More" data-a="note">${I.dots}</button>${pl(s.recipe,216)}</div><div style="padding:18px 20px 0"><h2>${d.name}</h2></div>${seg(['Ingredients','Steps'],s.rt,'rt')}${body}</div><div class="dock"><button class="main" data-a="start" data-v="${s.recipe}">Start cooking</button></div>`;
}
function cooking(){
 const {k,i}=s.cook,d=D[k],last=i===d.steps.length-1;
 return `<div class="screen"><div class="head" style="align-items:center"><button class="round" aria-label="Close" data-a="stop">${I.x}</button><span class="sub" style="margin:0;font-weight:600">Step ${i+1} of ${d.steps.length}</span><span style="width:44px"></span></div><div class="bar"><i style="width:${(i+1)/d.steps.length*100}%"></i></div><div style="padding:30px 20px 0"><h2>${d.steps[i]}</h2></div></div><div class="dock">${i>0?`<button class="main quiet" style="margin-bottom:10px" data-a="prev">Back a step</button>`:''}<button class="main" data-a="next">${last?'Done':'Next step'}</button></div>`;
}
const tabs=()=>`<nav class="tabs">${Object.keys(T).map(t=>`<button class="${s.tab===t?'on':''}" data-a="tab" data-v="${t}"><span>${T[t]}</span>${t}</button>`).join('')}<button class="ask" data-a="sheet" data-v="ask">Ask</button></nav>`;
function sheet(){
 if(!s.sheet)return'';
 const head=t=>`<span class="grab"></span><div class="sh"><h2>${t}</h2><button class="round" aria-label="Close" data-a="close">${I.x}</button></div>`;
 let b='';
 if(s.sheet==='add')b=`<div class="sheet">${head('Add to your list')}<form class="col" id="addf"><input class="field" id="item" placeholder="What do you need?" autocomplete="off"><button class="main">Add</button></form></div>`;
 if(s.sheet==='day')b=`<div class="sheet">${head(({Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'})[s.day])}<div class="card" style="margin:14px 0 0">${['Add a meal','Add from the freezer','Swap with another day','Take the night off'].map(x=>`<button style="display:block;width:100%;height:52px;text-align:left;font-size:16px;font-weight:500;border-top:1px solid var(--line)" data-a="note">${x}</button>`).join('').replace('border-top:1px solid var(--line)','')}</div></div>`;
 if(s.sheet==='ask')b=`<div class="sheet tall">${head('Ask Pomona')}<div class="chat" id="chat"><div class="me">Maya is out Thursday</div><div class="po">Thursday is leftovers, so there’s nothing to change.</div>${s.chat.map(c=>`<div class="me">${c}</div><div class="po">This mockup doesn’t answer yet.</div>`).join('')}</div><form id="askf" style="display:flex;gap:8px"><input class="field" id="q" placeholder="Ask anything about the week" autocomplete="off" style="border-radius:26px"><button class="main" style="width:76px;border-radius:26px;font-size:14px">Send</button></form></div>`;
 return `<div class="dim" data-a="close"></div>${b}`;
}
function draw(){
 if(s.welcome){app.innerHTML=`<div class="screen">${WHTML}</div><div class="dock" style="background:none"><button class="main" data-a="enter">Continue</button></div>`;return}
 let main;
 if(s.prep)main=prep();else if(s.cook)main=cooking();else if(s.recipe)main=recipe();else main={Plan:plan,Shop:shop,Kitchen:kitchen,Cook:cook}[s.tab]();
 const top=app.querySelector('.screen')?.scrollTop||0,same=draw.key===[s.tab,s.recipe,!!s.cook,s.day].join();draw.key=[s.tab,s.recipe,!!s.cook,s.day].join();
 app.innerHTML=main+(s.recipe||s.cook||s.prep?'':tabs())+sheet()+(s.toast?`<div class="toast">${s.toast}</div>`:'');
 const sc=app.querySelector('.screen');if(same&&sc){sc.scrollTop=top;sc.style.animation='none'}
 const c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight;
 document.getElementById('item')?.focus();
}
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const {a,v}=b.dataset;
 if(a==='enter')set({welcome:false});
 if(a==='prep')set({prep:true});if(a==='pback')set({prep:false});
 if(a==='pfold'){prepFold.has(v)?prepFold.delete(v):prepFold.add(v);draw()}
 if(a==='ptick'){prepDone.has(v)?prepDone.delete(v):prepDone.add(v);draw()}
 if(a==='tab')set({tab:v,recipe:null,cook:null});
 if(a==='day')set({day:v});if(a==='store')set({store:v});if(a==='kit')set({kit:v});if(a==='rt')set({rt:v});
 if(a==='open')set({recipe:v,rt:'Ingredients'});if(a==='back')set({recipe:null});
 if(a==='sheet')set({sheet:v});if(a==='close')set({sheet:null});
 if(a==='note'){s.sheet=null;toast('Not part of this mockup yet')}
 if(a==='tick'){const i=SHOP.find(x=>x.n===v);i.done=!i.done;draw()}
 if(a==='start')set({cook:{k:v,i:0}});if(a==='stop')set({cook:null});
 if(a==='prev')set({cook:{...s.cook,i:s.cook.i-1}});
 if(a==='next'){const {k,i}=s.cook;if(i===D[k].steps.length-1){s.cook=null;s.recipe=null;s.tab='Cook';toast(D[k].name+' cooked')}else set({cook:{k,i:i+1}})}
});
app.addEventListener('submit',e=>{e.preventDefault();
 if(e.target.id==='addf'){const v=document.getElementById('item').value.trim();if(!v)return;SHOP.push({a:'Added',n:v,s:s.store==='All stores'?'Metro':s.store,done:false});s.sheet=null;toast(v+' added')}
 if(e.target.id==='askf'){const v=document.getElementById('q').value.trim();if(!v)return;s.chat.push(v.replace(/</g,'&lt;'));draw()}
});
draw();
</script>
